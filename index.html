function sigOf(o){ return o ? (o.version+"|"+o.updatedAt+"|"+(o.sheetUpdatedAt||0)) : ""; }

async function loadData(showToast){
  const remote=await rawGet();
  const hasContent = remote && ((remote.projects&&remote.projects.length)||(remote.tasks&&remote.tasks.length));
  // SEGURANÇA: com servidor, "remote" nulo é FALHA de leitura (servidor
  // ocupado, rede), não planilha vazia. E se já havia dados carregados,
  // nunca criar os dados de exemplo -- o salvamento seguinte apagaria os
  // registros reais (o diff compararia com a foto dos dados reais).
  const jaTinhaDados = !!(lastSyncedSnapshot && ((lastSyncedSnapshot.projects||[]).length || (lastSyncedSnapshot.tasks||[]).length));
  if(!hasContent && ((MODE==="servidor" && !remote) || jaTinhaDados)){
    toast("Não consegui carregar os dados agora — tente de novo em instantes",true);
    return false;
  }
  if(hasContent || (MODE==="servidor" && remote)){
    // com servidor, uma base vazia é uma instalação nova: começa vazia (os
    // dados de exemplo são só do modo demonstração)
    DATA=remote; lastSig=sigOf(remote);
    if(showToast) toast("Atualizado pela equipe");
  }else{
    DATA=seed(); await persist(); lastSig=sigOf(DATA);
  }
  // modelo de conteúdo (perspectivas, listas, campos da TAP): servidor ou este navegador
  aplicarConfiguracoes(MODE==="servidor" ? (DATA.configuracoes||null) : lerConfiguracoesLocais());
  (DATA.tapData||[]).forEach(normalizarTAP);
  ensurePeople();
  lastSyncedSnapshot=cloneEntities(DATA);
  return true;
}
/* ============================================================
   SEÇÕES SOB DEMANDA (Firestore)
   Ao abrir, o app recebe só o cabeçalho e o cronograma de cada projeto.
   As demais seções (EAP, riscos, custos, stakeholders, responsabilidade,
   linha de base) chegam quando o projeto é aberto ou quando um relatório
   ou exportação precisa delas. DATA.secoesCarregadas[pid] diz o estado;
   sem essa informação (demonstração, outros backends) está tudo carregado.
============================================================ */
function secoesCarregadas(pid){
  return !(MODE==="servidor" && DATA.secoesCarregadas && DATA.secoesCarregadas[pid]===false);
}
const _garantindo={};
async function garantirSecoes(pids){
  const faltam=(pids||[]).filter(pid=>pid && !secoesCarregadas(pid));
  if(!faltam.length) return true;
  const chave=faltam.slice().sort().join(",");
  if(!_garantindo[chave]){
    _garantindo[chave]=(async()=>{
      try{
        await servidorCall("apiGarantirSecoes",faltam);
        const remote=await rawGet(); if(!remote) return false;
        const existentes=new Set((remote.projects||[]).map(p=>p.id));
        if(faltam.some(pid=>!existentes.has(pid))){ await loadData(false); return false; } // projeto excluído por outra pessoa
        incorporarSecoes(remote,faltam);
        return faltam.every(secoesCarregadas);
      }catch(e){ return false; }
      finally{ delete _garantindo[chave]; }
    })();
  }
  return _garantindo[chave];
}
/* traz para DATA (e para a "foto" do que está salvo) só os itens dos
   projetos recém-carregados -- sem mexer no que a pessoa está editando */
function incorporarSecoes(remote,pids){
  const alvo=new Set(pids);
  const listas=["risks","costs","stakeholders","reportSchedules","eapNodes","responsibleContacts","baselines","baselineHistory"];
  listas.forEach(k=>{
    const novos=(remote[k]||[]).filter(x=>alvo.has(x.projectId));
    DATA[k]=(DATA[k]||[]).filter(x=>!alvo.has(x.projectId)).concat(JSON.parse(JSON.stringify(novos)));
    if(lastSyncedSnapshot && Array.isArray(lastSyncedSnapshot[k])){
      lastSyncedSnapshot[k]=lastSyncedSnapshot[k].filter(x=>!alvo.has(x.projectId)).concat(JSON.parse(JSON.stringify(novos)));
    }
  });
  if(lastSyncedSnapshot && lastSyncedSnapshot.__meta){
    (remote.baselines||[]).filter(b=>alvo.has(b.projectId)).forEach(b=>{ lastSyncedSnapshot.__meta.baselinesPorProjeto[b.projectId]=JSON.stringify(b); });
    (remote.baselineHistory||[]).filter(h=>alvo.has(h.projectId)).forEach(h=>{ if(!lastSyncedSnapshot.__meta.histIds.includes(h.id)) lastSyncedSnapshot.__meta.histIds.push(h.id); });
  }
  DATA.secoesCarregadas=Object.assign({},DATA.secoesCarregadas||{}); DATA.secoesNegadas=Object.assign({},DATA.secoesNegadas||{});
  pids.forEach(pid=>{ DATA.secoesCarregadas[pid]=!!(remote.secoesCarregadas||{})[pid]; DATA.secoesNegadas[pid]=(remote.secoesNegadas||{})[pid]||[]; });
}
function ensurePeople(){
  normalizarCoresProjetos();
  ["risks","costs","baselines","stakeholders","portfolios","reportSchedules","eapNodes","responsibleContacts",
   "tapData","customTapYears","baselineHistory","peopleHidden"].forEach(k=>{ if(!Array.isArray(DATA[k])) DATA[k]=[]; });
  // hierarquia impossível (ciclo, pai inexistente ou de outro projeto) travava a tela -- desfaz aqui
  DATA.tasks.forEach(t=>{ if(t.isMilestone) normalizeMilestone(t); });
  const corrigidas=quebrarCiclos(DATA.tasks);
  quebrarCiclos(DATA.eapNodes);
  if(corrigidas.length) avisarCiclosCorrigidos(corrigidas);
  // lista de nomes = nomes guardados + todos os nomes em uso (gestores, responsáveis,
  // responsáveis adicionais e contatos da tela Responsabilidade)
  const set=new Set(DATA.people||[]);
  DATA.projects.forEach(p=>p.owner&&set.add(p.owner));
  DATA.tasks.forEach(t=>{ if(t.assignee) set.add(t.assignee); (t.coResponsaveis||[]).forEach(n=>n&&set.add(n)); });
  DATA.responsibleContacts.forEach(r=>r.name&&set.add(r.name));
  DATA.people=Array.from(set).map(x=>String(x).trim()).filter(Boolean);
  DATA.people=Array.from(new Set(DATA.people)).sort((a,b)=>a.localeCompare(b,"pt-BR"));
}
const _ciclosAvisados=new Set();
function avisarCiclosCorrigidos(lista){
  const novos=lista.filter(t=>!_ciclosAvisados.has(t.id));
  if(!novos.length) return;
  novos.forEach(t=>_ciclosAvisados.add(t.id));
  setTimeout(()=>toast(`${novos.length} atividade(s) estavam "dentro de si mesmas" e foram para o nível principal: ${novos.map(t=>t.name).slice(0,3).join(", ")}`,true,true),0);
}
/* nomes ocultos das sugestões (Gerenciar nomes) -- quem digita um nome
   oculto de novo num responsável/gestor traz o nome de volta */
function nomesSugeridos(){
  const ocultos=new Set(DATA.peopleHidden||[]);
  return (DATA.people||[]).filter(n=>!ocultos.has(n));
}
function reativarNomesDigitados(){
  if(!(DATA.peopleHidden||[]).length) return;
  const base=lastSyncedSnapshot||{};
  const antes=(k,id)=>(base[k]||[]).find(x=>x.id===id);
  const usados=new Set();
  (DATA.tasks||[]).forEach(t=>{
    const o=antes("tasks",t.id);
    if(t.assignee && (!o||o.assignee!==t.assignee)) usados.add(t.assignee);
    (t.coResponsaveis||[]).forEach(n=>{ if(!o||!(o.coResponsaveis||[]).includes(n)) usados.add(n); });
  });
  (DATA.projects||[]).forEach(p=>{ const o=antes("projects",p.id); if(p.owner && (!o||o.owner!==p.owner)) usados.add(p.owner); });
  (DATA.risks||[]).forEach(r=>{ const o=antes("risks",r.id); if(r.owner && (!o||o.owner!==r.owner)) usados.add(r.owner); });
  if(usados.size) DATA.peopleHidden=DATA.peopleHidden.filter(n=>!usados.has(n));
}
let ultimoSaveIniciadoEm=0, ultimoSaveTerminouEm=0, salvamentosEmCurso=0;
async function persist(){
  // merge por entidade: envia só o que mudou desde o último snapshot confirmado
  // (ver 01-storage.js) em vez de reescrever tudo por cima
  salvamentosEmCurso++; saving=true; ultimoSaveIniciadoEm=Date.now(); updateSync();
  try{ return await persistInterno(); }
  finally{ salvamentosEmCurso=Math.max(0,salvamentosEmCurso-1); saving=salvamentosEmCurso>0; ultimoSaveTerminouEm=Date.now(); updateSync(); }
}
async function persistInterno(){
  ensurePeople();
  reativarNomesDigitados();
  const antes={version:DATA.version, updatedAt:DATA.updatedAt};
  DATA.version=(DATA.version||0)+1;
  // com Firestore, "updatedAt" é o marcador de novidades de OUTRAS pessoas: salvar não o avança
  if(!(BACKEND && BACKEND.tipo==="firestore")) DATA.updatedAt=Date.now();
  DATA.updatedBy=me||"Anônimo";
  ultimasFalhas=[]; falhasDoUltimoSalvamento=[];
  const ok=await rawSet(DATA);
  if(!ok){ DATA.version=antes.version; DATA.updatedAt=antes.updatedAt; } // falhou: nada avança
  lastSig=sigOf(DATA);
  if(ok) lastSyncedSnapshot=cloneEntities(DATA); // só avança a base se realmente gravou
  dirty=false;
  if(!ok) toast("Não foi possível salvar",true);
  if(ok && ultimasFalhas.length){
    // parte das alterações não foi aceita (sem permissão, item excluído por outra pessoa,
    // documento grande demais): a tela volta a mostrar o que está de fato salvo
    const f=ultimasFalhas; ultimasFalhas=[]; ultimosRecusados=[]; falhasDoUltimoSalvamento=f;
    await loadData(false); render();
    toast("Parte das alterações não foi salva ("+f.map(x=>x.oQue+": "+x.motivo).slice(0,2).join("; ")+"). Recarreguei os dados.",true,true);
    return ok;
  }
  if(ok && ultimosRecusados.length){
    // o servidor recusou mudar a "atividade-pai" porque criaria um ciclo:
    // a estrutura mudou enquanto a pessoa mexia (outra pessoa/aba ou dado desatualizado)
    ultimosRecusados=[];
    if(await loadData(false)){ render(); toast("A estrutura do cronograma mudou enquanto você mexia — recarreguei os dados. Confira e tente de novo.",true,true); }
  }
  return ok;
}

/* ============================================================
   ATUALIZAÇÃO AUTOMÁTICA
   - não começa uma consulta antes de a anterior responder;
   - pausa com a aba em segundo plano (volta na hora ao reabrir);
   - espera mais depois de um erro (servidor ocupado);
   - com servidor, primeiro pergunta "mudou algo?" (apiCheck, leve)
     e só baixa tudo quando mudou;
   - descarta respostas que saíram ANTES do último salvamento desta
     pessoa (senão uma resposta atrasada "desfazia" na tela o que acabou
     de ser salvo, e a pessoa refazia o movimento -- foi assim que duas
     atividades acabaram uma dentro da outra).
============================================================ */
let pollEmCurso=false, pollFalhas=0, pollProximoEm=0;
/* Redesenho vindo da atualização automática: nunca com uma janela aberta
   nem com o cursor num campo da tela (o redesenho apagaria o que está
   sendo digitado). Fica pendente e acontece quando a pessoa sai do campo
   ou fecha a janela. Os dados em si já estão atualizados por trás. */
let renderPendente=false;
function campoDaTelaEmFoco(){
  const a=document.activeElement;
  return !!(a && a.closest && a.closest("#content") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function renderSeguro(){
  if(document.querySelector(".overlay.show") || campoDaTelaEmFoco()){ renderPendente=true; return; }
  renderPendente=false; render();
}
function aplicarRenderPendente(){
  if(!renderPendente) return;
  setTimeout(()=>{ if(renderPendente && !campoDaTelaEmFoco() && !document.querySelector(".overlay.show")){ renderPendente=false; render(); } },150);
}
if(typeof document!=="undefined"){
  document.addEventListener("focusout",aplicarRenderPendente);
  // fechar/recarregar a página com algo digitado e não salvo: o navegador pergunta
  window.addEventListener("beforeunload",e=>{
    if((typeof tapEdicao!=="undefined" && tapEdicao && tapEdicao.sujo) || (typeof modalSujo!=="undefined" && modalSujo)){ e.preventDefault(); e.returnValue=""; }
  });
}
async function poll(forcar){
  if(salvamentosEmCurso>0 || pollEmCurso) return;
  if(!forcar && typeof document!=="undefined" && document.hidden) return;
  if(!forcar && Date.now()<pollProximoEm) return;
  pollEmCurso=true;
  const inicio=Date.now();
  try{
    let remote=null;
    if(MODE==="servidor"){
      const chk=JSON.parse(await servidorCall("apiCheck"));
      const mudou = sigOf(chk)!==lastSig && ((chk.updatedAt||0)>(DATA.updatedAt||0) || (chk.sheetUpdatedAt||0)>(DATA.sheetUpdatedAt||0));
      if(mudou){ remote=await rawGet(); if(!remote) throw new Error("falha ao carregar"); }
      else remote={...chk, __soTravas:true};
    }else{
      remote=await rawGet();
      if(!remote) return;
    }
    pollFalhas=0; pollProximoEm=0;
    // resposta que pode ser anterior a um salvamento desta pessoa: ignorar
    if(salvamentosEmCurso>0 || ultimoSaveIniciadoEm>=inicio || ultimoSaveTerminouEm>=inicio) return;
    const locksChanged = JSON.stringify(remote.locks||{})!==JSON.stringify(DATA.locks||{});
    if(!remote.__soTravas){
      const changed = sigOf(remote)!==lastSig;
      const newer = (remote.updatedAt||0)>(DATA.updatedAt||0) || (remote.sheetUpdatedAt||0)>(DATA.sheetUpdatedAt||0);
      if(changed && newer){
        DATA=remote; lastSig=sigOf(remote); ensurePeople();
        lastSyncedSnapshot=cloneEntities(DATA);
        renderSeguro();
        if(remote.updatedBy && remote.updatedBy!==me && String(remote.updatedBy).toLowerCase()!==String(myEmail||"").toLowerCase()) toast("Atualizado por "+remote.updatedBy);
        return;
      }
    }
    if(locksChanged){
      DATA.locks=remote.locks||{};
      renderSeguro();
    }
  }catch(e){
    pollFalhas++;
    pollProximoEm=Date.now()+Math.min(60000, POLL_MS*Math.pow(2,pollFalhas));
  }finally{
    pollEmCurso=false;
  }
}
if(typeof document!=="undefined") document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ pollProximoEm=0; poll(); } });

/* ============================================================
   TRAVA DE EDIÇÃO POR SEÇÃO DO PROJETO
   Cada seção do projeto tem a sua trava: assim alguém da Equipe ajustando
   o Cronograma não impede o Gestor de editar a TAP ou os Riscos do mesmo
   projeto. A chave da trava é "idDoProjeto#secao":
     cabecalho (dados do projeto e TAP) · cronograma · eap · riscos ·
     custos · stakeholders · responsabilidade · linhaBase · tudo
   "tudo" vale para o projeto inteiro (importar, duplicar, excluir): só é
   concedida com todas as seções livres, e bloqueia todas elas.
   Sem seção (só o id do projeto), as consultas respondem "alguma seção
   deste projeto está em edição por outra pessoa" -- usado nos selos 🔒.

   DATA.locks = { "pid#secao": {holder, holderName, updatedAt, expiraEm} }
   - Com servidor: decidida pelo servidor, numa transação.
   - Modo demonstração (local): melhor esforço (lê antes de escrever).
============================================================ */
const SECOES_TRAVA=["cabecalho","cronograma","eap","riscos","custos","stakeholders","responsabilidade","linhaBase"];
const LOCK_TTL_LOCAL_MS=90000;
function tk(pid,secao){ return pid ? String(pid)+"#"+(secao||"tudo") : ""; }
function pidDaChave(k){ return String(k||"").split("#")[0]; }
function secaoDaChave(k){ const p=String(k||"").split("#"); return p.length>1?p[1]:""; }
function chaveTAP(){ return (typeof tapEdicao!=="undefined" && tapEdicao) ? tk(tapEdicao.projectId,"cabecalho") : ""; }
function travaValida(l){
  if(!l || !l.holder) return false;
  if(l.expiraEm) return Number(l.expiraEm) > Date.now();
  return (Date.now()-(Number(l.updatedAt)||0)) < LOCK_TTL_LOCAL_MS;
}
/* travas (de outra pessoa) que conflitam com a chave pedida */
function travasEmConflito(chave,locks,eu){
  locks=locks||{}; eu=eu===undefined?myIdentity():eu;
  const pid=pidDaChave(chave), sec=secaoDaChave(chave);
  return Object.keys(locks).filter(k=>{
    if(pidDaChave(k)!==pid) return false;
    const l=locks[k]; if(!travaValida(l) || l.holder===eu) return false;
    if(!sec || sec==="tudo") return true;          // projeto inteiro: qualquer seção conflita
    const s=secaoDaChave(k); return s===sec || s==="tudo";
  }).map(k=>Object.assign({chave:k},locks[k]));
}
let lockTimers={}; // projectId -> intervalId do heartbeat
let activeLockProjectId=null; // projeto cuja trava está associada ao modal aberto no momento
function myIdentity(){ return MODE==="servidor" ? myEmail : me; }
// trava negada: com nome = outra pessoa editando; sem nome = o servidor não respondeu
function msgTrava(r){
  const quem=r&&(r.holderName||r.holder);
  return quem ? "Projeto em edição por "+quem : "Servidor ocupado — não consegui abrir a edição agora. Tente de novo em instantes.";
}
/* Atalhos para quem edita: janela (trava fica enquanto a janela estiver
   aberta e é solta no closeModal) ou ação direta (pega, faz, solta). */
async function pegarTravaParaJanela(pid){
  if(isLockedByOther(pid)){ toast("Projeto em edição por "+lockHolderName(pid),true); return false; }
  const r=await acquireLock(pid);
  if(!r.ok){ toast(msgTrava(r),true); render(); return false; }
  activeLockProjectId=pid; startHeartbeat(pid); render();
  return true;
}
async function pegarTravaDireta(pid){
  if(isLockedByOther(pid)){ toast("Projeto em edição por "+lockHolderName(pid),true); return false; }
  const r=await acquireLock(pid);
  if(!r.ok){ toast(msgTrava(r),true); return false; }
  return true;
}
function isLockedByOther(chave){
  if(!chave || !DATA.locks) return false;
  return travasEmConflito(chave,DATA.locks).length>0;
}
function lockHolderName(chave){
  const c=travasEmConflito(chave,DATA.locks||{});
  return c.length ? (c[0].holderName||c[0].holder) : "";
}
async function acquireLock(chave){
  if(!chave) return {ok:true};
  if(chave.indexOf("#")<0) chave=tk(chave,"tudo");
  if(MODE==="servidor"){
    try{
      const s=await servidorCall("apiAcquireLock",chave);
      const r=s?(typeof s==="string"?JSON.parse(s):s):{ok:false};
      DATA.locks=DATA.locks||{};
      if(r.ok) DATA.locks[chave]={holder:r.holder,holderName:r.holderName,updatedAt:r.updatedAt,expiraEm:r.expiraEm||0};
      return r;
    }catch(e){ return {ok:false}; }
  }
  // demonstração: recarrega antes de decidir, para reduzir a janela de corrida
  const remote=await rawGet();
  const locks=(remote&&remote.locks)||DATA.locks||{};
  const conflito=travasEmConflito(chave,locks);
  const now=Date.now();
  if(conflito.length){
    const c=conflito[0];
    return {ok:false, holder:c.holder, holderName:c.holderName||c.holder, updatedAt:c.updatedAt};
  }
  if(remote) DATA.locks=remote.locks||{};
  DATA.locks=DATA.locks||{};
  DATA.locks[chave]={holder:myIdentity(),holderName:me,updatedAt:now};
  await persist();
  return {ok:true, holder:myIdentity(), holderName:me, updatedAt:now};
}
async function heartbeatLock(projectId){
  if(!projectId) return;
  if(MODE==="servidor"){
    const timer=lockTimers[projectId];
    try{
      const s=await servidorCall("apiHeartbeatLock",projectId);
      if(lockTimers[projectId]!==timer || !timer) return; // a edição terminou/recomeçou enquanto isso: resposta velha
      const r=s?(typeof s==="string"?JSON.parse(s):s):{ok:false};
      if(r.ok){ DATA.locks=DATA.locks||{}; DATA.locks[projectId]={holder:r.holder,holderName:r.holderName,updatedAt:r.updatedAt,expiraEm:r.expiraEm||0}; }
      else { stopHeartbeat(projectId); travaPerdida(projectId, r.holderName||r.holder); }
    }catch(e){}
  }else if(DATA.locks && DATA.locks[projectId] && DATA.locks[projectId].holder===myIdentity()){
    DATA.locks[projectId].updatedAt=Date.now();
    await persist();
  }
}
async function releaseLock(projectId){
  if(!projectId) return;
  stopHeartbeat(projectId);
  if(MODE==="servidor"){
    try{ await servidorCall("apiReleaseLock",projectId); }catch(e){}
    if(DATA.locks) delete DATA.locks[projectId];
  }else if(DATA.locks && DATA.locks[projectId] && DATA.locks[projectId].holder===myIdentity()){
    delete DATA.locks[projectId];
    await persist();
  }
}
function startHeartbeat(projectId){
  stopHeartbeat(projectId);
  lockTimers[projectId]=setInterval(()=>heartbeatLock(projectId), MODE==="servidor"?60000:20000);
}
function stopHeartbeat(projectId){
  if(lockTimers[projectId]){ clearInterval(lockTimers[projectId]); delete lockTimers[projectId]; }
}

/* ============================================================
   FILTERS
============================================================ */
function passFilters(t){
  if(filters.project && t.projectId!==filters.project) return false;
  if(filters.assignee && t.assignee!==filters.assignee) return false;
  if(filters.status && effStatus(t)!==filters.status) return false;
  if(filters.late && !isLate(t)) return false;
  if(filters.milestone && !t.isMilestone) return false;
  if(filters.search){
    const q=filters.search.toLowerCase();
    const pn=(projOf(t.projectId)||{}).name||"";
    if(!t.name.toLowerCase().includes(q) && !pn.toLowerCase().includes(q)) return false;
  }
  return true;
}
function visibleTaskIds(){
  // inclui ancestrais de atividades que passam, para manter a hierarquia
  const ids=new Set();
  DATA.tasks.forEach(t=>{ if(passFilters(t)){ ids.add(t.id); let p=t.parentId; while(p&&!ids.has(p)){ ids.add(p); p=(taskOf(p)||{}).parentId; } }});
  return ids;
}
function activeFilterCount(){
  let n=0; if(filters.project)n++; if(filters.assignee)n++; if(filters.status)n++; if(filters.late)n++; if(filters.milestone)n++; return n;
}

function renderDashboard(){

  if(filters.portfolio) projectsList = projectsList.filter(p=>(p.portfolioIds||[]).includes(filters.portfolio));
  const projIdSet = new Set(projectsList.map(p=>p.id));
  const tasks = DATA.tasks.filter(t=>projIdSet.has(t.projectId));

  const late=tasks.filter(isLate).length;
  const milestones=tasks.filter(t=>t.isMilestone);
  const msDone=milestones.filter(t=>effStatus(t)==="concluida").length;
  const overall=totalTasks? Math.round(tasks.reduce((a,t)=>a+progressOf(t),0)/totalTasks):0;

  // por projeto
  const projRows=projectsList.map(p=>{
    const roots=childrenOf(p.id,null);
    const pct=roots.length?Math.round(roots.map(progressOf).reduce((a,b)=>a+b,0)/roots.length):0;
    const lateN=tasks.filter(t=>t.projectId===p.id&&isLate(t)).length;
    return `<div class="proj-row">
      <span class="proj-dot" style="background:${p.color}"></span>
      <span class="pn">${esc(p.name)}</span>
      <span class="po">${esc(p.owner||"—")}</span>
      ${lateN?`<span class="late-tag">⚠ ${lateN}</span>`:""}
      <span class="barwrap"><i style="width:${pct}%"></i></span>
      <span class="pct">${pct}%</span>
    </div>`;
  }).join("") || `<p style="color:var(--muted)">Nenhum projeto ainda.</p>`;

  // distribuição por status (barra empilhada)
  const stCounts=STATUS.map(s=>({s,n:tasks.filter(t=>effStatus(t)===s.id).length}));
  const stTotal=Math.max(1,tasks.length);
  const stBar=stCounts.map(({s,n})=>n?`<i style="width:${(n/stTotal*100)}%;background:${s.sw}" title="${s.label}: ${n}"></i>`:"").join("");
  const stLegend=stCounts.map(({s,n})=>`<span><i style="background:${s.sw}"></i> ${s.label} <b class="mono">${n}</b></span>`).join("");

  // carga por pessoa
  const byP={};
  tasks.forEach(t=>{
    if(!t.assignee) return;
    byP[t.assignee]=byP[t.assignee]||{open:0,late:0,done:0};
    if(effStatus(t)==="concluida") byP[t.assignee].done++;
    else if(effStatus(t)==="cancelada"){/*ignora*/}
    else { byP[t.assignee].open++; if(isLate(t)) byP[t.assignee].late++; }
  });
  const maxLoad=Math.max(1,...Object.values(byP).map(v=>v.open+v.done));
  const loadRows=Object.entries(byP).sort((a,b)=>(b[1].open+b[1].late)-(a[1].open+a[1].late)).map(([nm,v])=>{
    const tot=v.open+v.done; const w=x=>(x/maxLoad*100);
    return `<div class="load-row">
      <span class="nm"><span class="av sm" style="background:${avColor(nm)}">${esc(initials(nm)).toUpperCase()}</span>${esc(nm)}</span>
      <span class="load-bar">
        ${v.open-v.late? `<i class="open" style="width:${w(v.open-v.late)}%"></i>`:""}
        ${v.late? `<i class="late" style="width:${w(v.late)}%"></i>`:""}
        ${v.done? `<i class="done" style="width:${w(v.done)}%"></i>`:""}
      </span>
      <span class="load-num">${v.open} abertas${v.late?` · ${v.late} atras.`:""}</span>
    </div>`;
  }).join("") || `<p style="color:var(--muted)">Sem responsáveis atribuídos.</p>`;

  // próximos prazos (datas efetivas, incl. rollup de subatividades)
  const upcoming=tasks.filter(t=>effStatus(t)!=="concluida"&&effStatus(t)!=="cancelada"&&!t.isMilestone&&effPlannedEnd(t))
    .sort((a,b)=>effPlannedEnd(a).localeCompare(effPlannedEnd(b))).slice(0,7).map(t=>{
      const p=projOf(t.projectId); const lt=isLate(t);
      return `<div class="proj-row">
        <span class="proj-dot" style="background:${p?p.color:"#ccc"}"></span>
        <span class="pn">${esc(t.name)}</span>
        <span class="av sm" style="background:${avColor(t.assignee)}" title="${esc(t.assignee)}">${esc(initials(t.assignee)).toUpperCase()}</span>
        <span class="dt ${lt?"":"plan"}" style="${lt?"color:var(--warn);font-weight:600":""}">${fmtBR(effPlannedEnd(t))}${lt?" ⚠":""}</span>
      </div>`;
    }).join("") || `<p style="color:var(--muted)">Sem prazos pendentes.</p>`;

  // próximos marcos
  const nextMs=milestones.filter(t=>effStatus(t)!=="cancelada").sort((a,b)=>(effPlannedEnd(a)||"9999").localeCompare(effPlannedEnd(b)||"9999")).slice(0,7).map(t=>{
    const p=projOf(t.projectId); const st=statusObj(effStatus(t)); const lt=isLate(t);
    return `<div class="proj-row">
      <span class="proj-dot" style="background:${p?p.color:"#ccc"}"></span>
      <span class="pn"><span style="color:var(--milestone)">◆</span> ${esc(t.name)}</span>
      <span class="pill ${st.cls}" style="flex:0 0 auto">${st.label}</span>
      <span class="dt ${lt?"":"plan"}" style="${lt?"color:var(--warn);font-weight:600":""}">${fmtBR(effPlannedEnd(t))}${lt?" ⚠":""}</span>
    </div>`;
  }).join("") || `<p style="color:var(--muted)">Nenhum marco cadastrado.</p>`;

  return `
  ${dashFilterBar()}
  <div class="grid-kpi">
    <div class="kpi"><div class="lab">Projetos</div><div class="val">${totalProj}</div><div class="sub">${totalTasks} atividades no total</div></div>
    <div class="kpi"><div class="lab">Progresso geral</div><div class="val exec">${overall}%</div><div class="sub">${done} concluídas</div></div>
    <div class="kpi"><div class="lab">Atrasadas</div><div class="val ${late?"warn":""}">${late}</div><div class="sub">prazo planejado vencido</div></div>
    <div class="kpi"><div class="lab">Em andamento</div><div class="val">${tasks.filter(t=>effStatus(t)==="em_andamento").length}</div><div class="sub">atividades ativas</div></div>
    <div class="kpi"><div class="lab">Marcos</div><div class="val" style="color:var(--milestone)">${milestones.length}</div><div class="sub">${msDone} concluído${msDone===1?"":"s"}</div></div>
  </div>
  <div class="panel">
    <h2>Distribuição por status <span class="badge">${totalTasks} atividades</span></h2>
    <div class="stbar">${stBar||`<i style="width:100%;background:var(--line)"></i>`}</div>
    <div class="legend" style="margin-top:12px">${stLegend}</div>
  </div>
  <div class="dash-2">
    <div class="panel"><h2>Projetos <span class="badge">${totalProj}</span></h2>${projRows}</div>
    <div class="panel"><h2>Carga por responsável</h2>${loadRows}
      <div class="legend" style="margin-top:14px"><span><i class="lg-plan" style="border-radius:2px"></i> Abertas</span><span><i style="background:var(--warn);border-radius:2px"></i> Atrasadas</span><span><i class="lg-exec" style="border-radius:2px"></i> Concluídas</span></div>
    </div>
  </div>
  <div class="dash-2">
    <div class="panel"><h2>Próximos prazos</h2>${upcoming}</div>
    <div class="panel"><h2>Próximos marcos <span class="badge" style="color:var(--milestone)">◆</span></h2>${nextMs}</div>
  </div>`;
}

  if(!p){

  const header=`<div class="pd-head no-print">
    <button class="btn" id="backToProjects"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Projetos</button>

    <button class="iconbtn" id="pdEditProj" title="Editar projeto"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
  </div>`;

  const tabs=[
    {id:"tap",label:"TAP",icon:iconTap()},
    {id:"eap",label:"EAP",icon:iconEAP()},
    {id:"crono",label:"Cronograma",icon:iconCrono()},
    {id:"gantt",label:"Gantt",icon:iconGantt()},
    {id:"riscos",label:"Riscos",icon:iconRiscos()},
    ...(pode("verCustos",p.id)?[{id:"custos",label:"Custos",icon:iconCustos()}]:[]),
    {id:"stakeholders",label:"Stakeholders",icon:iconStakeholders()},
    {id:"resp",label:"Responsabilidade",icon:iconResp()},
    {id:"baseline",label:"Linha de base",icon:iconBaseline()},
  ];
  const tabBar=`<div class="proj-tabs no-print" role="tablist" aria-label="Seções do projeto">${tabs.map(t=>`<button class="ptab ${projectTab===t.id?"on":""}" data-ptab="${t.id}" role="tab" aria-selected="${projectTab===t.id}">${t.icon}${t.label}</button>`).join("")}</div>`;

  // as funções de renderização abaixo já respeitam filters.project; fixamos temporariamente
  // no projeto atual para reaproveitá-las sem duplicar lógica.
  const savedProj=filters.project;
  filters.project=p.id;
  if(projectTab==="custos" && !pode("verCustos",p.id)) projectTab="crono";
  let body="";
  // seções ainda chegando do servidor (só o cabeçalho e o cronograma vêm na abertura)
  const precisaSecoes=["eap","riscos","custos","stakeholders","resp","baseline"].includes(projectTab);
  if(!secoesCarregadas(p.id)){
    garantirSecoes([p.id]).then(ok=>{ if(ok) renderSeguro(); });
  }
  if(precisaSecoes && !secoesCarregadas(p.id)) body=`<div class="empty" id="secoesCarregando"><h3>Carregando…</h3><p>Buscando os dados deste projeto.</p></div>`;
  else if(projectTab==="eap") body=renderEAP(p.id);
  else if(projectTab==="gantt") body=renderGantt();
  else if(projectTab==="riscos") body=renderRiscos(p.id);
  else if(projectTab==="custos") body=renderCustos(p.id);
  else if(projectTab==="stakeholders") body=renderStakeholders(p.id);
  else if(projectTab==="resp") body=renderResponsibilityMatrix(p.id);
  else if(projectTab==="baseline") body=renderBaseline(p.id);
  else if(projectTab==="tap") body=renderTAP(p.id);
  else body=renderCronoTree();
  filters.project=savedProj;

  return header+tabBar+body;
}

/* ============================================================
   EAP — Estrutura Analítica do Projeto

   Estrutura PRÓPRIA, independente das atividades do Cronograma (DATA.eapNodes,
   não DATA.tasks). A EAP representa a decomposição do ESCOPO do projeto;
   o Cronograma representa AS ATIVIDADES com data, responsável e status.
   As duas podem se parecer no começo (o "Editar EAP em lote" oferece
   copiar a hierarquia do Cronograma como ponto de partida), mas editar
   uma não altera a outra.

   Duas visualizações, alternáveis por botão:
   1. ORGANOGRAMA (horizontal) — caixas conectadas por linhas, como um
      organograma de empresa. Aplica zoom automático (encolhe até caber
      na largura da tela) + controles de zoom manual + rolagem, para
      projetos grandes não estourarem a tela.
   2. LISTA (vertical) — recuo por nível, sempre legível e sem zoom,
      melhor para projetos muito grandes ou para imprimir.

   Em ambas: dentro de cada nível, o trabalho vem primeiro e os MARCOS
   fecham o ramo, sempre como folhas — a decomposição termina na entrega
   que ela produz.
============================================================ */
function eapOrdenar(lista){ return lista.filter(e=>!e.isMilestone).concat(lista.filter(e=>e.isMilestone)); }

function renderEAP(projectId){
  const p=projOf(projectId); if(!p) return emptyState("Projeto não encontrado","");
  const roots=eapChildrenOf(projectId,null);
  if(!roots.length) return `<div class="eap-toolbar no-print"><button class="btn primary sm" id="eapEditBtn">Editar EAP em lote</button><button class="btn sm" id="eapAutoBtn">Montar EAP automática</button></div>`+emptyState("EAP vazia","Use \"Editar EAP em lote\" acima para criar a estrutura manualmente, ou \"Montar EAP automática\" para gerar a partir das atividades do Cronograma que têm subordinadas.");

  const toolbar=`<div class="eap-toolbar no-print">
    <div class="view-toggle">
      <button class="vtbtn ${eapViewMode==="org"?"on":""}" data-eapview="org" title="Organograma (caixas conectadas)">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M12 12H6v4M12 12h6v4"/></svg>
        Organograma
      </button>
      <button class="vtbtn ${eapViewMode==="lista"?"on":""}" data-eapview="lista" title="Lista vertical (recuo por nível)">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Lista
      </button>
    </div>
    ${eapViewMode==="org"?`<div class="eap-zoom">
      <button class="iconbtn" data-eapzoom="out" title="Diminuir zoom">−</button>
      <span class="mono" id="eapZoomPct">100%</span>
      <button class="iconbtn" data-eapzoom="in" title="Aumentar zoom">+</button>
      <button class="btn sm" data-eapzoom="reset" title="Ajustar à largura da tela">Ajustar à tela</button>
    </div>`:""}
    <button class="btn primary sm" id="eapEditBtn" style="margin-left:auto">Editar EAP em lote</button>
    <button class="btn sm" id="eapAutoBtn">Montar EAP automática</button>
  </div>`;

  const body = eapViewMode==="lista" ? renderEAPLista(p,projectId,roots) : renderEAPOrganograma(p,projectId,roots);
  return toolbar + body +
    `<p class="hint no-print" style="margin-top:14px">A EAP é uma estrutura própria, <strong>independente do Cronograma</strong> — editar aqui não muda as atividades, e vice-versa. Dentro de cada nível, o trabalho vem primeiro e os <strong>marcos ◆ fecham o ramo</strong>, como entregas. Use "Editar EAP em lote" para reestruturar tudo de uma vez.</p>`;
}

/* ---------- Visualização 1: organograma horizontal (com zoom) ---------- */
function renderEAPOrganograma(p,projectId,roots){
  const node=(e)=>{
    const cls=e.isMilestone?"ms":(e.parentId?"sub":"task");
    return `<div class="eap-node ${cls}" title="${esc(e.name)}">
      <div class="eap-name">${e.isMilestone?'<span class="eapv-dia">◆</span> ':""}${esc(e.name)}</div>
      ${e.notes?`<div class="eap-meta"><span class="sig note" title="${esc(e.notes)}">≡ ${esc(e.notes)}</span></div>`:""}
    </div>`;
  };
  const walk=(e)=>{
    const kids=eapOrdenar(eapChildrenOf(projectId,e.id));
    return `<li>${node(e)}${kids.length?`<ul>${kids.map(walk).join("")}</ul>`:""}</li>`;
  };
  const rootsHtml=eapOrdenar(roots).map(walk).join("");

  return `<div class="eap-scroll" id="eapScroll">
    <div class="eap-zoomable" id="eapZoomable">
      <div class="eap-tree"><ul><li>
        <div class="eap-node root">${esc(p.name)}</div>
        <ul>${rootsHtml}</ul>
      </li></ul></div>
    </div>
  </div>`;
}

/* ---------- Visualização 2: lista vertical (sem zoom) ---------- */
function renderEAPLista(p,projectId,roots){
  const node=(e,num,depth)=>{
    const cls=e.isMilestone?"ms":(depth===0?"task":"sub");
    return `<div class="eapv-node ${cls}">
      <span class="eapv-num mono">${num}</span>
      <span class="eapv-name">${e.isMilestone?'<span class="eapv-dia">◆</span> ':""}${esc(e.name)}</span>
      <span class="eapv-meta">
        ${e.notes?`<span class="sig note" title="${esc(e.notes)}">≡</span>`:""}
      </span>
    </div>`;
  };
  const walk=(e,num,depth)=>{
    const kids=eapOrdenar(eapChildrenOf(projectId,e.id));
    return `<li class="${e.isMilestone?"is-ms":""}" role="treeitem" aria-level="${depth+1}">${node(e,num,depth)}` +
      (kids.length?`<ul>${kids.map((k,i)=>walk(k,`${num}.${i+1}`,depth+1)).join("")}</ul>`:"") +
      `</li>`;
  };
  const rootsHtml=eapOrdenar(roots).map((r,i)=>walk(r,`${i+1}`,0)).join("");
  const total=DATA.eapNodes.filter(e=>e.projectId===projectId).length;
  const totalMs=DATA.eapNodes.filter(e=>e.projectId===projectId&&e.isMilestone).length;

  return `<div class="eapv">
      <div class="eapv-root">
        <span class="proj-dot" style="background:${p.color}"></span>
        <span class="eapv-rootname">${esc(p.name)}</span>
        <span class="eapv-rootmeta">${total} itens · ${totalMs} marco${totalMs===1?"":"s"}</span>
      </div>
      <ul class="eapv-tree" role="tree" aria-label="Estrutura analítica do projeto">${rootsHtml}</ul>
    </div>`;
}

/* ---------- Zoom: encaixe automático + ajuste manual ---------- */
function fitEAPZoom(){
  const scroll=$("#eapScroll"), zoomable=$("#eapZoomable");
  if(!scroll||!zoomable) return;
  zoomable.style.transform="scale(1)"; // mede sem zoom aplicado
  const natural=zoomable.scrollWidth;
  const disponivel=scroll.clientWidth-4;
  const fit = natural>disponivel ? Math.max(0.3, disponivel/natural) : 1;
  eapZoom = fit;
  applyEAPZoom();
}
function applyEAPZoom(){
  const zoomable=$("#eapZoomable"); if(!zoomable) return;
  zoomable.style.transform=`scale(${eapZoom})`;
  zoomable.style.transformOrigin="top left";
  const pct=$("#eapZoomPct"); if(pct) pct.textContent=Math.round(eapZoom*100)+"%";
}
/* ============================================================

============================================================ */
function renderRiscos(projectId){
  const risks=DATA.risks.filter(r=>r.projectId===projectId);

    const l=riskLevelOf(sev);
    return l.label==="Muito baixo"?"sev-muitobaixo":l.label==="Baixo"?"sev-low":l.label==="Médio"?"sev-med":l.label==="Alto"?"sev-high":"sev-muitoalto";
  };
  let cells="";
  for(let prob=5;prob>=1;prob--){
    cells+=`<div class="rm-ylabel">${prob}</div>`;
    for(let imp=1;imp<=5;imp++){
      const nesta=risks.filter(r=>r.probability===prob&&r.impact===imp);
      const count=nesta.length;
      const sev=prob*imp;
      const cls=clsPorNivel(sev);
      const active=(riskMatrixFilter&&riskMatrixFilter.prob===prob&&riskMatrixFilter.imp===imp)?" active":"";
      const titulo=count
        ? `${nesta.map(r=>r.name).join(", ")} — Probabilidade ${prob} × Impacto ${imp}`
        : `Probabilidade ${prob} × Impacto ${imp}`;
      cells+=`<button class="rm-cell ${cls}${active}" data-rmcell="${prob}:${imp}" title="${esc(titulo)}" aria-label="Probabilidade ${prob}, impacto ${imp}: ${count||0} risco(s)" aria-pressed="${active?"true":"false"}">${count||""}</button>`;
    }
  }
  cells+=`<div class="rm-corner"></div>`;
  for(let imp=1;imp<=5;imp++) cells+=`<div class="rm-xlabel">${imp}</div>`;

  const filtered = riskMatrixFilter ? risks.filter(r=>r.probability===riskMatrixFilter.prob&&r.impact===riskMatrixFilter.imp) : risks;
  const rows=filtered.map(r=>{
    const sev=r.probability*r.impact;
    const nivel=riskLevelOf(sev);
    const sevCls=clsPorNivel(sev);
    const st=riskStatusObj(r.status);
    const tipoLabel=r.riskType==="oportunidade"?"Oportunidade":"Ameaça";
    return `<tr>
      <td data-editrisk="${r.id}" style="cursor:pointer">${esc(r.name)}</td>
      <td>${esc(r.category||"—")}</td>
      <td><span class="pill ${r.riskType==="oportunidade"?"st-con":"st-can"}">${tipoLabel}</span></td>
      <td title="Probabilidade: ${r.probability} · Impacto: ${r.impact}"><span class="sev-badge ${sevCls}">${nivel.label}</span></td>
      <td style="font-size:11.5px;color:var(--muted)" title="${esc(nivel.strategy)}">${esc(nivel.strategy.split(" - ")[0])}</td>

      <td>${r.owner?esc(r.owner):"—"}</td>

      <td class="no-print"><button class="iconbtn" data-delrisk="${r.id}" title="Excluir"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></td>
    </tr>`;
  }).join("") || `<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:22px">Nenhum risco cadastrado${riskMatrixFilter?" nesta célula":""}.</td></tr>`;

  return `
  <div class="panel">
    <h2>Matriz de riscos <span class="badge">${risks.length} no total</span>${riskMatrixFilter?`<button class="clearf" id="rmClear" style="margin-left:auto">Limpar seleção</button>`:""}</h2>
    <div class="risk-matrix">
      <div class="rm-axis-y">Probabilidade</div>
      <div class="risk-matrix-cols">
        <div class="rm-grid">${cells}</div>
        <div class="rm-axis-x">Impacto</div>
      </div>
    </div>
    <div class="legend" style="margin-top:14px">
      <span><i style="background:#2F9E44"></i> Muito baixo</span>
      <span><i style="background:#74B816"></i> Baixo</span>
      <span><i style="background:#F2A705"></i> Médio</span>
      <span><i style="background:#E8590C"></i> Alto</span>

/* ============================================================
   CUSTOS — planejado × realizado, por categoria
============================================================ */
function fmtBRL(v){ return (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function renderCustos(projectId){
  const costs=DATA.costs.filter(c=>c.projectId===projectId);
  const totalPlan=costs.reduce((a,c)=>a+(Number(c.plannedValue)||0),0);
  const totalReal=costs.reduce((a,c)=>a+(Number(c.actualValue)||0),0);
  const saldo=totalPlan-totalReal;
  const pctUsed=totalPlan?Math.round(totalReal/totalPlan*100):0;

  const cats={};
  costs.forEach(c=>{
    const k=c.category||"Sem categoria";
    cats[k]=cats[k]||{plan:0,real:0};
    cats[k].plan+=Number(c.plannedValue)||0;
    cats[k].real+=Number(c.actualValue)||0;
  });
  const catRows=Object.entries(cats).map(([k,v])=>{
    const dv=v.plan-v.real;
    return `<tr><td>${esc(k)}</td><td class="mono">${fmtBRL(v.plan)}</td><td class="mono">${fmtBRL(v.real)}</td><td class="mono" style="color:${dv<0?"var(--danger)":"var(--exec)"}">${fmtBRL(dv)}</td></tr>`;

      <td>${esc(c.category||"—")}</td>
      <td>${c.costType==="investimento"?"Investimento":"Custeio"}</td>
      <td>${c.taskId&&taskOf(c.taskId)?`<span class="link-tag" title="Vinculado a: ${esc(taskOf(c.taskId).name)}">🔗 ${esc(taskOf(c.taskId).name)}</span>`:"—"}</td>
      <td class="dt plan">${fmtBR(c.date)}</td>
      <td class="mono">${fmtBRL(c.plannedValue)}</td>
      <td class="mono">${fmtBRL(c.actualValue)}</td>
      <td class="mono" style="color:${dv<0?"var(--danger)":"var(--exec)"}">${fmtBRL(dv)}</td>
      <td>${esc(c.status||"Não requisitado")}</td>
      <td class="no-print"><button class="iconbtn" data-delcost="${c.id}" title="Excluir"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></td>
    </tr>`;
  }).join("") || `<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:22px">Nenhum custo cadastrado.</td></tr>`;

  return `
  <div class="grid-kpi">
    <div class="kpi"><div class="lab">Orçado</div><div class="val">${fmtBRL(totalPlan)}</div><div class="sub">${costs.length} lançamento${costs.length===1?"":"s"}</div></div>
    <div class="kpi"><div class="lab">Realizado</div><div class="val ${pctUsed>100?"warn":"exec"}">${fmtBRL(totalReal)}</div><div class="sub">${pctUsed}% do orçado</div></div>
    <div class="kpi"><div class="lab">Saldo</div><div class="val ${saldo<0?"warn":""}">${fmtBRL(saldo)}</div><div class="sub">${saldo<0?"acima do orçamento":"dentro do orçamento"}</div></div>
  </div>
  <div class="panel">
    <h2>Por categoria</h2>
    <div class="tbl-wrap"><table class="crono"><thead><tr><th>Categoria</th><th>Orçado</th><th>Realizado</th><th>Saldo</th></tr></thead><tbody>${catRows}</tbody></table></div>
  </div>
  <div class="panel">
    <h2>Lançamentos <span class="badge">${costs.length}</span><button class="btn primary" id="newCostBtn" style="margin-left:auto">+ Novo custo</button></h2>
    ${isMobile?mobileCostCards(costs):`<div class="tbl-wrap"><table class="crono">
      <thead><tr><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Atividade vinculada</th><th>Data</th><th>Orçado</th><th>Realizado</th><th>Saldo</th><th>Status</th><th class="no-print"></th></tr></thead>
      <tbody>${rows}</tbody>

  </div>`;

function renderCronoTree(){
  if(isMobile) return renderCronoCardsMobile();
  const vis=visibleTaskIds();
  let rows="";
  const renderTask=(t,depth)=>{
    if(!vis.has(t.id)) return;
    const kids=childrenOf(t.projectId,t.id);
    const hasKids=kids.length>0;
    const isExp=expanded[t.id]!==false;
    const st=statusObj(effStatus(t));
    const pr=PRIO.find(p=>p.id===t.priority)||PRIO[1];
    const prog=progressOf(t);
    const lt=isLate(t);
    const locked=isLockedByOther(t.projectId);
    const preds=(t.predecessors||[]).map(id=>(taskOf(id)||{}).name).filter(Boolean);
    const rowCls = t.isMilestone ? "t-ms" : (depth===0 ? "t-root" : "t-sub");
    // prefixo de ramificação: sempre presente a partir do nível 1, independente de ser marco ou não,
    // para manter atividades e subatividades do mesmo nível sempre alinhadas entre si.
    const branchPrefix = depth>0 ? `<span class="branch">└</span>` : "";
    const subLevel = depth>=4 ? 4 : depth; // diferencia o ícone até o 4º nível, depois repete o padrão
    const mark = t.isMilestone
      ? `<span class="type-mark ms">◆</span>`
      : (depth===0 ? `<span class="type-mark task"></span>` : `<span class="type-mark sub${subLevel}"></span>`);
    const ps=effPlannedStart(t), pe=effPlannedEnd(t), as_=effActualStart(t), ae=effActualEnd(t);
    const rollup = hasKids ? ' title="Datas calculadas a partir das subatividades"' : "";
    // sinais compactos ao lado do nome (substituem as colunas Prioridade e Situação)
    const sinais = [
      lt ? `<span class="sig late" title="Atrasada">⚠</span>` : "",
      preds.length ? `<span class="sig pred" title="Predecessoras: ${esc(preds.join(', '))}">↳${preds.length}</span>` : "",
      t.notes ? `<span class="sig note" title="${esc(t.notes)}"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>` : ""

        <div class="tname" style="padding-left:${depth*20}px">
          <button class="caret" data-toggle="${t.id}" ${hasKids?ariaCaret(isExp,t.name):ariaHidden()} style="${hasKids?"":"visibility:hidden"}">${hasKids?(isExp?caretDown():caretRight()):caretRight()}</button>
          ${branchPrefix}${mark}
          <span class="label" data-edit="${t.id}" title="${esc(t.name)}">${esc(t.name)}</span>
          ${sinais}
        </div>
      </div></td>
      <td data-dblfield="assignee" title="Duplo clique para editar">${t.assignee?`<span class="av sm" style="background:${avColor(t.assignee)}" title="${esc(t.assignee)}">${esc(initials(t.assignee)).toUpperCase()}</span>`:`<span style="color:var(--muted)">—</span>`}${(t.coResponsaveis||[]).map(n=>`<span class="av sm" style="background:${avColor(n)};margin-left:2px;outline:2px solid var(--panel,#fff)" title="Responsável adicional: ${esc(n)}">${esc(initials(n)).toUpperCase()}</span>`).join("")}</td>
      <td data-dblfield="status" title="Duplo clique para editar"><span class="pill ${st.cls}">${st.label}</span></td>
      ${showProgressBar?`<td><span class="mini-bar"><i style="width:${prog}%"></i></span> <span class="mono" style="font-size:11px">${prog}%</span></td>`:""}
      ${(t.isMilestone&&!hasKids)
        ? `<td class="dt plan ms-espelho" title="Marco: igual ao fim planejado">${fmtBR(ps)}</td>`

      </div></td>
    </tr>`;
    if(hasKids&&isExp) kids.forEach(k=>renderTask(k,depth+1));
  };

  DATA.projects.forEach(p=>{
    const roots=childrenOf(p.id,null);
    const anyVis=DATA.tasks.some(t=>t.projectId===p.id&&vis.has(t.id));
    if(filters.project && filters.project!==p.id) return;
    if(!anyVis && (filters.search||activeFilterCount())) return;
    const pct=roots.length?Math.round(roots.map(progressOf).reduce((a,b)=>a+b,0)/roots.length):0;

      <td class="dt plan"${projRollup}>${fmtBR(pps)}</td>

/* ============================================================
   CRITICAL PATH (por projeto)
============================================================ */
function criticalSet(pid){
  const tasks=DATA.tasks.filter(t=>t.projectId===pid && (effPlannedStart(t)||effPlannedEnd(t)));
  if(!tasks.length) return new Set();
  const byId={}; tasks.forEach(t=>byId[t.id]=t);
  const dur=t=>{ const s=effPlannedStart(t),e=effPlannedEnd(t); if(s&&e) return Math.max(0,dayDiff(s,e))+1; return 1; };
  const memoEF={}, memoPath={};
  const ef=(t,seen)=>{
    if(memoEF[t.id]!=null) return memoEF[t.id];
    if(seen.has(t.id)) return 0; // ciclo
    seen.add(t.id);
    const preds=(t.predecessors||[]).map(id=>byId[id]).filter(Boolean);
    let best=0,bestP=null;
    preds.forEach(p=>{ const v=ef(p,seen); if(v>best){best=v;bestP=p.id;} });
    memoPath[t.id]=bestP;
    memoEF[t.id]=best+dur(t);
    seen.delete(t.id);
    return memoEF[t.id];
  };
  let endId=null,endVal=-1;
  tasks.forEach(t=>{ const v=ef(t,new Set()); if(v>endVal){endVal=v;endId=t.id;} });
  const crit=new Set();
  let cur=endId;
  while(cur && !crit.has(cur)){ crit.add(cur); cur=memoPath[cur]; }
  return crit;
}

/* ============================================================
   GANTT
============================================================ */
function renderGantt(){
  const vis=visibleTaskIds();
  // coletar atividades visíveis com datas
  const flat=[]; // {task, depth, isProj}
  DATA.projects.forEach(p=>{
    if(filters.project && filters.project!==p.id) return;
    const roots=childrenOf(p.id,null);
    const anyVis=DATA.tasks.some(t=>t.projectId===p.id&&vis.has(t.id));
    if(!anyVis && (filters.search||activeFilterCount())) return;
    flat.push({proj:p,isProj:true});
    const walk=(t,depth)=>{
      if(!vis.has(t.id)) return;
      flat.push({task:t,depth});
      if(expanded[t.id]!==false) childrenOf(t.projectId,t.id).forEach(k=>walk(k,depth+1));
    };
    if(expanded["p_"+p.id]!==false) roots.forEach(r=>walk(r,0));
  });

  // range de datas
  let min=null,max=null;
  const consider=d=>{ if(!d)return; const x=parseD(d); if(!min||x<min)min=x; if(!max||x>max)max=x; };
  flat.forEach(r=>{ if(r.task){ consider(effPlannedStart(r.task));consider(effPlannedEnd(r.task));consider(effActualStart(r.task));consider(effActualEnd(r.task));} });
  if(!min){ min=new Date(); max=addDays(new Date(),30); }
  min=addDays(min,-3); max=addDays(max,5);
  const today=new Date(); today.setHours(0,0,0,0);
  if(today<min) min=addDays(today,-2);
  if(today>max) max=addDays(today,2);
  const totalDays=Math.max(1,Math.round((max-min)/86400000)+1);

  /* ---------- ESCALA ----------
     Em projetos longos, mostrar um dia por coluna gera um grafico
     impraticavel. A escala aglutina os dias em semanas ou meses.
     "auto" escolhe sozinha pela duracao total.                        */
  const escala = ganttScale==="auto"
    ? (totalDays>240 ? "mes" : (totalDays>70 ? "semana" : "dia"))
    : ganttScale;
  // dias agrupados por coluna
  const DPC = escala==="mes" ? 30 : (escala==="semana" ? 7 : 1);
  // largura de UMA COLUNA (nao de um dia)
  const COLW = isPrinting
    ? (escala==="dia" ? Math.max(7, totalDays>120?7:(totalDays>60?9:12)) : (escala==="semana"?26:34))
    : (escala==="dia" ? Math.max(20, totalDays>45?26:34) : (escala==="semana"?44:64));
  // largura equivalente de 1 dia (usada no posicionamento das barras)
  const DW = COLW/DPC;
  const totalCols = Math.ceil(totalDays/DPC);
  const timeW = Math.max(totalCols*COLW, totalDays*DW);
  const xOf=iso=>{ if(!iso)return 0; return Math.round((parseD(iso)-min)/86400000)*DW; };

  if(!flat.length) return filterBar()+ganttToolbar(escala,totalDays)+emptyState("Nada para exibir","Crie atividades com datas planejadas para ver o Gantt.");

  // crit sets
  const critSets={};
  if(ganttOpts.critical) DATA.projects.forEach(p=>critSets[p.id]=criticalSet(p.id));

  // cabecalho: faixa superior (mes/ano) + faixa inferior (dia, semana ou mes)
  let months="",days="";
  let mStart=0,mLabel=null;
  for(let c=0;c<totalCols;c++){
    const d=addDays(min,c*DPC);
    const ml=d.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"});
    if(ml!==mLabel){
      if(mLabel!==null) months+=`<div class="g-month" style="left:${mStart*COLW}px;width:${(c-mStart)*COLW}px">${mLabel}</div>`;
      mLabel=ml; mStart=c;
    }
    let rot, we=false;
    if(escala==="dia"){
      rot=d.getDate(); we=(d.getDay()===0||d.getDay()===6);
    }else if(escala==="semana"){
      rot=d.getDate()+"/"+(d.getMonth()+1);
    }else{
      rot=d.toLocaleDateString("pt-BR",{month:"short"});
    }
    days+=`<div class="g-day ${we?"we":""}" style="left:${c*COLW}px;width:${COLW}px">${rot}</div>`;
  }
  months+=`<div class="g-month" style="left:${mStart*COLW}px;width:${(totalCols-mStart)*COLW}px">${mLabel}</div>`;

  // labels + rows (alturas variáveis: projeto maior, atividades/subatividades menores e iguais)
  let labels="",rowsHtml="";
  const rowY={}; let yc=0; const PROJH=40, ROWH=30;
  flat.forEach(r=>{
    const y=yc; const h=r.isProj?PROJH:ROWH;
    if(r.isProj){
      labels+=`<div class="g-lab proj" style="height:${h}px"><span class="proj-dot" style="background:${r.proj.color};margin-right:6px"></span><span class="ll" title="${esc(r.proj.name)}">${esc(r.proj.name)}</span>${isLockedByOther(r.proj.id)?`<span class="lock-badge" style="margin-left:6px" title="Em edição por ${esc(lockHolderName(r.proj.id))}">🔒</span>`:""}</div>`;
      rowsHtml+=`<div class="g-row proj" style="height:${h}px"></div>`;
    }else{
      const t=r.task; rowY[t.id]=y;
      const lt=isLate(t);
      const kidsOfT=childrenOf(t.projectId,t.id);
      const hasKidsT=kidsOfT.length>0;
      const isExpT=expanded[t.id]!==false;
      const labCls = t.isMilestone ? "lab-ms" : (r.depth===0 ? "lab-task" : "lab-sub");
      const branchPrefix = r.depth>0 ? '<span class="branch" style="margin-right:4px">└</span>' : "";
      const labMark = t.isMilestone ? '<span class="ms" style="color:var(--milestone)">◆</span> '
        : (r.depth===0 ? '<span class="type-mark task" style="margin-right:6px"></span>' : '');
      const gcaret = `<span class="caret" data-toggle="${t.id}" style="${hasKidsT?"":"visibility:hidden"}">${hasKidsT?(isExpT?caretDown():caretRight()):caretRight()}</span>`;
      labels+=`<div class="g-lab ${labCls}" style="height:${h}px;padding-left:${12+r.depth*16}px">${gcaret}${branchPrefix}${labMark}<span class="ll" data-edit="${t.id}" title="${esc(t.name)}">${esc(t.name)}</span></div>`;
      let bars="";
      const crit=ganttOpts.critical && critSets[t.projectId] && critSets[t.projectId].has(t.id);
      const tps=effPlannedStart(t), tpe=effPlannedEnd(t), tas=effActualStart(t), tae=effActualEnd(t);
      if(t.isMilestone){
        const x=xOf(tpe||tps);
        bars=`<div class="ms-dot ${crit?"crit":""}" style="left:${x}px" data-edit="${t.id}" title="${esc(t.name)}"></div>`;
      }else{
        if(tps&&tpe){
          const x=xOf(tps), w=Math.max(DW,(dayDiff(tps,tpe)+1)*DW);
          bars+=`<div class="bar plan ${crit?"crit":""}" style="left:${x}px;width:${w}px" data-edit="${t.id}" title="Planejado: ${fmtBR(tps)}–${fmtBR(tpe)}"></div>`;
        }
        const aS=tas, aE=tae||(effStatus(t)==="em_andamento"?todayISO():"");
        if(aS&&aE){
          const x=xOf(aS), w=Math.max(6,(dayDiff(aS,aE)+1)*DW);
          const doneCls = lt ? "late" : (effStatus(t)==="concluida" ? "done" : "");
          bars+=`<div class="bar exec ${doneCls}" style="left:${x}px;width:${w}px" data-edit="${t.id}" title="Execução: ${fmtBR(aS)}–${tae?fmtBR(tae):"em curso"}"><span class="bl">${progressOf(t)}%</span></div>`;
        }
      }
      rowsHtml+=`<div class="g-row" data-rowid="${t.id}" style="height:${h}px">${bars}</div>`;
    }
    yc+=h;
  });

  // weekend shading + today line (overlay layer)
  let shading="";
  if(escala==="dia"){   // marcar fins de semana so faz sentido dia a dia
    for(let i=0;i<totalDays;i++){
      const d=addDays(min,i);
      if(d.getDay()===0||d.getDay()===6) shading+=`<div class="g-weekend" style="left:${i*DW}px;width:${DW}px"></div>`;
    }
  }
  const todayX=Math.round((today-min)/86400000)*DW+DW/2;
  const totalH=yc;

  // dependency arrows (mais discretas: curva suave e menor opacidade; ocultável via toggle)
  let depPaths="";
  if(ganttOpts.showDeps!==false) flat.forEach(r=>{
    if(!r.task) return;
    const t=r.task;
    (t.predecessors||[]).forEach(pid=>{
      const pt=taskOf(pid);
      if(!pt||rowY[pid]==null||rowY[t.id]==null) return;
      const ppe=effPlannedEnd(pt), pps=effPlannedStart(pt), tps=effPlannedStart(t), tpe=effPlannedEnd(t);
      const pAE=effActualEnd(pt), tAS=effActualStart(t);
      // ancora a linha na barra de execução/progresso quando ela existir (mais próxima visualmente);
      // cai para a barra planejada apenas se ainda não há execução registrada.
      const fromDate = pAE || ppe || pps;
      const toDate = tAS || tps || tpe;
      const fromX=xOf(fromDate)+(pt.isMilestone?7:DW);
      const fromY=rowY[pid]+19; // alinhado ao centro da barra de execução (top:15 + altura:9 → centro 19.5)
      const toX=xOf(toDate)-(t.isMilestone?7:0);
      const toY=rowY[t.id]+19;
      const crit=ganttOpts.critical && critSets[t.projectId] && critSets[t.projectId].has(t.id) && critSets[t.projectId].has(pid);
      const midX=(fromX+toX)/2;
      depPaths+=`<path class="${crit?"crit":""}" d="M${fromX},${fromY} C${midX},${fromY} ${midX},${toY} ${toX},${toY}"/>
        <circle class="dep-dot ${crit?"crit":""}" cx="${toX}" cy="${toY}" r="2.3"/>`;
    });
  });

  return filterBar()+ganttToolbar(escala,totalDays)+expandBar("gantt")+`
  <div class="gantt"><div class="gantt-inner">
    <div class="g-labels">
      <div class="g-corner">Atividade</div>
      ${labels}
    </div>
    <div class="g-time" style="width:${timeW}px">
      <div class="g-head" style="width:${timeW}px">${months}${days}</div>
      <div class="g-rows" style="width:${timeW}px;height:${totalH}px">
        ${shading}
        ${rowsHtml}
        <svg class="dep-svg" width="${timeW}" height="${totalH}">${depPaths}</svg>
        <div class="g-today" style="left:${todayX}px"></div>
      </div>
    </div>
  </div></div>`;
}
function ganttToolbar(escala,totalDays){
  const op=(v,l)=>`<option value="${v}" ${ganttScale===v?"selected":""}>${l}</option>`;
  const auto = escala ? ` (${escala==="mes"?"mês":escala})` : "";
  return `<div class="gantt-toolbar">
    <label class="gscale">Escala
      <select id="gScale">
        ${op("auto","Automática"+auto)}
        ${op("dia","Dia")}
        ${op("semana","Semana")}
        ${op("mes","Mês")}
      </select>
    </label>
    <label class="toggle"><input type="checkbox" id="gCrit" ${ganttOpts.critical?"checked":""}><span class="tk"></span> Destacar caminho crítico</label>
    <label class="toggle"><input type="checkbox" id="gDeps" ${ganttOpts.showDeps!==false?"checked":""}><span class="tk"></span> Mostrar dependências</label>
    <div class="legend">
      <span><i class="lg-plan" style="opacity:.4"></i> Planejado</span>
      <span><i class="lg-exec"></i> Execução</span>
      <span><i style="background:var(--primary);border-radius:2px"></i> Concluído</span>
      <span><i style="background:var(--warn);border-radius:2px"></i> Atrasada</span>
      <span><i class="lg-ms"></i> Marco</span>
      ${ganttOpts.critical?`<span><i class="lg-crit"></i> Crítico</span>`:""}
    </div>
  </div>`;
}

============================================================ */
function wireView(){
  // filter bar
  const fp=$("#fProject"),fa=$("#fAssignee"),fs=$("#fStatus"),fl=$("#fLate"),fm=$("#fMilestone"),fc=$("#fClear"),fpg=$("#fProgress");
  if(fp) fp.onchange=e=>{filters.project=e.target.value; if(e.target.value) lastProject=e.target.value; render();};
  if(fa) fa.onchange=e=>{filters.assignee=e.target.value;render();};
  if(fs) fs.onchange=e=>{filters.status=e.target.value;render();};
  if(fl) fl.onclick=()=>{filters.late=!filters.late;render();};
  if(fm) fm.onclick=()=>{filters.milestone=!filters.milestone;render();};
  if(fpg) fpg.onclick=()=>toggleProgressBar();
  if(fc) fc.onclick=()=>{filters.project="";filters.assignee="";filters.status="";filters.late=false;filters.milestone=false;render();};
  const fcount=$("#fCount");
  if(fcount){ const n=DATA.tasks.filter(passFilters).length; fcount.textContent=n+" atividade"+(n===1?"":"s"); }

  // crono toggles & actions
  $$("[data-toggle]").forEach(el=>el.onclick=e=>{e.stopPropagation();const id=el.dataset.toggle;expanded[id]=expanded[id]===false;render();});
  $$("[data-ptoggle]").forEach(el=>el.onclick=e=>{e.stopPropagation();const k="p_"+el.dataset.ptoggle;expanded[k]=expanded[k]===false;render();});
  $$("[data-edit]").forEach(el=>el.onclick=e=>{e.stopPropagation();if(isMobile){mobileTaskInfo(el.dataset.edit);return;}openTaskModal(el.dataset.edit);});
  $$("[data-del]").forEach(el=>el.onclick=e=>{e.stopPropagation();deleteTask(el.dataset.del);});
  $$("[data-addsub]").forEach(el=>el.onclick=e=>{e.stopPropagation();const t=taskOf(el.dataset.addsub);openTaskModal(null,{projectId:t.projectId,parentId:t.id});});
  $$("[data-pred]").forEach(el=>el.onclick=e=>{e.stopPropagation();openPredecessorModal(el.dataset.pred);});
  $$("[data-addroot]").forEach(el=>el.onclick=e=>{e.stopPropagation();lastProject=el.dataset.addroot;openTaskModal(null,{projectId:el.dataset.addroot,parentId:null});});
  $$("[data-editproj]").forEach(el=>el.onclick=e=>{e.stopPropagation();openProjectModal(el.dataset.editproj);});
  $$("[data-delproj]").forEach(el=>el.onclick=e=>{e.stopPropagation();deleteProject(el.dataset.delproj);});

  // gantt critical toggle
  const gc=$("#gCrit"); if(gc) gc.onchange=e=>{ganttOpts.critical=e.target.checked;render();};
  const gd=$("#gDeps"); if(gd) gd.onchange=e=>{ganttOpts.showDeps=e.target.checked;render();};
  const gs=$("#gScale"); if(gs) gs.onchange=e=>{ganttScale=e.target.value;render();};

  // expandir / recolher todas as linhas
  $$("[data-expandlayer]").forEach(el=>el.onclick=()=>expandOneLayer());
  $$("[data-collapselayer]").forEach(el=>el.onclick=()=>collapseOneLayer());

  // edicao por duplo clique (responsavel, status, datas)

  // linha de base

  const blClr=$("#blClear"); if(blClr) blClr.onclick=()=>limparBaseline(currentProjectId);

  const eapAutoBtn=$("#eapAutoBtn"); if(eapAutoBtn) eapAutoBtn.onclick=()=>buildAutoEAP(currentProjectId);

  const officeBtn=$("#officeManagerEditBtn"); if(officeBtn) officeBtn.onclick=()=>openOfficeManagerModal(currentProjectId);

  // cronograma: arrastar e soltar — reordenar, aninhar como subatividade, ou tornar atividade raiz
  let dragTaskId=null;
  const cronoRows=$$(".crono tbody tr[data-task]");
  const projRows=$$(".crono tbody tr.row-proj");
  const clearDropClasses=()=>{
    cronoRows.forEach(r=>r.classList.remove("drop-before","drop-after","drop-inside","drop-deny"));
    projRows.forEach(r=>r.classList.remove("drop-root","drop-deny"));
  };
  cronoRows.forEach(row=>{
    row.addEventListener("dragstart",e=>{
      if(isReadOnly()){ e.preventDefault(); return; }
      const t0=taskOf(row.dataset.task);
      if(t0&&isLockedByOther(tk(t0.projectId,"cronograma"))){ e.preventDefault(); toast("Projeto em edição por "+lockHolderName(tk(t0.projectId,"cronograma")),true); return; }
      dragTaskId=row.dataset.task; row.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      try{ e.dataTransfer.setData("text/plain",dragTaskId); }catch(err){}
    });
    row.addEventListener("dragend",()=>{ row.classList.remove("dragging"); clearDropClasses(); dragTaskId=null; });
    row.addEventListener("dragover",e=>{
      if(!dragTaskId||dragTaskId===row.dataset.task) return;
      e.preventDefault();
      const dragT=taskOf(dragTaskId), overT=taskOf(row.dataset.task);
      clearDropClasses();
      if(!dragT||!overT||overT.projectId!==dragT.projectId||overT.id===dragT.id||isDescendant(overT.id,dragT.id)){
        row.classList.add("drop-deny"); return;
      }
      const rect=row.getBoundingClientRect();
      const y=(e.clientY-rect.top)/rect.height;
      if(y<0.25) row.classList.add("drop-before");
      else if(y>0.75) row.classList.add("drop-after");
      else row.classList.add("drop-inside");
    });
    row.addEventListener("drop",async e=>{
      e.preventDefault();
      const zone = row.classList.contains("drop-before")?"before":row.classList.contains("drop-after")?"after":row.classList.contains("drop-inside")?"inside":null;
      clearDropClasses();
      if(!dragTaskId||dragTaskId===row.dataset.task||!zone) return;
      const dragT=taskOf(dragTaskId), overT=taskOf(row.dataset.task);
      if(!dragT||!overT||overT.projectId!==dragT.projectId||isDescendant(overT.id,dragT.id)) return;
      if(isLockedByOther(tk(dragT.projectId,"cronograma"))){ toast("Projeto em edição por "+lockHolderName(tk(dragT.projectId,"cronograma")),true); return; }
      const lockRes=await acquireLock(tk(dragT.projectId,"cronograma"));
      if(!lockRes.ok){ toast(msgTrava(lockRes),true); return; }
      if(zone==="inside") nestTask(dragT, overT);
      else moveTask(dragT, overT, zone==="before");
      pruneInvalidPredecessors(dragT);
      await persist(); await releaseLock(tk(dragT.projectId,"cronograma")); render(); toast(zone==="inside"?"Movida para dentro de "+overT.name:"Ordem atualizada");
    });
  });

  // soltar sobre a linha de um projeto = tornar a atividade arrastada uma atividade raiz desse projeto
  projRows.forEach(row=>{
    row.addEventListener("dragover",e=>{
      if(!dragTaskId) return;
      e.preventDefault();
      const dragT=taskOf(dragTaskId);
      clearDropClasses();
      if(!dragT||dragT.projectId!==row.dataset.proj){ row.classList.add("drop-deny"); return; }
      row.classList.add("drop-root");
    });
    row.addEventListener("drop",async e=>{
      e.preventDefault();
      const allow=row.classList.contains("drop-root");
      clearDropClasses();
      if(!dragTaskId||!allow) return;
      const dragT=taskOf(dragTaskId);
      if(!dragT||dragT.projectId!==row.dataset.proj) return;
      if(isLockedByOther(tk(dragT.projectId,"cronograma"))){ toast("Projeto em edição por "+lockHolderName(tk(dragT.projectId,"cronograma")),true); return; }
      const lockRes=await acquireLock(tk(dragT.projectId,"cronograma"));
      if(!lockRes.ok){ toast(msgTrava(lockRes),true); return; }
      unnestToRoot(dragT, row.dataset.proj);
      pruneInvalidPredecessors(dragT);
      await persist(); await releaseLock(tk(dragT.projectId,"cronograma")); render(); toast("Atividade movida para o nível principal");
    });
  });
}

/* Reordena dragT para antes/depois de overT, usando o MESMO pai de overT (permite mudar de nível) */
function moveTask(dragT,overT,before){
  dragT.parentId = overT.parentId || null;
  const siblings=childrenOf(dragT.projectId,dragT.parentId).filter(s=>s.id!==dragT.id);
  const idx=siblings.findIndex(s=>s.id===overT.id);
  const insertAt = before ? idx : idx+1;
  siblings.splice(insertAt,0,dragT);
  siblings.forEach((s,i)=>{ s.order=i; });
}
/* Aninha dragT como última subatividade de overT */
function nestTask(dragT,overT){
  dragT.parentId = overT.id;
  const siblings=childrenOf(dragT.projectId,overT.id).filter(s=>s.id!==dragT.id);
  siblings.push(dragT);
  siblings.forEach((s,i)=>{ s.order=i; });
}
/* Remove dragT de dentro de uma atividade-pai, tornando-a atividade raiz do projeto */
function unnestToRoot(dragT,projectId){
  dragT.parentId=null; dragT.projectId=projectId;
  const siblings=childrenOf(projectId,null).filter(s=>s.id!==dragT.id);
  siblings.push(dragT);
  siblings.forEach((s,i)=>{ s.order=i; });
}
/* Ordem visual (pré-ordem) das atividades dentro do projeto, respeitando hierarquia atual */
function flattenOrder(projectId){
  const order=[];
  const walk=parentId=>{ childrenOf(projectId,parentId).forEach(t=>{ order.push(t.id); walk(t.id); }); };
  walk(null);
  return order;
}
/* Remove predecessoras que passaram a vir DEPOIS da atividade na nova posição (dependência deixaria de fazer sentido) */
function pruneInvalidPredecessors(t){
  if(!t.predecessors||!t.predecessors.length) return;
  const order=flattenOrder(t.projectId);
  const myIdx=order.indexOf(t.id);
  if(myIdx<0) return;
  t.predecessors=t.predecessors.filter(pid=>{
    const pIdx=order.indexOf(pid);
    return pIdx===-1 ? true : pIdx<myIdx;
  });
}

async function openPredecessorModal(taskId){

  if(isLockedByOther(tk(t.projectId,"cronograma"))){ toast("Projeto em edição por "+lockHolderName(tk(t.projectId,"cronograma")),true); return; }
  const lockRes=await acquireLock(tk(t.projectId,"cronograma"));
  if(!lockRes.ok){ toast(msgTrava(lockRes),true); render(); return; }
  activeLockProjectId=tk(t.projectId,"cronograma"); startHeartbeat(tk(t.projectId,"cronograma")); render();

  let preds=[...(t.predecessors||[])];
  const predOptions=()=>DATA.tasks
    .filter(x=>x.projectId===t.projectId && x.id!==t.id && !preds.includes(x.id) && !isDescendant(x.id,t.id))

      <select id="pd_sel"><option value="">+ adicionar predecessora…</option>${predOptions()}</select>

    </div>
  `;
  const foot=`<button class="btn" id="pd_cancel">Cancelar</button><button class="btn primary" id="pd_save">Salvar</button>`;
  showModal("Selecionar predecessora",body,foot,false);

  const renderPreds=()=>{
    $("#pd_list").innerHTML=preds.map(pid=>{
      const pt=taskOf(pid); if(!pt) return "";
      return `<span class="pred-tag">${esc(pt.name)}<button data-rmpd="${pid}"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></span>`;
    }).join("") || `<span style="color:var(--muted);font-size:12px">Nenhuma predecessora selecionada.</span>`;
    $$("[data-rmpd]").forEach(b=>b.onclick=()=>{preds=preds.filter(x=>x!==b.dataset.rmpd);renderPreds();refreshSel();});
  };
  const refreshSel=()=>{ $("#pd_sel").innerHTML=`<option value="">+ adicionar predecessora…</option>${predOptions()}`; };
  renderPreds();
  $("#pd_sel").onchange=e=>{ if(e.target.value){ preds.push(e.target.value); renderPreds(); refreshSel(); } };
  $("#pd_cancel").onclick=closeModal;
  $("#pd_save").onclick=async()=>{
    t.predecessors=preds;
    closeModal(); await persist(); render(); toast("Predecessoras atualizadas");
  };
}

  $("#m_save").onclick=async()=>{
    const name=$("#m_name").value.trim();
    if(!name){ $("#m_name").focus(); $("#m_name").style.borderColor="var(--danger)"; return; }
    if($("#m_ms").checked && !isParent){ $("#m_ps").value=$("#m_pe").value; $("#m_as").value=$("#m_ae").value; } // marco: início = fim
    const ps=$("#m_ps").value, pe=$("#m_pe").value;
    if(ps&&pe&&pe<ps){ toast("Fim planejado antes do início",true); return; }
    const antesPlannedEnd = editing ? t.plannedEnd : null; // para oferecer a cascata (B6) depois de salvar
    const stSel=$("#m_status").value;
    const stAuto = isParent || stSel==="__auto__";
    Object.assign(t,{
      name, projectId:$("#m_proj").value, parentId:$("#m_parent").value||null,
      assignee:$("#m_assignee").value.trim(),
      status: stAuto ? deriveStatusFromDates(t) : stSel,
      statusManual: !stAuto,
      progress:+$("#m_prog").value, plannedStart:ps, plannedEnd:pe,
      actualStart:$("#m_as").value, actualEnd:$("#m_ae").value,
      predecessors:preds, isMilestone:$("#m_ms").checked, link:$("#m_link").value.trim(), notes:$("#m_notes").value.trim(),
      coResponsaveis:coResp
    });
    normalizeMilestone(t);                       // marco: início = fim
    if(!t.statusManual) t.status=deriveStatusFromDates(t);   // reavalia com as datas finais
    if(t.statusManual && t.status==="concluida" && !t.actualEnd) t.actualEnd=todayISO();
    normalizeMilestone(t);
    if(editing){ const i=DATA.tasks.findIndex(x=>x.id===id); DATA.tasks[i]=t; }
    else { t.order=childrenOf(t.projectId,t.parentId).length; DATA.tasks.push(t); }
    closeModal(); await persist(); render(); toast(editing?"Atividade salva":"Atividade criada");
    if(editing && antesPlannedEnd && t.plannedEnd && antesPlannedEnd!==t.plannedEnd){
      offerCascadeIfNeeded(t.projectId,t.id,t.name,antesPlannedEnd,t.plannedEnd);
    }
  };
  setTimeout(()=>{const el=$("#m_name"); if(el) el.focus();},50);
}
function isDescendant(maybeChild,ancestorId){
  let p=taskOf(maybeChild); const vistos=new Set();
  while(p&&p.parentId&&!vistos.has(p.id)){ vistos.add(p.id); if(p.parentId===ancestorId)return true; p=taskOf(p.parentId); }
  return false;
}

async function deleteTask(id){
  if(blockIfReadOnly()) return;
  const t=taskOf(id); if(!t)return;
  if(isLockedByOther(tk(t.projectId,"cronograma"))){ toast("Projeto em edição por "+lockHolderName(tk(t.projectId,"cronograma")),true); return; }
  const subs=descendants(t);
  if(!confirm(`Excluir "${t.name}"${subs.length?` e suas ${subs.length} subatividade(s)`:""}?`)) return;
  const lockRes=await acquireLock(tk(t.projectId,"cronograma"));
  if(!lockRes.ok){ toast(msgTrava(lockRes),true); return; }
  const remove=new Set([id,...subs.map(s=>s.id)]);
  DATA.tasks=DATA.tasks.filter(x=>!remove.has(x.id));
  DATA.tasks.forEach(x=>{ if(x.predecessors) x.predecessors=x.predecessors.filter(p=>!remove.has(p)); });
  await persist(); await releaseLock(tk(t.projectId,"cronograma")); render(); toast("Atividade excluída");
}

async function deleteProject(id){
  if(blockIfReadOnly()) return;
  const p=projOf(id); if(!p)return;
  if(isLockedByOther(tk(id,"tudo"))){ toast("Projeto em edição por "+lockHolderName(tk(id,"tudo")),true); return; }
  if(!souAutorizadoParaProjeto(id)){
    openSolicitarComJustificativaModal(
      "Solicitar exclusão de projeto",
      `Você não está autorizado a excluir "${esc(p.name)}" — só o Responsável Escritório de Projetos deste projeto pode. O pedido, com sua justificativa, vai por e-mail para essa pessoa.`,
      async(justificativa)=>{
        try{ await servidorCall("solicitarExclusaoProjeto",id,justificativa); toast("Pedido enviado"); }
        catch(e){ toast("Não foi possível enviar o pedido",true); }
      }
    );
    return;
  }
  const n=DATA.tasks.filter(t=>t.projectId===id).length;
  if(!confirm(`Excluir o projeto "${p.name}"${n?` e suas ${n} atividade(s)`:""}?`)) return;
  const lockRes=await acquireLock(tk(id,"tudo"));
  if(!lockRes.ok){ toast(msgTrava(lockRes),true); return; }
  const remove=new Set(DATA.tasks.filter(t=>t.projectId===id).map(t=>t.id));
  DATA.projects=DATA.projects.filter(x=>x.id!==id);
  DATA.tasks=DATA.tasks.filter(t=>t.projectId!==id);
  DATA.tasks.forEach(x=>{ if(x.predecessors) x.predecessors=x.predecessors.filter(pp=>!remove.has(pp)); });
  DATA.risks=(DATA.risks||[]).filter(r=>r.projectId!==id);
  DATA.costs=(DATA.costs||[]).filter(c=>c.projectId!==id);
  if(filters.project===id) filters.project="";
  if(currentProjectId===id){ view="projects"; currentProjectId=null; }
  await persist(); if(DATA.locks) delete DATA.locks[tk(id,"tudo")]; releaseLock(tk(id,"tudo")); render(); toast("Projeto excluído");
}
