/* ============================================================
   JANELAS -- proteção do que foi digitado
   - clicar (ou soltar o mouse depois de selecionar um texto) FORA da
     janela não fecha mais;
   - Esc, X e Cancelar/Fechar perguntam antes de descartar, se algo foi
     digitado;
   - se a trava do projeto for perdida com a janela aberta, ela NÃO fecha:
     mostra um aviso e, ao salvar, tenta retomar a trava.
============================================================ */
let modalSujo=false, modalTravaPerdida=null, retomandoTrava=false;
function campoContaComoEdicao(el){
  if(!el || el.readOnly || el.disabled || el.hasAttribute("data-nosujo")) return false;
  if(el.tagName==="TEXTAREA") return true;
  if(el.tagName!=="INPUT") return false;
  const tp=(el.getAttribute("type")||"text").toLowerCase();
  return ["text","email","tel","date","number","url"].includes(tp);
}
function fecharModalPeloUsuario(){
  if(modalSujo && !confirm("Descartar o que foi digitado nesta janela?")) return;
  closeModal();
}
(function protegerJanelas(){
  const ov=document.getElementById("overlay"); if(!ov) return;
  ov.addEventListener("input",e=>{ if(campoContaComoEdicao(e.target)) modalSujo=true; });
  ov.addEventListener("click",async e=>{
    const btn=e.target.closest&&e.target.closest("button"); if(!btn) return;
    // Cancelar / Fechar com algo digitado: confirmar antes
    if(/_(cancel|close|fechar)$/.test(btn.id||"") && modalSujo){
      if(!confirm("Descartar o que foi digitado nesta janela?")){ e.stopPropagation(); e.preventDefault(); }
      return;
    }
    // trava perdida: ao salvar, tenta retomar antes de deixar o salvamento seguir
    if(modalTravaPerdida && btn.matches(".modal-f .btn.primary")){
      e.stopPropagation(); e.preventDefault();
      if(retomandoTrava) return;                     // já está tentando: ignora clique repetido
      const pid=modalTravaPerdida;
      retomandoTrava=true; btn.disabled=true;
      let r;
      try{ r=await acquireLock(pid); } finally { retomandoTrava=false; btn.disabled=false; }
      const mesmaJanela = btn.isConnected && modalTravaPerdida===pid && ov.classList.contains("show");
      if(!mesmaJanela){
        // janela fechada no meio: não deixa trava presa -- a não ser que o mesmo projeto já esteja em edição de novo
        const emUso = activeLockProjectId===pid || (typeof tapEdicao!=="undefined" && tapEdicao && chaveTAP()===pid);
        if(r && r.ok && !emUso) releaseLock(pid);
        return;
      }
      if(!r.ok){ toast(msgTrava(r)+" — suas alterações continuam na janela. Copie o texto ou tente de novo depois.",true,true); return; }
      modalTravaPerdida=null; activeLockProjectId=pid; startHeartbeat(pid);
      const av=document.getElementById("modalAvisoTrava"); if(av) av.remove();
      btn.click();
    }
  },true);
})();
// chamada quando outra pessoa assume a trava de um projeto que eu estava editando
function travaPerdida(projectId,quem){
  const nome=(projOf(pidDaChave(projectId))||{}).name||"";
  const naTAP = typeof tapEdicao!=="undefined" && tapEdicao && chaveTAP()===projectId;
  const ov=$("#overlay");
  const naJanela = ov && ov.classList.contains("show") && activeLockProjectId===projectId;
  if(naTAP) tapTravaPerdida(quem);
  if(naJanela){
    modalTravaPerdida=projectId;
    const b=ov.querySelector(".modal-b");
    if(b && !document.getElementById("modalAvisoTrava")){
      b.insertAdjacentHTML("afterbegin",`<div class="modal-aviso" id="modalAvisoTrava">⚠ ${quem?`${esc(quem)} assumiu a edição de "${esc(nome)}"`:`A edição de "${esc(nome)}" expirou (ficou mais de 90 s sem contato com o servidor)`}. O que você digitou continua aqui — ao salvar, tento retomar a edição.</div>`);
    }
    if(!naTAP) toast(quem?"Perdeu a edição de \""+nome+"\" para "+quem:"A edição de \""+nome+"\" expirou",true,true);
    return;
  }
  if(naTAP) return;
  toast(quem?"Perdeu a edição de \""+nome+"\" para "+quem:"A edição de \""+nome+"\" expirou",true);
  render();
}
/* Os formulários fazem "closeModal(); await persist();" -- soltar a trava
   na hora deixava um intervalo em que outra pessoa podia abrir e salvar
   por cima antes de o salvamento chegar ao servidor. Agora a trava só é
   solta quando os salvamentos em andamento terminam (e não é solta se o
   mesmo projeto voltou a ser editado nesse meio-tempo). */
function soltarTravaDepoisDeSalvar(pid){
  stopHeartbeat(pid);
  const inicio=Date.now();
  const tentar=()=>{
    if(activeLockProjectId===pid) { startHeartbeat(pid); return; }          // reaberto: a trava é dele de novo
    if(typeof tapEdicao!=="undefined" && tapEdicao && chaveTAP()===pid) return;
    if(salvamentosEmCurso>0 && Date.now()-inicio<60000){ setTimeout(tentar,150); return; }
    releaseLock(pid);
  };
  setTimeout(tentar,0);
}
function showModal(title,body,foot,wide){
  modalSujo=false; modalTravaPerdida=null;
  const ov=$("#overlay");
  ov.innerHTML=`<div class="modal ${wide?"wide":""}"><div class="modal-h"><h3 id="modalTitle">${esc(title)}</h3>
    <button class="iconbtn" id="m_x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-b">${body}</div><div class="modal-f">${foot}</div></div>`;
  ov.classList.add("show");
  $("#m_x").onclick=fecharModalPeloUsuario;
  ov.onclick=null; // clique fora da janela não fecha mais (perdia o que estava digitado)
}
function closeModal(){
  modalSujo=false; modalTravaPerdida=null;
  const ov=$("#overlay"); ov.classList.remove("show"); ov.innerHTML="";
  if(activeLockProjectId){
    const pid=activeLockProjectId; activeLockProjectId=null;
    // a TAP do mesmo projeto está em edição: a trava continua com ela
    if(typeof tapEdicao!=="undefined" && tapEdicao && chaveTAP()===pid){ if(typeof aplicarRenderPendente==="function") aplicarRenderPendente(); return; }
    if(DATA.locks) delete DATA.locks[pid]; // otimista: some da UI já, confirma em segundo plano
    soltarTravaDepoisDeSalvar(pid); render();
  }
  if(typeof aplicarRenderPendente==="function") aplicarRenderPendente();
}

/* ============================================================
   EXCEL EXPORT

   Gera a mesma estrutura da planilha modelo de importação (Projeto,
   Cronograma, Riscos, Custos, Stakeholders, Responsáveis), com os
   dados atuais de UM projeto -- exportar, editar no Excel e reimportar
   funciona sem conversão nenhuma, porque os dois lados usam o mesmo
   formato e a mesma numeração hierárquica (1., 1.1., 1.1.1.).

   Sempre escopado a um projeto (como a própria planilha modelo, que só
   tem lugar para um nome/responsável). Se nenhum projeto estiver em
   foco no momento, pede pra escolher um antes de exportar.
============================================================ */

/**
 * A biblioteca xlsx (SheetJS) gratuita não sabe escrever validação de
 * dados nativa do Excel (listas suspensas) -- isso é recurso pago da
 * própria SheetJS. Por isso a lista é injetada por fora, mexendo direto
 * no XML do arquivo (que no fundo é só um .zip): gera o arquivo
 * normalmente, abre com JSZip, insere o bloco <dataValidations> na
 * planilha certa (na posição correta do esquema, antes de
 * <ignoredErrors>) e gera o arquivo final de novo. Testado abrindo o
 * resultado no LibreOffice de verdade -- não é só a própria SheetJS
 * relendo o que ela mesma escreveu.
 *
 * specsPorAba: { "NomeDaAba": [ {sqref:"D2:D200", options:[...]}, ... ] }
 */
async function injectDropdowns(buffer,specsPorAba){
  const zip=await JSZip.loadAsync(buffer);
  const wbXml=await zip.file("xl/workbook.xml").async("string");
  const relsXml=await zip.file("xl/_rels/workbook.xml.rels").async("string");

  for(const nomeAba in specsPorAba){
    const specs=specsPorAba[nomeAba];
    if(!specs||!specs.length) continue;
    const mSheet=wbXml.match(new RegExp(`<sheet name="${nomeAba.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}"[^>]*r:id="(rId\\d+)"`));
    if(!mSheet) continue;
    const rId=mSheet[1];
    const mRel=relsXml.match(new RegExp(`Id="${rId}"[^>]*Target="worksheets/(sheet\\d+\\.xml)"`))
      || relsXml.match(new RegExp(`Target="worksheets/(sheet\\d+\\.xml)"[^>]*Id="${rId}"`));
    if(!mRel) continue;
    const caminho="xl/worksheets/"+mRel[1];
    const arquivo=zip.file(caminho);
    if(!arquivo) continue;
    let xml=await arquivo.async("string");

    const blocos=specs.map(s=>{
      const formula1='"'+s.options.join(",").replace(/"/g,"'")+'"';
      return `<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="${s.sqref}"><formula1>${formula1}</formula1></dataValidation>`;
    }).join("");
    const bloco=`<dataValidations count="${specs.length}">${blocos}</dataValidations>`;

    xml = xml.includes("<ignoredErrors")
      ? xml.replace("<ignoredErrors", bloco+"<ignoredErrors")
      : xml.replace("</worksheet>", bloco+"</worksheet>");
    zip.file(caminho,xml);
  }
  return zip.generateAsync({type:"blob"});
}

/**
 * Salva um workbook, tentando primeiro com as listas suspensas
 * injetadas; se a JSZip não tiver carregado (rede bloqueada, por
 * exemplo), cai para o download normal sem listas -- nunca trava o
 * download por causa disso.
 */
async function saveWorkbookComListas(wb,nomeArquivo,specsPorAba){
  if(typeof JSZip==="undefined"){
    XLSX.writeFile(wb,nomeArquivo);
    return;
  }
  try{
    const buffer=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    const blob=await injectDropdowns(buffer,specsPorAba);
    const a=document.createElement("a");
    const url=URL.createObjectURL(blob);
    a.href=url; a.download=nomeArquivo;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){
    XLSX.writeFile(wb,nomeArquivo);
  }
}

/**
 * Monta as especificações de lista suspensa para cada aba, calculando
 * a coluna a partir da posição real no cabeçalho -- se um cabeçalho
 * mudar de lugar um dia, a lista suspensa acompanha sozinha.
 */
function colDe(headers,nome){ return XLSX.utils.encode_col(headers.indexOf(nome)); }
function rangeDe(col){ return `${col}2:${col}400`; }
function dropdownSpecsPadrao(){
  return {
    "Cronograma":[
      {sqref:rangeDe(colDe(IMPORT_HEADERS,"Status")), options:["Não iniciada","Em andamento","Concluída","Cancelada"]},
      {sqref:rangeDe(colDe(IMPORT_HEADERS,"Marco")), options:["Sim"]},
    ],
    "Eap":[
      {sqref:rangeDe(colDe(EAP_IMPORT_HEADERS,"Marco")), options:["Sim"]},
    ],
    "Riscos":[
      {sqref:rangeDe(colDe(RISK_IMPORT_HEADERS,"Classificação")), options:RISK_CLASSIFICACOES},
      {sqref:rangeDe(colDe(RISK_IMPORT_HEADERS,"Status")), options:RISK_STATUS.map(s=>s.label)},
      {sqref:rangeDe(colDe(RISK_IMPORT_HEADERS,"Tipo de risco")), options:["Ameaça","Oportunidade"]},
    ],
    "Custos":[
      {sqref:rangeDe(colDe(COST_IMPORT_HEADERS,"Categoria")), options:COST_CATEGORIAS},
      {sqref:rangeDe(colDe(COST_IMPORT_HEADERS,"Método de Aquisição")), options:COST_METODOS_AQUISICAO},
      {sqref:rangeDe(colDe(COST_IMPORT_HEADERS,"Tipo")), options:COST_TYPES},
      {sqref:rangeDe(colDe(COST_IMPORT_HEADERS,"Fonte de recurso")), options:FONTES_RECURSO},
      {sqref:rangeDe(colDe(COST_IMPORT_HEADERS,"Status")), options:COST_STATUS},
    ],
  };
}
/** Acha em que linha da aba TAP (Campo/Valor) um campo está, pra mirar só aquela célula. */
function tapDropdownSpecs(linhasTap){
  const achar=nome=>{ const i=linhasTap.findIndex(l=>l[0]===nome); return i>=0? i+1 : null; }; // +1: cabeçalho ocupa a linha 1
  const specs=[];
  const add=(nome,options)=>{ const l=achar(nome); if(l) specs.push({sqref:`B${l}`, options}); };
  add(rotuloTAPPlanilha("novoOuAndamento"),TAP_NOVO_ANDAMENTO);
  add(rotuloTAPPlanilha("perspectiva"),PERSPECTIVAS_ESTRATEGICAS);
  add(rotuloTAPPlanilha("fonteRecursos"),FONTES_RECURSO);
  add(rotuloTAPPlanilha("prazoEstimado"),TAP_PRAZOS);
  // "Temporalidade das Entregas" agora aceita mais de um ano (separados por
  // ;), então não recebe lista suspensa de valor único aqui
  return { "TAP": specs };
}
function mesclarSpecs(...listas){
  const out={};
  listas.forEach(l=>{ for(const k in l){ out[k]=(out[k]||[]).concat(l[k]); } });
  return out;
}
/** Reordena as abas do workbook pra bater com a ordem desejada; qualquer
    aba que não esteja na lista (não deveria acontecer) fica no final,
    na ordem em que já estava. */
function reordenarAbas(wb,ordemDesejada){
  const atuais=wb.SheetNames.slice();
  const ordenadas=ordemDesejada.filter(n=>atuais.includes(n));
  const resto=atuais.filter(n=>!ordenadas.includes(n));
  wb.SheetNames=[...ordenadas,...resto];
}

async function exportProjectAsTemplate(pid){
  const p=projOf(pid); if(!p){ toast("Projeto não encontrado",true); return; }
  if(!(await garantirSecoes([pid]))){ toast("Não consegui carregar os dados agora — tente de novo",true); return; }
  if(!(await garantirLibs("xlsx","jszip"))){ toast("Não consegui carregar a biblioteca de Excel (verifique a conexão)",true); return; }
  const wb=XLSX.utils.book_new();

  /* ---------- Projeto ---------- */
  const portfolioNames=(p.portfolioIds||[]).map(id=>{ const pf=DATA.portfolios.find(x=>x.id===id); return pf?pf.name:null; }).filter(Boolean).join("; ");
  const wsP=XLSX.utils.aoa_to_sheet([
    ["Campo","Valor"],
    ["Nome do projeto",p.name],
    ["Responsável",p.owner||""],
    ["Portfólio(s)",portfolioNames],
    ...(campoTAPVisivel("perspectiva")?[[rotuloTAP("perspectiva"),p.strategicPerspective||""]]:[]),
  ]);
  wsP["!cols"]=[{wch:20},{wch:52}];
  XLSX.utils.book_append_sheet(wb,wsP,"Projeto");

  /* ---------- Cronograma: mesma numeração em árvore da importação ---------- */
  const numeroPorId={};
  const ordemTarefas=[];
  const walkNum=(parentId,prefixo)=>{
    childrenOf(pid,parentId).forEach((t,idx)=>{
      const num=`${prefixo}${idx+1}.`;
      numeroPorId[t.id]=num;
      ordemTarefas.push(t);
      walkNum(t.id,num);
    });
  };
  walkNum(null,"");

  const linhasCrono=[IMPORT_HEADERS];
  ordemTarefas.forEach(t=>{
    const predNums=(t.predecessors||[]).map(id=>numeroPorId[id]).filter(Boolean).join("; ");
    linhasCrono.push([
      numeroPorId[t.id], t.name, t.assignee||"", (t.coResponsaveis||[]).join("; "), statusObj(effStatus(t)).label,
      fmtBRfull(t.plannedStart)||"", fmtBRfull(t.plannedEnd)||"",
      fmtBRfull(t.actualStart)||"", fmtBRfull(t.actualEnd)||"",
      t.isMilestone?"Sim":"",
      predNums, t.link||"", t.notes||""
    ]);
  });
  const wsT=XLSX.utils.aoa_to_sheet(linhasCrono);
  wsT["!cols"]=[{wch:8},{wch:42},{wch:18},{wch:22},{wch:14},{wch:16},{wch:16},{wch:16},{wch:16},{wch:7},{wch:18},{wch:26},{wch:30}];
  XLSX.utils.book_append_sheet(wb,wsT,"Cronograma");

  /* ---------- Eap: numeração própria em árvore (independente do Cronograma) ---------- */
  const linhasEap=[EAP_IMPORT_HEADERS];
  const walkEap=(parentId,prefixo)=>{
    eapOrdenar(eapChildrenOf(pid,parentId)).forEach((e,idx)=>{
      const num=`${prefixo}${idx+1}.`;
      linhasEap.push([num, e.name, e.isMilestone?"Sim":"", e.notes||""]);
      walkEap(e.id,num);
    });
  };
  walkEap(null,"");
  const wsEap=XLSX.utils.aoa_to_sheet(linhasEap);
  wsEap["!cols"]=[{wch:8},{wch:42},{wch:7},{wch:30}];
  XLSX.utils.book_append_sheet(wb,wsEap,"Eap");

  /* ---------- Riscos ---------- */
  const riscosDoProjeto=DATA.risks.filter(r=>r.projectId===pid);
  const linhasRiscos=[RISK_IMPORT_HEADERS, ...riscosDoProjeto.map(r=>[
    r.name||"", r.category||"", Number(r.probability)||3, Number(r.impact)||3,
    r.owner||"", riskStatusObj(r.status).label, r.riskType==="oportunidade"?"Oportunidade":"Ameaça", r.mitigation||"",
    r.taskId?(numeroPorId[r.taskId]||""):"", r.notes||""
  ])];

function printProjects(projectIds){
  isPrinting=true;

  filters={ project:"", assignee:"", status:"", late:false, milestone:false, search:"", portfolio:"" };
  expanded={}; // tudo expandido, para a EAP e o Cronograma saírem completos

  };

  projectIds.forEach(pid=>{

/* Sugere o projeto para "Nova atividade": filtrado > único expandido > único existente > primeiro */
function currentProjectContext(){
  if(view==="project" && currentProjectId && projOf(currentProjectId)) return currentProjectId;
  if(filters.project) return filters.project;

  if(DATA.projects.length===1) return DATA.projects[0].id;

let toastT;
let toastFixoAte=0;
// fixo=true: aviso importante -- fica 5 s e não é coberto por avisos comuns nesse intervalo
function toast(msg,err,fixo){
  if(!fixo && !err && Date.now()<toastFixoAte) return; // erros sempre aparecem
  const el=$("#toast"); $("#toastTxt").textContent=msg;
  el.querySelector(".dot").style.background=err?"var(--danger)":"var(--exec)";
  el.classList.add("show"); clearTimeout(toastT);
  const dur=fixo?5000:2600;
  if(fixo) toastFixoAte=Date.now()+dur;
  toastT=setTimeout(()=>el.classList.remove("show"),dur);
}

/* ---------- normalizacao tolerante de entrada ---------- */
function normTxt(v){
  return String(v==null?"":v).normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
    .trim().toLowerCase().replace(/\s+/g," ");
}
function parseStatusLoose(v){
  const n=normTxt(v);
  if(!n) return "nao_iniciada";
  const map={
    "nao iniciada":"nao_iniciada","nao_iniciada":"nao_iniciada","nao iniciado":"nao_iniciada",
    "a fazer":"nao_iniciada","pendente":"nao_iniciada",
    "em andamento":"em_andamento","em_andamento":"em_andamento","andamento":"em_andamento",
    "fazendo":"em_andamento","em execucao":"em_andamento",
    "concluida":"concluida","concluido":"concluida","concluída":"concluida",
    "finalizada":"concluida","finalizado":"concluida","feito":"concluida","pronto":"concluida",
    "cancelada":"cancelada","cancelado":"cancelada"
  };
  return map[n]||null;
}
function parsePrioLoose(v){
  const n=normTxt(v);
  if(!n) return "media";
  if(n.startsWith("alt")) return "alta";
  if(n.startsWith("bai")) return "baixa";
  if(n.startsWith("med")||n.startsWith("méd")) return "media";
  return null;
}
function parseBoolLoose(v){
  const n=normTxt(v);
  return ["sim","s","x","true","1","yes"].includes(n);
}
function parseRiskStatusLoose(v){
  const n=normTxt(v);
  if(!n) return "aberto";
  if(n.startsWith("abert")) return "aberto";
  if(n.startsWith("mitigand")||n.startsWith("em mitigac")) return "mitigando";
  if(n.startsWith("mitigad")) return "mitigado";
  if(n.startsWith("materializ")) return "materializado";
  return null;
}
// Aceita Date, numero serial do Excel, "DD/MM/AAAA" e "AAAA-MM-DD"
function parseDateLoose(v){
  if(v==null||v==="") return "";
  if(Object.prototype.toString.call(v)==="[object Date]" && !isNaN(v)){
    return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
  }
  if(typeof v==="number" && isFinite(v)){
    // serial do Excel (base 1899-12-30)
    const d=new Date(Math.round((v-25569)*86400*1000));
    if(isNaN(d)) return null;
    return d.toISOString().slice(0,10);
  }
  // confere se a data existe de fato (rejeita 32/13/2026, 30/02, etc.)
  const real=(y,mo,d)=>{
    const dt=new Date(y,mo-1,d);
    return dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d;
  };
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m){
    const y=+m[1],mo=+m[2],d=+m[3];
    return real(y,mo,d) ? `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}` : null;
  }
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    let y=m[3]; if(y.length===2) y="20"+y;
    const yy=+y,mo=+m[2],d=+m[1];
    return real(yy,mo,d) ? `${yy}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}` : null;
  }
  return null; // invalido -> vira erro de validacao
}
// "1.2.3." -> profundidade 3 ; devolve tambem o pai "1.2."
function parseOutline(num){
  const clean=String(num==null?"":num).trim().replace(/\s/g,"");
  if(!/^\d+(\.\d+)*\.?$/.test(clean)) return null;
  const parts=clean.replace(/\.$/,"").split(".");
  return { key:parts.join(".")+".", depth:parts.length,
           parent: parts.length>1 ? parts.slice(0,-1).join(".")+"." : null };
}

    perspectiva:PERSPECTIVAS_ESTRATEGICAS[0]||"", temporalidade:TAP_ANOS_BASE[0]||"", novoOuAndamento:TAP_NOVO_ANDAMENTO[TAP_NOVO_ANDAMENTO.length-1]||"", etapaAtual:"Execução"};
  const exemploTap=[TAP_IMPORT_HEADERS, ...linhasTAPPlanilha(id=>exemploValor[id]||"")];
  const wsTap=XLSX.utils.aoa_to_sheet(exemploTap);
  wsTap["!cols"]=[{wch:46},{wch:44}];
  XLSX.utils.book_append_sheet(wb,wsTap,"TAP");

  reordenarAbas(wb,["Instruções","Projeto","TAP","Cronograma","Eap","Riscos","Custos","Stakeholders","Responsáveis"]);
  const specs=mesclarSpecs(dropdownSpecsPadrao(),tapDropdownSpecs(exemploTap));
  await saveWorkbookComListas(wb,"modelo_importacao_projeto.xlsx",specs);
  toast("Modelo baixado — preencha e envie de volta");
}

/* ============================================================
   IMPORTACAO — leitura e validacao
============================================================ */
function parseImportWorkbook(data){
  const wb=XLSX.read(data,{type:"array",cellDates:true});
  const result={ projectName:"", owner:"", portfolioNames:[], strategicPerspective:"", tasks:[], errors:[], warnings:[] };

  // --- aba Projeto (opcional) ---
  const shP=wb.Sheets["Projeto"]||wb.Sheets["projeto"];
  if(shP){
    XLSX.utils.sheet_to_json(shP,{header:1}).forEach(r=>{
      const k=normTxt(r[0]), v=r[1]==null?"":String(r[1]).trim();
      if(k.startsWith("nome")) result.projectName=v;
      if(k.startsWith("respons")) result.owner=v;
      if(k.startsWith("portfolio")) result.portfolioNames=v.split(/[;,]/).map(s=>s.trim()).filter(Boolean);
      if(k.startsWith("perspectiva") || nomesAceitosTAP("perspectiva").some(n=>normTxt(n)===k)) result.strategicPerspective=v;
    });
  }
  if(/^ex\.:/i.test(result.projectName)) result.projectName="";
  if(/^ex\.:/i.test(result.owner)) result.owner="";
  result.portfolioNames=result.portfolioNames.filter(n=>!/^ex\.:/i.test(n));
  if(/^ex\.:/i.test(result.strategicPerspective) || !PERSPECTIVAS_ESTRATEGICAS.includes(result.strategicPerspective)) result.strategicPerspective="";

  // --- aba Cronograma (nome novo; "Atividades" continua aceito para planilhas antigas) ---
  const shT=wb.Sheets["Cronograma"]||wb.Sheets["cronograma"]||wb.Sheets["Tarefas"]||wb.Sheets["tarefas"];
  if(!shT){ result.errors.push("A planilha não tem uma aba chamada 'Cronograma'."); return result; }

  const rows=XLSX.utils.sheet_to_json(shT,{header:1,defval:"",blankrows:false});
  if(rows.length<2){ result.errors.push("A aba 'Cronograma' está vazia."); return result; }

  // localiza as colunas pelo cabecalho (tolerante a ordem)
  const head=rows[0].map(normTxt);
  const col=(...alts)=>{
    for(const a of alts){ const i=head.findIndex(h=>h===normTxt(a)||h.startsWith(normTxt(a))); if(i>=0) return i; }
    return -1;
  };
  const cNum=col("nº","no","num","numero"), cName=col("atividade","tarefa","nome"),
        cResp=col("responsavel"), cCoResp=col("responsaveis adicionais","responsavel adicional"), cStat=col("status"), cPrio=col("prioridade"),
        cIni=col("inicio planejado","inicio"), cFim=col("fim planejado","fim"),
        cIniExec=col("inicio execucao","inicio exec"), cFimExec=col("fim execucao","fim exec"),
        cMarco=col("marco"), cPred=col("predecessoras"), cLink=col("link"), cObs=col("observacoes","observacao");

  if(cNum<0||cName<0){
    result.errors.push("Cabeçalho não encontrado. A aba 'Cronograma' precisa ter ao menos as colunas 'Nº' e 'Atividade'.");
    return result;
  }

  const byKey={};
  rows.slice(1).forEach((r,i)=>{
    const linha=i+2; // linha real na planilha
    const nome=String(r[cName]==null?"":r[cName]).trim();
    const numRaw=r[cNum];
    if(!nome && (numRaw==null||String(numRaw).trim()==="")) return; // linha vazia
    if(!nome){ result.errors.push(`Linha ${linha}: falta o nome da atividade.`); return; }

    const out=parseOutline(numRaw);
    if(!out){ result.errors.push(`Linha ${linha}: Nº "${numRaw}" inválido. Use 1., 1.1., 1.1.1.`); return; }
    if(byKey[out.key]){ result.errors.push(`Linha ${linha}: Nº ${out.key} está duplicado.`); return; }

    const st = cStat>=0 ? parseStatusLoose(r[cStat]) : "nao_iniciada";
    if(st===null){ result.warnings.push(`Linha ${linha}: status "${r[cStat]}" não reconhecido — usando "Não iniciada".`); }
    const pr = cPrio>=0 ? parsePrioLoose(r[cPrio]) : "media";
    if(pr===null){ result.warnings.push(`Linha ${linha}: prioridade "${r[cPrio]}" não reconhecida — usando "Média".`); }

    const ini = cIni>=0 ? parseDateLoose(r[cIni]) : "";
    const fim = cFim>=0 ? parseDateLoose(r[cFim]) : "";
    if(ini===null) result.errors.push(`Linha ${linha}: data de início "${r[cIni]}" inválida. Use DD/MM/AAAA.`);
    if(fim===null) result.errors.push(`Linha ${linha}: data de fim "${r[cFim]}" inválida. Use DD/MM/AAAA.`);
    const ehMarco = cMarco>=0 ? parseBoolLoose(r[cMarco]) : false;
    // marco: vale a data de FIM (o início acompanha) -- então não há "fim antes do início"
    if(!ehMarco && ini&&fim&&ini!==null&&fim!==null&&fim<ini)
      result.errors.push(`Linha ${linha}: fim (${r[cFim]}) é anterior ao início (${r[cIni]}).`);

    const iniExec = cIniExec>=0 ? parseDateLoose(r[cIniExec]) : "";
    const fimExec = cFimExec>=0 ? parseDateLoose(r[cFimExec]) : "";
    if(iniExec===null) result.errors.push(`Linha ${linha}: início de execução "${r[cIniExec]}" inválido. Use DD/MM/AAAA.`);
    if(fimExec===null) result.errors.push(`Linha ${linha}: fim de execução "${r[cFimExec]}" inválido. Use DD/MM/AAAA.`);

    const task={
      key:out.key, depth:out.depth, parentKey:out.parent, linha,
      name:nome,
      assignee: cResp>=0 ? String(r[cResp]||"").trim() : "",
      coResponsaveis: cCoResp>=0 ? String(r[cCoResp]||"").split(/[;,]/).map(s=>s.trim()).filter(Boolean) : [],
      status: st||"nao_iniciada",
      priority: pr||"media",
      plannedStart: ini||"", plannedEnd: fim||"",
      actualStart: iniExec||"", actualEnd: fimExec||"",
      isMilestone: ehMarco,
      predKeys: cPred>=0 ? String(r[cPred]||"").split(/[;,]/).map(s=>{
        const o=parseOutline(s); return o?o.key:null;
      }).filter(Boolean) : [],
      link: cLink>=0 ? String(r[cLink]||"").trim() : "",
      notes: cObs>=0 ? String(r[cObs]||"").trim() : ""
    };
    normalizeMilestone(task);
    byKey[out.key]=task;
    result.tasks.push(task);
  });

  // valida hierarquia e predecessoras
  result.tasks.forEach(t=>{
    if(t.parentKey && !byKey[t.parentKey])
      result.errors.push(`Linha ${t.linha}: o Nº ${t.key} exige que exista a atividade ${t.parentKey}, que não foi encontrada.`);
    t.predKeys.forEach(pk=>{
      if(!byKey[pk]) result.warnings.push(`Linha ${t.linha}: predecessora ${pk} não existe na planilha — será ignorada.`);
    });
  });

  if(!result.tasks.length && !result.errors.length)
    result.errors.push("Nenhuma atividade encontrada na aba 'Atividades'.");

  // --- aba Eap (opcional) — mesma lógica de Nº do Cronograma, mas é uma
  // estrutura independente (a decomposição do escopo, não as atividades)
  result.eapNodes=[];
  const shEap=wb.Sheets["Eap"]||wb.Sheets["eap"]||wb.Sheets["EAP"];
  if(shEap){
    const eaprows=XLSX.utils.sheet_to_json(shEap,{header:1,defval:"",blankrows:false});
    if(eaprows.length>1){
      const eaphead=eaprows[0].map(normTxt);
      const eapcol=(...alts)=>{ for(const a of alts){ const i=eaphead.findIndex(h=>h===normTxt(a)||h.startsWith(normTxt(a))); if(i>=0) return i; } return -1; };
      const cEapNum=eapcol("nº","no","num","numero"), cEapNome=eapcol("item","nome"),
            cEapMarco=eapcol("marco"), cEapObs=eapcol("observacoes","observacao");
      const eapByKey={};
      eaprows.slice(1).forEach((r,i)=>{
        const linha=i+2;
        const nome=String(r[cEapNome]==null?"":r[cEapNome]).trim();
        const numRaw=r[cEapNum];
        if(!nome && (numRaw==null||String(numRaw).trim()==="")) return;
        if(!nome){ result.warnings.push(`Eap, linha ${linha}: falta o nome do item — ignorado.`); return; }
        const out=cEapNum>=0?parseOutline(numRaw):null;
        if(!out){ result.warnings.push(`Eap, linha ${linha}: Nº "${numRaw}" inválido. Use 1., 1.1., 1.1.1. — item ignorado.`); return; }
        if(eapByKey[out.key]){ result.warnings.push(`Eap, linha ${linha}: Nº ${out.key} está duplicado — item ignorado.`); return; }
        const node={
          key:out.key, depth:out.depth, parentKey:out.parent,
          name:nome, isMilestone: cEapMarco>=0?parseBoolLoose(r[cEapMarco]):false,
          notes: cEapObs>=0?String(r[cEapObs]||"").trim():""
        };
        eapByKey[out.key]=node;
        result.eapNodes.push(node);
      });
      result.eapNodes.forEach(n=>{
        if(n.parentKey && !eapByKey[n.parentKey])
          result.warnings.push(`Eap: o Nº ${n.key} exige o item ${n.parentKey}, que não foi encontrado — vira raiz.`);
      });
    }
  }

  // --- aba Riscos (opcional) ---
  result.risks=[];
  const shR=wb.Sheets["Riscos"]||wb.Sheets["riscos"];
  if(shR){
    const rrows=XLSX.utils.sheet_to_json(shR,{header:1,defval:"",blankrows:false});
    if(rrows.length>1){
      const rhead=rrows[0].map(normTxt);
      const rcol=(...alts)=>{ for(const a of alts){ const i=rhead.findIndex(h=>h===normTxt(a)||h.startsWith(normTxt(a))); if(i>=0) return i; } return -1; };
      const cRNome=rcol("risco","nome"), cRCat=rcol("classificacao","categoria"), cRProb=rcol("probabilidade"),
            cRImp=rcol("impacto"), cRResp=rcol("responsavel"), cRStat=rcol("status"), cRTipo=rcol("tipo de risco","tipo"),
            cRMit=rcol("acao a ser realizada","mitigacao","mitigação"), cRTask=rcol("atividade vinculada","tarefa vinculada","atividade","tarefa"), cRObs=rcol("observacoes","observacao");
      rrows.slice(1).forEach((r,i)=>{
        const linha=i+2;
        const nome=String(r[cRNome]==null?"":r[cRNome]).trim();
        if(!nome) return;
        const prob=cRProb>=0?Math.min(5,Math.max(1,Math.round(Number(r[cRProb])||3))):3;
        const imp=cRImp>=0?Math.min(5,Math.max(1,Math.round(Number(r[cRImp])||3))):3;
        const stat=cRStat>=0?parseRiskStatusLoose(r[cRStat]):"aberto";
        if(stat===null) result.warnings.push(`Riscos, linha ${linha}: status "${r[cRStat]}" não reconhecido — usando "Aberto".`);
        const tipoTxt=cRTipo>=0?normTxt(r[cRTipo]):"";
        const riskType=tipoTxt.startsWith("oportun")?"oportunidade":"ameaca";
        const tkRaw=cRTask>=0?r[cRTask]:"";
        const tkOut=tkRaw?parseOutline(tkRaw):null;
        if(tkRaw && !tkOut) result.warnings.push(`Riscos, linha ${linha}: Nº de atividade "${tkRaw}" inválido — o risco ficará sem vínculo.`);
        result.risks.push({
          name:nome, category:cRCat>=0?String(r[cRCat]||"").trim():"",
          probability:prob, impact:imp, owner:cRResp>=0?String(r[cRResp]||"").trim():"",
          status:stat||"aberto", riskType, mitigation:cRMit>=0?String(r[cRMit]||"").trim():"",
          taskKey: tkOut?tkOut.key:null, notes:cRObs>=0?String(r[cRObs]||"").trim():""
        });
      });
    }
  }

  // --- aba Custos (opcional) ---
  result.costs=[];
  const shC=wb.Sheets["Custos"]||wb.Sheets["custos"];
  if(shC){
    const crows=XLSX.utils.sheet_to_json(shC,{header:1,defval:"",blankrows:false});
    if(crows.length>1){
      const chead=crows[0].map(normTxt);
      const ccol=(...alts)=>{ for(const a of alts){ const i=chead.findIndex(h=>h===normTxt(a)||h.startsWith(normTxt(a))); if(i>=0) return i; } return -1; };
      const cCDesc=ccol("descricao","descrição"), cCCat=ccol("categoria"), cCMetodo=ccol("metodo de aquisicao","metodo"), cCData=ccol("data"),
            cCPlan=ccol("valor orcado","orcado"), cCReal=ccol("valor realizado","realizado"),
            cCTipo=ccol("tipo"), cCFonte=ccol("fonte de recurso","fonte"), cCStat=ccol("status"), cCReqData=ccol("data da formalizacao","formalizacao"),
            cCTask=ccol("atividade vinculada","tarefa vinculada","atividade","tarefa"), cCObs=ccol("observacoes","observacao");
      crows.slice(1).forEach((r,i)=>{
        const linha=i+2;
        const desc=String(r[cCDesc]==null?"":r[cCDesc]).trim();
        if(!desc) return;
        const data=cCData>=0?parseDateLoose(r[cCData]):"";
        if(data===null) result.warnings.push(`Custos, linha ${linha}: data "${r[cCData]}" inválida — ficará em branco.`);
        const reqData=cCReqData>=0?parseDateLoose(r[cCReqData]):"";
        if(reqData===null) result.warnings.push(`Custos, linha ${linha}: data da formalização "${r[cCReqData]}" inválida — ficará em branco.`);
        const tipoTxt=cCTipo>=0?normTxt(r[cCTipo]):"";
        const costType=tipoTxt.startsWith("investi")?"investimento":"custeio";
        const statusTxt=cCStat>=0?String(r[cCStat]||"").trim():"";
        const status=COST_STATUS.includes(statusTxt)?statusTxt:(statusTxt?statusTxt:"Não requisitado");
        const tkRaw=cCTask>=0?r[cCTask]:"";
        const tkOut=tkRaw?parseOutline(tkRaw):null;
        if(tkRaw && !tkOut) result.warnings.push(`Custos, linha ${linha}: Nº de atividade "${tkRaw}" inválido — o custo ficará sem vínculo.`);
        result.costs.push({
          description:desc, category:cCCat>=0?String(r[cCCat]||"").trim():"", acquisitionMethod:cCMetodo>=0?String(r[cCMetodo]||"").trim():"",
          date:data||"", plannedValue:cCPlan>=0?(Number(r[cCPlan])||0):0,
          actualValue:cCReal>=0?(Number(r[cCReal])||0):0,
          costType, resourceSource:cCFonte>=0?String(r[cCFonte]||"").trim():"", status, requestDate:reqData||"",
          taskKey: tkOut?tkOut.key:null, notes:cCObs>=0?String(r[cCObs]||"").trim():""
        });
      });
    }
  }

  // --- aba Stakeholders (opcional) ---
  result.stakeholders=[];
  const shS=wb.Sheets["Stakeholders"]||wb.Sheets["stakeholders"];
  if(shS){
    const srows=XLSX.utils.sheet_to_json(shS,{header:1,defval:"",blankrows:false});
    if(srows.length>1){
      const shead=srows[0].map(normTxt);
      const scol=(...alts)=>{ for(const a of alts){ const i=shead.findIndex(h=>h===normTxt(a)||h.startsWith(normTxt(a))); if(i>=0) return i; } return -1; };
      const cSNome=scol("nome"), cSOrg=scol("organizacao","organização"),
            cSEmail=scol("e-mail","email"), cSTel=scol("telefone"),
            cSPoder=scol("poder"), cSInteresse=scol("interesse"),
            cSTask=scol("atividade vinculada","tarefa vinculada","atividade","tarefa"), cSObs=scol("observacoes","observacao");
      srows.slice(1).forEach((r,i)=>{
        const linha=i+2;
        const nome=String(r[cSNome]==null?"":r[cSNome]).trim();
        if(!nome) return;
        const poder=cSPoder>=0?Math.min(4,Math.max(1,Math.round(Number(r[cSPoder])||2))):2;
        const interesse=cSInteresse>=0?Math.min(4,Math.max(1,Math.round(Number(r[cSInteresse])||2))):2;
        const tkRaw=cSTask>=0?r[cSTask]:"";
        const tkOut=tkRaw?parseOutline(tkRaw):null;
        if(tkRaw && !tkOut) result.warnings.push(`Stakeholders, linha ${linha}: Nº de atividade "${tkRaw}" inválido — o stakeholder ficará sem vínculo.`);
        result.stakeholders.push({
          name:nome, organization:cSOrg>=0?String(r[cSOrg]||"").trim():"",
          email:cSEmail>=0?String(r[cSEmail]||"").trim():"",
          phone:cSTel>=0?String(r[cSTel]||"").trim():"",
          power:poder, interest:interesse,
          taskKey: tkOut?tkOut.key:null, notes:cSObs>=0?String(r[cSObs]||"").trim():""
        });
      });
    }
  }

  // --- aba Responsáveis (opcional) ---
  result.responsibles=[];
  const shRe=wb.Sheets["Responsáveis"]||wb.Sheets["Responsaveis"]||wb.Sheets["responsaveis"]||wb.Sheets["responsáveis"];
  if(shRe){
    const rerows=XLSX.utils.sheet_to_json(shRe,{header:1,defval:"",blankrows:false});
    if(rerows.length>1){
      const rehead=rerows[0].map(normTxt);
      const recol=(...alts)=>{ for(const a of alts){ const i=rehead.findIndex(h=>h===normTxt(a)||h.startsWith(normTxt(a))); if(i>=0) return i; } return -1; };
      const cReNome=recol("nome"), cReEmail=recol("e-mail","email"), cReTel=recol("telefone"), cReLot=recol("lotacao","lotação");
      rerows.slice(1).forEach(r=>{
        const nome=String(r[cReNome]==null?"":r[cReNome]).trim();
        if(!nome) return;
        result.responsibles.push({
          name:nome,
          email:cReEmail>=0?String(r[cReEmail]||"").trim():"",
          phone:cReTel>=0?String(r[cReTel]||"").trim():"",
          lotacao:cReLot>=0?String(r[cReLot]||"").trim():""
        });
      });
    }
  }

  // --- aba TAP (opcional) -- formato Campo/Valor, igual à aba Projeto ---
  result.tap=null;
  const shTap=wb.Sheets["TAP"]||wb.Sheets["Tap"]||wb.Sheets["tap"];
  if(shTap){
    const taprows=XLSX.utils.sheet_to_json(shTap,{header:1,defval:""});
    const porCampo={};
    taprows.forEach(r=>{
      const campo=normTxt(r[0]);
      if(campo) porCampo[campo]=r[1]==null?"":String(r[1]).trim();
    });
    const buscar=(...chaves)=>{ for(const k of chaves){ const v=porCampo[normTxt(k)]; if(v!=null && v!=="") return v; } return ""; };
    const dataPreenchRaw=buscar("data de preenchimento");
    const dataPreench=dataPreenchRaw?parseDateLoose(dataPreenchRaw):"";
    const porPrefixo=id=>{ const pre=((CAMPO_TAP_POR_ID[id]||{}).prefixos||[]).map(normTxt); const k=Object.keys(porCampo).find(c=>pre.some(x=>c.indexOf(x)===0) && porCampo[c]!==""); return k?porCampo[k]:""; };
    const campo=id=>buscar(...nomesAceitosTAP(id)) || porPrefixo(id);
    const perspTapRaw=campo("perspectiva");
    const lista=v=>v.split(";").map(s=>s.trim()).filter(Boolean);
    result.tap={
      strategicPerspective:PERSPECTIVAS_ESTRATEGICAS.includes(perspTapRaw)?perspTapRaw:"",
      temporalidade:lista(campo("temporalidade")),
      novoOuAndamento:campo("novoOuAndamento"),
      etapaAtual:campo("etapaAtual"),
      subsecretaria:campo("subsecretaria"),
      areaTecnica:campo("areaTecnica"),
      telefone:campo("telefone"),
      email:campo("email"),
      justificativa:campo("justificativa"),
      publicoAlvo:campo("publicoAlvo"),
      objetivo:campo("objetivo"),
      escopo:campo("escopo"),
      resultadosEsperados:campo("resultadosEsperados"),
      recursosDemandados:lista(campo("recursosDemandados")),
      fonteRecursos:campo("fonteRecursos"),
      prazoEstimado:campo("prazoEstimado"),
      objetivoGeral:campo("objetivoGeral"),
      objetivoEspecifico:campo("objetivoEspecifico"),
      dataPreenchimento:dataPreench||""
    };
  }

  return result;
}

/* ============================================================
   IMPORTACAO — gravacao

   Se já existir um projeto com o MESMO NOME e MESMO RESPONSÁVEL
   (comparação sem acento/caixa), a importação passa a ATUALIZAR esse
   projeto em vez de criar um segundo:
     - atividades são casadas por NOME dentro do projeto; encontrada uma
       atividade com o mesmo nome, ela é atualizada (datas planejadas,
       responsável, status, prioridade, marco, predecessoras) --
       exceto as DATAS DE EXECUÇÃO, que são preservadas como já
       estavam, exatamente como pedido;
     - atividades da planilha sem correspondência viram atividades novas;
     - atividades que já existiam no sistema mas não estão na planilha
       são mantidas como estão (a importação nunca apaga sozinha);
     - riscos e custos seguem o mesmo princípio, casados pelo nome/
       descrição -- e o valor já realizado (custos) também é
       preservado, pelo mesmo motivo das datas de execução.
============================================================ */
async function commitImport(parsed,modo){
  if(blockIfReadOnly()) return;
  const nomeAlvo=normTxt(parsed.projectName), donoAlvo=normTxt(parsed.owner);
  const existente = nomeAlvo ? DATA.projects.find(p=>normTxt(p.name)===nomeAlvo && normTxt(p.owner)===donoAlvo) : null;
  const atualizando=!!existente;
  if(existente && !(await garantirSecoes([existente.id]))){ toast("Não consegui carregar os dados do projeto agora — tente de novo",true); return; }
  const pid = existente ? existente.id : uid();
  let baselinePreservada=null;

  if(!existente){
    DATA.projects.push({ id:pid, name:parsed.projectName||"Projeto importado",
      owner:parsed.owner||"", color:PALETTE[DATA.projects.length%PALETTE.length], portfolioIds:[] });
  }else if(modo==="substituir"){
    // preserva a linha de base: guarda as datas por NOME da atividade antes
    // de apagar tudo -- como as atividades novas vêm com id diferente, a
    // linha de base é remontada depois casando pelo nome (mesmo princípio
    // já usado para mesclar tarefas na reimportação normal)
    const baselineAntiga=baselineOf(pid);
    if(baselineAntiga){
      baselinePreservada={
        justificativaRedefinicao:null, meta:baselineAntiga,
        porNome:new Map((baselineAntiga.tasks||[]).map(bt=>[normTxt(bt.name||((DATA.tasks.find(t=>t.id===bt.taskId)||{}).name)||""),bt]))
      };
    }
    // limpa tudo do projeto antes de importar -- sem nada pra casar por
    // nome, a mesma logica de mesclagem abaixo trata cada item da
    // planilha como novo, entao o resultado e so o que veio da planilha
    DATA.tasks=DATA.tasks.filter(t=>t.projectId!==pid);
    DATA.risks=DATA.risks.filter(r=>r.projectId!==pid);
    DATA.costs=DATA.costs.filter(c=>c.projectId!==pid);
    DATA.stakeholders=DATA.stakeholders.filter(s=>s.projectId!==pid);
    DATA.responsibleContacts=DATA.responsibleContacts.filter(r=>r.projectId!==pid);
    DATA.eapNodes=DATA.eapNodes.filter(e=>e.projectId!==pid);
    DATA.tapData=DATA.tapData.filter(t=>t.projectId!==pid);
  }

  /* ---------- portfólios: cria os que faltarem pelo nome; a lista da
     planilha se SOMA à que já existe (nunca remove uma associação que
     a pessoa já tinha feito manualmente), exceto no modo substituir,
     onde o projeto passa a pertencer só aos portfólios da planilha */
  const projetoAtual=DATA.projects.find(p=>p.id===pid);
  if(!Array.isArray(projetoAtual.portfolioIds)) projetoAtual.portfolioIds=[];
  if(parsed.portfolioNames && parsed.portfolioNames.length){
    const idsDaPlanilha=parsed.portfolioNames.map(nome=>{
      const alvo=normTxt(nome);
      let pf=DATA.portfolios.find(x=>normTxt(x.name)===alvo);
      if(!pf){ pf={id:uid(),name:nome,color:PALETTE[DATA.portfolios.length%PALETTE.length],grupoId:projetoAtual.grupoId||(typeof grupoPadraoParaNovoProjeto==="function"?grupoPadraoParaNovoProjeto():"")||""}; DATA.portfolios.push(pf); }
      return pf.id;
    });
    projetoAtual.portfolioIds = modo==="substituir"
      ? idsDaPlanilha
      : [...new Set([...projetoAtual.portfolioIds, ...idsDaPlanilha])];
  }
  if(parsed.strategicPerspective) projetoAtual.strategicPerspective=parsed.strategicPerspective;

  /* ---------- atividades: casadas por nome, dentro do projeto ---------- */
  const tarefasAtuais = atualizando ? DATA.tasks.filter(t=>t.projectId===pid) : [];
  const tarefaPorNome=new Map();
  tarefasAtuais.forEach(t=>{ const k=normTxt(t.name); if(!tarefaPorNome.has(k)) tarefaPorNome.set(k,t); });

  const idByKey={};
  parsed.tasks.forEach(t=>{
    const match=tarefaPorNome.get(normTxt(t.name));
    idByKey[t.key]=match?match.id:uid();
  });

  let tarefasCriadas=0, tarefasAtualizadas=0;
  const orderCount={};
  parsed.tasks.forEach(t=>{
    const parentId=t.parentKey?(idByKey[t.parentKey]||null):null;
    const match=tarefaPorNome.get(normTxt(t.name));
    const predecessors=t.predKeys.map(k=>idByKey[k]).filter(Boolean);
    if(match){
      match.parentId=parentId;
      match.name=t.name;
      match.assignee=t.assignee;
      if(t.coResponsaveis&&t.coResponsaveis.length) match.coResponsaveis=t.coResponsaveis;
      match.status=t.status;
      match.statusManual=true; // veio explicitamente da planilha
      match.priority=t.priority;
      match.plannedStart=t.plannedStart;
      match.plannedEnd=t.plannedEnd;
      match.isMilestone=t.isMilestone;
      if(t.notes) match.notes=t.notes;
      if(t.link) match.link=t.link;
      match.predecessors=predecessors;
      if(t.actualStart) match.actualStart=t.actualStart;
      if(t.actualEnd) match.actualEnd=t.actualEnd;
      normalizeMilestone(match);
      // actualStart / actualEnd: só mudam se a planilha trouxer uma data --
      // em branco preserva o que já estava registrado
      tarefasAtualizadas++;
    }else{
      const bucket=parentId||"__root__";
      if(orderCount[bucket]==null) orderCount[bucket]=childrenOf(pid,parentId).length;
      const novo={
        id:idByKey[t.key], projectId:pid, parentId,
        name:t.name, assignee:t.assignee, coResponsaveis:t.coResponsaveis||[], status:t.status, statusManual:true, priority:t.priority,
        progress: t.status==="concluida"?100:0,
        plannedStart:t.plannedStart, plannedEnd:t.plannedEnd,
        actualStart: t.actualStart||(t.status!=="nao_iniciada"?t.plannedStart:""),
        actualEnd: t.actualEnd||(t.status==="concluida"?t.plannedEnd:""),
        predecessors, isMilestone:t.isMilestone, link:t.link||"", notes:t.notes, order:orderCount[bucket]++
      };
      normalizeMilestone(novo);
      DATA.tasks.push(novo);
      tarefasCriadas++;
    }
  });

  /* ---------- linha de base: remonta casando por nome (só quando o modo
     substituir capturou uma linha de base antes de apagar as tarefas) ---------- */
  if(baselinePreservada){
    const tarefasNovasDoProjeto=DATA.tasks.filter(t=>t.projectId===pid);
    const novoSnapshotTasks=[];
    tarefasNovasDoProjeto.forEach(t=>{
      const bt=baselinePreservada.porNome.get(normTxt(t.name));
      if(bt) novoSnapshotTasks.push({ taskId:t.id, name:t.name, plannedStart:bt.plannedStart, plannedEnd:bt.plannedEnd });
    });
    if(novoSnapshotTasks.length){
      DATA.baselines=(DATA.baselines||[]).filter(b=>b.projectId!==pid);
      DATA.baselines.push({ ...baselinePreservada.meta, tasks:novoSnapshotTasks });
    }
  }

  /* ---------- eap: casada por nome, hierarquia própria (Nº da aba Eap,
     independente do Cronograma) ---------- */
  let eapCriados=0, eapAtualizados=0;
  if(parsed.eapNodes&&parsed.eapNodes.length){
    const eapAtuais=DATA.eapNodes.filter(e=>e.projectId===pid);
    const eapPorNome=new Map();
    eapAtuais.forEach(e=>{ const k=normTxt(e.name); if(!eapPorNome.has(k)) eapPorNome.set(k,e); });

    const eapIdByKey={};
    parsed.eapNodes.forEach(n=>{
      const match=eapPorNome.get(normTxt(n.name));
      eapIdByKey[n.key]=match?match.id:uid();
    });

    const eapOrderCount={};
    parsed.eapNodes.forEach(n=>{
      const parentId=n.parentKey?(eapIdByKey[n.parentKey]||null):null;
      const match=eapPorNome.get(normTxt(n.name));
      const bucket=parentId||"__root__";
      if(eapOrderCount[bucket]==null) eapOrderCount[bucket]=eapChildrenOf(pid,parentId).length;
      if(match){
        match.parentId=parentId; match.name=n.name; match.isMilestone=n.isMilestone;
        if(n.notes) match.notes=n.notes;
        match.order=eapOrderCount[bucket]++;
        eapAtualizados++;
      }else{
        DATA.eapNodes.push({ id:eapIdByKey[n.key], projectId:pid, parentId,
          name:n.name, isMilestone:n.isMilestone, notes:n.notes, order:eapOrderCount[bucket]++ });
        eapCriados++;
      }
    });
  }

  /* ---------- riscos: casados por nome, dentro do projeto ---------- */
  let riscosCriados=0, riscosAtualizados=0;
  if(parsed.risks&&parsed.risks.length){
    const riscosAtuais=atualizando?DATA.risks.filter(r=>r.projectId===pid):[];
    const riscoPorNome=new Map();
    riscosAtuais.forEach(r=>{ const k=normTxt(r.name); if(!riscoPorNome.has(k)) riscoPorNome.set(k,r); });
    parsed.risks.forEach(r=>{
      const taskId=r.taskKey?(idByKey[r.taskKey]||null):null;
      const match=riscoPorNome.get(normTxt(r.name));
      if(match){
        match.name=r.name; match.category=r.category; match.probability=r.probability;
        match.impact=r.impact; match.owner=r.owner; match.status=r.status; match.riskType=r.riskType;
        match.mitigation=r.mitigation; match.notes=r.notes||match.notes;
        if(taskId) match.taskId=taskId;
        riscosAtualizados++;
      }else{
        DATA.risks.push({ id:uid(), projectId:pid, taskId, name:r.name, category:r.category,
          probability:r.probability, impact:r.impact, owner:r.owner, status:r.status, riskType:r.riskType,
          mitigation:r.mitigation, notes:r.notes });
        riscosCriados++;
      }
    });
  }

  /* ---------- custos: casados por descrição, dentro do projeto ---------- */
  let custosCriados=0, custosAtualizados=0;
  if(parsed.costs&&parsed.costs.length){
    const custosAtuais=atualizando?DATA.costs.filter(c=>c.projectId===pid):[];
    const custoPorDesc=new Map();
    custosAtuais.forEach(c=>{ const k=normTxt(c.description); if(!custoPorDesc.has(k)) custoPorDesc.set(k,c); });
    parsed.costs.forEach(c=>{
      const taskId=c.taskKey?(idByKey[c.taskKey]||null):null;
      const match=custoPorDesc.get(normTxt(c.description));
      if(match){
        match.description=c.description; match.category=c.category; match.acquisitionMethod=c.acquisitionMethod; match.date=c.date;
        match.plannedValue=c.plannedValue;
        // valor realizado: NAO TOCAR -- mesmo princípio das datas de execução
        match.costType=c.costType; match.resourceSource=c.resourceSource; match.status=c.status; match.requestDate=c.requestDate;
        match.notes=c.notes||match.notes;
        if(taskId) match.taskId=taskId;
        custosAtualizados++;
      }else{
        DATA.costs.push({ id:uid(), projectId:pid, taskId, description:c.description,
          category:c.category, acquisitionMethod:c.acquisitionMethod, date:c.date, plannedValue:c.plannedValue,
          actualValue:c.actualValue||0, costType:c.costType, resourceSource:c.resourceSource, status:c.status, requestDate:c.requestDate,
          notes:c.notes });
        custosCriados++;
      }
    });
  }

  /* ---------- stakeholders: casados por nome, dentro do projeto ---------- */
  let stakeCriados=0, stakeAtualizados=0;
  if(parsed.stakeholders&&parsed.stakeholders.length){
    const stakeAtuais=atualizando?DATA.stakeholders.filter(s=>s.projectId===pid):[];
    const stakePorNome=new Map();
    stakeAtuais.forEach(s=>{ const k=normTxt(s.name); if(!stakePorNome.has(k)) stakePorNome.set(k,s); });
    parsed.stakeholders.forEach(s=>{
      const taskId=s.taskKey?(idByKey[s.taskKey]||null):null;
      const match=stakePorNome.get(normTxt(s.name));
      if(match){
        match.name=s.name; match.organization=s.organization;
        match.email=s.email||match.email; match.phone=s.phone||match.phone;
        match.power=s.power; match.interest=s.interest;
        match.notes=s.notes||match.notes;
        if(taskId) match.taskId=taskId;
        stakeAtualizados++;
      }else{
        DATA.stakeholders.push({ id:uid(), projectId:pid, taskId, name:s.name,
          organization:s.organization, email:s.email, phone:s.phone,
          power:s.power, interest:s.interest,
          strategy:QUADRANT_STRATEGY[stakeholderQuadrant(s.power,s.interest)], notes:s.notes });
        stakeCriados++;
      }
    });
  }

  /* ---------- responsáveis: contatos casados por nome, dentro do projeto ---------- */
  let respCriados=0, respAtualizados=0;
  if(parsed.responsibles&&parsed.responsibles.length){
    const respAtuais=DATA.responsibleContacts.filter(r=>r.projectId===pid);
    const respPorNome=new Map();
    respAtuais.forEach(r=>{ const k=normTxt(r.name); if(!respPorNome.has(k)) respPorNome.set(k,r); });
    parsed.responsibles.forEach(rc=>{
      const match=respPorNome.get(normTxt(rc.name));
      if(match){
        match.email=rc.email||match.email; match.phone=rc.phone||match.phone; match.lotacao=rc.lotacao||match.lotacao;
        respAtualizados++;
      }else{
        DATA.responsibleContacts.push({ id:uid(), projectId:pid, name:rc.name, email:rc.email, phone:rc.phone, lotacao:rc.lotacao||"" });
        respCriados++;
      }
    });
  }

  /* ---------- TAP: um registro por projeto -- cria se não existir, ou
     atualiza o que existe, só nos campos que a planilha realmente trouxe ---------- */
  let tapAtualizado=false;
  if(parsed.tap){
    let tapRec=DATA.tapData.find(x=>x.projectId===pid);
    if(!tapRec){ tapRec={id:uid(),projectId:pid}; DATA.tapData.push(tapRec); }
    const campos=["novoOuAndamento","etapaAtual","subsecretaria","areaTecnica","telefone","email",
      "justificativa","publicoAlvo","objetivo","escopo","resultadosEsperados","fonteRecursos","prazoEstimado",
      "objetivoGeral","objetivoEspecifico","dataPreenchimento"];
    campos.forEach(k=>{ if(parsed.tap[k]) tapRec[k]=parsed.tap[k]; });
    if(parsed.tap.temporalidade && parsed.tap.temporalidade.length) tapRec.temporalidade=parsed.tap.temporalidade;
    if(parsed.tap.recursosDemandados && parsed.tap.recursosDemandados.length) tapRec.recursosDemandados=parsed.tap.recursosDemandados;
    // conflito Projeto x TAP na Perspectiva Estratégica: o TAP vence, já
    // que é onde ela passou a ser editada de verdade
    if(parsed.tap.strategicPerspective) projetoAtual.strategicPerspective=parsed.tap.strategicPerspective;
    tapAtualizado=true;
  }

  await persist();
  view="project"; currentProjectId=pid; projectTab="crono"; lastProject=pid;
  render();

  if(atualizando){
    const partes=[`${tarefasCriadas} atividade(s) nova(s)`,`${tarefasAtualizadas} atualizada(s)`];
    if(riscosCriados||riscosAtualizados) partes.push(`${riscosCriados} risco(s) novo(s), ${riscosAtualizados} atualizado(s)`);
    if(custosCriados||custosAtualizados) partes.push(`${custosCriados} custo(s) novo(s), ${custosAtualizados} atualizado(s)`);
    if(stakeCriados||stakeAtualizados) partes.push(`${stakeCriados} stakeholder(s) novo(s), ${stakeAtualizados} atualizado(s)`);
    if(respCriados||respAtualizados) partes.push(`${respCriados} responsável(is) novo(s), ${respAtualizados} atualizado(s)`);
    if(eapCriados||eapAtualizados) partes.push(`EAP: ${eapCriados} novo(s), ${eapAtualizados} atualizado(s)`);
    if(tapAtualizado) partes.push("TAP atualizado");
    toast(`Projeto atualizado — ${partes.join(" · ")}`);
  }else{
    let msg=`Projeto importado: ${tarefasCriadas} atividade${tarefasCriadas===1?"":"s"}`;
    if(riscosCriados) msg+=`, ${riscosCriados} risco(s)`;
    if(custosCriados) msg+=`, ${custosCriados} custo(s)`;
    if(stakeCriados) msg+=`, ${stakeCriados} stakeholder(s)`;
    if(respCriados) msg+=`, ${respCriados} responsável(is)`;
    if(eapCriados) msg+=`, ${eapCriados} item(ns) de EAP`;
    if(tapAtualizado) msg+=", TAP preenchido";
    toast(msg);
  }
}

/* ============================================================
   IMPORTACAO — interface
============================================================ */
function openImportModal(){
  if(blockIfReadOnly()) return;
  const body=`
    <p class="hint" style="margin-top:-4px;margin-bottom:16px">Cadastre um projeto inteiro de uma vez, com toda a hierarquia de atividades.</p>
    <div class="imp-step">
      <div class="imp-num">1</div>
      <div class="imp-txt"><strong>Baixe o modelo</strong><br><span>Planilha com as colunas certas e um exemplo preenchido.</span></div>
      <button class="btn" id="imp_tpl">Baixar modelo</button>
    </div>
    <div class="imp-step">
      <div class="imp-num">2</div>
      <div class="imp-txt"><strong>Preencha no Excel</strong><br><span>A coluna Nº define a hierarquia: 1., 1.1., 1.1.1.</span></div>
    </div>
    <div class="imp-step">
      <div class="imp-num">3</div>
      <div class="imp-txt"><strong>Envie de volta</strong><br><span>Conferimos tudo antes de importar.</span></div>
      <label class="btn primary" style="cursor:pointer;margin:0">Escolher arquivo
        <input type="file" id="imp_file" accept=".xlsx,.xls" style="display:none">
      </label>
    </div>
    <div id="imp_result"></div>
  `;
  showModal("Importar projeto de uma planilha",body,
    `<button class="btn" id="imp_close">Fechar</button>`,true);
  $("#imp_close").onclick=closeModal;
  $("#imp_tpl").onclick=downloadImportTemplate;
  $("#imp_file").onchange=e=>{
    const f=e.target.files&&e.target.files[0];
    if(!f) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      let parsed;
      try{ parsed=parseImportWorkbook(new Uint8Array(ev.target.result)); }
      catch(err){ $("#imp_result").innerHTML=`<div class="imp-box err">Não consegui ler o arquivo. Ele é mesmo uma planilha .xlsx?</div>`; return; }
      renderImportPreview(parsed);
    };
    garantirLibs("xlsx").then(ok=>{
      if(!ok){ toast("Não consegui carregar a biblioteca de Excel (verifique a conexão)",true); return; }
      reader.readAsArrayBuffer(f);
    });
  };
  garantirLib("xlsx"); // já começa a baixar enquanto a pessoa escolhe o arquivo
}

function renderImportPreview(parsed){
  const box=$("#imp_result");
  const errs=parsed.errors, warns=parsed.warnings;
  const lista=errs.length?`<div class="imp-box err"><strong>${errs.length} problema${errs.length===1?"":"s"} a corrigir:</strong>
      <ul>${errs.slice(0,12).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>
      ${errs.length>12?`<em>…e mais ${errs.length-12}.</em>`:""}</div>`:"";
  const avisos=warns.length?`<div class="imp-box warn"><strong>${warns.length} aviso${warns.length===1?"":"s"}:</strong>
      <ul>${warns.slice(0,6).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>
      ${warns.length>6?`<em>…e mais ${warns.length-6}.</em>`:""}</div>`:"";

  if(errs.length){ box.innerHTML=lista+avisos; return; }

  const nomeAlvo=normTxt(parsed.projectName), donoAlvo=normTxt(parsed.owner);
  const existente = nomeAlvo ? DATA.projects.find(p=>normTxt(p.name)===nomeAlvo && normTxt(p.owner)===donoAlvo) : null;
  const contagemAtual = existente ? {
    atividades: DATA.tasks.filter(t=>t.projectId===existente.id).length,
    riscos: DATA.risks.filter(r=>r.projectId===existente.id).length,
    custos: DATA.costs.filter(c=>c.projectId===existente.id).length,
    stakeholders: DATA.stakeholders.filter(s=>s.projectId===existente.id).length,
  } : null;
  const avisoAtualizacao = existente ? `<div class="imp-box warn" style="margin-top:0">
      <strong>Este projeto já existe</strong> — escolha como importar "${esc(existente.name)}" abaixo.
      <ul style="margin:6px 0 0">
        <li><strong>Atualizar:</strong> atividades com o mesmo nome são atualizadas (as datas de execução já registradas são preservadas); atividades sem correspondência entram como novas; nada é apagado.</li>
        <li><strong>Substituir:</strong> apaga tudo do projeto atual (${contagemAtual.tarefas} atividade(s), ${contagemAtual.riscos} risco(s), ${contagemAtual.custos} custo(s), ${contagemAtual.stakeholders} stakeholder(s)) e recria só com o que está nesta planilha.</li>
      </ul>
    </div>` : "";

  const arvore=parsed.tasks.slice(0,14).map(t=>
    `<div style="padding-left:${(t.depth-1)*18}px;font-size:12.5px;line-height:1.7">
      <span class="mono" style="color:var(--muted)">${t.key}</span>
      ${t.isMilestone?'<span style="color:var(--milestone)">◆</span> ':""}${esc(t.name)}
    </div>`).join("");

  const extras=[];
  if(parsed.risks&&parsed.risks.length) extras.push(`${parsed.risks.length} risco${parsed.risks.length===1?"":"s"}`);
  if(parsed.costs&&parsed.costs.length) extras.push(`${parsed.costs.length} custo${parsed.costs.length===1?"":"s"}`);
  if(parsed.stakeholders&&parsed.stakeholders.length) extras.push(`${parsed.stakeholders.length} stakeholder${parsed.stakeholders.length===1?"":"s"}`);

  box.innerHTML=`${avisoAtualizacao}${avisos}
    <div class="imp-box ok">
      <strong>Pronto para ${existente?"importar":"importar"}</strong><br>
      Projeto: <strong>${esc(parsed.projectName||"Projeto importado")}</strong> ·
      ${parsed.tasks.length} atividade${parsed.tasks.length===1?"":"s"}${extras.length?" · "+extras.join(" · "):""}
    </div>
    <div class="imp-prev">${arvore}${parsed.tasks.length>14?`<div style="color:var(--muted);font-size:12px;margin-top:6px">…e mais ${parsed.tasks.length-14} atividade(s).</div>`:""}</div>
    ${existente
      ? `<div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn" id="imp_go_atualizar" style="flex:1;justify-content:center">Atualizar projeto</button>
          <button class="btn" id="imp_go_substituir" style="flex:1;justify-content:center;color:var(--danger);border-color:var(--danger)">Substituir projeto</button>
        </div>`
      : `<button class="btn primary" id="imp_go_atualizar" style="width:100%;justify-content:center;margin-top:14px">Importar projeto</button>`}`;
  $("#imp_go_atualizar").onclick=async()=>{ closeModal(); await commitImport(parsed,"atualizar"); };
  const btnSubstituir=$("#imp_go_substituir");
  if(btnSubstituir) btnSubstituir.onclick=async()=>{
    const ok=confirm(`Substituir "${existente.name}" inteiro?\n\nIsso apaga ${contagemAtual.tarefas} atividade(s), ${contagemAtual.riscos} risco(s), ${contagemAtual.custos} custo(s) e ${contagemAtual.stakeholders} stakeholder(s) atuais, recriando só com o que está nesta planilha. Não pode ser desfeito por aqui (só restaurando um backup).`);
    if(!ok) return;
    closeModal(); await commitImport(parsed,"substituir");
  };
}

/* ============================================================
   2) CADASTRO RAPIDO EM LOTE — o caminho mais veloz
   Cola-se uma lista indentada; cada nivel de indentacao vira subatividade.
============================================================ */
async function openQuickAddModal(projectId){
  if(blockIfReadOnly()) return;
  const p=projOf(projectId); if(!p) return;
  if(isLockedByOther(tk(projectId,"cronograma"))){ toast("Projeto em edição por "+lockHolderName(tk(projectId,"cronograma")),true); return; }
  const lockRes=await acquireLock(tk(projectId,"cronograma"));
  if(!lockRes.ok){ toast(msgTrava(lockRes),true); render(); return; }
  activeLockProjectId=tk(projectId,"cronograma"); startHeartbeat(tk(projectId,"cronograma")); render();

  const exemplo="Planejamento\n  Levantamento de requisitos\n  Aprovação do escopo\nExecução\n  Contratação\n  Implantação\nEntrega final";
  const body=`
    <p class="hint" style="margin-top:-4px;margin-bottom:12px">Digite ou cole uma atividade por linha. Use <strong>espaços no início</strong> para criar subatividades — como um índice.</p>
    <div class="field"><label>Atividades</label>
      <textarea id="qa_txt" rows="12" style="font-family:var(--font-mono);font-size:12.5px;line-height:1.6" placeholder="${esc(exemplo)}"></textarea>
      <div class="hint">Serão adicionadas ao final de <strong>${esc(p.name)}</strong>. Datas e responsáveis podem ser preenchidos depois.</div>
    </div>
    <div id="qa_prev"></div>`;
  showModal("Adicionar várias atividades",body,
    `<button class="btn" id="qa_cancel">Cancelar</button><button class="btn primary" id="qa_save">Adicionar</button>`,false);

  const parse=()=>{
    const linhas=$("#qa_txt").value.split("\n").filter(l=>l.trim());
    // normaliza indentacao: cada nivel distinto de recuo vira uma profundidade
    const recuos=[...new Set(linhas.map(l=>l.match(/^\s*/)[0].replace(/\t/g,"  ").length))].sort((a,b)=>a-b);
    return linhas.map(l=>{
      const rec=l.match(/^\s*/)[0].replace(/\t/g,"  ").length;
      return { depth:recuos.indexOf(rec), name:l.trim() };
    });
  };
  const preview=()=>{
    const its=parse();
    $("#qa_prev").innerHTML = its.length
      ? `<div class="imp-box ok" style="margin-top:2px">${its.length} atividade${its.length===1?"":"s"} serão adicionadas</div>`
      : "";
  };
  $("#qa_txt").oninput=preview;
  $("#qa_cancel").onclick=closeModal;
  $("#qa_save").onclick=async()=>{
    const its=parse();
    if(!its.length){ toast("Digite ao menos uma atividade",true); return; }
    const pilha={}; // depth -> id do ultimo item daquele nivel
    const novas=[];
    its.forEach(it=>{
      const id=uid();
      const parentId = it.depth>0 ? (pilha[it.depth-1]||null) : null;
      pilha[it.depth]=id;
      novas.push({ id, projectId, parentId, name:it.name, assignee:"",
        status:"nao_iniciada", priority:"media", progress:0,
        plannedStart:"", plannedEnd:"", actualStart:"", actualEnd:"",
        predecessors:[], isMilestone:false, notes:"", order:0 });
    });
    // ordem sequencial dentro de cada pai, respeitando o que ja existe
    const base={};
    novas.forEach(t=>{
      const b=t.parentId||"__root__";
      if(base[b]==null) base[b]=childrenOf(projectId,t.parentId).length;
      t.order=base[b]++;
    });
    DATA.tasks.push(...novas);
    closeModal(); await persist(); render();
    toast(`${novas.length} atividade${novas.length===1?"":"s"} adicionada${novas.length===1?"":"s"}`);
  };
  setTimeout(()=>{const el=$("#qa_txt"); if(el) el.focus();},50);
}

async function duplicateProject(id){
  if(blockIfReadOnly()) return;
  const p=projOf(id); if(!p) return;
  const origem=DATA.tasks.filter(t=>t.projectId===id);
  if(!confirm(`Duplicar "${p.name}" com suas ${origem.length} atividade(s)?\n\nO novo projeto vem com o status zerado, pronto para replanejar.`)) return;

  const pid=uid();
  const idMap={};
  origem.forEach(t=>{ idMap[t.id]=uid(); });

  DATA.projects.push({ id:pid, name:p.name+" (cópia)", owner:p.owner, grupoId:p.grupoId||"",
    color:PALETTE[DATA.projects.length%PALETTE.length] });

  DATA.tasks.push(...origem.map(t=>({
    ...t,
    id:idMap[t.id], projectId:pid,
    parentId: t.parentId?(idMap[t.parentId]||null):null,
    predecessors:(t.predecessors||[]).map(x=>idMap[x]).filter(Boolean),
    status:"nao_iniciada", progress:0, actualStart:"", actualEnd:""
  })));

  await persist();
  view="project"; currentProjectId=pid; projectTab="crono"; lastProject=pid;
  render();
  toast("Projeto duplicado — ajuste as datas e comece");
}

/* ---------- Expandir / recolher por camada ----------
   Cada clique afeta só a camada mais externa ainda fechada (Expandir) ou
   mais interna ainda aberta (Recolher). O projeto conta como a camada mais
   externa de todas (profundidade -1): o último clique em Recolher fecha o
   próprio projeto; o primeiro clique em Expandir o reabre.                */
function expandBar(){
  return `<div class="expand-bar no-print">
    <button class="btn sm" data-expandlayer="1" title="Abrir a próxima camada fechada">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="7 13 12 18 17 13"/><polyline points="7 6 12 11 17 6"/></svg>
      Expandir
    </button>
    <button class="btn sm" data-collapselayer="1" title="Fechar a camada mais funda aberta">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 13"/></svg>
      Recolher
    </button>
  </div>`;
}
function taskDepth(t){
  let d=0, cur=t;
  const vistos=new Set();
  while(cur && cur.parentId && !vistos.has(cur.id)){ vistos.add(cur.id); d++; cur=taskOf(cur.parentId); }
  return d;
}
function layerScope(){
  const pid = (view==="project" && currentProjectId) ? currentProjectId : null;
  const projetos = pid ? DATA.projects.filter(p=>p.id===pid) : DATA.projects;
  const atividades = pid ? DATA.tasks.filter(t=>t.projectId===pid) : DATA.tasks;
  return { projetos, atividades };
}
function collapseOneLayer(){
  const { projetos, atividades } = layerScope();
  const nos = [
    ...projetos.map(p=>({key:"p_"+p.id, depth:-1})),
    ...atividades.filter(hasChildren).map(t=>({key:t.id, depth:taskDepth(t)}))
  ];
  const abertos = nos.filter(n=>expanded[n.key]!==false);
  if(!abertos.length){ toast("Já está tudo recolhido"); return; }
  const maxD = Math.max(...abertos.map(n=>n.depth));
  abertos.filter(n=>n.depth===maxD).forEach(n=>{ expanded[n.key]=false; });
  render();
}
function expandOneLayer(){
  const { projetos, atividades } = layerScope();
  const nos = [
    ...projetos.map(p=>({key:"p_"+p.id, depth:-1})),
    ...atividades.filter(hasChildren).map(t=>({key:t.id, depth:taskDepth(t)}))
  ];
  const fechados = nos.filter(n=>expanded[n.key]===false);
  if(!fechados.length){ toast("Já está tudo expandido"); return; }
  const minD = Math.min(...fechados.map(n=>n.depth));
  fechados.filter(n=>n.depth===minD).forEach(n=>{ expanded[n.key]=true; });
  render();
}

/* ============================================================
   MODO SOMENTE LEITURA

   Em modo leitura nenhuma gravação acontece: os botões de ação somem,
   arrastar é desativado e os formulários não abrem. Hoje é ativado no
   celular (sempre só consulta) e pela função toggleReadOnly; com as
   permissões (etapa E3), também pelo papel da pessoa. A proteção de
   verdade fica nas regras do servidor -- isto é só a interface.

   O antigo "Link de leitura" (acesso sem login) foi retirado:
   nesta versão quem não está cadastrado não vê nada.
============================================================ */
function isReadOnly(){ return !!readOnly || (typeof isMobile!=="undefined" && isMobile) || (typeof podeEditarContexto==="function" && !podeEditarContexto()); }

function applyReadOnly(){
  document.body.classList.toggle("readonly", isReadOnly());
}

function toggleReadOnly(){
  if(readOnly){
    if(!confirm("Sair do modo somente leitura e voltar a poder editar?")) return;
    readOnly=false;
  }else{
    readOnly=true;
  }
  applyReadOnly(); render();
  toast(readOnly?"Modo somente leitura ativado":"Edição reativada");
}

/* ============================================================
   LINHA DE BASE (BASELINE)

   Uma "fotografia" das datas planejadas num momento específico, para
   comparar depois com o planejamento atual e enxergar o desvio --
   sem isso, todo replanejamento apaga o rastro do que foi combinado
   originalmente.

   Decisões de escopo (confirmadas antes de implementar):
     - Uma linha de base POR VEZ por projeto (redefinir substitui a
       anterior; não há histórico de várias).
     - Só PRAZO (início/fim planejados) -- sem custo.
     - Vive numa tela própria ("Comparar linha de base"), separada do
       Cronograma -- nenhuma coluna nova foi adicionada lá.
============================================================ */
function baselineOf(projectId){
  return (DATA.baselines||[]).find(b=>b.projectId===projectId)||null;
}
function baselineTaskOf(baseline,taskId){
  return baseline ? (baseline.tasks||[]).find(t=>t.taskId===taskId) : null;
}
function diasEntre(a,b){
  if(!a||!b) return null;
  return Math.round((parseD(b)-parseD(a))/86400000);
}

async function defineBaseline(projectId){
  if(blockIfReadOnly()) return;
  const p=projOf(projectId); if(!p) return;
  const todas=DATA.tasks.filter(t=>t.projectId===projectId);
  if(!todas.length){ toast("Este projeto ainda não tem atividades",true); return; }

  const existente=baselineOf(projectId);
  if(existente){
    if(!souAutorizadoParaProjeto(projectId)){
      openSolicitarComJustificativaModal(
        "Solicitar redefinição de linha de base",
        `Você não está autorizado a redefinir a linha de base de "${esc(p.name)}" — só o Responsável Escritório de Projetos deste projeto pode. O pedido, com sua justificativa, vai por e-mail para essa pessoa.`,
        async(justificativa)=>{
          try{ await servidorCall("solicitarAcaoLinhaDeBase",projectId,"redefinir",justificativa); toast("Pedido enviado"); }
          catch(e){ toast("Não foi possível enviar o pedido",true); }
        }
      );
      return;
    }
    openRedefineBaselineModal(projectId,existente,todas);
    return;
  }

  if(!confirm(`Definir a linha de base de "${p.name}" com as datas planejadas de hoje?`)) return;
  await commitNewBaseline(projectId,todas,null);
}

async function commitNewBaseline(projectId,todas,justificativa){
  if(isLockedByOther(tk(projectId,"linhaBase"))){ toast("Projeto em edição por "+lockHolderName(tk(projectId,"linhaBase")),true); return; }
  const lockRes=await acquireLock(tk(projectId,"linhaBase"));
  if(!lockRes.ok){ toast(msgTrava(lockRes),true); return; }

  const antiga=baselineOf(projectId);
  if(antiga){
    // guarda a linha de base que está sendo substituída no histórico,
    // com a justificativa desta redefinição -- ela explica por que a
    // ANTIGA deixou de valer, então fica junto do registro dela
    if(!Array.isArray(DATA.baselineHistory)) DATA.baselineHistory=[];
    DATA.baselineHistory.push({ ...antiga, id:uid(), replacedAt:Date.now(), justificativaRedefinicao:justificativa||"" });
  }

  const snapshot={
    projectId, createdAt:Date.now(), createdBy:me||"Anônimo",
    tasks: todas.map(t=>({ taskId:t.id, name:t.name, plannedStart:effPlannedStart(t), plannedEnd:effPlannedEnd(t) }))
  };
  DATA.baselines=(DATA.baselines||[]).filter(b=>b.projectId!==projectId);
  DATA.baselines.push(snapshot);
  await persist(); render();
  toast("Linha de base definida");
}

    <div class="field"><label>Justificativa para redefinir a linha de base</label><textarea id="bl_just" rows="3" placeholder="Ex.: escopo revisado após aprovação do comitê em ..."></textarea></div>`;

      async(justificativa)=>{
