/* ============================================================
   EAP EDITÁVEL EM LOTE

   Opera sobre DATA.eapNodes -- uma estrutura PRÓPRIA, independente das
   atividades do Cronograma. Mesmo formato da "Adicionar várias atividades"
   (uma linha por item, indentação = subitem), mas para reestruturar a
   EAP inteira de uma vez -- renomear, reordenar, mudar de nível e
   adicionar/remover, tudo pelo texto.

   Como isso distingue "editar" de "criar": cada linha de um item que já
   existe traz uma marca invisível-ish no final (⟦id⟧). Se a marca
   continua lá, é o mesmo item (só nome/posição podem ter mudado). Uma
   linha sem marca é um item novo. Um item que tinha marca e deixou de
   aparecer foi removido.
============================================================ */
function eapEditMarker(id){ return ` ⟦${id}⟧`; }

/**
 * Monta a EAP automaticamente a partir do Cronograma, considerando
 * SÓ as atividades que têm subordinadas (o "esqueleto" da hierarquia --
 * atividades-folha ficam de fora). Como uma atividade só entra aqui por
 * ter filhos, o pai dela (se existir) sempre tem pelo menos um filho
 * também -- ou seja, a própria atividade -- então a hierarquia entre as
 * atividades escolhidas fica automaticamente preservada, sem precisar
 * reencaixar nada.
 */
async function buildAutoEAP(projectId){
  if(blockIfReadOnly()) return;
  const p=projOf(projectId); if(!p) return;
  const comFilhos=DATA.tasks.filter(t=>t.projectId===projectId && childrenOf(projectId,t.id).length>0);
  if(!comFilhos.length){ toast("Nenhuma atividade com subordinadas neste Cronograma",true); return; }

  const eapAtual=DATA.eapNodes.filter(e=>e.projectId===projectId);
  if(eapAtual.length){
    const ok=confirm(`Isso substitui a EAP atual (${eapAtual.length} item(ns)) por uma nova, gerada a partir das ${comFilhos.length} atividade(s) do Cronograma que têm subordinadas. Continuar?`);
    if(!ok) return;
  }

  DATA.eapNodes=DATA.eapNodes.filter(e=>e.projectId!==projectId);
  const ordemPorPai={};
  comFilhos.forEach(t=>{
    const chave=t.parentId||"__root__";
    const ordem=ordemPorPai[chave]==null?0:ordemPorPai[chave];
    ordemPorPai[chave]=ordem+1;
    DATA.eapNodes.push({ id:t.id, projectId, parentId:t.parentId, name:t.name, isMilestone:!!t.isMilestone, notes:"", order:ordem });
  });

  await persist();
  toast(`EAP montada — ${comFilhos.length} item(ns) a partir do Cronograma`);
  render();
}
function eapEditStripMarker(linha){
  const m=linha.match(/^(.*?)\s*⟦([a-zA-Z0-9_-]+)⟧\s*$/);
  return m ? {texto:m[1].trim(), id:m[2]} : {texto:linha.trim(), id:null};
}

function eapEditBuildText(projectId){
  const linhas=[];
  const walk=(parentId,depth)=>{
    eapChildrenOf(projectId,parentId).forEach(e=>{
      const marco=e.isMilestone?"◆ ":"";
      linhas.push("  ".repeat(depth)+marco+e.name+eapEditMarker(e.id));
      walk(e.id,depth+1);
    });
  };
  walk(null,0);
  return linhas.join("\n");
}

async function openEapEditModal(projectId){
  if(blockIfReadOnly()) return;
  const p=projOf(projectId); if(!p) return;
  if(isLockedByOther(tk(projectId,"eap"))){ toast("Projeto em edição por "+lockHolderName(tk(projectId,"eap")),true); return; }
  const lockRes=await acquireLock(tk(projectId,"eap"));
  if(!lockRes.ok){ toast(msgTrava(lockRes),true); render(); return; }
  activeLockProjectId=tk(projectId,"eap"); startHeartbeat(tk(projectId,"eap")); render();

  const temTarefas=DATA.tasks.some(t=>t.projectId===projectId);
  const temEap=DATA.eapNodes.some(e=>e.projectId===projectId);
  const textoAtual=eapEditBuildText(projectId);
  const body=`
    <p class="hint" style="margin-top:-4px;margin-bottom:12px">Uma linha por item. Use <strong>espaços no início</strong> para indicar subitem — mova a indentação para trocar de nível. Prefixe com <strong>◆</strong> para marcar como marco (a decomposição termina numa entrega). Renomeie o texto livremente; só não apague o código entre ⟦ ⟧ no final da linha se quiser manter a identidade do mesmo item. Uma linha nova (sem esse código) vira item novo. Remover uma linha existente exclui aquele item — <strong>isso é independente do Cronograma</strong>, nenhuma atividade é afetada.</p>
    ${(!temEap && temTarefas)?`<div class="imp-box" style="margin-bottom:12px">A EAP deste projeto ainda está vazia. <button class="btn sm" id="eapedit_copiar" type="button">Copiar a estrutura do Cronograma atual</button> como ponto de partida — depois disso as duas evoluem soltas.</div>`:""}
    <div class="field"><label>Estrutura da EAP</label>
      <textarea id="eapedit_txt" rows="16" style="font-family:var(--font-mono);font-size:12px;line-height:1.6">${esc(textoAtual)}</textarea>
    </div>
    <div id="eapedit_prev"></div>`;
  showModal(`Editar EAP em lote — ${p.name}`,body,
    `<button class="btn" id="eapedit_cancel">Cancelar</button><button class="btn primary" id="eapedit_save">Salvar</button>`,false);

  const parse=()=>{
    const linhasBrutas=$("#eapedit_txt").value.split("\n").filter(l=>l.trim());
    const recuos=[...new Set(linhasBrutas.map(l=>l.match(/^\s*/)[0].replace(/\t/g,"  ").length))].sort((a,b)=>a-b);
    return linhasBrutas.map(l=>{
      const rec=l.match(/^\s*/)[0].replace(/\t/g,"  ").length;
      let texto=l.trim();
      let isMilestone=false;
      if(texto.startsWith("◆")){ isMilestone=true; texto=texto.slice(1).trim(); }
      const stripped=eapEditStripMarker(texto);
      return { depth:recuos.indexOf(rec), name:stripped.texto, id:stripped.id, isMilestone };
    }).filter(it=>it.name);
  };
  const preview=()=>{
    const its=parse();
    const existentes=new Set(DATA.eapNodes.filter(e=>e.projectId===projectId).map(e=>e.id));
    const idsNoTexto=new Set(its.filter(it=>it.id).map(it=>it.id));
    const novas=its.filter(it=>!it.id).length;
    const removidas=[...existentes].filter(id=>!idsNoTexto.has(id)).length;
    const eapNodeOf=id=>DATA.eapNodes.find(e=>e.id===id);
    const renomeadas=its.filter(it=>it.id && existentes.has(it.id) && eapNodeOf(it.id) && eapNodeOf(it.id).name!==it.name).length;
    $("#eapedit_prev").innerHTML = its.length
      ? `<div class="imp-box ${removidas?'warn':'ok'}" style="margin-top:2px">${its.length} item(ns) no total${novas?` · ${novas} nova(s)`:""}${renomeadas?` · ${renomeadas} renomeada(s)`:""}${removidas?` · ${removidas} será(ão) excluída(s)`:""}</div>`
      : `<div class="imp-box warn" style="margin-top:2px">Nenhum item — salvar isto excluiria a EAP inteira. Confira antes de continuar.</div>`;
  };

  const copiarBtn=$("#eapedit_copiar");
  if(copiarBtn) copiarBtn.onclick=()=>{
    const linhas=[];
    const walk=(parentId,depth)=>{
      childrenOf(projectId,parentId).forEach(t=>{
        linhas.push("  ".repeat(depth)+(t.isMilestone?"◆ ":"")+t.name);
        walk(t.id,depth+1);
      });
    };
    walk(null,0);
    $("#eapedit_txt").value=linhas.join("\n");
    preview();
  };

  preview();
  $("#eapedit_txt").oninput=preview;
  $("#eapedit_cancel").onclick=closeModal;
  $("#eapedit_save").onclick=async()=>{
    const its=parse();
    const existentesDoProjeto=DATA.eapNodes.filter(e=>e.projectId===projectId);
    const existentesPorId={}; existentesDoProjeto.forEach(e=>{ existentesPorId[e.id]=e; });

    const pilha={};       // depth -> id do ultimo item daquele nivel (existente ou recem-criado)
    const ordemPorPai={}; // parentId (ou "__root__") -> proximo numero de ordem
    const idsUsados=new Set();
    const novosNodes=[];
    let criadas=0, renomeadas=0;

    its.forEach(it=>{
      const parentId = it.depth>0 ? (pilha[it.depth-1]||null) : null;
      const chavePai = parentId||"__root__";
      const ordem = ordemPorPai[chavePai]==null ? 0 : ordemPorPai[chavePai];
      ordemPorPai[chavePai]=ordem+1;

      let id = it.id && existentesPorId[it.id] ? it.id : null;
      if(id){
        const e=existentesPorId[id];
        if(e.name!==it.name) renomeadas++;
        e.name=it.name; e.parentId=parentId; e.isMilestone=it.isMilestone; e.order=ordem;
      }else{
        id=uid();
        const novo={ id, projectId, parentId, name:it.name, isMilestone:it.isMilestone, notes:"", order:ordem };
        novosNodes.push(novo);
        existentesPorId[id]=novo;
        criadas++;
      }
      idsUsados.add(id);
      pilha[it.depth]=id;
    });

    const removidos=existentesDoProjeto.filter(e=>!idsUsados.has(e.id)).length;
    DATA.eapNodes.push(...novosNodes);
    DATA.eapNodes=DATA.eapNodes.filter(e=>e.projectId!==projectId || idsUsados.has(e.id));

    closeModal(); await persist(); await releaseLock(tk(projectId,"eap")); render();
    const partes=[`${criadas} nova(s)`];
    if(renomeadas) partes.push(`${renomeadas} renomeada(s)`);
    if(removidos) partes.push(`${removidos} excluída(s)`);
    toast(`EAP atualizada — ${partes.join(" · ")}`);
  };
}
/* ============================================================
   MATRIZ DE RESPONSABILIDADE

   Tela dentro do projeto para gerenciar quem é responsável por quê:
   - Lista cada responsável (extraído das atividades + cadastro de contato
     opcional) com contagem de atividades abertas/atrasadas.
   - "Novo responsável" cria o contato antes mesmo de atribuir atividades.
   - "Gerenciar atividades" abre uma seleção em lote (marca/desmarca quais
     atividades/subatividades pertencem àquela pessoa).
   - "Gerenciador de envios" no mesmo formato do que já existe para
     stakeholders (Agendamentos + Enviar agora), mas cada pessoa recebe
     um e-mail PRÓPRIO com só as atividades dela (atrasadas + a vencer nos
     próximos 7 dias) -- nunca um resumo compartilhado do projeto.
============================================================ */
function isResponsavelDe(t,nome){
  const alvo=nome.trim().toLowerCase();
  if((t.assignee||"").trim().toLowerCase()===alvo) return true;
  return (t.coResponsaveis||[]).some(c=>c.trim().toLowerCase()===alvo);
}
function responsiblesOfProject(projectId){
  const nomes=new Map(); // nome normalizado -> nome de exibição
  DATA.tasks.filter(t=>t.projectId===projectId && t.assignee).forEach(t=>{
    const k=t.assignee.trim().toLowerCase();
    if(!nomes.has(k)) nomes.set(k,t.assignee.trim());
  });
  DATA.tasks.filter(t=>t.projectId===projectId).forEach(t=>{
    (t.coResponsaveis||[]).forEach(n=>{
      const k=n.trim().toLowerCase();
      if(k && !nomes.has(k)) nomes.set(k,n.trim());
    });
  });
  DATA.responsibleContacts.filter(r=>r.projectId===projectId).forEach(r=>{
    const k=r.name.trim().toLowerCase();
    if(!nomes.has(k)) nomes.set(k,r.name.trim());
  });
  return [...nomes.values()].sort((a,b)=>a.localeCompare(b,"pt-BR")).map(nome=>{
    const atividades=DATA.tasks.filter(t=>t.projectId===projectId && isResponsavelDe(t,nome) && effStatus(t)!=="cancelada");
    const abertas=atividades.filter(t=>effStatus(t)!=="concluida");
    const atrasadas=abertas.filter(reportIsCurrentLate);
    const contato=DATA.responsibleContacts.find(r=>r.projectId===projectId && r.name.trim().toLowerCase()===nome.toLowerCase());
    return { nome, total:atividades.length, abertas:abertas.length, atrasadas:atrasadas.length, contato };
  });
}

/* ---------- Novo responsável / editar contato ---------- */
async function confirmDeleteResponsible(projectId,nome){
  if(blockIfReadOnly()) return;
  const alvo=nome.trim().toLowerCase();
  const nAtiv=DATA.tasks.filter(t=>t.projectId===projectId && isResponsavelDe(t,nome)).length;
  const msg=nAtiv
    ? `Excluir "${nome}" da lista de responsáveis? ${nAtiv} atividade(s) perdem essa pessoa como responsável (principal ou adicional).`
    : `Excluir "${nome}" da lista de responsáveis?`;
  if(!confirm(msg)) return;
  if(!(await pegarTravaDireta(tk(projectId,"cronograma")))) return;
  // depois da trava: dados atuais (a atualização automática pode tê-los trocado)
  const atividades=DATA.tasks.filter(t=>t.projectId===projectId && isResponsavelDe(t,nome));
  atividades.forEach(t=>{
    if((t.assignee||"").trim().toLowerCase()===alvo) t.assignee="";
    if((t.coResponsaveis||[]).length) t.coResponsaveis=t.coResponsaveis.filter(c=>c.trim().toLowerCase()!==alvo);
  });
  DATA.responsibleContacts=DATA.responsibleContacts.filter(r=>!(r.projectId===projectId && r.name.trim().toLowerCase()===alvo));
  await persist(); await releaseLock(tk(projectId,"cronograma")); render(); toast("Responsável excluído");
}

/* ---------- Gerenciar atividades de um responsável (seleção em lote) ---------- */
async function openResponsibleTasksModal(projectId,nome){
  if(blockIfReadOnly()) return;
  if(!projOf(projectId)) return;
  if(!(await pegarTravaParaJanela(tk(projectId,"cronograma")))) return;
  const p=projOf(projectId); if(!p){ closeModal(); return; }
  const ordenadas=treeOrderTasks(projectId);
  const linhas=ordenadas.map(({task:t,depth})=>{
    const ehPrincipal=(t.assignee||"").trim().toLowerCase()===nome.toLowerCase();
    const ehAdicional=(t.coResponsaveis||[]).some(c=>c.trim().toLowerCase()===nome.toLowerCase());
    return `
    <label class="resp-task-row" style="padding-left:${depth*18}px">
      <input type="checkbox" data-resptaskchk="${t.id}" ${ehPrincipal?"checked":""} title="Responsável principal">
      <span class="resp-task-name">${t.isMilestone?'<span class="eapv-dia">◆</span> ':""}${esc(t.name)}</span>
      <label class="hint" style="display:inline-flex;align-items:center;gap:4px;margin-left:10px" title="Responsável adicional (além do principal)">
        <input type="checkbox" data-resptaskco="${t.id}" ${ehAdicional?"checked":""} style="width:auto"> adicional
      </label>
      ${t.assignee&&t.assignee.trim().toLowerCase()!==nome.toLowerCase()?`<span class="hint" style="display:inline">principal atual: ${esc(t.assignee)}</span>`:""}
    </label>`;
  }).join("");
  const body=`<p class="hint" style="margin-top:-4px;margin-bottom:10px">Marque as atividades e subatividades de <strong>${esc(nome)}</strong>. A coluna à esquerda define o responsável principal (desmarcar deixa sem responsável; marcar transfere de quem era). A coluna "adicional" inclui ${esc(nome)} como responsável adicional da atividade, sem tirar o principal — pode haver mais de um adicional por atividade.</p>
    <div class="resp-task-list">${linhas||`<span class="hint" style="display:inline">Este projeto ainda não tem atividades.</span>`}</div>`;
  showModal(`Atividades de ${nome}`,body,`<button class="btn" id="respt_cancel">Cancelar</button><button class="btn primary" id="respt_save">Salvar atribuições</button>`,false);
  $("#respt_cancel").onclick=closeModal;
  $("#respt_save").onclick=async()=>{
    let mudou=0;
    $$("[data-resptaskchk]").forEach(chk=>{
      const t=taskOf(chk.dataset.resptaskchk); if(!t) return;
      const eraDele=(t.assignee||"").trim().toLowerCase()===nome.toLowerCase();
      if(chk.checked && !eraDele){ t.assignee=nome; mudou++; }
      else if(!chk.checked && eraDele){ t.assignee=""; mudou++; }
    });
    $$("[data-resptaskco]").forEach(chk=>{
      const t=taskOf(chk.dataset.resptaskco); if(!t) return;
      const lista=t.coResponsaveis||[];
      const idx=lista.findIndex(c=>c.trim().toLowerCase()===nome.toLowerCase());
      if(chk.checked && idx<0){ t.coResponsaveis=[...lista,nome]; mudou++; }
      else if(!chk.checked && idx>=0){ t.coResponsaveis=lista.filter((_,i)=>i!==idx); mudou++; }
    });
    closeModal();
    if(mudou){ await persist(); toast(`${mudou} atividade(s) atualizada(s)`); }
    render();
  };
}

async function openRgeScheduleForm(projectId){
  if(blockIfReadOnly()) return;
  if(!(await pegarTravaParaJanela(tk(projectId,"stakeholders")))) return;
  const body=`
    <div class="field"><label>Nome do agendamento</label><input id="rges_name" placeholder="Ex.: Aviso semanal de pendências"></div>
    <div class="field"><label>Responsáveis <span style="font-weight:400;color:var(--muted)">(cada um recebe um e-mail só com as próprias atividades)</span></label>
      <div class="ge-contact-list">${rgeContactPickerHtml(projectId)}</div>
    </div>
    <div class="f2">
      <div class="field"><label>Frequência</label><select id="rges_freq">
        <option value="semanal">Semanal</option>
        <option value="quinzenal">A cada 2 semanas</option>
        <option value="mensal">Mensal</option>
      </select></div>
      <div class="field" id="rges_dia_wrap"><label>Dia da semana</label><select id="rges_weekday">${RESP_WEEKDAY_LABEL.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select></div>
    </div>`;
  showModal("Novo agendamento",body,`<button class="btn" id="rges_cancel">Cancelar</button><button class="btn primary" id="rges_save">Criar agendamento</button>`,false);

  const atualizarDiaWrap=()=>{
    const freq=$("#rges_freq").value;
    if(freq==="mensal") $("#rges_dia_wrap").innerHTML=`<label>Dia do mês</label><input type="number" id="rges_daymonth" min="1" max="28" value="1">`;
    else $("#rges_dia_wrap").innerHTML=`<label>Dia da semana</label><select id="rges_weekday">${RESP_WEEKDAY_LABEL.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select>`;
  };
  $("#rges_freq").onchange=atualizarDiaWrap;
  $("#rges_cancel").onclick=closeModal;
  $("#rges_save").onclick=async()=>{
    const name=$("#rges_name").value.trim();
    if(!name){ toast("Dê um nome ao agendamento",true); return; }
    const nomes=[];
    let faltaEmail=false;
    $$("[data-rgepick]:checked").forEach(chk=>{
      const nome=chk.dataset.rgepick;
      const r=DATA.responsibleContacts.find(x=>x.projectId===projectId && x.name.trim().toLowerCase()===nome.toLowerCase());
      const emailInput=$(`[data-rgeemail="${cssEsc(nome)}"]`);
      if((!r||!r.email) && emailInput){
        const val=emailInput.value.trim();
        if(!val){ faltaEmail=true; return; }
        if(r) r.email=val; else DATA.responsibleContacts.push({id:uid(),projectId,name:nome,email:val,phone:""});
      }
      nomes.push(nome);
    });
    if(faltaEmail){ toast("Preencha o e-mail dos responsáveis marcados sem contato",true); return; }
    if(!nomes.length){ toast("Escolha pelo menos um responsável",true); return; }

    const freq=$("#rges_freq").value;
    const weekdayEl=$("#rges_weekday"), daymonthEl=$("#rges_daymonth");
    DATA.reportSchedules.push({
      id:uid(), projectId, name, reportType:"resp-tasks",
      stakeholderIds:[], extraContacts:[], responsibleNames:nomes,
      frequency:freq, weekday:weekdayEl?+weekdayEl.value:null, dayOfMonth:daymonthEl?+daymonthEl.value:null,
      active:true, lastSentAt:0, createdBy:me||"Anônimo"
    });
    closeModal(); await persist();
    toast("Agendamento criado"); openRespGerenciadorEnvios(projectId);
  };
}
async function toggleRgeSchedule(id,projectId){
  if(blockIfReadOnly()) return;
  if(!DATA.reportSchedules.some(x=>x.id===id)) return;
  if(!(await pegarTravaDireta(tk(projectId,"stakeholders")))) return;
  const s=DATA.reportSchedules.find(x=>x.id===id); // versão atual, depois da trava
  if(!s){ await releaseLock(tk(projectId,"stakeholders")); return; }
  s.active=!s.active;
  await persist(); await releaseLock(tk(projectId,"stakeholders")); toast(s.active?"Agendamento reativado":"Agendamento pausado");
  openRespGerenciadorEnvios(projectId);
}
async function deleteRgeSchedule(id,projectId){
  if(blockIfReadOnly()) return;
  if(!confirm("Excluir este agendamento?")) return;
  if(!(await pegarTravaDireta(tk(projectId,"stakeholders")))) return;
  DATA.reportSchedules=DATA.reportSchedules.filter(x=>x.id!==id);
  await persist(); await releaseLock(tk(projectId,"stakeholders")); toast("Agendamento excluído");
  openRespGerenciadorEnvios(projectId);
}

function renderRgeEnviarAgora(box,projectId){
  box.innerHTML=`
    <div class="field"><label>Responsáveis</label>
      <div class="ge-contact-list">${rgeContactPickerHtml(projectId)}</div>
    </div>
    <p class="hint" style="margin-top:-2px">Cada pessoa marcada recebe um e-mail próprio, só com as atividades atrasadas e as que vencem nos próximos 7 dias.</p>
    <button class="btn primary" id="rgea_send" style="width:100%;justify-content:center;margin-top:10px">Enviar agora</button>`;

  $("#rgea_send").onclick=async()=>{
    const nomes=[];
    let faltaEmail=false;
    $$("[data-rgepick]:checked").forEach(chk=>{
      const nome=chk.dataset.rgepick;
      const r=DATA.responsibleContacts.find(x=>x.projectId===projectId && x.name.trim().toLowerCase()===nome.toLowerCase());
      const emailInput=$(`[data-rgeemail="${cssEsc(nome)}"]`);
      if((!r||!r.email) && emailInput){
        const val=emailInput.value.trim();
        if(!val){ faltaEmail=true; return; }
        if(r) r.email=val; else DATA.responsibleContacts.push({id:uid(),projectId,name:nome,email:val,phone:""});
      }
      nomes.push(nome);
    });
    if(faltaEmail){ toast("Preencha o e-mail dos responsáveis marcados sem contato",true); return; }
    if(!nomes.length){ toast("Escolha pelo menos um responsável",true); return; }

    const btn=$("#rgea_send"); btn.disabled=true; btn.textContent="Enviando…";
    try{
      await persist();
      let enviados=0;
      for(const nome of nomes){
        const r=DATA.responsibleContacts.find(x=>x.projectId===projectId && x.name.trim().toLowerCase()===nome.toLowerCase());
        if(!r||!r.email) continue;
        const corpo=renderResponsibleTasksSummaryHtml(projectId,nome);
        await servidorCall("enviarRelatorioPorEmail", JSON.stringify([{name:nome,email:r.email}]), `Suas atividades — ${(projOf(projectId)||{}).name||""}`, corpo);
        enviados++;
      }
      toast(`Enviado para ${enviados} responsável(is)`);
      closeModal();
    }catch(e){
      toast("Não foi possível enviar agora",true);
      btn.disabled=false; btn.textContent="Enviar agora";
    }
  };
}

/* Resumo de e-mail com as atividades de UM responsável (atrasadas + a vencer
   nos próximos 7 dias) -- mesmo espírito do renderEmailSummaryHtml dos
   stakeholders, mas o conteúdo é pessoal, não um resumo do projeto. */
function renderResponsibleTasksSummaryHtml(projectId,nome){
  const p=projOf(projectId); if(!p) return "";
  const hoje=todayISO(), em7=isoOf(new Date(Date.now()+7*86400000));
  const alvo=nome.trim().toLowerCase();
  const atividades=DATA.tasks.filter(t=>t.projectId===projectId && (t.assignee||"").trim().toLowerCase()===alvo && effStatus(t)!=="concluida" && effStatus(t)!=="cancelada");
  const atrasadas=atividades.filter(reportIsCurrentLate).sort((a,b)=>(effPlannedEnd(a)||"").localeCompare(effPlannedEnd(b)||""));
  const aVencer=atividades.filter(t=>{ const pe=effPlannedEnd(t); return pe && pe>=hoje && pe<=em7 && !reportIsCurrentLate(t); }).sort((a,b)=>(effPlannedEnd(a)||"").localeCompare(effPlannedEnd(b)||""));
  const linha=t=>`<tr><td style="padding:6px 4px;border-bottom:1px solid #F0EDF4;font-size:12.5px">${esc(t.name)}</td><td style="padding:6px 4px;border-bottom:1px solid #F0EDF4;font-size:12.5px;white-space:nowrap;text-align:right">${fmtBRfull(effPlannedEnd(t))||"—"}</td></tr>`;
  const tabela=(titulo,lista,cor)=>lista.length?`<p style="font-size:12.5px;color:${cor};font-weight:700;margin:16px 0 4px">${titulo} (${lista.length})</p><table style="width:100%;border-collapse:collapse">${lista.map(linha).join("")}</table>`:"";
  let linkApp=""; try{ linkApp=linkDoApp(); }catch(e){}
  const semPendencias=!atrasadas.length && !aVencer.length;
  return `<div style="font-family:Arial,sans-serif;max-width:560px;margin:0 auto">
    <div style="background:#2A1840;color:#fff;padding:16px 20px;border-radius:8px 8px 0 0">
      <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#D9C9EE">${esc(APP_CONFIG.nomeApp)} · ${esc(p.name)}</div>
      <h2 style="margin:6px 0 0;font-size:19px">Suas atividades — ${esc(nome)}</h2>
    </div>
    <div style="border:1px solid #E3E7EE;border-top:none;padding:18px 20px;border-radius:0 0 8px 8px">
      ${semPendencias?`<p style="font-size:13px;color:#334155">Nenhuma atividade atrasada ou a vencer nos próximos 7 dias. 🎉</p>`:tabela("Atrasadas",atrasadas,"#E03131")+tabela("A vencer nos próximos 7 dias",aVencer,"#DD7C00")}
      ${linkApp?`<a href="${linkApp}" style="display:inline-block;margin-top:14px;background:#5E2B8C;color:#fff;text-decoration:none;padding:10px 16px;border-radius:6px;font-size:13px;font-weight:600">Abrir na ferramenta</a>`:""}
      <p style="font-size:10.5px;color:#94A3B8;margin-top:16px">Resumo automático — ${esc(APP_CONFIG.nomeApp)}.</p>
    </div>
  </div>`;
}
/* ============================================================
   TAP — TERMO DE ABERTURA DO PROJETO

   Formulário dentro do projeto. Três campos vêm pré-preenchidos ao
   vivo da própria tela de criação do projeto (Nome, Gestor/Responsável
   e Perspectiva Estratégica) -- editá-los aqui não faz sentido, edite
   o projeto para mudar esses três; o resto é próprio do TAP.

   "Temporalidade das Entregas" permite adicionar opções de ano além das
   5 já sugeridas -- a lista de anos extras (DATA.customTapYears) é
   compartilhada entre todos os projetos, igual à lista de pessoas.
============================================================ */
function tapOfProject(projectId){ return DATA.tapData.find(t=>t.projectId===projectId)||null; }

function tapYearOptionsAll(){
  return [...TAP_ANOS_BASE, ...DATA.customTapYears.filter(y=>!TAP_ANOS_BASE.includes(y))];
}

/* ============================================================
   EDIÇÃO DA TAP (com trava do projeto)
   A TAP abre SÓ PARA LEITURA. "Editar TAP" pega a trava do projeto (como
   os formulários em janela), busca a versão mais recente no servidor e
   libera os campos. Enquanto edita:
   - tudo o que é digitado fica num RASCUNHO -- se a tela for redesenhada
     (atualização automática, "+ ano"), os campos voltam com o rascunho;
   - sair da tela com alterações pede confirmação;
   - se a trava for perdida, os campos continuam e, ao salvar, a trava é
     retomada (ou aparece quem está editando).
   Salvar ou Cancelar solta a trava.
============================================================ */
let tapEdicao=null; // {projectId, rascunho, sujo, travaPerdida, quem}
function lerFormTAP(){
  const val=id=>{ const el=$("#"+id); return el?el.value:""; };
  return {
    __persp: val("tap_perspectiva"),
    temporalidade: $$("[data-tapcheck='temporalidade']:checked").map(c=>c.value),
    novoOuAndamento: val("tap_novoandamento"),
    etapaAtual: val("tap_etapa"), subsecretaria: val("tap_subsecretaria"), areaTecnica: val("tap_areatecnica"),
    telefone: val("tap_telefone"), email: val("tap_email"), justificativa: val("tap_justificativa"),
    publicoAlvo: val("tap_publicoalvo"), objetivo: val("tap_objetivo"), escopo: val("tap_escopo"),
    resultadosEsperados: val("tap_resultados"),
    recursosDemandados: $$("[data-tapcheck='recursos']:checked").map(c=>c.value),
    fonteRecursos: val("tap_fonte"), prazoEstimado: val("tap_prazo"), dataPreenchimento: val("tap_data"),
    objetivoGeral: val("tap_objgeral"), objetivoEspecifico: val("tap_objespecifico")
  };
}
function guardarRascunhoTAP(){
  const fs=$(".tap-fieldset");
  if(!tapEdicao || !$(".tap-table") || !fs || fs.disabled) return; // tela em modo leitura: não sobrescreve o rascunho
  tapEdicao.rascunho=lerFormTAP(); tapEdicao.sujo=true;
}
async function iniciarEdicaoTAP(projectId){
  if(blockIfReadOnly()) return;
  const btn=$("#tap_edit"); if(btn){ btn.disabled=true; btn.textContent="Abrindo…"; }
  if(!(await pegarTravaDireta(tk(projectId,"cabecalho")))){ render(); return; }
  // começa a editar sobre a versão MAIS RECENTE (a da tela pode ter até alguns segundos)
  if(MODE==="servidor" && salvamentosEmCurso===0) await loadData(false);
  tapEdicao={projectId, rascunho:null, sujo:false, travaPerdida:false, quem:"", base:null};
  startHeartbeat(tk(projectId,"cabecalho"));
  render();
  if(tapEdicao) tapEdicao.base=lerFormTAP(); // como estava ao começar: ao salvar, só vai o que a pessoa mudou
  setTimeout(()=>{ const el=$("#tap_etapa"); if(el) el.focus(); },50);
}
function encerrarEdicaoTAP(){
  if(!tapEdicao) return;
  const pid=tapEdicao.projectId; tapEdicao=null;
  stopHeartbeat(tk(pid,"cabecalho")); if(DATA.locks) delete DATA.locks[tk(pid,"cabecalho")];
  releaseLock(tk(pid,"cabecalho"));
}
function cancelarEdicaoTAP(){
  if(tapEdicao && tapEdicao.sujo && !confirm("Descartar as alterações da TAP?")) return;
  encerrarEdicaoTAP(); render();
}
function tapTravaPerdida(quem){
  if(!tapEdicao) return;
  if($(".tap-table")) guardarRascunhoTAP();
  tapEdicao.travaPerdida=true; tapEdicao.quem=quem||"";
  toast(`${quem||"Outra pessoa"} assumiu a edição deste projeto. O que você digitou na TAP continua na tela — ao salvar, tento retomar.`,true,true);
  render();
}
/* chamada no começo de cada render: se a pessoa saiu da TAP (outra aba,
   outro projeto, outra tela) no meio da edição, pergunta antes de descartar.
   Entrar no modo celular/leitura (zoom, janela estreita) NÃO descarta: a
   edição e o rascunho ficam guardados e voltam quando a tela alargar. */
let navAnteriorTAP=null;
function lembrarNavegacaoTAP(){
  navAnteriorTAP={view,currentProjectId,projectTab,portfolio:filters.portfolio,lastProject:(typeof lastProject!=="undefined"?lastProject:null)};
}
function verificarSaidaDaTAP(){
  if(!tapEdicao) return;
  if(!projOf(tapEdicao.projectId)){ encerrarEdicaoTAP(); return; } // projeto excluído
  const naTAP = view==="project" && currentProjectId===tapEdicao.projectId && projectTab==="tap";
  if(naTAP) return;
  if(tapEdicao.sujo && !confirm("Você está editando a TAP e não salvou. Sair e descartar as alterações?")){
    // volta exatamente para onde estava (inclusive filtros mexidos pelo clique)
    const n=navAnteriorTAP;
    view="project"; currentProjectId=tapEdicao.projectId; projectTab="tap";
    if(n){ filters.portfolio=n.portfolio; if(typeof lastProject!=="undefined") lastProject=n.lastProject; }
    return;
  }
  encerrarEdicaoTAP();
}

function renderTAP(projectId){
  const p=projOf(projectId); if(!p) return emptyState("Projeto não encontrado","");
  const editando = !!(tapEdicao && tapEdicao.projectId===projectId && !isReadOnly());
  const rasc = editando && tapEdicao.rascunho;
  const t=Object.assign({}, tapOfProject(projectId)||{}, rasc||{});
  const hoje=todayISO();

  const selectHtml=(id,opts,valorAtual,comBranco)=>`<select id="${id}">${comBranco?`<option value="">Selecione…</option>`:""}${(valorAtual&&!opts.includes(valorAtual)?[valorAtual,...opts]:opts).map(o=>`<option value="${esc(o)}" ${valorAtual===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  const checksHtml=(id,opts,selecionados)=>opts.map(o=>`<label class="port-chk tap-year-chk"><input type="checkbox" data-tapcheck="${id}" value="${esc(o)}" ${selecionados.includes(o)?"checked":""}>${esc(o)}</label>`).join("");
  // cada campo: rótulo e visibilidade vêm das Configurações (Administração)
  const row=(id,valueHtml)=>campoTAPVisivel(id)?`<div class="tap-row" data-tapcampo="${id}"><div class="tap-row-label">${esc(rotuloTAP(id))}</div><div class="tap-row-value">${valueHtml}</div></div>`:"";
  // compatibilidade: TAPs antigos guardavam um ano só (string); agora é lista
  const temporalidadeAtual=Array.isArray(t.temporalidade)?t.temporalidade:(t.temporalidade?[t.temporalidade]:[]);

  // cascata Perspectiva -> Objetivo Geral -> Objetivo Específico: cada select
  // só mostra as opções válidas para o que já foi escolhido acima dele. Se o
  // valor salvo não bater com nenhuma opção da cascata (dado antigo/planilha
  // com texto livre), ele entra como opção extra pra não se perder.
  const perspAtual=(rasc && rasc.__persp!==undefined) ? rasc.__persp : (p.strategicPerspective||"");
  const geraisDaPersp=perspAtual&&TAP_CASCATA_ESTRATEGICA[perspAtual]?Object.keys(TAP_CASCATA_ESTRATEGICA[perspAtual]):[];
  const geralAtual=t.objetivoGeral||"";
  const geraisOpts=(geralAtual&&!geraisDaPersp.includes(geralAtual))?[geralAtual,...geraisDaPersp]:geraisDaPersp;
  const especificosDoGeral=(perspAtual&&geralAtual&&TAP_CASCATA_ESTRATEGICA[perspAtual]&&TAP_CASCATA_ESTRATEGICA[perspAtual][geralAtual])||[];
  const especificoAtual=t.objetivoEspecifico||"";
  const especificosOpts=(especificoAtual&&!especificosDoGeral.includes(especificoAtual))?[especificoAtual,...especificosDoGeral]:especificosDoGeral;
  const comValorAtual=(lista,v)=>(v && !lista.includes(v)) ? [v,...lista] : lista;
  const perspOptsHtml=`<option value="">Selecione…</option>`+comValorAtual(PERSPECTIVAS_ESTRATEGICAS,perspAtual).map(x=>`<option value="${esc(x)}" ${perspAtual===x?"selected":""}>${esc(x)}</option>`).join("");

  const travadoPorOutro=!editando && isLockedByOther(tk(projectId,"cabecalho"));
  const barra = editando
    ? `<div class="tap-barra editando no-print"><span>✎ Editando a TAP${tapEdicao.sujo?" — <b>alterações não salvas</b>":""}</span></div>
       ${tapEdicao.travaPerdida?`<div class="modal-aviso no-print">⚠ ${esc(tapEdicao.quem||"Outra pessoa")} assumiu a edição deste projeto. O que você digitou continua aqui — ao salvar, tento retomar a edição.</div>`:""}`
    : `<div class="tap-barra no-print">
        ${travadoPorOutro
          ? `<span class="lock-badge">🔒 Em edição por ${esc(lockHolderName(tk(projectId,"cabecalho")))}</span>`
          : `<button class="btn primary" id="tap_edit">Editar TAP</button>`}
        <span class="hint" style="margin:0">A TAP fica só para leitura até você clicar em Editar.</span>
      </div>`;
  return barra+`<fieldset class="tap-fieldset" ${editando?"":"disabled"}><div class="tap-table">
    ${row("nome",`<input value="${esc(p.name)}" disabled>`)}
    ${row("temporalidade",`<div style="display:flex;flex-direction:column;gap:8px"><div class="tap-year-list">${checksHtml("temporalidade",tapYearOptionsAll().concat(temporalidadeAtual.filter(y=>!tapYearOptionsAll().includes(y))),temporalidadeAtual)}</div><button class="btn sm" id="tap_addyear" type="button" title="Adicionar outra opção de ano" style="align-self:flex-start">+ ano</button></div>`)}
    ${row("novoOuAndamento",`<div style="max-width:280px">${selectHtml("tap_novoandamento",TAP_NOVO_ANDAMENTO,t.novoOuAndamento||"",true)}</div>`)}
    ${row("etapaAtual",`<textarea id="tap_etapa" rows="2">${esc(t.etapaAtual||"")}</textarea>`)}
    ${row("subsecretaria",`<input id="tap_subsecretaria" value="${esc(t.subsecretaria||"")}">`)}
    ${row("areaTecnica",`<input id="tap_areatecnica" value="${esc(t.areaTecnica||"")}">`)}
    ${row("gestor",`<input value="${esc(p.owner||"")}" disabled>`)}
    ${row("telefone",`<div style="max-width:220px"><input id="tap_telefone" value="${esc(t.telefone||"")}"></div>`)}
    ${row("email",`<div style="max-width:320px"><input id="tap_email" type="email" value="${esc(t.email||"")}"></div>`)}
    ${row("justificativa",`<textarea id="tap_justificativa" rows="3">${esc(t.justificativa||"")}</textarea>`)}
    ${row("publicoAlvo",`<textarea id="tap_publicoalvo" rows="2">${esc(t.publicoAlvo||"")}</textarea>`)}
    ${row("objetivo",`<textarea id="tap_objetivo" rows="3">${esc(t.objetivo||"")}</textarea>`)}
    ${row("escopo",`<textarea id="tap_escopo" rows="4">${esc(t.escopo||"")}</textarea>`)}
    ${row("resultadosEsperados",`<textarea id="tap_resultados" rows="3">${esc(t.resultadosEsperados||"")}</textarea>`)}
    ${row("recursosDemandados",`<div class="port-chk-list">${checksHtml("recursos",TAP_RECURSOS_DEMANDADOS.concat((t.recursosDemandados||[]).filter(x=>!TAP_RECURSOS_DEMANDADOS.includes(x))),t.recursosDemandados||[])}</div>`)}
    ${row("fonteRecursos",`<div style="max-width:420px">${selectHtml("tap_fonte",comValorAtual(FONTES_RECURSO,t.fonteRecursos),t.fonteRecursos||"",true)}</div>`)}
    ${row("prazoEstimado",`<div style="max-width:280px">${selectHtml("tap_prazo",comValorAtual(TAP_PRAZOS,t.prazoEstimado),t.prazoEstimado||"",true)}</div>`)}
    ${row("perspectiva",`<div style="max-width:520px"><select id="tap_perspectiva">${perspOptsHtml}</select></div>`)}
    ${row("objetivoGeral",`<div style="max-width:640px"><select id="tap_objgeral">${`<option value="">Selecione…</option>`+geraisOpts.map(x=>`<option value="${esc(x)}" ${geralAtual===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`)}
    ${row("objetivoEspecifico",`<div style="max-width:640px"><select id="tap_objespecifico">${`<option value="">Selecione…</option>`+especificosOpts.map(x=>`<option value="${esc(x)}" ${especificoAtual===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`)}
    ${row("dataPreenchimento",`<div style="max-width:200px"><input id="tap_data" type="date" value="${t.dataPreenchimento||hoje}"></div>`)}
  </div></fieldset>
  ${editando?`<div class="tap-acoes no-print"><button class="btn primary" id="tap_save">Salvar TAP</button><button class="btn" id="tap_cancel">Cancelar</button></div>`:""}`;
}

/** Repovoa o select de Objetivo Geral (e zera o Específico) quando a
    Perspectiva muda; repovoa o Específico quando o Geral muda. */
function atualizarCascataTAP(nivel){
  const selPersp=$("#tap_perspectiva"), selGeral=$("#tap_objgeral"), selEsp=$("#tap_objespecifico");
  if(!selPersp||!selGeral||!selEsp) return;
  if(nivel==="perspectiva"){
    const gerais=TAP_CASCATA_ESTRATEGICA[selPersp.value]?Object.keys(TAP_CASCATA_ESTRATEGICA[selPersp.value]):[];
    selGeral.innerHTML=`<option value="">Selecione…</option>`+gerais.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join("");
    selEsp.innerHTML=`<option value="">Selecione…</option>`;
  }else if(nivel==="geral"){
    const especificos=(TAP_CASCATA_ESTRATEGICA[selPersp.value]&&TAP_CASCATA_ESTRATEGICA[selPersp.value][selGeral.value])||[];
    selEsp.innerHTML=`<option value="">Selecione…</option>`+especificos.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join("");
  }
}

async function saveTAP(projectId){
  if(blockIfReadOnly()) return;
  const p=projOf(projectId); if(!p) return;
  if(!tapEdicao || tapEdicao.projectId!==projectId) return;
  const v=lerFormTAP();
  tapEdicao.rascunho=v;
  if(tapEdicao.travaPerdida){
    const r=await acquireLock(tk(projectId,"cabecalho"));
    if(!r.ok){ toast(msgTrava(r)+" — o que você digitou continua na tela.",true,true); render(); return; }
    tapEdicao.travaPerdida=false; startHeartbeat(tk(projectId,"cabecalho"));
    // a trava ficou fora por um tempo: busca a versão atual antes de gravar
    if(MODE==="servidor" && salvamentosEmCurso===0) await loadData(false);
  }
  const pAtual=projOf(projectId); if(!pAtual){ toast("O projeto foi excluído",true); encerrarEdicaoTAP(); render(); return; }
  // só o que a PESSOA mudou desde que clicou em Editar vai para o registro
  // (o resto fica como está -- inclusive o que outra pessoa tenha salvo)
  const base=tapEdicao.base||{};
  let t=tapOfProject(projectId);
  const mudou=k=>!tapEdicao.base || JSON.stringify(v[k])!==JSON.stringify(base[k])
    || (k==="dataPreenchimento" && t && !t.dataPreenchimento); // data padrão (hoje) é gravada no 1º salvamento
  const novo=!t;
  const tAntes=t?JSON.parse(JSON.stringify(t)):null, pAntes={strategicPerspective:pAtual.strategicPerspective,color:pAtual.color};
  if(novo){ t={id:uid(),projectId}; DATA.tapData.push(t); }
  if(mudou("__persp")){ pAtual.strategicPerspective=v.__persp; pAtual.color=corDaPerspectiva(pAtual.strategicPerspective); }
  const textos=["etapaAtual","subsecretaria","areaTecnica","telefone","email","justificativa","publicoAlvo","objetivo","escopo","resultadosEsperados"];
  const outros=["temporalidade","novoOuAndamento","recursosDemandados","fonteRecursos","prazoEstimado","dataPreenchimento","objetivoGeral","objetivoEspecifico"];
  textos.forEach(k=>{ if(novo||mudou(k)) t[k]=String(v[k]||"").trim(); });
  outros.forEach(k=>{ if(novo||mudou(k)) t[k]=v[k]; });
  const ok=await persist();
  if(!ok){
    // desfaz no app (senão o valor não salvo iria junto no próximo salvamento de qualquer coisa)
    if(novo) DATA.tapData=DATA.tapData.filter(x=>x!==t); else Object.keys(t).forEach(k=>{ if(!(k in tAntes)) delete t[k]; }), Object.assign(t,tAntes);
    Object.assign(pAtual,pAntes);
    tapEdicao.sujo=true; render(); return; // continua editando, nada do que foi digitado se perde
  }
  encerrarEdicaoTAP();
  render();
  toast("TAP salvo");
}

function openAddTapYearModal(projectId){
  const ano=prompt("Novo ano para \"Temporalidade das Entregas\":");
  if(!ano) return;
  const v=ano.trim();
  if(!v) return;
  guardarRascunhoTAP(); // o que já foi digitado não se perde no redesenho
  if(tapEdicao && tapEdicao.rascunho && !tapEdicao.rascunho.temporalidade.includes(v)) tapEdicao.rascunho.temporalidade.push(v);
  if(!tapYearOptionsAll().includes(v)) DATA.customTapYears.push(v);
  persist();
  render();
}

function render_ProjectLinksModal(projectId){
  const p=projOf(projectId); if(!p) return;

    : `<span class="hint" style="display:inline">Nenhum link avulso ainda.</span>`;

  const body=`
    <div class="field"><label>Links das atividades do Cronograma</label>
      <div class="proj-link-list">${listaAtividades}</div>
      <p class="hint" style="margin-top:4px">Para mudar o link de uma atividade, edite a própria atividade no Cronograma.</p>
    </div>
    <div class="field"><label>Links avulsos do projeto</label>
      <div class="proj-link-list">${listaAvulsos}</div>
    </div>
    <div class="f2">
      <div class="field"><label>Título</label><input id="pl_label" placeholder="Ex.: Documento de requisitos"></div>

/* ============================================================
   VERSÃO PARA CELULAR (≤ 720px)

   Mesma página, dois layouts: a largura da tela decide. No celular o foco
   é CONSULTAR (ver, filtrar, expandir, abrir detalhes), então:
   - a edição fica desligada (isReadOnly() passa a valer também no celular,
     sem mexer no modo "somente leitura" gravado/compartilhado);
   - o menu lateral dá lugar a uma barra inferior (Painel, Portfólios,
     Projetos, Mais) e a uma folha "Mais" com a lista de projetos/portfólios;
   - o Cronograma vira cards, Custos vira cards, EAP abre em lista.
   No desktop nada disso é renderizado: isMobile é false e a classe
   body.is-mobile não existe.
============================================================ */
let isMobile=false;
let mobileMoreOpen=false;
let eapModoAntesMobile=null;
const mCardOpen={};

function setMobileMode(v){
  v=!!v;
  const mudou = v!==isMobile;
  isMobile=v;
  document.body.classList.toggle("is-mobile",v);
  mobileMoreOpen=false;
  if(v){ if(eapModoAntesMobile===null) eapModoAntesMobile=eapViewMode; eapViewMode="lista"; }
  else if(eapModoAntesMobile!==null){ eapViewMode=eapModoAntesMobile; eapModoAntesMobile=null; }
  applyReadOnly();
  if(mudou){ const c=document.getElementById("content"); if(c&&c.innerHTML) render(); }
}

function mobileScrollTop(){ try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){} }

function initMobile(){
  // barra inferior
  const bar=document.getElementById("mbar");
  if(bar) bar.addEventListener("click",e=>{
    const b=e.target.closest("[data-mnav]"); if(!b) return;
    const v=b.dataset.mnav;
    if(v==="more"){ mobileMoreOpen=!mobileMoreOpen; renderMobileChrome(); return; }
    mobileMoreOpen=false; view=v; render();
    mobileScrollTop();
  });
  // folha "Mais"
  const sh=document.getElementById("mSheet");
  if(sh){
    // captura: fecha a folha antes dos handlers de navegação (que chamam render)
    sh.addEventListener("click",e=>{
      // os botões da folha são criados fora do ciclo de render: navegam aqui mesmo
      const gp=e.target.closest("[data-gotoproj]"), gf=e.target.closest("[data-gotoport]");
      if(gp){ e.stopPropagation(); mobileMoreOpen=false; view="project"; currentProjectId=gp.dataset.gotoproj; projectTab="crono"; lastProject=currentProjectId; render(); mobileScrollTop(); return; }
      if(gf){ e.stopPropagation(); mobileMoreOpen=false; view="projects"; filters.portfolio=gf.dataset.gotoport; render(); mobileScrollTop(); return; }
      if(e.target.closest("[data-mclose]")){ mobileMoreOpen=false; renderMobileChrome(); return; }
      const a=e.target.closest("[data-mact]");
      if(a){
        mobileMoreOpen=false; renderMobileChrome();
        if(a.dataset.mact==="help") openHelpModal();
        else if(a.dataset.mact==="refresh"){ toast("Atualizando…"); loadData(false).then(()=>render()).catch(()=>{}); }
      }
    },true);
  }
  const bg=document.getElementById("mSheetBg");
  if(bg) bg.addEventListener("click",()=>{ mobileMoreOpen=false; renderMobileChrome(); });
  // cards: tocar abre/fecha os detalhes (o caret e os links têm handler próprio)
  const content=document.getElementById("content");
  if(content) content.addEventListener("click",e=>{
    const c=e.target.closest("[data-mcard]"); if(!c) return;
    const open=c.classList.toggle("open");
    c.setAttribute("aria-expanded",open?"true":"false");
    mCardOpen[c.dataset.mcard]=open;
  });
  try{
    if(!window.matchMedia) return;
    const mq=window.matchMedia("(max-width: 720px)");
    setMobileMode(mq.matches);
    const h=e=>setMobileMode(e.matches);
    if(mq.addEventListener) mq.addEventListener("change",h); else if(mq.addListener) mq.addListener(h);
  }catch(err){}
}

function renderMobileChrome(){
  const bar=document.getElementById("mbar"); if(!bar) return;
  bar.querySelectorAll("[data-mnav]").forEach(b=>{
    const v=b.dataset.mnav;
    const on = mobileMoreOpen ? v==="more" : (v===view || (v==="projects"&&view==="project"));
    b.classList.toggle("active",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  document.body.classList.toggle("m-more-open",mobileMoreOpen&&isMobile);
  const sh=document.getElementById("mSheet"); if(!sh) return;
  sh.setAttribute("aria-hidden",mobileMoreOpen?"false":"true");
  if(!isMobile){ sh.innerHTML=""; return; }
  const projs=DATA.projects.map(p=>
    `<button class="ms-item ${view==="project"&&currentProjectId===p.id?"active":""}" data-gotoproj="${p.id}"><span class="proj-dot" style="background:${p.color}"></span><span class="ms-txt">${esc(p.name)}</span></button>`
  ).join("") || `<p class="ms-empty">Nenhum projeto ainda.</p>`;
  const ports=DATA.portfolios.map(pf=>
    `<button class="ms-item ${view==="projects"&&filters.portfolio===pf.id?"active":""}" data-gotoport="${pf.id}"><span class="proj-dot" style="background:${pf.color}"></span><span class="ms-txt">${esc(pf.name)}</span></button>`
  ).join("") || `<p class="ms-empty">Nenhum portfólio ainda.</p>`;
  const sync=(document.getElementById("syncTxt")||{}).textContent||"";
  sh.innerHTML=`<div class="ms-head"><b>${esc(APP_CONFIG.nomeApp)}</b><button class="iconbtn" data-mclose aria-label="Fechar menu">✕</button></div>
    <div class="ms-body">
      ${me?`<div class="ms-user"><span class="av sm" style="background:${avColor(me)}">${esc(initials(me)).toUpperCase()}</span><span>${esc(me)}</span></div>`:""}
      <h3>Projetos <span class="badge">${DATA.projects.length}</span></h3>${projs}
      <h3>Portfólios <span class="badge">${DATA.portfolios.length}</span></h3>${ports}
      <h3>Mais</h3>
      <button class="ms-item" data-mact="refresh"><span class="ms-txt">Atualizar dados</span></button>
      <button class="ms-item" data-mact="help"><span class="ms-txt">Ajuda</span></button>
      <p class="ms-note">${esc(sync)}<br>Versão de consulta: para criar ou editar, use um computador.</p>
    </div>`;
}

/* ---------- Cronograma em cards ---------- */
function renderCronoCardsMobile(){
  const vis=visibleTaskIds();
  let html="";
  const dt=(lab,v,extra)=>`<div class="mc-f"><span>${lab}</span><b class="${extra||""}">${v?fmtBR(v):"—"}</b></div>`;
  const card=(t,depth)=>{
    if(!vis.has(t.id)) return;
    const kids=childrenOf(t.projectId,t.id);
    const hasKids=kids.length>0;
    const isExp=expanded[t.id]!==false;
    const st=statusObj(effStatus(t));
    const lt=isLate(t);
    const prog=progressOf(t);
    const ps=effPlannedStart(t), pe=effPlannedEnd(t), as_=effActualStart(t), ae=effActualEnd(t);
    const preds=(t.predecessors||[]).map(id=>(taskOf(id)||{}).name).filter(Boolean);
    const resp=[t.assignee].concat(t.coResponsaveis||[]).filter(Boolean);
    const open=!!mCardOpen[t.id];
    const cls=t.isMilestone?"t-ms":(depth===0?"t-root":"t-sub");
    html+=`<div class="mcard ${cls}${lt?" late":""}${open?" open":""}" data-mcard="${t.id}" aria-expanded="${open}" style="margin-left:${Math.min(depth,4)*12}px">
      <div class="mc-top">
        ${hasKids?`<button class="caret" data-toggle="${t.id}" ${ariaCaret(isExp,t.name)}>${isExp?caretDown():caretRight()}</button>`:""}
        <span class="mc-name">${t.isMilestone?'<span style="color:var(--milestone)">◆</span> ':""}${esc(t.name)}</span>
        ${lt?`<span class="sig late" title="Atrasada">⚠</span>`:""}
      </div>
      <div class="mc-meta">
        <span class="pill ${st.cls}">${st.label}</span>
        ${t.assignee?`<span class="mc-resp"><span class="av sm" style="background:${avColor(t.assignee)}">${esc(initials(t.assignee)).toUpperCase()}</span>${esc(t.assignee.split(" ")[0])}${resp.length>1?` +${resp.length-1}`:""}</span>`:""}
        ${pe?`<span class="${lt?"mc-late":""}">até ${fmtBR(pe)}</span>`:""}
      </div>
      ${showProgressBar?`<div class="mc-bar"><i style="width:${prog}%"></i></div>`:""}
      <div class="mc-det">
        ${dt("Início plan.",ps)}${dt("Fim plan.",pe)}${dt("Início exec.",as_)}${dt("Fim exec.",ae)}
        ${showProgressBar?"":`<div class="mc-f"><span>Progresso</span><b>${prog}%</b></div>`}
        <div class="mc-f wide"><span>Responsáveis</span><b>${resp.length?esc(resp.join(", ")):"—"}</b></div>
        ${preds.length?`<div class="mc-f wide"><span>Predecessoras</span><b>${esc(preds.join(", "))}</b></div>`:""}
        ${t.notes?`<div class="mc-f wide"><span>Observações</span><b class="mc-notes">${esc(t.notes)}</b></div>`:""}
      </div>
    </div>`;
    if(hasKids&&isExp) kids.forEach(k=>card(k,depth+1));
  };
  DATA.projects.forEach(p=>{
    if(filters.project && filters.project!==p.id) return;
    const roots=childrenOf(p.id,null);
    const anyVis=DATA.tasks.some(t=>t.projectId===p.id&&vis.has(t.id));
    if(!anyVis && (filters.search||activeFilterCount())) return;
    const pct=roots.length?Math.round(roots.map(progressOf).reduce((a,b)=>a+b,0)/roots.length):0;
    const pst=statusObj(projStatus(p.id));
    const expP=expanded["p_"+p.id]!==false;
    html+=`<div class="mproj" data-mproj="${p.id}">
      ${roots.length?`<button class="caret" data-ptoggle="${p.id}" ${ariaCaret(expP,p.name)}>${expP?caretDown():caretRight()}</button>`:""}
      <span class="proj-dot" style="background:${p.color}"></span>
      <span class="mp-name">${esc(p.name)}</span>
      <span class="pill ${pst.cls}">${pst.label}</span>
      <span class="mp-pct">${pct}%</span>
    </div>`;
    if(expP) roots.forEach(r=>card(r,0));
  });
  if(!html) return filterBar(true)+emptyState("Nenhum resultado","Ajuste os filtros para ver atividades.");
  return filterBar(true)+expandBar("crono")+`<div class="mcards" aria-label="Cronograma de atividades">${html}</div>
    <p class="hint no-print" style="margin-top:10px">Toque numa atividade para ver os detalhes.</p>`;
}

/* ============================================================
   GERENCIAR NOMES (só perfil master)

   A lista de sugestões de nomes junta os nomes já guardados com todos os
   nomes em uso. Aqui o master pode:
   - REMOVER DAS SUGESTÕES: o nome deixa de ser oferecido em novos
     cadastros (continua onde já está em uso). Se alguém digitar o nome
     de novo num responsável/gestor, ele volta sozinho.
   - JUNTAR/RENOMEAR: troca o nome em todas as atividades (responsável e
     responsáveis adicionais), projetos (gestor e histórico), riscos,
     contatos da tela Responsabilidade e agendamentos de relatório, e
     tira a versão antiga das sugestões. Com servidor isso roda no
     servidor (apiRenomearNome), sobre os dados atuais da planilha. Serve para erros de digitação
     ("Joao" -> "João") e variações ("Ana" -> "Ana Lima").
============================================================ */
function podeGerenciarNomes(){ return souAdminSistema(); }
function usoDoNome(n){
  let tarefas=0, projetos=0, outros=0;
  DATA.tasks.forEach(t=>{ if(t.assignee===n || (t.coResponsaveis||[]).includes(n)) tarefas++; });
  DATA.projects.forEach(p=>{ if(p.owner===n) projetos++; });
  (DATA.risks||[]).forEach(r=>{ if(r.owner===n) outros++; });
  (DATA.responsibleContacts||[]).forEach(r=>{ if(r.name===n) outros++; });
  return {tarefas,projetos,outros,total:tarefas+projetos+outros};
}
function textoUso(u){
  if(!u.total) return "sem uso";
  const partes=[];
  if(u.tarefas) partes.push(`${u.tarefas} atividade${u.tarefas>1?"s":""}`);
  if(u.projetos) partes.push(`${u.projetos} projeto${u.projetos>1?"s":""}`);
  if(u.outros) partes.push(`${u.outros} outro${u.outros>1?"s":""}`);
  return "em uso: "+partes.join(", ");
}
function todosOsNomes(){
  return Array.from(new Set([...(DATA.people||[]),...(DATA.peopleHidden||[])])).sort((a,b)=>a.localeCompare(b,"pt-BR"));
}
let _nomesFiltro="", _nomesJuntando=null;
function openNamesModal(){
  if(blockIfReadOnly()) return;
  if(!podeGerenciarNomes()){ toast("Só a Administração do sistema pode gerenciar a lista de nomes",true); return; }
  _nomesJuntando=null;
  showModal("Gerenciar nomes",`
    <p class="hint" style="margin-top:-4px">Nomes oferecidos como sugestão nos campos de responsável e gestor. <b>Remover das sugestões</b> não apaga o nome de onde ele já está em uso. <b>Juntar</b> troca o nome em todos os lugares (útil para erros de digitação).</p>
    <div class="field" style="margin-bottom:10px"><input id="nm_busca" type="search" placeholder="Buscar nome…" value="${esc(_nomesFiltro)}"></div>
    <div id="nm_lista" class="nm-lista"></div>
    <datalist id="nm_todos"></datalist>`,
    `<button class="btn" id="nm_fechar">Fechar</button>`,true);
  $("#nm_fechar").onclick=closeModal;
  $("#nm_busca").oninput=e=>{ _nomesFiltro=e.target.value; desenharListaNomes(); };
  desenharListaNomes();
}
function desenharListaNomes(){
  const box=$("#nm_lista"); if(!box) return;
  const ocultos=new Set(DATA.peopleHidden||[]);
  const q=normTxt(_nomesFiltro||"");
  const nomes=todosOsNomes().filter(n=>!q||normTxt(n).includes(q));
  $("#nm_todos").innerHTML=nomesSugeridos().map(n=>`<option value="${esc(n)}">`).join("");
  box.innerHTML=nomes.map((n,i)=>{
    const u=usoDoNome(n), oculto=ocultos.has(n), juntando=_nomesJuntando===n;
    return `<div class="nm-row ${oculto?"oculto":""}">
      <div class="nm-info"><span class="av sm" style="background:${avColor(n)}">${esc(initials(n)).toUpperCase()}</span>
        <div><div class="nm-nome">${esc(n)} ${oculto?`<span class="pill st-nao">fora das sugestões</span>`:""}</div><div class="hint" style="margin:0">${textoUso(u)}</div></div></div>
      <div class="nm-acoes">
        ${oculto?`<button class="btn sm" data-nmmostrar="${i}">Voltar às sugestões</button>`:`<button class="btn sm" data-nmocultar="${i}">Remover das sugestões</button>`}
        <button class="btn sm" data-nmjuntar="${i}">Juntar…</button>
      </div>
      ${juntando?`<div class="nm-juntar"><span>Trocar <b>${esc(n)}</b> por</span><input id="nm_para" list="nm_todos" placeholder="Nome correto"><button class="btn primary sm" id="nm_confirmar">Juntar</button><button class="btn sm" id="nm_cancelar">Cancelar</button></div>`:""}
    </div>`;
  }).join("") || `<p class="hint">Nenhum nome encontrado.</p>`;
  const nomeDe=el=>nomes[Number(el.dataset.nmocultar??el.dataset.nmmostrar??el.dataset.nmjuntar)];
  $$("[data-nmocultar]").forEach(el=>el.onclick=async()=>{
    const n=nomeDe(el); DATA.peopleHidden=Array.from(new Set([...(DATA.peopleHidden||[]),n]));
    await persist(); desenharListaNomes(); toast(`"${n}" removido das sugestões`);
  });
  $$("[data-nmmostrar]").forEach(el=>el.onclick=async()=>{
    const n=nomeDe(el); DATA.peopleHidden=(DATA.peopleHidden||[]).filter(x=>x!==n);
    await persist(); desenharListaNomes(); toast(`"${n}" voltou às sugestões`);
  });
  $$("[data-nmjuntar]").forEach(el=>el.onclick=()=>{ _nomesJuntando=nomeDe(el); desenharListaNomes(); setTimeout(()=>{const i=$("#nm_para"); if(i) i.focus();},30); });
  const canc=$("#nm_cancelar"); if(canc) canc.onclick=()=>{ _nomesJuntando=null; desenharListaNomes(); };
  const conf=$("#nm_confirmar"); if(conf) conf.onclick=async()=>{
    const de=_nomesJuntando, para=($("#nm_para").value||"").trim();
    if(!para){ $("#nm_para").focus(); return; }
    if(para===de){ toast("Escolha um nome diferente",true); return; }
    const u=usoDoNome(de);
    if(!confirm(`Trocar "${de}" por "${para}" em todos os lugares (${u.total} registro${u.total===1?"":"s"})?\n\n"${de}" sai das sugestões.`)) return;
    _nomesJuntando=null;
    if(MODE==="servidor"){
      // com servidor a troca é feita no servidor, sobre os dados atuais da
      // planilha e dentro da trava de gravação -- não desfaz edições recentes
      if(dirty || salvamentosEmCurso>0) await persist(); // nada pendente se perde na recarga
      try{ await servidorCall("apiRenomearNome",de,para); }
      catch(e){ toast("Não foi possível juntar os nomes: "+((e&&e.message)||"erro"),true); return; }
      if(!(await loadData(false))) return; // aviso de erro já mostrado
    }else{
      juntarNomes(de,para);
      await persist();
    }
    render(); desenharListaNomes(); toast(`"${de}" agora é "${para}"`);
  };
}
function juntarNomes(de,para){
  const troca=x=>x===de?para:x;
  DATA.tasks.forEach(t=>{
    if(t.assignee===de) t.assignee=para;
    if((t.coResponsaveis||[]).includes(de)) t.coResponsaveis=Array.from(new Set(t.coResponsaveis.map(troca))).filter(n=>n!==t.assignee);
  });
  DATA.projects.forEach(p=>{
    if(p.owner===de) p.owner=para;
    (p.ownerHistory||[]).forEach(h=>{ if(h.name===de) h.name=para; });
  });
  (DATA.risks||[]).forEach(r=>{ if(r.owner===de) r.owner=para; });
  (DATA.responsibleContacts||[]).forEach(r=>{ if(r.name===de) r.name=para; });
  (DATA.reportSchedules||[]).forEach(s=>{ if((s.responsibleNames||[]).includes(de)) s.responsibleNames=Array.from(new Set(s.responsibleNames.map(troca))); });
  DATA.people=(DATA.people||[]).filter(n=>n!==de);
  if(!DATA.people.includes(para)) DATA.people.push(para);
  DATA.peopleHidden=Array.from(new Set([...(DATA.peopleHidden||[]),de])).filter(n=>n!==para);
}
/* ============================================================
   TELA DE ACESSO
   Aparece no lugar do app quando:
   - ninguém entrou ainda (login: Google, link por e-mail, e-mail e senha);
   - a pessoa entrou com e-mail e senha e ainda não confirmou o e-mail;
   - a pessoa entrou, mas não tem cadastro (pede acesso à Administração);
   - o config.js aponta para o Firebase, mas o SDK não carregou.
   Nada do app é carregado nesses casos -- e as regras do Firestore
   recusam qualquer leitura de quem não está cadastrado.
============================================================ */
function aplicarIdentidade(who){

const CHAVE_EMAIL_LINK="gestao-projetos:emailLink";

    "auth/invalid-action-code":"Este link já foi usado ou expirou. Peça um novo.",
    "auth/expired-action-code":"Este link expirou. Peça um novo."
  };
  return m[c] || ("Não foi possível concluir"+(c?" ("+c+")":"")+".");
}

  };
  const campo=document.getElementById("acEmail");
  try{ const salvo=localStorage.getItem(CHAVE_EMAIL_LINK); if(salvo) campo.value=salvo; }catch(e){}
}

/* ============================================================
   PERMISSÕES — papéis por grupo e por projeto

   Cada projeto pertence a UM grupo. A pessoa tem um papel no grupo (vale
   para todos os projetos dele) e pode ter papéis extras em projetos
   avulsos (exceções). Vale sempre o MAIOR papel. A "Administração do
   sistema" pode tudo.

   Isto aqui só decide o que a TELA oferece. Quem garante de verdade é o
   servidor: as regras do Firestore (firestore.rules) aplicam a mesma
   tabela -- tentar contornar a tela não adianta.

   No modo demonstração (sem servidor) tudo é permitido.
============================================================ */
const PAPEIS=[
  {id:"admin_grupo",  nome:"Administrador do grupo",  nivel:6, descricao:"Gerencia as pessoas do grupo e tudo dos projetos do grupo."},
  {id:"escritorio",   nome:"Escritório de Projetos",  nivel:5, descricao:"Cria e exclui projetos e portfólios, define a linha de base, importa projetos."},
  {id:"gestor",       nome:"Gestor de projeto",       nivel:4, descricao:"Edita tudo do projeto (TAP, EAP, cronograma, riscos, custos, stakeholders) e exporta."},
  {id:"equipe",       nome:"Equipe de projeto",       nivel:3, descricao:"Edita o cronograma (atividades, datas, status); vê o resto."},
  {id:"patrocinador", nome:"Patrocinador",            nivel:2, descricao:"Vê tudo, exporta e recebe resumos periódicos."},
  {id:"leitura",      nome:"Somente leitura",         nivel:1, descricao:"Vê tudo, sem editar nem exportar."},
  {id:"convidado",    nome:"Convidado externo",       nivel:0, descricao:"Vê só os projetos em que foi incluído, sem os custos. Só por projeto."}
];
const NIVEL_PAPEL=Object.fromEntries(PAPEIS.map(p=>[p.id,p.nivel]));
function nivelDoPapel(p){ return p==="admin_sistema" ? 99 : (NIVEL_PAPEL[p]!==undefined ? NIVEL_PAPEL[p] : -1); }
function nomeDoPapel(p){ if(p==="admin_sistema") return "Administração do sistema"; const x=PAPEIS.find(y=>y.id===p); return x?x.nome:"—"; }
function papelMaior(a,b){ return nivelDoPapel(a)>=nivelDoPapel(b) ? (a||b) : b; }
// seção do Firestore editada a partir de cada aba do projeto
const SECAO_DA_ABA={tap:"cabecalho",eap:"eap",crono:"cronograma",gantt:"cronograma",riscos:"riscos",custos:"custos",stakeholders:"stakeholders",resp:"responsabilidade",baseline:"linhaBase"};
// nível mínimo para EDITAR cada seção (o mesmo do firestore.rules)
const NIVEL_EDITAR_SECAO={cabecalho:4,cronograma:3,eap:4,riscos:4,custos:4,stakeholders:4,responsabilidade:4,linhaBase:5};

function comPermissoes(){ return MODE==="servidor" && !!DATA && !!DATA.acessoProjetos; }
function souAdminSistema(){ return !comPermissoes() || !!souAdminMaster; }
function meuPapelNoProjeto(pid){
  if(!comPermissoes() || souAdminMaster) return "admin_sistema";
  const a=DATA.acessoProjetos[pid]; if(!a) return "";
  return (a.papeis||{})[String(myEmail||"").toLowerCase()]||"";
}
function meuPapelNoGrupo(gid){
  if(!comPermissoes() || souAdminMaster) return "admin_sistema";
  const g=(DATA.grupos||[]).find(x=>x.id===gid); if(!g) return "";
  return (g.membros||{})[String(myEmail||"").toLowerCase()]||"";
}
// grupos em que posso criar projetos/portfólios (Escritório de Projetos ou acima)
function gruposOndePossoCriar(){
  const todos=DATA.grupos||[];
  if(!comPermissoes()) return todos;
  return todos.filter(g=>nivelDoPapel(meuPapelNoGrupo(g.id))>=5);
}
function gruposQueAdministro(){
  const todos=DATA.grupos||[];
  if(!comPermissoes()) return todos;
  return todos.filter(g=>nivelDoPapel(meuPapelNoGrupo(g.id))>=6);
}
function grupoPadraoParaNovoProjeto(){
  const g=gruposOndePossoCriar(); return g.length?g[0].id:"";
}

/* Pergunta central: "posso fazer <acao> neste projeto?"
   acoes: ver · editar (com seção) · verCustos · exportar · excluirProjeto ·
          linhaDeBase · importar · gerenciarAcesso                             */
function pode(acao,pid,secao){
  if(!comPermissoes()) return true;
  const papel=meuPapelNoProjeto(pid), n=nivelDoPapel(papel);
  switch(acao){
    case "ver": return n>=0;
    case "editar": return n>=(NIVEL_EDITAR_SECAO[secao||"cabecalho"]||4);
    case "verCustos": return n>=1;                       // todos, menos o Convidado externo
    case "exportar": return n>=4 || papel==="patrocinador";
    case "excluirProjeto": case "linhaDeBase": case "importar": return n>=5;
    // acesso (exceções): quem administra o GRUPO do projeto
    case "gerenciarAcesso": { const a=DATA.acessoProjetos[pid]; return !!a && nivelDoPapel(meuPapelNoGrupo(a.grupoId))>=6; }
    default: return false;
  }
}
function podeCriarProjeto(){ return !comPermissoes() || souAdminMaster || gruposOndePossoCriar().length>0; }
function podeImportarAlgum(){ return podeCriarProjeto(); }
function podeEditarPortfolio(pf){
  if(!comPermissoes() || souAdminMaster) return true;
  if(!pf) return gruposOndePossoCriar().length>0;
  return nivelDoPapel(meuPapelNoGrupo(pf.grupoId))>=5;
}
// sem servidor (demonstração) a "Administração" mostra só as Configurações deste navegador
function podeAdministrar(){ return !comPermissoes() || souAdminMaster || gruposQueAdministro().length>0 || podeVerPedidos(); }
// pedidos (exclusões, linha de base) chegam a quem pode atendê-los: Escritório de Projetos ou acima
function podeVerPedidos(){
  if(!comPermissoes()) return false;
  return souAdminMaster || gruposOndePossoCriar().length>0 || Object.keys(DATA.acessoProjetos||{}).some(pid=>nivelDoPapel(meuPapelNoProjeto(pid))>=5);
}

function podeEditarContexto(){
  if(!comPermissoes()) return true;

function souAutorizadoParaProjeto(projectId){ return pode("excluirProjeto",projectId); }
