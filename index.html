/* ============================================================
   ADMINISTRAÇÃO — pessoas, grupos, acesso por projeto e pedidos

   Quem usa:
   - Administração do sistema: tudo (pessoas, grupos, pedidos).
   - Administrador do grupo: as pessoas e papéis do(s) seu(s) grupo(s) e
     as exceções de acesso dos projetos desses grupos.

   Como funciona o acesso: cada projeto guarda, no próprio documento, o
   mapa "papeis" (e-mail -> papel efetivo = maior entre o papel no grupo e
   a exceção do projeto) e a lista "leitores" (quem pode ver). Quando o
   grupo muda, todos os projetos do grupo são regravados juntos, num lote.
   As regras do Firestore conferem tudo isso no servidor.
============================================================ */
function registrarOperacoesAdministracao(B){
  const db=B.db, est=B.estado, FV=B.firebase.firestore.FieldValue, U=B.util;
  const emailNorm=U.emailNorm;
  const ehAdmin=()=>!!est.adminSistema;
  const papelNoGrupo=gid=>{ const g=est.grupos.get(gid); return (g&&g.membros&&g.membros[est.email])||""; };
  const souAdminDoGrupo=gid=>ehAdmin() || papelNoGrupo(gid)==="admin_grupo";
  const PAPEIS_GRUPO=PAPEIS.filter(p=>p.id!=="convidado").map(p=>p.id);
  // exceções por projeto: qualquer papel, menos administrar (isso é do grupo)
  const PAPEIS_EXCECAO=PAPEIS.filter(p=>p.id!=="admin_grupo").map(p=>p.id);

  function acessoDoProjeto(membrosGrupo,excecoes){
    const papeis=Object.assign({},membrosGrupo||{});
    Object.keys(excecoes||{}).forEach(em=>{ papeis[em]=papelMaior(papeis[em],excecoes[em]); });
    return {papeis, leitores:Object.keys(papeis).sort()};
  }
  async function emLotes(ops){
    // ops: [ (lote)=>void ]; o Firestore aceita até 500 operações por lote
    for(let i=0;i<ops.length;i+=400){
      const b=db.batch(); ops.slice(i,i+400).forEach(f=>f(b)); await b.commit();
    }
  }
  async function garantirUsuarios(emails,gid){
    const novos=[];
    for(const em of emails){
      const s=await db.doc("usuarios/"+em).get().catch(()=>null);
      if(s && s.exists) continue;
      novos.push(b=>b.set(db.doc("usuarios/"+em),{email:em, nome:"", ativo:true, criadoPorGrupo:gid||"", criadoPor:est.email, criadoEm:FV.serverTimestamp()}));
    }
    return novos;
  }
  function validarMembros(membros,permitidos){
    const limpo={};
    Object.keys(membros||{}).forEach(em=>{
      const e=emailNorm(em), p=membros[em];
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) throw new Error("E-mail inválido: "+em);
      if(!permitidos.includes(p)) throw new Error("Papel inválido para "+em+": "+p);
      limpo[e]=p;
    });
    return limpo;
  }
  async function enfileirarEmail(msg){
    const para=(msg.para||[]).map(emailNorm).filter(Boolean);
    if(!para.length) return null;
    const ref=db.collection("fila").doc();
    await ref.set({ status:"pendente", tipo:msg.tipo||"aviso", para:para.slice(0,50), assunto:String(msg.assunto||"").slice(0,300),
      html:String(msg.html||""), anexoHtml:String(msg.anexoHtml||""), nomeAnexo:String(msg.nomeAnexo||""),
      criadoPor:est.email, criadoEm:FV.serverTimestamp(), criadoEmMs:Date.now() });
    return ref.id;
  }
  function htmlAviso(titulo,linhas,link){
    return `<div style="font-family:Arial,sans-serif;max-width:560px;margin:0 auto">
      <div style="background:#2A1840;color:#fff;padding:14px 18px;border-radius:8px 8px 0 0;font-size:12px;letter-spacing:1px;text-transform:uppercase">${esc(APP_CONFIG.nomeApp)}</div>
      <div style="border:1px solid #E3E0EA;border-top:none;padding:18px;border-radius:0 0 8px 8px">
        <h2 style="font-size:17px;margin:0 0 10px">${esc(titulo)}</h2>
        ${linhas.map(l=>`<p style="font-size:13px;color:#333;line-height:1.5;margin:6px 0">${l}</p>`).join("")}
        ${link?`<a href="${esc(link)}" style="display:inline-block;margin-top:10px;background:#5E2B8C;color:#fff;text-decoration:none;padding:9px 15px;border-radius:6px;font-size:13px;font-weight:600">Abrir na ferramenta</a>`:""}
      </div></div>`;
  }

  /* ---------------- grupos ---------------- */
  async function salvarGrupo(gid,dados){
    if(!souAdminDoGrupo(gid)) throw new Error("Só a Administração ou o Administrador do grupo altera o grupo.");
    const atual=est.grupos.get(gid); if(!atual) throw new Error("Grupo não encontrado.");
    const membros=validarMembros(dados.membros, PAPEIS_GRUPO);
    if(!ehAdmin() && membros[est.email]!=="admin_grupo") throw new Error("Você não pode tirar a si mesmo da administração do grupo (peça à Administração do sistema).");
    const nome=String(dados.nome||atual.nome||"").trim()||atual.nome;
    const ops=await garantirUsuarios(Object.keys(membros),gid);
    ops.push(b=>b.set(db.doc("grupos/"+gid),{nome, membros, membrosEmails:Object.keys(membros).sort(), atualizadoPor:est.email, atualizadoEm:FV.serverTimestamp()}));
    est.headers.forEach((h,pid)=>{
      if(h.grupoId!==gid) return;
      const a=acessoDoProjeto(membros,h.excecoes);
      ops.push(b=>b.update(db.doc("projetos/"+pid),{papeis:a.papeis, leitores:a.leitores, atualizadoPor:est.email}));
    });
    await emLotes(ops);
    est.grupos.set(gid,Object.assign({},atual,{nome,membros,membrosEmails:Object.keys(membros)}));
    return JSON.stringify({ok:true});
  }
  async function criarGrupo(nome){
    if(!ehAdmin()) throw new Error("Só a Administração do sistema cria grupos.");
    nome=String(nome||"").trim(); if(!nome) throw new Error("Informe o nome do grupo.");
    const ref=db.collection("grupos").doc();
    await ref.set({nome, membros:{}, membrosEmails:[], criadoPor:est.email, criadoEm:FV.serverTimestamp()});
    return JSON.stringify({ok:true, id:ref.id});
  }
  async function excluirGrupo(gid){
    if(!ehAdmin()) throw new Error("Só a Administração do sistema exclui grupos.");
    const temProjetos=Array.from(est.headers.values()).some(h=>h.grupoId===gid);
    if(temProjetos) throw new Error("Este grupo ainda tem projetos. Mova-os para outro grupo antes de excluir.");
    await db.doc("grupos/"+gid).delete();
    return JSON.stringify({ok:true});
  }

  /* ---------------- acesso de um projeto (exceções) ---------------- */
  async function atualizarAcessoProjeto(pid,excecoes){
    const h=est.headers.get(pid); if(!h) throw new Error("Projeto não encontrado.");
    if(!souAdminDoGrupo(h.grupoId)) throw new Error("Só a Administração ou o Administrador do grupo altera o acesso.");
    const exc=validarMembros(excecoes, PAPEIS_EXCECAO);
    const g=est.grupos.get(h.grupoId);
    const a=acessoDoProjeto((g&&g.membros)||{},exc);
    const ops=await garantirUsuarios(Object.keys(exc),h.grupoId);
    ops.push(b=>b.update(db.doc("projetos/"+pid),{excecoes:exc, papeis:a.papeis, leitores:a.leitores, atualizadoPor:est.email}));
    await emLotes(ops);
    return JSON.stringify({ok:true});
  }
  async function moverProjetoGrupo(pid,gid){
    if(!ehAdmin()) throw new Error("Só a Administração do sistema muda o grupo de um projeto.");
    const h=est.headers.get(pid), g=est.grupos.get(gid);
    if(!h||!g) throw new Error("Projeto ou grupo não encontrado.");
    const a=acessoDoProjeto(g.membros,h.excecoes);
    await db.doc("projetos/"+pid).update({grupoId:gid, papeis:a.papeis, leitores:a.leitores, atualizadoPor:est.email});
    return JSON.stringify({ok:true});
  }

  /* ---------------- pessoas (Administração do sistema) ---------------- */
  async function listarUsuarios(){
    if(!ehAdmin()) throw new Error("Só a Administração do sistema vê a lista de pessoas.");
    const qs=await db.collection("usuarios").get();
    return JSON.stringify({usuarios:qs.docs.map(d=>Object.assign({email:d.id},d.data(),{criadoEm:null,atualizadoEm:null})), admins:est.admins.slice(), adminInicial:emailNorm(APP_CONFIG.adminInicial||"")});
  }
  async function salvarUsuario(u){
    if(!ehAdmin()) throw new Error("Só a Administração do sistema cadastra pessoas.");
    const email=emailNorm(u.email);
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error("E-mail inválido.");
    const ativo=u.ativo!==false;
    const ops=[b=>b.set(db.doc("usuarios/"+email),{email, nome:String(u.nome||"").trim(), ativo, atualizadoPor:est.email, atualizadoEm:FV.serverTimestamp()},{merge:true})];
    if(u.adminSistema===true) ops.push(b=>b.set(db.doc("config/admins"),{emails:FV.arrayUnion(email)},{merge:true}));
    if(u.adminSistema===false){
      if(email===est.email) throw new Error("Você não pode tirar a sua própria administração (peça a outra pessoa da Administração).");
      ops.push(b=>b.set(db.doc("config/admins"),{emails:FV.arrayRemove(email)},{merge:true}));
    }
    if(!ativo){
      if(email===est.email) throw new Error("Você não pode desativar a si mesmo.");
      // desativar: deixa de ser da Administração, sai de todos os grupos e exceções (e, por isso, de todos os projetos)
      if(u.adminSistema!==false) ops.push(b=>b.set(db.doc("config/admins"),{emails:FV.arrayRemove(email)},{merge:true}));
      const gruposMud=new Map();
      est.grupos.forEach((g,gid)=>{ if((g.membros||{})[email]){ const m=Object.assign({},g.membros); delete m[email]; gruposMud.set(gid,m); ops.push(b=>b.update(db.doc("grupos/"+gid),{membros:m, membrosEmails:Object.keys(m).sort()})); } });
      est.headers.forEach((h,pid)=>{
        const exc=Object.assign({},h.excecoes||{}); const tinha=!!exc[email]; delete exc[email];
        const membros=gruposMud.get(h.grupoId) || ((est.grupos.get(h.grupoId)||{}).membros) || {};
        if(tinha || gruposMud.has(h.grupoId)){ const a=acessoDoProjeto(membros,exc); ops.push(b=>b.update(db.doc("projetos/"+pid),{excecoes:exc, papeis:a.papeis, leitores:a.leitores})); }
      });
    }
    await emLotes(ops);
    return JSON.stringify({ok:true});
  }

  /* ---------------- pedidos ---------------- */
  async function listarPedidos(){
    let docs=[];
    if(ehAdmin()){ const qs=await db.collection("pedidos").where("status","==","aberto").get(); docs=qs.docs; }
    else { const qs=await db.collection("pedidos").where("destinatarios","array-contains",est.email).get(); docs=qs.docs.filter(d=>d.data().status==="aberto"); }
    const lista=docs.map(d=>{ const x=d.data(); return {id:d.id, tipo:x.tipo, solicitante:x.solicitante, solicitanteNome:x.solicitanteNome||"", mensagem:x.mensagem||"", justificativa:x.justificativa||"", projetoId:x.projetoId||"", portfolioId:x.portfolioId||"", acao:x.acao||"", criadoEmIso:x.criadoEmIso||""}; });
    lista.sort((a,b)=>String(b.criadoEmIso).localeCompare(String(a.criadoEmIso)));
    return JSON.stringify({pedidos:lista});
  }
  async function responderPedido(id,status,resposta){
    if(!["atendido","recusado"].includes(status)) throw new Error("Situação inválida.");
    const ref=db.doc("pedidos/"+id); const s=await ref.get(); if(!s.exists) throw new Error("Pedido não encontrado.");
    const p=s.data();
    if(p.status!=="aberto") throw new Error("Este pedido já foi respondido.");
    await ref.update({status, resposta:String(resposta||"").slice(0,1000), atendidoPor:est.email, atendidoEm:FV.serverTimestamp()});
    const textos={acesso:"seu pedido de acesso", exclusao_projeto:"seu pedido de exclusão de projeto", exclusao_portfolio:"seu pedido de exclusão de portfólio", linha_base:"seu pedido sobre a linha de base"};
    await enfileirarEmail({ tipo:"resposta_pedido", para:[p.solicitante],
      assunto:(status==="atendido"?"Pedido atendido":"Pedido recusado")+" — "+APP_CONFIG.nomeApp,
      html:htmlAviso(status==="atendido"?"Pedido atendido":"Pedido recusado",[`A Administração ${status==="atendido"?"atendeu":"recusou"} ${textos[p.tipo]||"seu pedido"}.`, resposta?`Resposta: ${esc(resposta)}`:""].filter(Boolean), linkDoApp()) }).catch(()=>{});
    return JSON.stringify({ok:true});
  }
  function destinatariosDoProjeto(pid){
    const h=est.headers.get(pid)||{};
    const doEscritorio=Object.keys(h.papeis||{}).filter(em=>nivelDoPapel(h.papeis[em])>=5);
    return Array.from(new Set(doEscritorio.concat(est.admins||[])));
  }
  async function criarPedido(dados,destinatarios,assunto,linhas){
    const ref=db.collection("pedidos").doc();
    destinatarios=destinatarios.slice(0,20);
    await ref.set(Object.assign({ status:"aberto", solicitante:est.email, solicitanteNome:String(est.nome||"").slice(0,200), destinatarios, mensagem:"",
      criadoEm:FV.serverTimestamp(), criadoEmIso:new Date().toISOString() }, dados));
    await enfileirarEmail({tipo:"pedido", para:destinatarios, assunto, html:htmlAviso(assunto,linhas,linkDoApp())}).catch(()=>{});
    return {ok:true, enviadoPara:destinatarios.join(", ")};
  }
  async function solicitarAcaoProjeto(pid,tipo,acao,justificativa){
    const h=est.headers.get(pid); if(!h) throw new Error("Projeto não encontrado.");
    const dest=destinatariosDoProjeto(pid);
    return criarPedido({tipo, acao, projetoId:pid, grupoId:h.grupoId||"", justificativa:String(justificativa||"").slice(0,1000)}, dest,
      `Pedido: ${acao} — ${h.name||""}`, [`<strong>${esc(est.nome||est.email)}</strong> (${esc(est.email)}) pediu: ${esc(acao)}.`, `Projeto: ${esc(h.name||"")}`, `Justificativa: ${esc(justificativa||"(não informada)")}`]);
  }
  async function solicitarExclusaoPortfolio(id,justificativa){
    const pf=est.portfolios.get(id); if(!pf) throw new Error("Portfólio não encontrado.");
    const g=est.grupos.get(pf.grupoId);
    const dest=Array.from(new Set(Object.keys((g&&g.membros)||{}).filter(em=>nivelDoPapel(g.membros[em])>=5).concat(est.admins||[])));
    return criarPedido({tipo:"exclusao_portfolio", acao:"excluir o portfólio", portfolioId:id, grupoId:pf.grupoId||"", justificativa:String(justificativa||"").slice(0,1000)}, dest,
      `Pedido: excluir o portfólio — ${pf.name||""}`, [`<strong>${esc(est.nome||est.email)}</strong> (${esc(est.email)}) pediu a exclusão do portfólio ${esc(pf.name||"")}.`, `Justificativa: ${esc(justificativa||"(não informada)")}`]);
  }

  /* ---------------- pessoas e acesso em arquivo (só a Administração) ---------------- */
  async function exportarPessoas(){
    if(!ehAdmin()) throw new Error("Só a Administração do sistema exporta pessoas e acesso.");
    const qs=await db.collection("usuarios").get();
    const usuarios=qs.docs.map(d=>{ const x=d.data(); return {email:d.id, nome:x.nome||"", ativo:x.ativo===true, criadoPorGrupo:x.criadoPorGrupo||""}; });
    const grupos=Array.from(est.grupos.values()).map(g=>({id:g.id, nome:g.nome||"", membros:Object.assign({},g.membros||{})}));
    const excecoesPorProjeto={}, grupoDoProjeto={};
    est.headers.forEach((h,pid)=>{ grupoDoProjeto[pid]=h.grupoId||""; if(h.excecoes && Object.keys(h.excecoes).length) excecoesPorProjeto[pid]=Object.assign({},h.excecoes); });
    return JSON.stringify({usuarios, grupos, admins:(est.admins||[]).slice(), excecoesPorProjeto, grupoDoProjeto});
  }
  async function importarPessoas(arq){
    if(!ehAdmin()) throw new Error("Só a Administração do sistema importa pessoas e acesso.");
    if(!arq || arq.tipo!=="gestao-projetos/pessoas") throw new Error("Arquivo de pessoas inválido.");
    // só SOMA: ninguém é desativado nem tirado de grupo por um arquivo (isso se faz na tela, com as regras de sempre)
    const emailOk=e=>/^[^@\s\/]+@[^@\s\/]+\.[^@\s\/]+$/.test(e) && e.length<=200;
    const ops=[]; let nU=0, nG=0, nP=0;
    const existentes=new Set((await db.collection("usuarios").get()).docs.map(d=>d.id));
    (arq.usuarios||[]).forEach(u=>{
      const email=emailNorm(u.email); if(!emailOk(email)) return;
      const dados={email, nome:String(u.nome||"").slice(0,200), atualizadoPor:est.email, atualizadoEm:FV.serverTimestamp()};
      if(!existentes.has(email)) Object.assign(dados,{ativo:u.ativo===true, criadoPorGrupo:String(u.criadoPorGrupo||"")});
      else if(u.ativo===true) dados.ativo=true; // reativar, sim; desativar, não
      if(email===est.email) delete dados.ativo;
      ops.push(b=>b.set(db.doc("usuarios/"+email),dados,{merge:true}));
      nU++;
    });
    const membrosPorGrupo=new Map();
    (arq.grupos||[]).forEach(g=>{
      const id=String(g.id||"").trim(); if(!/^[A-Za-z0-9_-]{1,100}$/.test(id)) return;
      const doArquivo={}; Object.keys(g.membros||{}).forEach(em=>{ if(emailOk(emailNorm(em))) doArquivo[em]=g.membros[em]; });
      // membros atuais continuam; os do arquivo entram (com o papel do arquivo)
      const membros=Object.assign({}, ((est.grupos.get(id)||{}).membros)||{}, validarMembros(doArquivo, PAPEIS_GRUPO));
      membrosPorGrupo.set(id,membros);
      ops.push(b=>b.set(db.doc("grupos/"+id),{nome:String(g.nome||id).slice(0,200), membros, membrosEmails:Object.keys(membros).sort(), atualizadoPor:est.email, atualizadoEm:FV.serverTimestamp()}));
      nG++;
    });
    const admins=(arq.admins||[]).map(emailNorm).filter(e=>/@/.test(e));
    if(admins.length) ops.push(b=>b.set(db.doc("config/admins"),{emails:FV.arrayUnion(...admins)},{merge:true}));
    // acesso de cada projeto que existe aqui: grupo (do arquivo, se veio) + exceções (do arquivo, se vieram)
    est.headers.forEach((h,pid)=>{
      const membros=membrosPorGrupo.get(h.grupoId) || ((est.grupos.get(h.grupoId)||{}).membros) || {};
      const exc=(arq.excecoesPorProjeto && arq.excecoesPorProjeto[pid]) ? Object.assign({}, h.excecoes||{}, validarMembros(arq.excecoesPorProjeto[pid], PAPEIS_EXCECAO)) : (h.excecoes||{});
      const a=acessoDoProjeto(membros,exc);
      ops.push(b=>b.update(db.doc("projetos/"+pid),{excecoes:exc, papeis:a.papeis, leitores:a.leitores, atualizadoPor:est.email}));
      nP++;
    });
    await emLotes(ops);
    return JSON.stringify({ok:true, usuarios:nU, grupos:nG, projetos:nP});
  }

  /* ---------------- e-mails pela fila (enviados pela tarefa agendada) ---------------- */
  async function enviarRelatorioPorEmail(destJson,assunto,corpoHtml,anexoHtml,nomeAnexo){
    const dest=(typeof destJson==="string"?JSON.parse(destJson):destJson)||[];
    const para=dest.map(d=>d&&d.email).filter(Boolean);
    if(!para.length) throw new Error("Nenhum destinatário com e-mail válido.");
    await enfileirarEmail({tipo:"relatorio", para, assunto, html:corpoHtml, anexoHtml:anexoHtml||"", nomeAnexo:nomeAnexo||""});
    return {ok:true, enviadoPara:para, anexado:!!anexoHtml, naFila:true};
  }

  Object.assign(B.extensoes,{
    apiSalvarGrupo:salvarGrupo, apiCriarGrupo:criarGrupo, apiExcluirGrupo:excluirGrupo,

    apiListarUsuarios:listarUsuarios, apiSalvarUsuario:salvarUsuario,
    apiListarPedidos:listarPedidos, apiResponderPedido:responderPedido,
    solicitarExclusaoProjeto:(pid,j)=>solicitarAcaoProjeto(pid,"exclusao_projeto","excluir o projeto",j),

    solicitarExclusaoPortfolio, enviarRelatorioPorEmail,

  });
  B.util.enfileirarEmail=enfileirarEmail; B.util.htmlAviso=htmlAviso; B.util.acessoDoProjeto=acessoDoProjeto;
}

let abaAdmin="grupos";
async function openAdministracaoModal(aba){
  if(!podeAdministrar()){ toast("Só a Administração (ou o Administrador de um grupo) acessa esta área",true); return; }
  // sem servidor (demonstração): só as Configurações, guardadas neste navegador
  const comServidor=comPermissoes();
  if(typeof rascunhoConfig!=="undefined") rascunhoConfig=null;
  const podeConfig=!comServidor || souAdminMaster;
  const abas=comServidor ? [
    ...(souAdminMaster?[{id:"pessoas",label:"Pessoas"}]:[]),
    ...(souAdminMaster||gruposQueAdministro().length?[{id:"grupos",label:"Grupos e papéis"}]:[]),
    ...(podeVerPedidos()?[{id:"pedidos",label:"Pedidos"}]:[]),
    ...(podeConfig?[{id:"config",label:"Configurações"}]:[])
  ] : [{id:"config",label:"Configurações"}];
  abaAdmin = (aba && abas.some(a=>a.id===aba)) ? aba : abas[0].id;
  showModal("Administração",`<div class="view-toggle" id="admAbas" role="tablist">${abas.map(a=>`<button class="vtbtn ${a.id===abaAdmin?"on":""}" data-admaba="${a.id}" role="tab">${a.label}</button>`).join("")}</div>
    <div id="admCorpo" style="min-height:240px"><p class="hint">Carregando…</p></div>`,`<button class="btn" id="adm_close">Fechar</button>`,true);
  $("#adm_close").onclick=closeModal;
  $$("[data-admaba]").forEach(b=>b.onclick=()=>{ abaAdmin=b.dataset.admaba; $$("[data-admaba]").forEach(x=>x.classList.toggle("on",x===b)); renderAbaAdmin(); });
  renderAbaAdmin();
}
async function renderAbaAdmin(){
  const box=$("#admCorpo"); if(!box) return;
  box.innerHTML=`<p class="hint">Carregando…</p>`;
  try{
    if(abaAdmin==="pessoas") await renderAbaPessoas(box);
    else if(abaAdmin==="pedidos") await renderAbaPedidos(box);
    else if(abaAdmin==="config") await renderAbaConfiguracoes(box);
    else renderAbaGrupos(box);
  }catch(e){ box.innerHTML=`<div class="imp-box err">Não foi possível carregar: ${esc((e&&e.message)||String(e))}</div>`; }
}

  const membros=Object.assign({},g.membros||{});
  const desenhar=()=>{

/* ============================================================
   ADMINISTRAÇÃO › CONFIGURAÇÕES (modelo de conteúdo)

   Tela onde a Administração ajusta perspectivas e objetivos, as listas de
   opções e os campos da TAP (ver 02b-configuracoes.js). Também exporta e
   importa o modelo como arquivo .json e volta ao padrão de fábrica.

   Na demonstração, fica guardado neste navegador; com servidor, em
   config/geral -- e chega a todas as pessoas na hora (tempo real).
============================================================ */
function registrarOperacoesConfiguracoes(B){
  const db=B.db, est=B.estado, FV=B.firebase.firestore.FieldValue;
  async function salvarConfiguracoes(modelo){
    if(!est.adminSistema) throw new Error("Só a Administração do sistema altera as configurações.");
    const {modelo:limpo, erros}=validarModelo(modelo);
    if(erros.length) throw new Error(erros.join(" "));
    const escritaId=B.util.novoId(); est.minhasEscritas.add(escritaId);
    // set() inteiro do campo: o que saiu da configuração deixa de existir
    await db.doc("config/geral").set({configuracoes:limpo, escritaId, atualizadoPor:est.email, atualizadoEm:FV.serverTimestamp()},{merge:true});
    est.geral=Object.assign({},est.geral||{},{configuracoes:limpo}); est.versao++;
    return JSON.stringify({ok:true});
  }
  Object.assign(B.extensoes,{apiSalvarConfiguracoes:salvarConfiguracoes});
}
if(BACKEND && BACKEND.tipo==="firestore") registrarOperacoesConfiguracoes(BACKEND);

async function gravarConfiguracoes(modelo){
  const {modelo:limpo, erros}=validarModelo(modelo);
  if(erros.length){ toast(erros[0],true,true); return false; }
  if(MODE==="servidor"){
    try{ await servidorCall("apiSalvarConfiguracoes",limpo); }
    catch(e){ toast("Não foi possível salvar: "+((e&&e.message)||e),true,true); return false; }
    DATA.configuracoes=limpo;
  }else{
    try{ localStorage.setItem(CHAVE_CONFIG_LOCAL,JSON.stringify(limpo)); }
    catch(e){ toast("Não foi possível guardar neste navegador.",true); return false; }
  }
  aplicarConfiguracoes(limpo);
  return true;
}

let rascunhoConfig=null; // o que está sendo editado (só é aplicado ao salvar)

// perspectiva em texto: uma linha por objetivo geral; específicos começam com "-"
function objetivosParaTexto(objs){
  return (objs||[]).map(o=>[o.nome, ...(o.especificos||[]).map(e=>"  - "+e)].join("\n")).join("\n");
}
function textoParaObjetivos(txt){
  const out=[]; let atual=null;
  String(txt||"").split(/\r?\n/).forEach(l=>{
    const t=l.trim(); if(!t) return;
    if(/^[-•*]\s*/.test(t)){ if(atual) atual.especificos.push(t.replace(/^[-•*]\s*/,"")); return; }
    atual={nome:t, especificos:[]}; out.push(atual);
  });
  return out;
}
function lerTelaConfiguracoes(){
  const m={tipo:"gestao-projetos/modelo", versao:1, perspectivas:[], listas:{}, camposTap:{}};
  $$("[data-cfgpersp]").forEach(card=>{
    m.perspectivas.push({ nome:card.querySelector("[data-cfg='nome']").value, cor:card.querySelector("[data-cfg='cor']").value,
      objetivos:textoParaObjetivos(card.querySelector("[data-cfg='objetivos']").value) });
  });
  LISTAS_CONFIGURAVEIS.forEach(l=>{ const el=$(`[data-cfglista="${l.chave}"]`); if(el) m.listas[l.chave]=el.value.split(/\r?\n/); });
  CAMPOS_TAP.forEach(c=>{
    const r=$(`[data-cfgrotulo="${c.id}"]`), o=$(`[data-cfgoculto="${c.id}"]`);
    const rot=r?r.value.trim():"";
    const entrada={};
    if(rot && rot!==c.rotulo) entrada.rotulo=rot;
    if(o && o.checked) entrada.oculto=true;
    if(Object.keys(entrada).length) m.camposTap[c.id]=entrada;
  });
  return m;
}

/* ============================================================
   EXPORTAR E IMPORTAR (.json)

   Três tipos de arquivo:
   - Projeto  (gestao-projetos/projeto): um projeto com tudo -- cronograma,
     EAP, riscos, custos, stakeholders, responsáveis, envios programados,
     TAP, linha de base e histórico. Quem pode exportar o projeto
     (Gestor ou acima, Patrocinador) baixa; importar exige Escritório de
     Projetos (no projeto de destino ou no grupo, para criar).
   - Base inteira (gestao-projetos/base): todos os projetos, portfólios,
     listas e configurações. Só a Administração do sistema.
   - Pessoas e acesso (gestao-projetos/pessoas): cadastro, grupos e
     papéis, Administração e exceções por projeto. Arquivo SEPARADO, só a
     Administração do sistema (tem e-mails de todo mundo).

   Importar um projeto: como NOVO (ids novos), SUBSTITUINDO um projeto
   existente ou MESCLANDO nele. Importar a base: substituir tudo, mesclar
   ou comparar e escolher (restauração seletiva, 37-restauracao-seletiva.js).
   Antes de qualquer importação que mexe no que existe, o app baixa uma
   cópia do estado atual -- desfazer é importar essa cópia.

   Na demonstração tudo funciona igual, com os dados deste navegador.
============================================================ */
const TIPO_BASE="gestao-projetos/base", TIPO_PROJETO="gestao-projetos/projeto", TIPO_PESSOAS="gestao-projetos/pessoas";
// listas do app que pertencem a um projeto (todas têm projectId)
const LISTAS_DO_PROJETO=["tasks","risks","costs","stakeholders","reportSchedules","eapNodes","responsibleContacts","tapData","baselines","baselineHistory"];
const LIMITE_ARQUIVO_MB=50;

function cabecalhoArquivo(tipo){
  return { tipo, versao:1, app:(APP_CONFIG&&APP_CONFIG.nomeApp)||"Gestão de Projetos", organizacao:(APP_CONFIG&&APP_CONFIG.organizacao)||"",
    exportadoEm:new Date().toISOString(), exportadoPor:myEmail||me||"" };
}
function baixarJSON(obj,nome){
  const blob=new Blob([JSON.stringify(obj,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nome;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); },1000);
}
const nomeArquivoJSON=base=>`${reportFileBaseName(base,60)}_${todayISO()}.json`;
const copia=o=>JSON.parse(JSON.stringify(o));

/* ---------- montar ---------- */
function dadosDoProjeto(pid){
  const p=projOf(pid); if(!p) return null;
  const d={projects:[copia(p)]};
  LISTAS_DO_PROJETO.forEach(k=>{ d[k]=copia((DATA[k]||[]).filter(x=>x.projectId===pid)); });
  d.portfolios=copia(DATA.portfolios.filter(pf=>(p.portfolioIds||[]).includes(pf.id)));
  return d;
}
/* exportação e cópia de segurança só saem completas: parte que não carregou = nada exportado */
async function garantirCompleto(pids){
  const ok=await garantirSecoes(pids);
  const faltam=pids.filter(pid=>projOf(pid) && (!secoesCarregadas(pid) || ((DATA.secoesNegadas||{})[pid]||[]).length));
  if(ok===false || faltam.length) throw new Error("não consegui carregar todas as partes de "+(faltam.map(pid=>(projOf(pid)||{}).name||pid).join(", ")||"um projeto")+" — tente de novo");
}
async function montarArquivoProjeto(pid){
  await garantirCompleto([pid]);
  const d=dadosDoProjeto(pid); if(!d) throw new Error("Projeto não encontrado.");
  return Object.assign(cabecalhoArquivo(TIPO_PROJETO),{dados:d});

async function montarArquivoBase(){
  await garantirCompleto(DATA.projects.map(p=>p.id));
  const d={projects:copia(DATA.projects), portfolios:copia(DATA.portfolios||[])};
  LISTAS_DO_PROJETO.forEach(k=>{ d[k]=copia(DATA[k]||[]); });
  d.people=copia(DATA.people||[]); d.peopleHidden=copia(DATA.peopleHidden||[]); d.customTapYears=copia(DATA.customTapYears||[]);
  return Object.assign(cabecalhoArquivo(TIPO_BASE),{dados:d, configuracoes:configuracoesAtuais?modeloAtual():null});
}
async function baixarCopiaDeSeguranca(pids){
  // só os projetos afetados quando é um projeto; a base inteira nos demais casos
  if(pids && pids.length===1 && projOf(pids[0])){ const a=await montarArquivoProjeto(pids[0]); baixarJSON(a,"copia-antes-de-importar_"+nomeArquivoJSON(projOf(pids[0]).name)); return; }
  const a=await montarArquivoBase(); baixarJSON(a,"copia-antes-de-importar_"+nomeArquivoJSON("base"));
}

/* ---------- ler e conferir um arquivo ---------- */
function conferirArquivo(obj){
  if(!obj || typeof obj!=="object") throw new Error("O arquivo não é um .json do Gestão de Projetos.");
  if(obj.tipo===TIPO_PESSOAS){
    if(!Array.isArray(obj.usuarios) || !Array.isArray(obj.grupos)) throw new Error("Arquivo de pessoas incompleto.");
    return obj;
  }
  if(obj.tipo!==TIPO_BASE && obj.tipo!==TIPO_PROJETO){
    if(obj.tipo==="gestao-projetos/modelo") throw new Error("Este é um modelo de configurações — importe em Administração › Configurações.");
    throw new Error("O arquivo não é um .json do Gestão de Projetos.");
  }
  if(Number(obj.versao)>1) throw new Error("Arquivo de uma versão mais nova do app. Atualize o app antes de importar.");
  const d=obj.dados;
  if(!d || !Array.isArray(d.projects)) throw new Error("Arquivo sem a lista de projetos.");
  if(obj.tipo===TIPO_PROJETO && d.projects.length!==1) throw new Error("O arquivo de projeto deve ter exatamente um projeto.");
  ["portfolios",...LISTAS_DO_PROJETO].forEach(k=>{ if(d[k]===undefined) d[k]=[]; if(!Array.isArray(d[k])) throw new Error(`Lista "${k}" inválida no arquivo.`); });
  const idValido=id=>typeof id==="string" && ID_VALIDO.test(id) && !/^__.*__$/.test(id);
  [...d.projects, ...d.portfolios].forEach(x=>{ if(!x || typeof x!=="object" || !idValido(x.id)) throw new Error("Há registros sem identificador válido no arquivo."); });
  const ids=new Set(d.projects.map(p=>p.id));
  LISTAS_DO_PROJETO.forEach(k=>d[k].forEach(x=>{
    if(!x || typeof x!=="object" || Array.isArray(x)) throw new Error(`Registro inválido em "${k}".`);
    if(typeof x.projectId!=="string" || !ids.has(x.projectId)) throw new Error(`Há registros em "${k}" de um projeto que não está no arquivo.`);
    if(k!=="baselines" && !idValido(x.id)) throw new Error(`Há registros sem identificador válido em "${k}".`);
  }));
  // tipos: textos são texto e listas são listas (um valor estranho não pode quebrar a tela de ninguém)
  ["projects","portfolios",...LISTAS_DO_PROJETO].forEach(k=>{ d[k]=d[k].map(limparRegistro); });
  d.tapData.forEach(normalizarTAP);
  return obj;
}
const ID_VALIDO=/^[A-Za-z0-9_-]{1,128}$/;
const CAMPOS_TEXTO=new Set(["name","description","owner","assignee","notes","category","status","mitigation","organization","email","phone","strategicPerspective","color","link","reportType","frequency","lotacao"]);
const CAMPOS_LISTA=new Set(["predecessors","coResponsaveis","stakeholderIds","portfolioIds","temporalidade","recursosDemandados","extraContacts","responsibleNames","tasks","links","ownerHistory"]);
const CHAVES_PROIBIDAS=new Set(["__proto__","constructor","prototype"]);
function limparRegistro(v){
  if(Array.isArray(v)) return v.map(limparRegistro);
  if(v && typeof v==="object"){
    const o={};
    Object.keys(v).forEach(k=>{
      if(CHAVES_PROIBIDAS.has(k)) return;
      let x=limparRegistro(v[k]);
      if(CAMPOS_TEXTO.has(k) && x!=null && typeof x!=="string") x=String(typeof x==="object"?"":x);
      if(CAMPOS_LISTA.has(k) && x!=null && !Array.isArray(x)) x=[];
      o[k]=x;
    });
    return o;
  }
  return v;
}
async function lerArquivoJSON(arquivo){
  if(arquivo.size>LIMITE_ARQUIVO_MB*1024*1024) throw new Error(`Arquivo grande demais (limite de ${LIMITE_ARQUIVO_MB} MB).`);
  let obj; try{ obj=JSON.parse(await arquivo.text()); }catch(e){ throw new Error("O arquivo não é um .json válido."); }
  return conferirArquivo(obj);
}

/* ---------- ids novos (importar como projeto novo) ----------
   Troca TODOS os identificadores do projeto e dos seus registros e
   atualiza as referências entre eles (mãe, predecessoras, atividade
   vinculada, linha de base...). Portfólios mantêm o id. */
const CHAVES_REFERENCIA=new Set(["id","projectId","parentId","taskId"]);
const LISTAS_REFERENCIA=new Set(["predecessors","stakeholderIds"]);
function trocarIds(d){
  const mapa=new Map();
  const novo=id=>{ const k=String(id); if(!mapa.has(k)) mapa.set(k,uid()); return mapa.get(k); };
  d.projects.forEach(p=>novo(p.id));
  LISTAS_DO_PROJETO.forEach(k=>d[k].forEach(x=>{ if(x.id) novo(x.id); }));
  const trocar=v=>{
    if(Array.isArray(v)) return v.map(trocar);
    if(v && typeof v==="object"){
      const o={};
      Object.keys(v).forEach(k=>{
        const x=v[k];
        // referência a algo que não está no arquivo (ex.: predecessora já excluída) não vem junto
        if(CHAVES_REFERENCIA.has(k) && typeof x==="string" && x) o[k]=mapa.has(x)?mapa.get(x):(k==="parentId"||k==="taskId"?null:x);
        else if(LISTAS_REFERENCIA.has(k) && Array.isArray(x)) o[k]=x.filter(i=>typeof i!=="string"||mapa.has(i)).map(i=>typeof i==="string"?mapa.get(i):(i&&typeof i==="object"?trocar(i):i));
        else o[k]=trocar(x);
      });
      return o;
    }
    return v;
  };
  const out={projects:trocar(d.projects), portfolios:copia(d.portfolios||[])};
  LISTAS_DO_PROJETO.forEach(k=>{ out[k]=trocar(d[k]); });
  return out;
}

/* ---------- aplicar no DATA (o salvamento vem depois, pelo persist) ---------- */
function portfoliosDoArquivo(d,grupoId){
  // vínculo com portfólio: o que existe aqui (mesmo id ou mesmo nome) ou um novo, se a pessoa pode criar
  const troca=new Map();
  (d.portfolios||[]).forEach(pf=>{
    let alvo=DATA.portfolios.find(x=>x.id===pf.id) || DATA.portfolios.find(x=>normTxt(x.name)===normTxt(pf.name));
    if(!alvo && podeEditarPortfolio({grupoId:grupoId||""})){ alvo=Object.assign(copia(pf),{grupoId:grupoId||pf.grupoId||""}); if(DATA.portfolios.some(x=>x.id===alvo.id)) alvo.id=uid(); DATA.portfolios.push(alvo); }
    if(alvo) troca.set(pf.id,alvo.id);
  });
  return ids=>(ids||[]).map(id=>troca.get(id)||(DATA.portfolios.some(x=>x.id===id)?id:null)).filter(Boolean);
}
function importarProjetoComoNovo(arquivo,grupoId){
  const d=trocarIds(arquivo.dados);
  const p=d.projects[0];
  p.grupoId=grupoId||"";
  p.portfolioIds=portfoliosDoArquivo(arquivo.dados,grupoId)(arquivo.dados.projects[0].portfolioIds);
  if(DATA.projects.some(x=>normTxt(x.name)===normTxt(p.name))) p.name=p.name+" (importado)";
  DATA.projects.push(p);
  LISTAS_DO_PROJETO.forEach(k=>{ DATA[k]=(DATA[k]||[]).concat(d[k]); });
  return p.id;
}
/* substituir: o projeto de destino fica igual ao do arquivo (mantém o próprio id e grupo);
   mesclar: o que está no arquivo entra/atualiza, nada é apagado */
function importarProjetoNoExistente(arquivo,alvoId,modo){
  const alvo=projOf(alvoId); if(!alvo) throw new Error("Projeto de destino não encontrado.");
  const origem=arquivo.dados.projects[0];
  const mesmoProjeto=origem.id===alvoId;
  // ids: os do arquivo, se forem deste mesmo projeto; senão, ids novos (evita colidir com outro projeto)
  let d=arquivo.dados;
  if(!mesmoProjeto){
    d=trocarIds(arquivo.dados);
    LISTAS_DO_PROJETO.forEach(k=>d[k].forEach(x=>{ x.projectId=alvoId; }));
    d.projects[0].id=alvoId;
  }else d=copia(d);
  const pArq=d.projects[0];
  const vinculos=portfoliosDoArquivo(arquivo.dados,alvo.grupoId)(origem.portfolioIds);
  const manter={id:alvoId, grupoId:alvo.grupoId};
  if(modo==="substituir"){
    Object.keys(alvo).forEach(k=>{ if(!(k in manter)) delete alvo[k]; });
    Object.assign(alvo,copia(pArq),manter,{portfolioIds:vinculos});
    LISTAS_DO_PROJETO.forEach(k=>{
      // histórico de linha de base só acumula (o servidor não deixa apagar): soma o do arquivo
      if(k==="baselineHistory"){ const ja=new Set((DATA[k]||[]).filter(x=>x.projectId===alvoId).map(x=>x.id)); DATA[k]=(DATA[k]||[]).concat(d[k].filter(x=>!ja.has(x.id))); return; }
      DATA[k]=(DATA[k]||[]).filter(x=>x.projectId!==alvoId).concat(d[k]);
    });
  }else{
    Object.keys(pArq).forEach(k=>{ if(!(k in manter) && pArq[k]!=="" && pArq[k]!=null) alvo[k]=copia(pArq[k]); });
    alvo.portfolioIds=Array.from(new Set([...(alvo.portfolioIds||[]),...vinculos]));
    LISTAS_DO_PROJETO.forEach(k=>{
      if(k==="tapData"||k==="baselines"){ if(d[k].length){ DATA[k]=(DATA[k]||[]).filter(x=>x.projectId!==alvoId).concat(d[k]); } return; }
      const lista=DATA[k]||(DATA[k]=[]);
      const pos=new Map(); lista.forEach((y,i)=>{ if(y.projectId===alvoId) pos.set(String(y.id),i); });
      d[k].forEach(x=>{ const i=pos.get(String(x.id)); if(i!==undefined) lista[i]=x; else { pos.set(String(x.id),lista.length); lista.push(x); } });
    });
  }
  return alvoId;
}
function importarBase(arquivo,modo,grupoPadrao){
  const d=copia(arquivo.dados);
  const gruposValidos=new Set((DATA.grupos||[]).map(g=>g.id));
  const grupoDe=p=>{ const atual=projOf(p.id); if(atual) return atual.grupoId||""; return (!comPermissoes()||gruposValidos.has(p.grupoId)) ? (p.grupoId||"") : (grupoPadrao||""); };
  d.projects.forEach(p=>{ p.grupoId=grupoDe(p); });
  d.portfolios.forEach(pf=>{ const at=DATA.portfolios.find(x=>x.id===pf.id); pf.grupoId = at ? at.grupoId : ((!comPermissoes()||gruposValidos.has(pf.grupoId)) ? (pf.grupoId||"") : (grupoPadrao||"")); });
  const uniao=(a,b)=>Array.from(new Set([...(a||[]),...(b||[])]));
  if(modo==="substituir"){
    const hist=DATA.baselineHistory||[];
    DATA.projects=d.projects; DATA.portfolios=d.portfolios;
    LISTAS_DO_PROJETO.forEach(k=>{ DATA[k]=d[k]; });
    // histórico que o servidor guarda dos projetos que continuam: soma
    const ficam=new Set(d.projects.map(p=>p.id)), ja=new Set(DATA.baselineHistory.map(h=>h.id));
    DATA.baselineHistory=DATA.baselineHistory.concat(hist.filter(h=>ficam.has(h.projectId)&&!ja.has(h.id)));
  }else{
    // casa por id (e projeto, nos registros de projeto): o que mudou de projeto aqui não é puxado de volta
    const juntar=(k)=>{
      const lista=DATA[k]||(DATA[k]=[]), chave=x=>String(x.id)+"|"+(k==="projects"||k==="portfolios"?"":String(x.projectId));
      const pos=new Map(); lista.forEach((y,i)=>pos.set(chave(y),i));
      (d[k]||[]).forEach(x=>{ const i=pos.get(chave(x)); if(i!==undefined) lista[i]=x; else if(k!=="projects"&&k!=="portfolios"&&lista.some(y=>String(y.id)===String(x.id))) return; else { pos.set(chave(x),lista.length); lista.push(x); } });
    };
    juntar("projects"); juntar("portfolios");
    LISTAS_DO_PROJETO.forEach(k=>{
      if(k==="baselines"||k==="tapData"){ const pids=new Set(d[k].map(x=>x.projectId)); DATA[k]=(DATA[k]||[]).filter(x=>!pids.has(x.projectId)).concat(d[k]); return; }
      juntar(k);
    });
  }
  DATA.people=uniao(DATA.people,d.people); DATA.customTapYears=uniao(DATA.customTapYears,d.customTapYears);
}

/* ---------- travas: o projeto inteiro, enquanto é trocado ---------- */
async function travarProjetos(pids){
  const pegas=[];
  for(const pid of pids){
    const k=tk(pid,"tudo"), r=await acquireLock(k);
    if(!r.ok){ soltarTravas(pegas); throw new Error(`${(projOf(pid)||{}).name||"um projeto"}: ${msgTrava(r)}`); }
    startHeartbeat(k); pegas.push(k);
  }
  return pegas;
}
function soltarTravas(chaves){ (chaves||[]).forEach(k=>{ releaseLock(k); }); }

function projetosOndePossoImportar(){ return DATA.projects.filter(p=>pode("importar",p.id)); }

        // ninguém editando o projeto enquanto ele é trocado

        startHeartbeat(chaveTrava);

        await baixarCopiaDeSeguranca([alvo]);
        novoPid=importarProjetoNoExistente(arq,alvo,m);

      if(!ok){ await loadData(false); render(); throw new Error("a gravação não terminou — os dados foram recarregados do servidor; confira o projeto antes de tentar de novo"); }
      closeModal();
      // parte recusada pelo servidor: o app já recarregou e avisou (persist); só não navega para um projeto que não ficou

/* ============================================================
   LOGOTIPO

   De onde vem, nesta ordem:
   1. o enviado pela Administração (Administração › Configurações) --
      fica em config/aparencia, que qualquer um pode ler (aparece já na
      tela de entrada); na demonstração, neste navegador;
   2. os arquivos do repositório: assets/logo.png (horizontal, para o menu
      aberto) e assets/logo-icone.png (quadrado: menu recolhido e ícone da
      aba). Trocar o arquivo no GitHub troca o logotipo;
   3. a marca neutra que vem com o app.

   Aparece no menu, na tela de entrada, no ícone da aba, nas impressões
   e na capa dos relatórios.
============================================================ */
const CHAVE_APARENCIA_LOCAL="gestao-projetos:aparencia";
const LIMITE_LOGO_BYTES=350*1024; // por imagem, já reduzida
const LOGO_PADRAO=(()=>{ const a=document.querySelector(".brand-logo"), b=document.querySelector(".brand-crest"); return {logo:a?a.getAttribute("src"):"", icone:b?b.getAttribute("src"):""}; })();
let logoAtual={logo:LOGO_PADRAO.logo, icone:LOGO_PADRAO.icone, origem:"padrao"};
let aparenciaEnviada=null; // {logo, icone} enviado pela Administração (ou null)

function caminhoDoArquivo(nome){
  const cfg=(typeof APP_CONFIG!=="undefined" && APP_CONFIG)||{};
  if(cfg.logo===false) return "";
  const base = nome==="icone" ? (cfg.logoIcone||"assets/logo-icone.png") : (cfg.logo||"assets/logo.png");
  return base + (cfg.versaoLogo ? (base.includes("?")?"&":"?")+"v="+encodeURIComponent(cfg.versaoLogo) : "");
}
// confere se a imagem existe antes de trocar (sem arquivo, fica a marca neutra, sem ícone quebrado)
function imagemCarrega(src){
  return new Promise(res=>{
    if(!src || typeof Image==="undefined"){ res(false); return; }
    const img=new Image(); let fim=false;
    const acabar=v=>{ if(!fim){ fim=true; res(v); } };
    img.onload=()=>acabar(img.naturalWidth>0); img.onerror=()=>acabar(false);
    setTimeout(()=>acabar(false),4000);
    img.src=src;
  });
}
function mostrarLogotipo(){
  document.querySelectorAll(".brand-logo,.acesso-logo").forEach(el=>{ el.src=logoAtual.logo; el.alt=APP_CONFIG.nomeApp; });
  document.querySelectorAll(".brand-crest").forEach(el=>{ el.src=logoAtual.icone||logoAtual.logo; });
  let fav=document.querySelector("link[rel~='icon']");
  if(!fav){ fav=document.createElement("link"); fav.rel="icon"; document.head.appendChild(fav); }
  fav.href=logoAtual.icone||logoAtual.logo;
}
async function aplicarLogotipo(){
  if(aparenciaEnviada && aparenciaEnviada.logo){
    logoAtual={logo:aparenciaEnviada.logo, icone:aparenciaEnviada.icone||aparenciaEnviada.logo, origem:"enviado"};
    mostrarLogotipo(); return;
  }
  logoAtual={logo:LOGO_PADRAO.logo, icone:LOGO_PADRAO.icone, origem:"padrao"};
  mostrarLogotipo();
  // arquivos do repositório: troca quando (e se) carregarem
  const [l,i]=[caminhoDoArquivo("logo"),caminhoDoArquivo("icone")];
  const [temL,temI]=await Promise.all([imagemCarrega(l),imagemCarrega(i)]);
  if(aparenciaEnviada && aparenciaEnviada.logo) return; // chegou um enviado no meio do caminho
  if(temL||temI){ logoAtual={logo:temL?l:LOGO_PADRAO.logo, icone:temI?i:(temL?l:LOGO_PADRAO.icone), origem:"arquivo"}; mostrarLogotipo(); }
}
/* lê o logotipo enviado: servidor (público, antes do login) ou este navegador */
async function carregarAparencia(){
  try{
    if(BACKEND && BACKEND.tipo==="firestore"){
      const s=await BACKEND.db.doc("config/aparencia").get();
      aparenciaEnviada = s.exists && s.data().logo ? {logo:s.data().logo, icone:s.data().icone||""} : null;
    }else if(MODE!=="servidor"){
      const v=localStorage.getItem(CHAVE_APARENCIA_LOCAL); aparenciaEnviada=v?JSON.parse(v):null;
    }
  }catch(e){ /* sem acesso ou offline: fica o do repositório / padrão */ }
  await aplicarLogotipo();

function registrarOperacoesAparencia(B){
  const db=B.db, est=B.estado, FV=B.firebase.firestore.FieldValue;
  Object.assign(B.extensoes,{
    apiSalvarAparencia: async (dados)=>{
      if(!est.adminSistema) throw new Error("Só a Administração do sistema troca o logotipo.");
      if(!dados || !dados.logo){ await db.doc("config/aparencia").delete(); return JSON.stringify({ok:true}); }
      [dados.logo,dados.icone||""].forEach(u=>{ if(!/^data:image\/(png|jpeg|webp);base64,/.test(u||"data:image/png;base64,")) throw new Error("Imagem inválida."); if(String(u).length>LIMITE_LOGO_BYTES*1.37) throw new Error("Imagem grande demais."); });
      await db.doc("config/aparencia").set({logo:dados.logo, icone:dados.icone||"", atualizadoPor:est.email, atualizadoEm:FV.serverTimestamp()});
      return JSON.stringify({ok:true});
    }
  });
}

/* reduz a imagem (canvas) para caber no documento: horizontal até 600×200, ícone 128×128 */
function reduzirImagem(arquivo,larg,alt,quadrado){
  return new Promise((res,rej)=>{
    const leitor=new FileReader();
    leitor.onerror=()=>rej(new Error("Não consegui ler a imagem."));
    leitor.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("O arquivo não é uma imagem válida (use PNG, JPG ou WebP)."));
      img.onload=()=>{
        const esc_=Math.min(1, larg/img.naturalWidth, alt/img.naturalHeight);
        const w=Math.max(1,Math.round(img.naturalWidth*esc_)), h=Math.max(1,Math.round(img.naturalHeight*esc_));
        const c=document.createElement("canvas"); c.width=quadrado?larg:w; c.height=quadrado?alt:h;
        const ctx=c.getContext("2d");
        if(quadrado){ ctx.drawImage(img,(larg-w)/2,(alt-h)/2,w,h); } else ctx.drawImage(img,0,0,w,h);
        const url=c.toDataURL("image/png");
        if(url.length>LIMITE_LOGO_BYTES*1.37) rej(new Error("Imagem grande demais mesmo depois de reduzida — use um arquivo mais simples."));
        else res(url);
      };
      img.src=leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}

  const origem={enviado:"enviado pela Administração", arquivo:"arquivo do repositório (assets/logo.png)", padrao:"marca neutra do app"}[logoAtual.origem];
  return `<h3 class="cfg-titulo">Logotipo</h3>
    <p class="hint">Em uso agora: <strong>${esc(origem)}</strong>. O enviado aqui vale para todos e aparece já na tela de entrada; sem ele, vale o arquivo <code>assets/logo.png</code> do repositório (e <code>assets/logo-icone.png</code>, quadrado, para o ícone).</p>
    <div class="cfg-logo">
      <div class="cfg-logo-prev"><img src="${esc(logoAtual.logo)}" alt="Logotipo atual"></div>
      <div class="cfg-logo-prev quad"><img src="${esc(logoAtual.icone||logoAtual.logo)}" alt="Ícone atual"></div>
      <div class="cfg-acoes-topo" style="margin:0">
        <label class="btn sm" style="cursor:pointer">Enviar logotipo…<input type="file" id="cfg_logo" accept="image/png,image/jpeg,image/webp" style="display:none"></label>
        <label class="btn sm" style="cursor:pointer">Enviar ícone (quadrado)…<input type="file" id="cfg_icone" accept="image/png,image/jpeg,image/webp" style="display:none"></label>
        ${aparenciaEnviada?`<button class="btn sm" id="cfg_logo_tirar" type="button">Voltar ao do repositório</button>`:""}
      </div>
    </div>`;
}
function ligarSecaoLogotipo(redesenhar){
  const enviar=async(campo,arquivo)=>{
    try{
      const url = campo==="icone" ? await reduzirImagem(arquivo,128,128,true) : await reduzirImagem(arquivo,600,200,false);
      const novo=Object.assign({logo:"",icone:""}, aparenciaEnviada||{});
      novo[campo]=url; if(!novo.logo) novo.logo=url; // só o ícone: vale também como logotipo
      await salvarLogotipoEnviado(novo); toast("Logotipo atualizado"); redesenhar();
    }catch(e){ toast((e&&e.message)||String(e),true,true); }
  };
  const l=$("#cfg_logo"), i=$("#cfg_icone"), t=$("#cfg_logo_tirar");
  if(l) l.onchange=ev=>{ const f=ev.target.files&&ev.target.files[0]; if(f) enviar("logo",f); };
  if(i) i.onchange=ev=>{ const f=ev.target.files&&ev.target.files[0]; if(f) enviar("icone",f); };
  if(t) t.onclick=async()=>{ if(!confirm("Tirar o logotipo enviado e voltar ao do repositório?")) return; try{ await salvarLogotipoEnviado(null); toast("Logotipo enviado removido"); redesenhar(); }catch(e){ toast((e&&e.message)||String(e),true); } };
}

/* nome do app vem do config.js (APP_CONFIG.nomeApp) */
function aplicarNomeDoApp(){
  try{ document.title=APP_CONFIG.nomeApp; }catch(e){}
  document.querySelectorAll(".brand-name").forEach(el=>{ el.textContent=APP_CONFIG.nomeApp; });
  document.querySelectorAll(".brand-crest").forEach(el=>{ el.title=APP_CONFIG.nomeApp; });
}

/* ============================================================
   INIT
============================================================ */
(async function init(){
  aplicarNomeDoApp();
  carregarAparencia(); // logotipo: enviado pela Administração > arquivo do repositório > marca neutra (não espera)
  if(FIREBASE_SEM_SDK){ mostrarTelaAcesso({erroSdk:true}); return; }
  if(MODE==="servidor"){
    // uma chamada só traz "quem sou eu" + os dados (antes eram duas, em sequência)
    let who=null, r=null;
    await concluirLinkDeEmailSeHouver(); // voltou de um "link de acesso por e-mail"
    try{
      r=JSON.parse(await servidorCall("apiInit"));
      who=r.who; dadosPreCarregados=r.data||null;
    }catch(e){
      if(BACKEND && BACKEND.tipo==="firestore"){ mostrarTelaAcesso({erroInicio:(e&&(e.message||e.code))||String(e)}); return; }
      try{ const s=await servidorCall("apiWhoAmI"); who=s?JSON.parse(s):null; }catch(e2){ who=null; }
    }
    // sem login, e-mail não confirmado ou pessoa sem cadastro: tela de acesso, nada do app
    if(r && (r.precisaLogin || r.precisaVerificarEmail || r.semCadastro)){ mostrarTelaAcesso(r); return; }
    if(who){ aplicarIdentidade(who); }
    else { me="Usuário"; myEmail=""; souAdminMaster=false; }
  }else{
    try{ me=localStorage.getItem("gestao-projetos:me")||""; }catch(e){ me=""; }
  }
  try{ sidebarCollapsed = localStorage.getItem("gestao-projetos:sidebar")==="1"; }catch(e){}
  try{ showProgressBar = localStorage.getItem("gestao-projetos:showProgress")==="1"; }catch(e){}
  applySidebar();
  initMobile();
  applyReadOnly();
  await loadData(false);
  if(MODE!=="servidor" && !me) askName();
  render();
  setInterval(poll, POLL_MS);
})();
</script>
