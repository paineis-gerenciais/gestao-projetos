<script>
"use strict";
/* ============================================================
   BACKEND FIRESTORE

   Implementa, no próprio navegador, as mesmas operações que o app já usa
   com qualquer servidor (apiInit, apiLoad, apiCheck, apiSaveDiff,
   apiAcquireLock...), lendo e gravando no Cloud Firestore. A segurança de
   verdade fica nas REGRAS do Firestore (firestore.rules): este módulo só
   organiza os dados e evita mandar ao servidor o que ele vai recusar.

   ESTRUTURA DOS DADOS
     projetos/{pid}                     cabeçalho do projeto + TAP + acesso
     projetos/{pid}/secoes/{secao}      cronograma · eap · riscos · custos ·
                                        stakeholders · responsabilidade ·
                                        linhaBase
     projetos/{pid}/travas/{secao}      trava de edição de cada seção
     portfolios/{id}                    portfólios
     grupos/{gid}                       grupos de usuários e papéis
     usuarios/{email}                   pessoas cadastradas
     config/{admins|geral|pessoas|aparencia}
     pedidos/{id}                       pedidos (acesso, exclusão, linha de base)
     fila/{id}                          e-mails a enviar (pela tarefa agendada)

   LEITURAS (custo): ao abrir, o app lê o cabeçalho e o cronograma de cada
   projeto visível (o Painel precisa só disso). As demais seções de um
   projeto são carregadas quando ele é aberto, ou quando um relatório ou
   exportação precisa delas (garantirSecoes). Depois disso, tudo fica em
   tempo real: só o que muda é lido de novo.
============================================================ */
const FS_SECOES=["cronograma","eap","riscos","custos","stakeholders","responsabilidade","linhaBase"];
const FS_SECOES_TRAVA=["cabecalho","cronograma","eap","riscos","custos","stakeholders","responsabilidade","linhaBase"];
const FS_TRAVA_TTL_MS=180000;
// campos do cabeçalho que só a administração de acesso grava (nunca vêm do formulário do projeto)
const FS_CAMPOS_ACESSO=["papeis","leitores","excecoes","grupoId","criadoEm","criadoPor"];
// campos internos do documento que não fazem parte do objeto "projeto" do app
const FS_CAMPOS_INTERNOS=["tap","papeis","leitores","excecoes","criadoEm","criadoPor","atualizadoEm","atualizadoPor","escritaId"];
// lista do app -> seção do Firestore (e nome da lista dentro do documento)
const FS_ENTIDADES={
  tasks:{secao:"cronograma",campo:"itens"},
  eapNodes:{secao:"eap",campo:"itens"},
  risks:{secao:"riscos",campo:"itens"},
  costs:{secao:"custos",campo:"itens"},
  stakeholders:{secao:"stakeholders",campo:"itens"},
  reportSchedules:{secao:"stakeholders",campo:"agendamentos"},
  responsibleContacts:{secao:"responsabilidade",campo:"itens"}
};

function criarBackendFirestore(firebase, cfgFb, opcoes){
  opcoes=opcoes||{};
  const app = opcoes.app
    || ((firebase.apps||[]).find(a=>a.name===(opcoes.nomeApp||"[DEFAULT]")))
    || firebase.initializeApp(cfgFb, opcoes.nomeApp||undefined);
  const auth=app.auth(), db=app.firestore();
  try{ auth.languageCode="pt-BR"; }catch(e){} // e-mails do login (link, confirmação, nova senha) em português
  if(cfgFb && cfgFb.emulador && !opcoes.app){
    try{ const [h,p]=String(cfgFb.emulador.firestore||"localhost:8080").split(":"); db.useEmulator(h,Number(p)); }catch(e){}
    try{ auth.useEmulator(cfgFb.emulador.auth||"http://localhost:9099"); }catch(e){}
  }
  const FV=firebase.firestore.FieldValue, TS=firebase.firestore.Timestamp;
  const agoraMs=()=>Date.now();
  const novoId=()=>Math.random().toString(36).slice(2,10)+agoraMs().toString(36).slice(-4);
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const emailNorm=e=>String(e||"").trim().toLowerCase();
  const msDe=v=>{ if(!v) return 0; if(typeof v==="number") return v; if(typeof v.toMillis==="function") return v.toMillis(); return Number(v)||0; };

  /* ---------------- estado em memória (cópia do que o Firestore mandou) ---------------- */
  const est={
    usuario:null,            // usuário do Firebase Auth
    email:"", nome:"",
    adminSistema:false,
    admins:[],               // config/admins.emails
    perfil:null,             // usuarios/{email}
    grupos:new Map(),        // gid -> doc
    headers:new Map(),       // pid -> doc do cabeçalho
    secoes:new Map(),        // pid -> { secao: dados | null(negado) }
    historicos:new Map(),    // pid -> Map(id -> linha de base substituída)
    portfolios:new Map(),
    pessoas:{people:[],peopleHidden:[]},
    geral:{},
    aparencia:{},
    travas:{},               // "pid#secao" -> trava
    versao:0,                // muda a cada novidade (minha ou de outra pessoa)
    externas:0,              // conta só as novidades de OUTRAS pessoas (o app recarrega quando cresce)
    mudouPor:"",
    inscr:{},                // chave -> função de cancelar
    primeiras:{},            // chave -> promessa do primeiro retorno
    secoesPedidas:new Set(), // pids com todas as seções em tempo real
    travasObservadas:"",
    minhasEscritas:new Set(),
    offsetServidor:0,        // relógio do servidor - relógio local (ms), estimado pelas travas
    iniciado:false
  };
  const agoraServ=()=>agoraMs()+est.offsetServidor;
  function externa(por){ est.versao++; est.externas++; est.mudouPor=por||""; }
  // primeira=true: carga inicial de uma inscrição (não é "novidade de outra pessoa")
  function marcarMudanca(doc,opcoes){
    opcoes=opcoes||{};
    est.versao++;
    if(opcoes.primeira) return;
    if(opcoes.removido){ externa(""); return; }
    const dados=doc && doc.exists!==false && typeof doc.data==="function" ? (doc.data()||{}) : null;
    const minha = dados && dados.escritaId && est.minhasEscritas.has(dados.escritaId);
    if(!minha) externa((dados&&dados.atualizadoPor)||"");
  }
  function cancelar(chave){ if(est.inscr[chave]){ try{ est.inscr[chave](); }catch(e){} } delete est.inscr[chave]; delete est.primeiras[chave]; }
  function cancelarPrefixo(pref){ Object.keys(est.inscr).filter(k=>k.indexOf(pref)===0).forEach(cancelar); }

  /* ---------------- autenticação ---------------- */
  let resolverAuth; const authPronto=new Promise(r=>{ resolverAuth=r; });
  auth.onAuthStateChanged(u=>{
    const trocou = est.usuario && (!u || emailNorm(u.email)!==est.email);
    est.usuario=u||null; est.email=u?emailNorm(u.email):""; est.nome=u?(u.displayName||""):"";
    resolverAuth(u);
    if(trocou){ try{ location.reload(); }catch(e){} }
  });

  /* ---------------- quem sou eu / cadastro ---------------- */
  async function lerDoc(caminho){
    try{ const s=await db.doc(caminho).get(); return s.exists?s.data():null; }
    catch(e){ return { __erro: e && (e.code||e.message) }; }
  }
  async function carregarIdentidade(){
    const cfgAdmins=await lerDoc("config/admins");
    est.admins=(cfgAdmins && !cfgAdmins.__erro && Array.isArray(cfgAdmins.emails)) ? cfgAdmins.emails.map(emailNorm) : [];
    const adminInicial=emailNorm((typeof APP_CONFIG!=="undefined" && APP_CONFIG.adminInicial)||"");
    const perfil=await lerDoc("usuarios/"+est.email);
    est.perfil=(perfil && !perfil.__erro)?perfil:null;
    // igual às regras: quem foi desativado deixa de ser da Administração (menos o admin inicial)
    const desativado=!!(est.perfil && est.perfil.ativo!==undefined && est.perfil.ativo!==true);
    est.adminSistema = (!!adminInicial && adminInicial===est.email) || (est.admins.includes(est.email) && !desativado);
    if(est.perfil && est.perfil.nome) est.nome=est.perfil.nome;
    if(!est.nome) est.nome=nomeDoEmail(est.email);
  }
  function nomeDoEmail(email){
    const local=String(email||"").split("@")[0]||"";
    const partes=local.split(/[._-]+/).filter(Boolean);
    return partes.length ? partes.map(p=>p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()).join(" ") : email;
  }
  function cadastrado(){ return est.adminSistema || !!(est.perfil && est.perfil.ativo===true); }

  /* ---------------- inscrições (tempo real) ---------------- */
  function inscrever(chave, criar){
    // cria a inscrição (se ainda não existe) e devolve a promessa do primeiro retorno (ou erro)
    if(est.primeiras[chave]) return est.primeiras[chave];
    est.primeiras[chave]=new Promise(res=>{
      let primeira=true;
      const fim=()=>{ if(primeira){ primeira=false; res(); } };
      est.inscr[chave]=criar(fim, ()=>primeira);
    });
    return est.primeiras[chave];
  }
  function esquecer(chave){ delete est.inscr[chave]; delete est.primeiras[chave]; }
  function inscreverHeaders(){
    const ref = est.adminSistema ? db.collection("projetos") : db.collection("projetos").where("leitores","array-contains",est.email);
    return inscrever("headers", (fim,ehPrimeira)=>ref.onSnapshot(qs=>{
      const inicial=ehPrimeira();
      const vistos=new Set();
      qs.docs.forEach(d=>{ vistos.add(d.id); est.headers.set(d.id, Object.assign({id:d.id}, d.data())); });
      Array.from(est.headers.keys()).forEach(pid=>{ if(!vistos.has(pid)){ est.headers.delete(pid); est.secoes.delete(pid); est.historicos.delete(pid); cancelarPrefixo("sec:"+pid+":"); est.secoesPedidas.delete(pid); } });
      const mudancas=qs.docChanges?qs.docChanges():[];
      if(inicial || !mudancas.length) est.versao++;
      else mudancas.forEach(m=>marcarMudanca(m.doc,{removido:m.type==="removed"}));
      // cada projeto visível: cronograma sempre (o Painel precisa)
      const esperas=[];
      vistos.forEach(pid=>{
        esperas.push(inscreverSecao(pid,"cronograma"));
        if(est.secoesPedidas.has(pid)) esperas.push(inscreverSecoesDoProjeto(pid));
      });
      Promise.all(esperas).then(fim);
    }, err=>{
      // a consulta caiu (rede, permissão): tenta de novo em instantes, sem travar o app
      console.warn("projetos:",err&&err.message); esquecer("headers"); fim();
      setTimeout(()=>{ if(est.iniciado) inscreverHeaders(); },10000);
    }));
  }
  function inscreverSecao(pid,secao){
    const chave="sec:"+pid+":"+secao;
    return inscrever(chave, (fim,ehPrimeira)=>db.doc("projetos/"+pid+"/secoes/"+secao).onSnapshot(s=>{
      const porSecao=est.secoes.get(pid)||{}; est.secoes.set(pid,porSecao);
      porSecao[secao]= s.exists ? s.data() : {};
      marcarMudanca(s,{primeira:ehPrimeira()}); fim();
    }, err=>{
      // sem permissão (ex.: Convidado em Custos): marcado como negado; um novo pedido tenta de novo
      const porSecao=est.secoes.get(pid)||{}; est.secoes.set(pid,porSecao);
      porSecao[secao]=null; est.versao++; esquecer(chave); fim();
    }));
  }
  function inscreverHistorico(pid){
    const chave="sec:"+pid+":historicoLB";
    return inscrever(chave, (fim,ehPrimeira)=>db.collection("projetos/"+pid+"/historicoLinhaBase").onSnapshot(qs=>{
      const mapa=new Map(); qs.docs.forEach(d=>mapa.set(d.id,Object.assign({id:d.id},d.data())));
      est.historicos.set(pid,mapa);
      if(ehPrimeira()) est.versao++; else (qs.docChanges?qs.docChanges():[]).forEach(m=>marcarMudanca(m.doc,{removido:m.type==="removed"}));
      fim();
    }, err=>{ est.historicos.set(pid,new Map()); est.versao++; esquecer(chave); fim(); }));
  }
  function inscreverSecoesDoProjeto(pid){
    return Promise.all(FS_SECOES.map(s=>inscreverSecao(pid,s)).concat([inscreverHistorico(pid)]));
  }
  function inscreverColecaoSimples(chave, ref, aoChegar){
    return inscrever(chave, (fim,ehPrimeira)=>ref.onSnapshot(qs=>{
      const inicial=ehPrimeira(); aoChegar(qs);
      if(inicial) est.versao++; else (qs.docChanges?qs.docChanges():[]).forEach(m=>marcarMudanca(m.doc,{removido:m.type==="removed"}));
      fim();
    }, err=>{ esquecer(chave); fim(); }));
  }
  function inscreverDoc(chave, caminho, aoChegar){
    return inscrever(chave, (fim,ehPrimeira)=>db.doc(caminho).onSnapshot(s=>{ aoChegar(s.exists?s.data():{}); marcarMudanca(s,{primeira:ehPrimeira()}); fim(); }, err=>{ aoChegar({}); esquecer(chave); fim(); }));
  }
  async function iniciarInscricoes(){
    if(est.iniciado) return; est.iniciado=true;
    const gruposRef = est.adminSistema ? db.collection("grupos") : db.collection("grupos").where("membrosEmails","array-contains",est.email);
    await Promise.all([
      inscreverColecaoSimples("grupos", gruposRef, qs=>{ est.grupos.clear(); qs.docs.forEach(d=>est.grupos.set(d.id,Object.assign({id:d.id},d.data()))); }),
      inscreverHeaders(),
      inscreverColecaoSimples("portfolios", db.collection("portfolios"), qs=>{ est.portfolios.clear(); qs.docs.forEach(d=>est.portfolios.set(d.id,Object.assign({id:d.id},d.data()))); }),
      inscreverDoc("pessoas","config/pessoas", d=>{ est.pessoas={people:d.people||[], peopleHidden:d.peopleHidden||[]}; }),
      inscreverDoc("geral","config/geral", d=>{ est.geral=d||{}; }),
      inscreverDoc("admins","config/admins", d=>{ est.admins=(d.emails||[]).map(emailNorm); })
    ]);
  }
  async function garantirSecoes(pids){
    const lista=(pids&&pids.length?pids:Array.from(est.headers.keys())).filter(pid=>est.headers.has(pid));
    lista.forEach(pid=>est.secoesPedidas.add(pid));
    await Promise.all(lista.map(inscreverSecoesDoProjeto));
    return lista.length;
  }
  function secoesCarregadas(pid){
    const s=est.secoes.get(pid)||{};
    return FS_SECOES.every(x=>Object.prototype.hasOwnProperty.call(s,x)) && est.historicos.has(pid);
  }
  /* depois de uma gravação MINHA: a cópia local já fica com o que foi gravado
     (o retorno do servidor pelo tempo real pode chegar depois) */
  function aplicarSecaoLocal(pid,secao,dados){
    const porSecao=est.secoes.get(pid)||{}; est.secoes.set(pid,porSecao);
    porSecao[secao]=Object.assign({},porSecao[secao]||{},clone(dados)); est.versao++;
  }
  function aplicarHeaderLocal(pid,campos,apagarCampos){
    const h=est.headers.get(pid); if(!h) return;
    const novo=Object.assign({},h,clone(campos)); (apagarCampos||[]).forEach(k=>delete novo[k]);
    est.headers.set(pid,novo); est.versao++;
  }

  /* ---------------- montar o DATA do app a partir dos documentos ---------------- */
  function projetoDoHeader(h){
    const p={};
    Object.keys(h).forEach(k=>{ if(!FS_CAMPOS_INTERNOS.includes(k)) p[k]=h[k]; });
    p.id=h.id; p.grupoId=h.grupoId||"";
    return p;
  }
  function montarDados(){
    const d={ version:est.versao, updatedAt:est.externas, updatedBy:est.mudouPor, sheetUpdatedAt:0,
      people:(est.pessoas.people||[]).slice(), peopleHidden:(est.pessoas.peopleHidden||[]).slice(),
      customTapYears:((est.geral&&est.geral.customTapYears)||[]).slice(),
      configuracoes:(est.geral&&est.geral.configuracoes)?clone(est.geral.configuracoes):null,
      projects:[], tasks:[], risks:[], costs:[], stakeholders:[], reportSchedules:[], eapNodes:[],
      responsibleContacts:[], tapData:[], baselines:[], baselineHistory:[], portfolios:[],
      locks:clone(est.travas)||{},
      acessoProjetos:{}, secoesNegadas:{}, secoesCarregadas:{}, grupos:[]
    };
    est.headers.forEach((h,pid)=>{
      d.projects.push(projetoDoHeader(h));
      if(h.tap) d.tapData.push(Object.assign({}, h.tap, {projectId:pid, id:h.tap.id||("tap-"+pid)}));
      d.acessoProjetos[pid]={grupoId:h.grupoId||"", papeis:h.papeis||{}, excecoes:h.excecoes||{}};
      const sec=est.secoes.get(pid)||{};
      d.secoesCarregadas[pid]=secoesCarregadas(pid);
      d.secoesNegadas[pid]=FS_SECOES.filter(x=>sec[x]===null);
      Object.keys(FS_ENTIDADES).forEach(k=>{
        const m=FS_ENTIDADES[k], doc=sec[m.secao];
        if(doc && Array.isArray(doc[m.campo])) doc[m.campo].forEach(it=>d[k].push(Object.assign({},it,{projectId:pid})));
      });
      const lb=sec.linhaBase;
      if(lb && lb.atual) d.baselines.push(Object.assign({},lb.atual,{projectId:pid}));
      const hist=est.historicos.get(pid);
      if(hist) Array.from(hist.values()).sort((a,b)=>(Number(a.replacedAt)||0)-(Number(b.replacedAt)||0)).forEach(h2=>d.baselineHistory.push(Object.assign({},h2,{projectId:pid})));
    });
    est.portfolios.forEach(p=>d.portfolios.push(Object.assign({},p)));
    est.grupos.forEach(g=>d.grupos.push({id:g.id, nome:g.nome||"", membros:g.membros||{}}));
    d.projects.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"pt-BR"));
    return clone(d);
  }

  /* ---------------- gravação ---------------- */
  function localizar(entidade,id){
    // em qual projeto o item está hoje (pela cópia em memória)
    const m=FS_ENTIDADES[entidade];
    for(const [pid,sec] of est.secoes){
      const doc=sec[m.secao];
      if(doc && Array.isArray(doc[m.campo]) && doc[m.campo].some(x=>String(x.id)===String(id))) return pid;
    }
    return null;
  }
  function papelNoProjeto(pid){
    if(est.adminSistema) return "admin_sistema";
    const h=est.headers.get(pid); return (h && h.papeis && h.papeis[est.email]) || "";
  }
  function papelNoGrupo(gid){
    const g=est.grupos.get(gid); return (g && g.membros && g.membros[est.email]) || "";
  }
  function calcularPapeis(grupoId, excecoes){
    const g=est.grupos.get(grupoId);
    const papeis=Object.assign({}, (g&&g.membros)||{});
    Object.keys(excecoes||{}).forEach(em=>{
      const atual=papeis[em], novo=excecoes[em];
      papeis[em] = (typeof papelMaior==="function") ? papelMaior(atual,novo) : (atual||novo);
    });
    return papeis;
  }
  const LIMITE_DOC=900000; // o Firestore aceita até ~1 MiB por documento
  function erroPermanente(e){
    const c=String((e&&e.code)||"");
    return /permission-denied|not-found|invalid-argument|failed-precondition|out-of-range/.test(c) || (e&&e.tamanho);
  }
  function motivoDoErro(e){
    const c=String((e&&e.code)||"");
    if(e && e.tamanho) return "ficou grande demais para um documento do Firestore (limite de 1 MB)";
    if(/permission-denied/.test(c)) return "sem permissão para esta alteração";
    if(/not-found/.test(c)) return "o item foi excluído por outra pessoa";
    return (e&&e.message)||String(e);
  }
  async function gravarSecao(pid, secao, alteracoes, escritaId){
    // alteracoes: { campo: {upsert:[], deleteIds:[]} } -- devolve os ids recusados (ciclo)
    const ref=db.doc("projetos/"+pid+"/secoes/"+secao);
    let recusados=[], gravado=null, outraPessoaGravou=false;
    await db.runTransaction(async tx=>{
      recusados=[]; // recomeça a cada tentativa da transação
      const s=await tx.get(ref);
      const atual=s.exists?(s.data()||{}):{};
      const emCache=(est.secoes.get(pid)||{})[secao];
      outraPessoaGravou = !!(atual.escritaId && !est.minhasEscritas.has(atual.escritaId) && (!emCache || emCache.escritaId!==atual.escritaId));
      const novo={};
      Object.keys(alteracoes).forEach(campo=>{
        const {upsert,deleteIds}=alteracoes[campo];
        const apagar=new Set((deleteIds||[]).map(String));
        const porId=new Map(); const ordem=[];
        (atual[campo]||[]).forEach(it=>{ const id=String(it.id); if(apagar.has(id)) return; porId.set(id,it); ordem.push(id); });
        const paiGravado=new Map((atual[campo]||[]).map(it=>[String(it.id), it.parentId||null]));
        (upsert||[]).forEach(it=>{
          const limpo=Object.assign({},it); delete limpo.projectId;
          const id=String(limpo.id); if(!porId.has(id)) ordem.push(id); porId.set(id,limpo);
        });
        const lista=ordem.map(id=>porId.get(id));
        if(secao==="cronograma" || secao==="eap"){
          // hierarquia sem ciclos: recusa a troca de pai que fecharia um ciclo
          const mapa=new Map(lista.map(x=>[String(x.id),x]));
          const formaCiclo=id=>{ const vistos=new Set(); let cur=id; while(cur){ if(vistos.has(cur)) return false; vistos.add(cur); const n=mapa.get(cur); if(!n||!n.parentId) return false; if(String(n.parentId)===id) return true; cur=String(n.parentId); } return false; };
          (upsert||[]).forEach(it=>{
            const id=String(it.id), n=mapa.get(id); if(!n || !n.parentId) return;
            if(String(n.parentId)===id || formaCiclo(id)){
              n.parentId=paiGravado.get(id)||null;
              if(n.parentId && formaCiclo(id)) n.parentId=null;
              if(secao==="cronograma") recusados.push(id);
            }
          });
          // ciclos antigos e pais inexistentes viram nível principal
          lista.forEach(n=>{ const vistos=new Set([String(n.id)]); let cur=n; while(cur && cur.parentId){ const pai=mapa.get(String(cur.parentId)); if(!pai || vistos.has(String(pai.id))){ cur.parentId=null; break; } vistos.add(String(pai.id)); cur=pai; } });
        }
        novo[campo]=lista;
      });
      if(JSON.stringify(novo).length>LIMITE_DOC){ const e=new Error("tamanho"); e.tamanho=true; throw e; }
      Object.assign(novo,{ atualizadoPor:est.email, escritaId });
      gravado=Object.assign({},atual,novo);
      tx.set(ref,Object.assign({},novo,{atualizadoEm:FV.serverTimestamp()}),{merge:true});
    });
    aplicarSecaoLocal(pid,secao,gravado);
    if(outraPessoaGravou) externa(""); // a minha gravação incorporou novidades de outra pessoa
    return recusados;
  }
  async function salvarDiff(payloadStr){
    const payload=typeof payloadStr==="string"?JSON.parse(payloadStr):payloadStr;
    const diff=payload.diff||{};
    const escritaId=novoId(); est.minhasEscritas.add(escritaId);
    const recusados=[], falhas=[];
    const tentar=async(oQue,fn)=>{ try{ return await fn(); }catch(e){ if(!erroPermanente(e) && !/aborted|unavailable|deadline/i.test(String(e&&e.code))) throw e; falhas.push({oQue, motivo:motivoDoErro(e)}); return null; } };
    const vazio={upsert:[],deleteIds:[]};
    const dp=diff.projects||vazio, dpo=diff.portfolios||vazio, dtap=diff.tapData||vazio;
    const novos=new Set((payload.projetosNovos||[]).map(String));
    const removidosRemotamente=new Set();

    // 1) portfólios
    for(const p of (dpo.upsert||[])){
      await tentar("portfólio "+(p.name||""),async()=>{
        const o=Object.assign({},p,{atualizadoEm:FV.serverTimestamp(),atualizadoPor:est.email,escritaId});
        await db.doc("portfolios/"+p.id).set(o,{merge:true});
        est.portfolios.set(p.id,Object.assign({},est.portfolios.get(p.id)||{},clone(p)));
      });
    }
    for(const id of (dpo.deleteIds||[])){ await tentar("excluir portfólio",async()=>{ await db.doc("portfolios/"+id).delete(); est.portfolios.delete(id); }); }

    // 2) projetos novos e alterados (cabeçalho). "Novo" é o que o app criou nesta sessão;
    //    um projeto que sumiu do servidor NUNCA é recriado por uma edição atrasada.
    for(const p of (dp.upsert||[])){
      const ref=db.doc("projetos/"+p.id);
      const campos={};
      Object.keys(p).forEach(k=>{ if(k!=="id" && !FS_CAMPOS_ACESSO.includes(k) && !FS_CAMPOS_INTERNOS.includes(k)) campos[k]=p[k]; });
      Object.assign(campos,{atualizadoPor:est.email, escritaId});
      await tentar("projeto "+(p.name||""),async()=>{
        let criado=null;
        await db.runTransaction(async tx=>{
          criado=null;
          const s=await tx.get(ref);
          if(s.exists){
            // campo que saiu do projeto (ex.: importação "substituir") sai também do servidor
            const apagar={}; const atual=s.data()||{};
            Object.keys(atual).forEach(k=>{ if(!(k in campos) && !FS_CAMPOS_ACESSO.includes(k) && !FS_CAMPOS_INTERNOS.includes(k) && k!=="id") apagar[k]=FV.delete(); });
            tx.update(ref,Object.assign({},campos,apagar,{atualizadoEm:FV.serverTimestamp()})); return;
          }
          if(!novos.has(String(p.id))){ removidosRemotamente.add(String(p.id)); return; }
          const grupoId=p.grupoId || (typeof grupoPadraoParaNovoProjeto==="function" ? grupoPadraoParaNovoProjeto() : "") || "";
          const papeis=calcularPapeis(grupoId,{});
          criado=Object.assign({},campos,{ grupoId, excecoes:{}, papeis, leitores:Object.keys(papeis).sort(), criadoPor:est.email });
          tx.set(ref,Object.assign({},criado,{criadoEm:FV.serverTimestamp(), atualizadoEm:FV.serverTimestamp()}));
        });
        if(criado) est.headers.set(p.id,Object.assign({id:p.id},criado));
        else if(!removidosRemotamente.has(String(p.id))) aplicarHeaderLocal(p.id,campos);
      });
    }
    if(removidosRemotamente.size) falhas.push({oQue:"projeto", motivo:"o projeto foi excluído por outra pessoa"});

    // 3) TAP (fica no cabeçalho): exclusões antes das inclusões
    const tapComUpsert=new Set((dtap.upsert||[]).map(t=>String(t.projectId)));
    for(const id of (dtap.deleteIds||[])){
      const h=Array.from(est.headers.values()).find(x=>x.tap && String(x.tap.id)===String(id));
      if(!h || tapComUpsert.has(String(h.id))) continue;
      await tentar("TAP",async()=>{ await db.doc("projetos/"+h.id).update({tap:FV.delete(), escritaId, atualizadoPor:est.email}); aplicarHeaderLocal(h.id,{},["tap"]); });
    }
    for(const t of (dtap.upsert||[])){
      if(!t.projectId || removidosRemotamente.has(String(t.projectId))) continue;
      const o=Object.assign({},t); delete o.projectId;
      await tentar("TAP",async()=>{ await db.doc("projetos/"+t.projectId).update({tap:o, atualizadoEm:FV.serverTimestamp(), atualizadoPor:est.email, escritaId}); aplicarHeaderLocal(t.projectId,{tap:o}); });
    }

    // 4) seções: primeiro o que entra (incluindo itens que mudaram de projeto), depois o que sai
    //    do projeto antigo -- se a inclusão falhar, o item não some dos dois lugares
    const projetosApagados=new Set((dp.deleteIds||[]).map(String));
    const ignorar=pid=>!pid || projetosApagados.has(String(pid)) || removidosRemotamente.has(String(pid));
    const porSecao=Object.create(null), movidos=Object.create(null); // sem protótipo: id vindo de arquivo não vira "__proto__"
    const add=(mapa,pid,secao,campo,tipo,valor)=>{
      if(ignorar(pid)) return;
      const k=pid+"|"+secao; mapa[k]=mapa[k]||{};
      mapa[k][campo]=mapa[k][campo]||{upsert:[],deleteIds:[]};
      mapa[k][campo][tipo].push(valor);
    };
    Object.keys(FS_ENTIDADES).forEach(ent=>{
      const d=diff[ent]; if(!d) return; const m=FS_ENTIDADES[ent];
      (d.upsert||[]).forEach(it=>{
        const onde=localizar(ent,it.id);
        if(onde && onde!==it.projectId) add(movidos,onde,m.secao,m.campo,"deleteIds",String(it.id));
        add(porSecao,it.projectId,m.secao,m.campo,"upsert",it);
      });
      (d.deleteIds||[]).forEach(id=>{ const onde=localizar(ent,id); if(onde) add(porSecao,onde,m.secao,m.campo,"deleteIds",String(id)); });
    });
    const falhouEntrada=new Set();
    for(const k of Object.keys(porSecao)){
      const [pid,secao]=k.split("|");
      const r=await tentar(secao+" do projeto "+((est.headers.get(pid)||{}).name||""),()=>gravarSecao(pid,secao,porSecao[k],escritaId));
      if(r===null) Object.values(porSecao[k]).forEach(c=>(c.upsert||[]).forEach(it=>falhouEntrada.add(String(it.id))));
      else recusados.push(...r);
    }
    for(const k of Object.keys(movidos)){
      const [pid,secao]=k.split("|");
      Object.values(movidos[k]).forEach(c=>{ c.deleteIds=(c.deleteIds||[]).filter(id=>!falhouEntrada.has(String(id))); });
      if(Object.values(movidos[k]).every(c=>!c.deleteIds.length)) continue;
      await tentar(secao+" (mudança de projeto)",()=>gravarSecao(pid,secao,movidos[k],escritaId));
    }

    // 5) linha de base (por projeto) e histórico (um documento por linha de base substituída; só soma)
    const lbPorProjeto=Object.create(null);
    (payload.baselinesUpsert||[]).forEach(b=>{ if(b&&b.projectId){ (lbPorProjeto[b.projectId]=lbPorProjeto[b.projectId]||{}).atual=b; } });
    (payload.baselinesDel||[]).forEach(pid=>{ (lbPorProjeto[pid]=lbPorProjeto[pid]||{}).apagar=true; });
    (payload.baselineHistoryNew||[]).forEach(h=>{ if(h&&h.projectId){ const o=(lbPorProjeto[h.projectId]=lbPorProjeto[h.projectId]||{}); (o.hist=o.hist||[]).push(h); } });
    for(const pid of Object.keys(lbPorProjeto)){
      if(ignorar(pid)) continue;
      const o=lbPorProjeto[pid];
      await tentar("linha de base",async()=>{
        for(const h of (o.hist||[])){
          const c=Object.assign({},h); delete c.projectId; const id=String(h.id||novoId());
          const ref=db.doc("projetos/"+pid+"/historicoLinhaBase/"+id);
          await db.runTransaction(async tx=>{ const s=await tx.get(ref); if(!s.exists) tx.set(ref,Object.assign(c,{id, escritaId})); });
          const mapa=est.historicos.get(pid)||new Map(); mapa.set(id,Object.assign({id},c)); est.historicos.set(pid,mapa);
        }
        if(o.atual || o.apagar){
          let atualLB=null;
          if(o.atual){ atualLB=Object.assign({},o.atual); delete atualLB.projectId; }
          if(JSON.stringify(atualLB||{}).length>LIMITE_DOC){ const e=new Error("tamanho"); e.tamanho=true; throw e; }
          await db.doc("projetos/"+pid+"/secoes/linhaBase").set({atual:atualLB, atualizadoEm:FV.serverTimestamp(), atualizadoPor:est.email, escritaId},{merge:true});
          aplicarSecaoLocal(pid,"linhaBase",{atual:atualLB, escritaId});
        }
      });
    }

    // 6) projetos excluídos: seções, histórico, travas e cabeçalho
    for(const pid of projetosApagados){
      await tentar("excluir projeto",async()=>{
        let hist=[];
        try{ const qs=await db.collection("projetos/"+pid+"/historicoLinhaBase").get(); hist=qs.docs.map(d=>d.id); }catch(e){}
        const b=db.batch();
        FS_SECOES.forEach(s=>b.delete(db.doc("projetos/"+pid+"/secoes/"+s)));
        hist.forEach(h=>b.delete(db.doc("projetos/"+pid+"/historicoLinhaBase/"+h)));
        FS_SECOES_TRAVA.concat(["tudo"]).forEach(s=>b.delete(db.doc("projetos/"+pid+"/travas/"+s)));
        b.delete(db.doc("projetos/"+pid));
        await b.commit();
        est.headers.delete(pid); est.secoes.delete(pid); est.historicos.delete(pid); cancelarPrefixo("sec:"+pid+":");
      });
    }

    // 7) listas soltas: nomes (somados), anos da TAP
    const pessoasMud={};
    if((payload.peopleNew||[]).length) pessoasMud.people=FV.arrayUnion(...payload.peopleNew);
    if(est.adminSistema && (payload.peopleHiddenAdd||[]).length) pessoasMud.peopleHidden=FV.arrayUnion(...payload.peopleHiddenAdd);
    if(Object.keys(pessoasMud).length) await tentar("lista de nomes",()=>db.doc("config/pessoas").set(Object.assign(pessoasMud,{escritaId}),{merge:true}));
    if((payload.peopleHiddenDel||[]).length){
      // reexibir: a Administração sempre; os demais só o nome que acabaram de usar num responsável
      const usados=new Set();
      ["tasks","risks"].forEach(ent=>((diff[ent]||{}).upsert||[]).forEach(x=>{ if(x.assignee) usados.add(x.assignee); if(x.owner) usados.add(x.owner); (x.coResponsaveis||[]).forEach(n=>usados.add(n)); }));
      (dp.upsert||[]).forEach(p=>{ if(p.owner) usados.add(p.owner); });
      const tirar=payload.peopleHiddenDel.filter(n=>est.adminSistema||usados.has(n));
      if(tirar.length) await tentar("lista de nomes",()=>db.doc("config/pessoas").set({peopleHidden:FV.arrayRemove(...tirar), escritaId},{merge:true}));
    }
    if((payload.customTapYearsNew||[]).length) await tentar("anos da TAP",()=>db.doc("config/geral").set({customTapYears:FV.arrayUnion(...payload.customTapYearsNew), escritaId},{merge:true}));
    est.versao++;
    // updatedAt nulo: o app NÃO avança o marcador de novidades de outras pessoas ao salvar
    // projetos criados agora: o app precisa saber o acesso deles já (senão abririam só para leitura até recarregar)
    const acessoNovos={};
    novos.forEach(pid=>{ const h=est.headers.get(pid); if(h) acessoNovos[pid]={grupoId:h.grupoId||"", papeis:h.papeis||{}, excecoes:h.excecoes||{}}; });
    return JSON.stringify({version:est.versao, updatedAt:null, recusados, falhas, acessoNovos});
  }

  /* ---------------- travas de edição ---------------- */
  function travaParaApp(d){ return {holder:d.email, holderName:d.nome||d.email, updatedAt:msDe(d.atualizadoEm)||agoraMs(), expiraEm:msDe(d.expiraEm)-est.offsetServidor}; }
  /* O prazo das travas é comparado com o relógio do SERVIDOR (estimado a partir
     do horário gravado pelo próprio Firestore), não com o relógio deste computador. */
  async function acertarRelogio(ref){
    try{ const s=await ref.get(); const t=s.exists?msDe(s.data().atualizadoEm):0; if(t) est.offsetServidor=t-agoraMs(); }catch(e){}
  }
  async function pegarTrava(chave){
    const pid=String(chave).split("#")[0], secao=String(chave).split("#")[1]||"tudo";
    const verificar = secao==="tudo" ? FS_SECOES_TRAVA.concat(["tudo"]) : [secao,"tudo"];
    const ref=db.doc("projetos/"+pid+"/travas/"+secao);
    let resposta=null;
    try{
      await db.runTransaction(async tx=>{
        resposta=null;
        const agora=agoraServ();
        const docs=await Promise.all(verificar.map(s=>tx.get(db.doc("projetos/"+pid+"/travas/"+s))));
        for(const s of docs){
          if(!s.exists) continue; const d=s.data();
          if(d.email!==est.email && msDe(d.expiraEm)>agora){ resposta={ok:false, holder:d.email, holderName:d.nome||d.email, updatedAt:msDe(d.atualizadoEm)}; return; }
        }
        const expira=agora+FS_TRAVA_TTL_MS;
        tx.set(ref, {email:est.email, nome:est.nome, expiraEm:TS.fromMillis(expira), atualizadoEm:FV.serverTimestamp()});
        resposta={ok:true, holder:est.email, holderName:est.nome, updatedAt:agora, expiraEm:expira};
      });
    }catch(e){
      // o servidor recusou (trava ainda válida pelo relógio dele, ou sem permissão)
      return JSON.stringify({ok:false, holder:"", holderName:"", erro:String((e&&e.code)||e)});
    }
    if(resposta.ok){
      await acertarRelogio(ref);
      est.travas[pid+"#"+secao]={holder:est.email, holderName:est.nome, updatedAt:resposta.updatedAt, expiraEm:resposta.expiraEm-est.offsetServidor};
      resposta.expiraEm-=est.offsetServidor; // o app compara com o relógio local
    }
    return JSON.stringify(resposta);
  }
  async function renovarTrava(chave){
    const pid=String(chave).split("#")[0], secao=String(chave).split("#")[1]||"tudo";
    const ref=db.doc("projetos/"+pid+"/travas/"+secao);
    let resposta=null;
    try{
      await db.runTransaction(async tx=>{
        resposta=null;
        const s=await tx.get(ref); const agora=agoraServ();
        if(!s.exists){ resposta={ok:false, expirada:true, holder:"", holderName:""}; return; }
        const d=s.data();
        if(d.email!==est.email){ resposta={ok:false, expirada:false, holder:d.email, holderName:d.nome||d.email}; return; }
        if(msDe(d.expiraEm)<=agora){ resposta={ok:false, expirada:true, holder:"", holderName:""}; return; }
        const expira=agora+FS_TRAVA_TTL_MS;
        tx.update(ref,{expiraEm:TS.fromMillis(expira), atualizadoEm:FV.serverTimestamp()});
        resposta={ok:true, holder:est.email, holderName:est.nome, updatedAt:agora, expiraEm:expira-est.offsetServidor};
      });
    }catch(e){ return JSON.stringify({ok:false, expirada:true, holder:"", holderName:""}); }
    if(resposta.ok) est.travas[pid+"#"+secao]={holder:est.email, holderName:est.nome, updatedAt:resposta.updatedAt, expiraEm:resposta.expiraEm};
    return JSON.stringify(resposta);
  }
  async function soltarTrava(chave){
    const pid=String(chave).split("#")[0], secao=String(chave).split("#")[1]||"tudo";
    const ref=db.doc("projetos/"+pid+"/travas/"+secao);
    try{
      await db.runTransaction(async tx=>{ const s=await tx.get(ref); if(s.exists && s.data().email===est.email) tx.delete(ref); });
    }catch(e){}
    delete est.travas[pid+"#"+secao];
    return JSON.stringify({ok:true});
  }
  function observarTravas(pid){
    if(est.travasObservadas===pid) return;
    cancelar("travas"); est.travasObservadas=pid||"";
    Object.keys(est.travas).forEach(k=>{ if(est.travas[k].holder!==est.email) delete est.travas[k]; });
    if(!pid) return;
    est.inscr["travas"]=db.collection("projetos/"+pid+"/travas").onSnapshot(qs=>{
      Object.keys(est.travas).filter(k=>k.indexOf(pid+"#")===0).forEach(k=>delete est.travas[k]);
      qs.docs.forEach(d=>{ est.travas[pid+"#"+d.id]=travaParaApp(d.data()); });
      est.versao++;
    }, ()=>{});
  }

  /* ---------------- juntar/renomear nome (Administração) ---------------- */
  async function renomearNome(de,para){
    de=String(de||"").trim(); para=String(para||"").trim();
    if(!de||!para||de===para) throw new Error("Nomes inválidos.");
    if(!est.adminSistema) throw new Error("Só a Administração do sistema pode juntar nomes.");
    await garantirSecoes([]);
    const escritaId=novoId(); est.minhasEscritas.add(escritaId);
    let trocas=0;
    const lista=txt=>{ const it=(txt||[]).map(x=>String(x).trim()).filter(Boolean); if(!it.includes(de)) return null; const out=[]; it.map(x=>x===de?para:x).forEach(x=>{ if(!out.includes(x)) out.push(x); }); return out; };
    for(const [pid,h] of est.headers){
      const mud={};
      if(h.owner===de){ mud.owner=para; }
      const hist=(h.ownerHistory||[]).map(x=>Object.assign({},x));
      if(hist.some(x=>x&&x.name===de)){ hist.forEach(x=>{ if(x&&x.name===de) x.name=para; }); mud.ownerHistory=hist; }
      if(Object.keys(mud).length){ trocas++; await db.doc("projetos/"+pid).update(Object.assign({},mud,{escritaId})); aplicarHeaderLocal(pid,mud); }
      const mexer={
        cronograma:{itens:t=>{ let m=false; if(t.assignee===de){ t.assignee=para; m=true; } const co=lista(t.coResponsaveis); if(co){ t.coResponsaveis=co.filter(x=>x!==t.assignee); m=true; } return m; }},
        riscos:{itens:r=>{ if(r.owner===de){ r.owner=para; return true; } return false; }},
        responsabilidade:{itens:r=>{ if(r.name===de){ r.name=para; return true; } return false; }},
        stakeholders:{agendamentos:s=>{ const l=lista(s.responsibleNames); if(!l) return false; s.responsibleNames=l; return true; }}
      };
      for(const secao of Object.keys(mexer)){
        const ref=db.doc("projetos/"+pid+"/secoes/"+secao);
        let gravadoLocal=null;
        await db.runTransaction(async tx=>{
          gravadoLocal=null;
          const s=await tx.get(ref); if(!s.exists) return; const d=s.data(); const novo={}; let mudou=false;
          Object.keys(mexer[secao]).forEach(campo=>{ const itens=(d[campo]||[]).map(x=>Object.assign({},x)); itens.forEach(x=>{ if(mexer[secao][campo](x)){ mudou=true; trocas++; } }); novo[campo]=itens; });
          if(mudou){ tx.update(ref,Object.assign({},novo,{escritaId, atualizadoPor:est.email, atualizadoEm:FV.serverTimestamp()})); gravadoLocal=Object.assign({},d,novo,{escritaId}); }
        });
        if(gravadoLocal){ aplicarSecaoLocal(pid,secao,gravadoLocal); gravadoLocal=null; }
      }
    }
    await db.doc("config/pessoas").set({people:FV.arrayUnion(para), peopleHidden:FV.arrayUnion(de), escritaId},{merge:true});
    await db.doc("config/pessoas").set({people:FV.arrayRemove(de), escritaId},{merge:true});
    await db.doc("config/pessoas").set({peopleHidden:FV.arrayRemove(para), escritaId},{merge:true});
    return JSON.stringify({ok:true, trocas});
  }

  /* ---------------- operações ---------------- */
  function quemSou(){
    return { email:est.email, name:est.nome, souAdminMaster:est.adminSistema, adminSistema:est.adminSistema,
      cadastrado:cadastrado(), emailVerificado:!!(est.usuario && est.usuario.emailVerified),
      provedores:est.usuario ? (est.usuario.providerData||[]).map(p=>p&&p.providerId).filter(Boolean) : [] };
  }
  async function iniciar(){
    const u=auth.currentUser || await authPronto;
    if(!u) return JSON.stringify({precisaLogin:true});
    if(!est.usuario || est.email!==emailNorm(u.email)){ est.usuario=u; est.email=emailNorm(u.email); est.nome=u.displayName||""; }
    // e-mail e senha: só vale depois de confirmar o e-mail
    const viaSenha=(u.providerData||[]).some(p=>p && p.providerId==="password") && !(u.providerData||[]).some(p=>p && p.providerId!=="password");
    if(viaSenha && !u.emailVerified) return JSON.stringify({precisaVerificarEmail:true, who:{email:emailNorm(u.email)}});
    await carregarIdentidade();
    if(!cadastrado()) return JSON.stringify({semCadastro:true, who:quemSou()});
    await iniciarInscricoes();
    return JSON.stringify({who:quemSou(), data:montarDados()});
  }
  const operacoes={
    apiInit: iniciar,
    apiWhoAmI: async()=>{ await authPronto; return JSON.stringify(quemSou()); },
    apiLoad: async()=>JSON.stringify(montarDados()),
    apiCheck: async()=>JSON.stringify({version:est.versao, updatedAt:est.externas, updatedBy:est.mudouPor, sheetUpdatedAt:0, locks:clone(est.travas)||{}}),
    apiSaveDiff: salvarDiff,
    apiAcquireLock: pegarTrava,
    apiHeartbeatLock: renovarTrava,
    apiReleaseLock: soltarTrava,
    apiObservarTravas: async pid=>{ observarTravas(pid); return JSON.stringify({ok:true}); },
    apiGarantirSecoes: async pids=>{ const n=await garantirSecoes(pids||[]); return JSON.stringify({ok:true, projetos:n}); },
    apiRenomearNome: renomearNome,
    sair: async()=>{ Object.keys(est.inscr).forEach(cancelar); await auth.signOut(); return JSON.stringify({ok:true}); }
  };
  const backend={
    tipo:"firestore",
    chamar(fn,...args){
      const op=operacoes[fn] || (backend.extensoes && backend.extensoes[fn]);
      if(!op) return Promise.reject(new Error("Operação não disponível: "+fn));
      return Promise.resolve().then(()=>op(...args));
    },
    // usados pelos módulos de login, permissões e administração (etapas seguintes)
    firebase, app, auth, db, estado:est, authPronto, operacoes, extensoes:{},
    util:{ novoId, emailNorm, msDe, nomeDoEmail, calcularPapeis, papelNoProjeto, papelNoGrupo, montarDados, garantirSecoes, carregarIdentidade, cadastrado, quemSou, iniciarInscricoes }
  };
  return backend;
}
/* ============================================================
   CONFIGURAÇÃO E ARMAZENAMENTO

   O app roda em dois modos:
   - "servidor": um backend registrado em window.__BACKEND faz a leitura,
     a gravação, as travas e as demais operações (na versão final, o
     backend Firestore; nos testes, um backend falso);
   - "local": sem backend -- modo DEMONSTRAÇÃO, com os dados guardados só
     neste navegador (localStorage). Serve para conhecer o app sem
     instalar nada e para os testes.

   Contrato do backend: window.__BACKEND.chamar(nomeDaOperacao, ...args)
   devolve uma Promise com o resultado (os mesmos nomes de operação usados
   pelo app desde a versão Apps Script: apiInit, apiLoad, apiSaveDiff,
   apiAcquireLock...). Assim as telas não dependem de qual backend está
   por trás.

   MERGE POR ENTIDADE (em vez de reescrever tudo a cada gravação):
   guardamos uma "foto" do que já está confirmado como salvo
   (lastSyncedSnapshot). Na hora de gravar, comparamos essa foto com o
   estado atual e enviamos só os registros que a PESSOA realmente
   criou/editou/excluiu nesta sessão (o "diff"). Quem grava aplica esse
   diff em cima da versão mais recente -- tudo que a pessoa não tocou
   permanece como estava, mesmo que outra pessoa tenha salvo entretanto.
============================================================ */
const APP_CONFIG=Object.assign({
  nomeApp:"Gestão de Projetos",   // nome exibido no menu, na aba do navegador, nos relatórios e e-mails
  organizacao:"",                 // nome da organização (opcional; aparece nos relatórios)
  firebase:null,                  // configuração do projeto Firebase (preenchida na implantação)
  adminInicial:""                 // e-mail do primeiro Administrador do sistema
}, (typeof window!=="undefined" && window.APP_CONFIG) || {});
const KEY="gestao-projetos:dados";
/* backend: o dos testes (window.__BACKEND) ou o Firestore, quando o config.js
   traz a configuração do Firebase e o SDK carregou */
const FIREBASE_SEM_SDK = !!(APP_CONFIG.firebase && (typeof window==="undefined" || !window.firebase) && !(typeof window!=="undefined" && window.__BACKEND));
const BACKEND=(typeof window!=="undefined" && window.__BACKEND && typeof window.__BACKEND.chamar==="function") ? window.__BACKEND
  : (APP_CONFIG.firebase && typeof window!=="undefined" && window.firebase && typeof criarBackendFirestore==="function")
    ? criarBackendFirestore(window.firebase, APP_CONFIG.firebase, {app: window.__FIREBASE_APP||null})
    : null;
const MODE=(BACKEND||FIREBASE_SEM_SDK)?"servidor":"local";
// com Firestore a consulta de "mudou algo?" é local (o tempo real já trouxe); por isso pode ser frequente
const POLL_MS=MODE==="servidor"?(BACKEND&&BACKEND.tipo==="firestore"?2000:12000):5000;

function servidorCall(fn,...args){
  if(!BACKEND) return Promise.reject(new Error("Operação disponível só com servidor: "+fn));
  try{ return Promise.resolve(BACKEND.chamar(fn,...args)); }
  catch(e){ return Promise.reject(e); }
}
let dadosPreCarregados=null; // vem junto com "quem sou eu" na abertura (apiInit) -- 1 chamada a menos
async function rawGet(){
  if(MODE==="servidor"){
    if(dadosPreCarregados){ const d=dadosPreCarregados; dadosPreCarregados=null; return d; }
    try{ const s=await servidorCall("apiLoad"); return s?(typeof s==="string"?JSON.parse(s):s):null; }catch(e){ return null; }
  }
  try{ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return null; }
}

/* ---------- snapshot e diff (base do merge por entidade) ---------- */
const ENTITY_KEYS=["projects","tasks","risks","costs","stakeholders","portfolios","reportSchedules","eapNodes","responsibleContacts","tapData"];
function cloneEntities(d){
  const out={};
  ENTITY_KEYS.forEach(k=>{ out[k]=JSON.parse(JSON.stringify(d[k]||[])); });
  out.__meta=metaSnapshot(d);
  return out;
}
/* Itens "soltos" (fora das abas por entidade): linha de base, histórico,
   anos extras da TAP, lista de nomes e nomes ocultos. Antes iam INTEIROS
   em todo salvamento, e quem salvasse com dados desatualizados podia
   apagar o que outra pessoa tinha acabado de incluir. Agora só vai o que
   mudou nesta sessão, e o servidor SOMA (nunca substitui) as listas. */
function metaSnapshot(d){
  d=d||{};
  return {
    baselinesPorProjeto: Object.fromEntries((d.baselines||[]).map(b=>[b.projectId,JSON.stringify(b)])),
    histIds: (d.baselineHistory||[]).map(h=>h.id),
    tapYears: (d.customTapYears||[]).slice(),
    people: (d.people||[]).slice(),
    ocultos: (d.peopleHidden||[]).slice()
  };
}
function computeMetaDiff(){
  const b=(lastSyncedSnapshot&&lastSyncedSnapshot.__meta)||metaSnapshot({});
  const m={};
  // linha de base: só os projetos cuja linha de base mudou/foi removida nesta sessão
  // (mandar a lista inteira deixava uma aba desatualizada apagar a de outro projeto)
  const atuais=Object.fromEntries((DATA.baselines||[]).map(x=>[x.projectId,x]));
  const ups=Object.keys(atuais).filter(pid=>JSON.stringify(atuais[pid])!==(b.baselinesPorProjeto||{})[pid]).map(pid=>atuais[pid]);
  const dels=Object.keys(b.baselinesPorProjeto||{}).filter(pid=>!atuais[pid]);
  if(ups.length) m.baselinesUpsert=ups;
  if(dels.length) m.baselinesDel=dels;
  const hs=new Set(b.histIds); const hn=(DATA.baselineHistory||[]).filter(h=>!hs.has(h.id)); if(hn.length) m.baselineHistoryNew=hn;
  const ty=new Set(b.tapYears); const tn=(DATA.customTapYears||[]).filter(y=>!ty.has(y)); if(tn.length) m.customTapYearsNew=tn;
  const ps=new Set(b.people); const pn=(DATA.people||[]).filter(x=>!ps.has(x)); if(pn.length) m.peopleNew=pn;
  const os=new Set(b.ocultos), oa=new Set(DATA.peopleHidden||[]);
  const add=[...oa].filter(x=>!os.has(x)), del=[...os].filter(x=>!oa.has(x));
  if(add.length) m.peopleHiddenAdd=add;
  if(del.length) m.peopleHiddenDel=del;
  return m;
}
function diffArray(oldArr,newArr){
  const oldMap=new Map((oldArr||[]).map(x=>[String(x.id),x]));
  const newMap=new Map((newArr||[]).map(x=>[String(x.id),x]));
  const upsert=[], deleteIds=[];
  newMap.forEach((v,id)=>{
    const o=oldMap.get(id);
    if(!o||JSON.stringify(o)!==JSON.stringify(v)) upsert.push(v);
  });
  oldMap.forEach((v,id)=>{ if(!newMap.has(id)) deleteIds.push(id); });
  return {upsert,deleteIds};
}
function computeDirtyDiff(){
  const base=lastSyncedSnapshot||{};
  const out={};
  ENTITY_KEYS.forEach(k=>{ out[k]=diffArray(base[k]||[], DATA[k]||[]); });
  return out;
}
function diffIsEmpty(diff){
  return ENTITY_KEYS.every(k=>!diff[k].upsert.length && !diff[k].deleteIds.length);
}
// aplica um diff em cima do estado remoto mais recente — usado nos modos
// local/compartilhado, onde não há um servidor para fazer isso por nós
function applyDiffToSnapshot(remote,diff,meta){
  remote = remote || {};
  const uniao=(a,b)=>Array.from(new Set([...(a||[]),...(b||[])]));
  const histPorId=new Map((remote.baselineHistory||[]).map(h=>[h.id,h]));
  (meta.baselineHistoryNew||[]).forEach(h=>histPorId.set(h.id,h));
  let ocultos=uniao(remote.peopleHidden,meta.peopleHiddenAdd);
  const del=new Set(meta.peopleHiddenDel||[]); ocultos=ocultos.filter(x=>!del.has(x));
  const merged={
    version:(remote.version||0)+1,
    updatedAt: meta.updatedAt, updatedBy: meta.updatedBy,
    people: uniao(remote.people,meta.peopleNew),
    peopleHidden: ocultos,
    baselines: (()=>{ const por=new Map((remote.baselines||[]).map(x=>[x.projectId,x]));
      (meta.baselinesUpsert||[]).forEach(x=>por.set(x.projectId,x)); (meta.baselinesDel||[]).forEach(pid=>por.delete(pid));
      return Array.from(por.values()); })(),
    customTapYears: uniao(remote.customTapYears,meta.customTapYearsNew),
    baselineHistory: Array.from(histPorId.values()),
    locks: remote.locks, sheetUpdatedAt: remote.sheetUpdatedAt
  };
  ENTITY_KEYS.forEach(key=>{
    const delSet=new Set((diff[key].deleteIds||[]).map(String));
    const byId=new Map();
    (remote[key]||[]).forEach(x=>{ if(!delSet.has(String(x.id))) byId.set(String(x.id),x); });
    (diff[key].upsert||[]).forEach(x=>byId.set(String(x.id),x));
    merged[key]=Array.from(byId.values());
  });
  return merged;
}

async function rawSet(obj){
  const diff=computeDirtyDiff();
  const meta=Object.assign({ updatedAt:Date.now(), updatedBy:(obj.updatedBy||me||"Anônimo") }, computeMetaDiff());
  ultimosRecusados=[];

  if(MODE==="servidor"){
    // projetos criados nesta sessão (os demais, se sumiram do servidor, NÃO são recriados)
    const jaSalvos=new Set(((lastSyncedSnapshot||{}).projects||[]).map(p=>String(p.id)));
    const projetosNovos=(diff.projects.upsert||[]).map(p=>String(p.id)).filter(id=>!jaSalvos.has(id));
    const payload=JSON.stringify(Object.assign({ diff, projetosNovos }, meta));
    try{
      const s=await servidorCall("apiSaveDiff",payload);
      if(s){ const saved=typeof s==="string"?JSON.parse(s):s; if(saved){ obj.version=saved.version; if(saved.updatedAt!=null) obj.updatedAt=saved.updatedAt; ultimosRecusados=saved.recusados||[]; ultimasFalhas=saved.falhas||[];
        if(saved.acessoNovos && obj.acessoProjetos) Object.assign(obj.acessoProjetos,saved.acessoNovos); } }
      return true;
    }catch(e){ return false; }
  }else{
    try{
      const v=localStorage.getItem(KEY);
      const remote=v?JSON.parse(v):null;
      const merged=applyDiffToSnapshot(remote,diff,meta);
      localStorage.setItem(KEY,JSON.stringify(merged));
      obj.version=merged.version; obj.updatedAt=merged.updatedAt;
      return true;
    }catch(e){ return false; }
  }
}

/* Confere e limpa um modelo vindo da tela, do servidor ou de um arquivo.
   Devolve {modelo, erros}. Itens vazios e repetidos são descartados. */
function validarModelo(m){
  const erros=[];
  if(!m || typeof m!=="object"){ return {modelo:null, erros:["O arquivo não contém um modelo de configuração."]}; }
  const txt=v=>String(v==null?"":v).trim().slice(0,300);
  const unicos=lista=>{ const vistos=new Set(), out=[]; (Array.isArray(lista)?lista:[]).forEach(x=>{ const t=txt(x); if(t && !vistos.has(t.toLowerCase())){ vistos.add(t.toLowerCase()); out.push(t); } }); return out; };
  const out={perspectivas:[], listas:{}, camposTap:{}};
  if(Array.isArray(m.perspectivas)){
    const vistas=new Set();
    m.perspectivas.forEach(p=>{
      const nome=txt(p&&p.nome); if(!nome) return;
      if(vistas.has(nome.toLowerCase())){ erros.push(`Perspectiva repetida: "${nome}".`); return; }
      vistas.add(nome.toLowerCase());
      const cor=/^#[0-9a-f]{6}$/i.test(String(p.cor||"")) ? String(p.cor).toUpperCase() : "";
      const gerais=new Set(), objetivos=[];
      (Array.isArray(p.objetivos)?p.objetivos:[]).forEach(o=>{
        const g=txt(o&&o.nome); if(!g || gerais.has(g.toLowerCase())) return; gerais.add(g.toLowerCase());
        objetivos.push({nome:g, especificos:unicos(o.especificos)});
      });
      out.perspectivas.push({nome, cor, objetivos});
    });
    if(!out.perspectivas.length) erros.push("Inclua pelo menos uma perspectiva estratégica.");
  }else out.perspectivas=null; // ausente: mantém as do padrão
  const ls=(m.listas && typeof m.listas==="object") ? m.listas : {};
  LISTAS_CONFIGURAVEIS.forEach(l=>{
    if(!(l.chave in ls)) return;
    const v=unicos(ls[l.chave]);
    if(!v.length) erros.push(`A lista "${l.nome}" não pode ficar vazia.`); else out.listas[l.chave]=v;
  });
  const ct=(m.camposTap && typeof m.camposTap==="object") ? m.camposTap : {};
  Object.keys(ct).forEach(id=>{
    const c=CAMPO_TAP_POR_ID[id]; if(!c) return;
    const r=txt(ct[id]&&ct[id].rotulo), oc=!c.fixo && !!(ct[id]&&ct[id].oculto);
    if(r || oc) out.camposTap[id]=Object.assign(r?{rotulo:r}:{}, oc?{oculto:true}:{});
  });
  return {modelo:out, erros};
}

/* Aplica um modelo: volta tudo ao padrão de fábrica e então sobrepõe. */
function aplicarConfiguracoes(cfg){
  const trocar=(alvo,nova)=>{ alvo.splice(0,alvo.length,...nova); };
  const limparObj=o=>Object.keys(o).forEach(k=>delete o[k]);
  const v=cfg ? validarModelo(cfg).modelo : null;
  const persp=(v && v.perspectivas) || MODELO_PADRAO.perspectivas;
  trocar(PERSPECTIVAS_ESTRATEGICAS, persp.map(p=>p.nome));
  limparObj(PERSPECTIVA_CORES); limparObj(TAP_CASCATA_ESTRATEGICA);
  persp.forEach(p=>{
    if(p.cor) PERSPECTIVA_CORES[p.nome]=p.cor;
    TAP_CASCATA_ESTRATEGICA[p.nome]=Object.fromEntries((p.objetivos||[]).map(o=>[o.nome,(o.especificos||[]).slice()]));
  });
  LISTAS_CONFIGURAVEIS.forEach(l=>trocar(l.alvo, ((v && v.listas[l.chave]) || MODELO_PADRAO.listas[l.chave]).slice()));
  configuracoesAtuais = v ? {perspectivas:v.perspectivas, listas:v.listas, camposTap:v.camposTap} : null;
}

/* ============================================================
   CONTEXTO DE CÁLCULO (desempenho)

   Datas, status e progresso de uma atividade-pai são calculados a partir
   das filhas, recursivamente. Sem memória, o Painel refazia a mesma
   conta milhares de vezes (o tempo crescia com o quadrado do número de
   atividades: ~1,6 s com 1.560 atividades). Durante um render() abrimos
   um contexto com um índice "pai -> filhas" e guardamos cada resultado;
   fora do render (modais, exportação, testes) tudo continua sendo
   calculado na hora, sem risco de valor velho.

   PROTEÇÃO CONTRA CICLOS: se por algum motivo uma atividade acabar
   "dentro" de uma descendente dela (A filha de B e B filha de A), as
   funções recursivas entravam em laço infinito e travavam a tela. Agora
   (1) os ciclos são desfeitos ao carregar (quebrarCiclos) e (2) cada
   cálculo recursivo detecta quando está revisitando a mesma atividade e
   para ali, em vez de travar.
============================================================ */
let _calc=null, _calcProf=0;
function calcBegin(){
  if(_calcProf++>0) return;
  const filhos=new Map(), porId=new Map();
  for(const t of DATA.tasks){
    porId.set(t.id,t);
    if(t.parentId){ let a=filhos.get(t.parentId); if(!a) filhos.set(t.parentId,a=[]); a.push(t); }
  }
  _calc={filhos,porId,filhosDoProjeto:new Map(),memo:{}};
}
function calcEnd(){ if(--_calcProf<=0){ _calcProf=0; _calc=null; } }
function kidsOf(t){ if(_calc) return _calc.filhos.get(t.id)||[]; return DATA.tasks.filter(x=>x.parentId===t.id); }
const _pilhaCalc=new Set();
function memoCalc(nome,t,fn,seCiclo){
  const chave=nome+"|"+t.id;
  if(_pilhaCalc.has(chave)) return seCiclo;          // ciclo: para aqui em vez de travar
  let m=null;
  if(_calc){ m=_calc.memo[nome]||(_calc.memo[nome]=new Map()); if(m.has(t.id)) return m.get(t.id); }
  _pilhaCalc.add(chave);
  let v;
  try{ v=fn(); } finally { _pilhaCalc.delete(chave); }
  if(m) m.set(t.id,v);
  return v;
}
/* Desfaz vínculos de "pai" impossíveis: ciclos (A dentro de B e B dentro
   de A, ou a atividade dentro dela mesma), pai inexistente ou pai de outro
   projeto. O nó que fecha o ciclo vira item do nível principal. Devolve
   a lista dos itens corrigidos. Serve para atividades e para a EAP. */
function quebrarCiclos(lista){
  const porId=new Map((lista||[]).map(x=>[x.id,x]));
  const corrigidos=[];
  for(const n of (lista||[])){
    const vistos=new Set([n.id]); let cur=n;
    while(cur.parentId){
      const pai=porId.get(cur.parentId);
      if(!pai || pai.projectId!==cur.projectId || cur.parentId===cur.id || vistos.has(pai.id)){
        cur.parentId=null; corrigidos.push(cur); break;
      }
      vistos.add(pai.id); cur=pai;
    }
  }
  return corrigidos;
}

function descendants(t){

  const walk=x=>{ for(const k of kidsOf(x)){ if(vistos.has(k.id)) continue; vistos.add(k.id); out.push(k); walk(k); } };
  walk(t); return out;
}

}

}

/* ============================================================
   STATUS EFETIVO

   Regras, nesta ordem de precedencia:
   1. Atividade COM subatividades -> sempre derivado das subatividades
      (o status do pai e um resumo, nao faz sentido edita-lo).
   2. Atividade SEM subatividades com marcacao manual -> respeita o manual.
   3. Atividade SEM subatividades sem marcacao -> derivado das datas.

   A edicao manual (statusManual=true) e gravada quando a pessoa
   escolhe o status no formulario ou arrasta o cartao.
============================================================ */
function deriveStatusFromDates(t){
  const hoje=todayISO();
  if(t.actualEnd) return "concluida";
  if(t.actualStart) return t.actualStart<=hoje ? "em_andamento" : "nao_iniciada";
  if(t.plannedStart && t.plannedStart<=hoje) return "em_andamento";
  return "nao_iniciada";
}
function deriveStatusFromChildren(kids){
  const sts=kids.map(effStatus);
  const vivos=sts.filter(s=>s!=="cancelada");
  if(!vivos.length) return "cancelada";                       // todas canceladas
  if(vivos.every(s=>s==="concluida")) return "concluida";     // todas concluidas
  if(vivos.every(s=>s==="nao_iniciada")) return "nao_iniciada";
  return "em_andamento";                                       // qualquer mistura
}
function effStatus(t){
  if(!t) return "nao_iniciada";
  return memoCalc("st",t,()=>{
    const kids=kidsOf(t);
    if(kids.length) return deriveStatusFromChildren(kids);
    if(t.statusManual) return t.status||"nao_iniciada";
    return deriveStatusFromDates(t);
  },"nao_iniciada");
}
function projStatus(pid){
  const roots=childrenOf(pid,null);
  return roots.length ? deriveStatusFromChildren(roots) : "nao_iniciada";
}

/* ============================================================
   DATAS EFETIVAS

   Atividade sem subatividades -> usa a propria data.
   Atividade com subatividades  -> inicio = menor inicio entre elas.
                             fim    = maior fim, MAS so quando TODAS
                                      estiverem concluidas. Enquanto
                                      houver pendencia, o fim fica vazio,
                                      porque o pai ainda nao terminou.
   Marco -> inicio e fim sao sempre a mesma data.
============================================================ */
function effPlannedStart(t){
  return memoCalc("ps",t,()=>{
    const kids=kidsOf(t);
    if(!kids.length) return t.isMilestone ? (t.plannedEnd||t.plannedStart||"") : (t.plannedStart||"");
    const vals=kids.map(effPlannedStart).filter(Boolean);
    return vals.length ? vals.reduce((a,b)=>a<b?a:b) : "";
  },"");
}
function effPlannedEnd(t){
  return memoCalc("pe",t,()=>{
    const kids=kidsOf(t);
    if(!kids.length) return t.isMilestone ? (t.plannedEnd||t.plannedStart||"") : (t.plannedEnd||"");
    const vals=kids.map(effPlannedEnd).filter(Boolean);
    return vals.length ? vals.reduce((a,b)=>a>b?a:b) : "";
  },"");
}
function effActualStart(t){
  return memoCalc("as",t,()=>{
    const kids=kidsOf(t);
    if(!kids.length) return t.isMilestone ? (t.actualEnd||t.actualStart||"") : (t.actualStart||"");
    const vals=kids.map(effActualStart).filter(Boolean);
    return vals.length ? vals.reduce((a,b)=>a<b?a:b) : "";
  },"");
}
function effActualEnd(t){
  return memoCalc("ae",t,()=>{
    const kids=kidsOf(t);
    if(!kids.length) return t.isMilestone ? (t.actualEnd||t.actualStart||"") : (t.actualEnd||"");
    // o pai so tem data de fim quando TODAS as subatividades terminaram
    const relevantes=kids.filter(k=>effStatus(k)!=="cancelada");
    if(!relevantes.length) return "";
    const vals=relevantes.map(effActualEnd);
    if(vals.some(v=>!v)) return "";           // ainda ha subatividade em aberto
    return vals.reduce((a,b)=>a>b?a:b);
  },"");
}
// Rollup de datas no nível do PROJETO (mesmo princípio da atividade-pai)
function projPlannedStart(pid){ const vals=childrenOf(pid,null).map(effPlannedStart).filter(Boolean); return vals.length?vals.reduce((a,b)=>a<b?a:b):""; }
function projPlannedEnd(pid){ const vals=childrenOf(pid,null).map(effPlannedEnd).filter(Boolean); return vals.length?vals.reduce((a,b)=>a>b?a:b):""; }
function projActualStart(pid){ const vals=childrenOf(pid,null).map(effActualStart).filter(Boolean); return vals.length?vals.reduce((a,b)=>a<b?a:b):""; }
function projActualEnd(pid){
  const roots=childrenOf(pid,null).filter(t=>effStatus(t)!=="cancelada");
  if(!roots.length) return "";
  const vals=roots.map(effActualEnd);
  if(vals.some(v=>!v)) return "";           // projeto so encerra com tudo concluido
  return vals.reduce((a,b)=>a>b?a:b);
}
// Normaliza um marco: inicio e fim sempre iguais
/* MARCO: só as datas de FIM (planejado e execução) são editáveis; o início
   acompanha o fim. Se só o início estiver preenchido (dado antigo), ele
   vira o fim. Assim nunca existe "fim antes do início" num marco. */
function normalizeMilestone(t){
  if(!t || !t.isMilestone) return t;
  const pe=t.plannedEnd||t.plannedStart||"";
  t.plannedStart=pe; t.plannedEnd=pe;
  const ae=t.actualEnd||t.actualStart||"";
  t.actualStart=ae; t.actualEnd=ae;
  return t;
}

/* ============================================================
   BIBLIOTECAS SOB DEMANDA (desempenho)
   Excel (xlsx), PDF (html2pdf) e zip (jszip) somam ~2 MB e eram baixadas
   e interpretadas ANTES de o app aparecer, toda vez que alguém o abria.
   Agora só carregam na primeira vez que alguém exporta, importa ou gera
   um PDF (e ficam no cache do navegador depois disso).
============================================================ */
const LIBS={
  xlsx:{global:"XLSX",url:"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"},
  jszip:{global:"JSZip",url:"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"},
  html2pdf:{global:"html2pdf",url:"https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"}
};
const _libsCarregando={};
function garantirLib(nome){
  const lib=LIBS[nome];
  if(!lib || typeof window[lib.global]!=="undefined") return Promise.resolve(true);
  if(window.__semLibsExternas) return Promise.resolve(false); // ambiente de teste sem rede
  if(_libsCarregando[nome]) return _libsCarregando[nome];
  _libsCarregando[nome]=new Promise(res=>{
    const sc=document.createElement("script");
    sc.src=lib.url; sc.async=true;
    const falhou=()=>{ delete _libsCarregando[nome]; res(false); };
    const limite=setTimeout(falhou,20000); // rede bloqueada: desiste em vez de esperar para sempre
    sc.onload=()=>{ clearTimeout(limite); res(typeof window[lib.global]!=="undefined"); };
    sc.onerror=()=>{ clearTimeout(limite); falhou(); };
    document.head.appendChild(sc);
  });
  return _libsCarregando[nome];
}
// "obrigatoria" decide o resultado; as opcionais só melhoram (ex.: jszip = listas suspensas no Excel)
async function garantirLibs(obrigatoria,...opcionais){
  const demorou=setTimeout(()=>toast("Carregando…"),400);
  const r=await Promise.all([obrigatoria,...opcionais].map(garantirLib));
  clearTimeout(demorou);
  return r[0];
}
