// Percorre a árvore de atividades do projeto na mesma ordem que o Cronograma
// usa (pai, depois seus filhos, recursivamente) -- em vez de ordenar todas
// as atividades juntas pelo campo `order`, que só é válido dentro do mesmo
// nível hierárquico.
function treeOrderTasks(projectId){
  const out=[];
  const walk=(parentId,depth)=>{
    childrenOf(projectId,parentId).forEach(t=>{
      out.push({task:t,depth});
      walk(t.id,depth+1);
    });
  };
  walk(null,0);
  return out;
}

function renderBaseline(projectId){
  const p=projOf(projectId); if(!p) return emptyState("Projeto não encontrado","");
  const baseline=baselineOf(projectId);
  const ordenadas=treeOrderTasks(projectId);
  const todas=ordenadas.map(o=>o.task);

  const header=`<div class="bl-head">
    <div>
      ${baseline
        ? `<span class="pill st-con">Linha de base ativa</span> <span class="hint" style="display:inline">definida em ${fmtBRfull(new Date(baseline.createdAt).toISOString().slice(0,10))} por ${esc(baseline.createdBy||"—")}</span>`
        : `<span class="pill st-nao">Sem linha de base</span> <span class="hint" style="display:inline">defina uma para comparar o planejamento atual com o combinado originalmente</span>`}
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn primary" id="blDefine">${baseline?"Redefinir linha de base":"Definir linha de base"}</button>
      ${baseline?`<button class="btn" id="blClear">Remover</button>`:""}
      <button class="btn" id="blHistory">Histórico de linhas de base</button>
    </div>
  </div>`;

  if(!baseline){
    return header+emptyState("Nenhuma comparação disponível","Defina a linha de base acima para começar a acompanhar o desvio do cronograma.");
  }
  if(!todas.length){
    return header+emptyState("Este projeto não tem atividades","");
  }

  const modo = baselineCompareMode==="exec" ? "exec" : "plan";
  const toggle=`<div class="view-toggle no-print" style="margin-top:14px">
    <button class="vtbtn ${modo==="plan"?"on":""}" data-blmode="plan">Comparar com o planejado</button>
    <button class="vtbtn ${modo==="exec"?"on":""}" data-blmode="exec">Comparar com o executado</button>
  </div>`;

  const linhas=ordenadas.map(({task:t,depth})=>{
    const bt=baselineTaskOf(baseline,t.id);
    const semBase=!bt;
    const curIni = modo==="exec" ? effActualStart(t) : effPlannedStart(t);
    const curFim = modo==="exec" ? effActualEnd(t)   : effPlannedEnd(t);
    const semExec = modo==="exec" && !curFim;
    const desvioIni = (semBase||!curIni) ? null : diasEntre(bt.plannedStart,curIni);
    const desvioFim = (semBase||!curFim) ? null : diasEntre(bt.plannedEnd,curFim);
    const desviar=(n,vazio)=>{
      if(vazio) return `<span class="hint" style="display:inline">${modo==="exec"?"ainda não concluída":"sem base"}</span>`;
      if(n===null) return `<span class="hint" style="display:inline">sem base</span>`;
      if(n===0) return `<span class="mono" style="color:var(--exec)">no prazo</span>`;
      const atraso=n>0;
      return `<span class="mono" style="color:${atraso?"var(--danger)":"var(--exec)"};font-weight:700">${atraso?"+":""}${n}d</span>`;
    };
    return `<tr data-edit="${t.id}" style="cursor:pointer">
      <td style="padding-left:${14+depth*20}px">${esc(t.name)}</td>
      <td class="dt plan">${semBase?"—":fmtBR(bt.plannedStart)}</td>
      <td class="dt plan">${semBase?"—":fmtBR(bt.plannedEnd)}</td>
      <td class="dt plan">${fmtBR(curIni)||(modo==="exec"?"—":"")}</td>
      <td class="dt plan">${fmtBR(curFim)||(modo==="exec"?"—":"")}</td>
      <td>${desviar(desvioIni, modo==="exec"&&!curIni)}</td>
      <td>${desviar(desvioFim, semExec)}</td>
    </tr>`;
  }).join("");

  const comBase=todas.filter(t=>baselineTaskOf(baseline,t.id));
  const relevantes = modo==="exec" ? comBase.filter(t=>effActualEnd(t)) : comBase;
  const atrasadas=relevantes.filter(t=>{
    const bt=baselineTaskOf(baseline,t.id);
    const fim = modo==="exec" ? effActualEnd(t) : effPlannedEnd(t);
    const d=diasEntre(bt.plannedEnd,fim);
    return d>0;
  }).length;

  return header+toggle+`
  <div class="grid-kpi" style="margin-top:14px">
    <div class="kpi"><div class="lab">Atividades comparáveis</div><div class="val">${relevantes.length}</div><div class="sub">de ${todas.length} no total${modo==="exec"?" · só as já concluídas":""}</div></div>
    <div class="kpi"><div class="lab">Com atraso em relação à base</div><div class="val ${atrasadas?"warn":"exec"}">${atrasadas}</div></div>
  </div>
  <div class="panel" style="margin-top:14px">
    <h2>${modo==="exec"?"Executado":"Planejado"} × linha de base</h2>
    <div class="tbl-wrap"><table class="crono">
      <thead><tr>
        <th>Atividade</th><th>Início base</th><th>Fim base</th><th>Início ${modo==="exec"?"executado":"atual"}</th><th>Fim ${modo==="exec"?"executado":"atual"}</th><th>Desvio início</th><th>Desvio fim</th>
      </tr></thead>
      <tbody>${linhas}</tbody>
    </table></div>
  </div>`;
}
/* ============================================================
   CASCATA DE DATAS POR PREDECESSORA (B6)

   Quando o Fim Planejado de uma atividade muda, verifica duas coisas:

   PARTE 1 — atividades que dependem dela por PREDECESSORA FORMAL (o
   vínculo já existente no botão de predecessora). Vem marcada por
   padrão, e propaga em cadeia (se a sucessora também tem sucessoras,
   entram na lista também).

   PARTE 2 — outras atividades do projeto cuja DATA DE INÍCIO coincide
   com a data de fim ANTIGA da atividade alterada, mesmo sem vínculo
   formal. É só uma coincidência, não uma relação que o sistema
   realmente conhece — por isso vem DESMARCADA por padrão. Se
   confirmada, a atividade encontrada entra na cadeia de predecessoras
   formais dali para frente (se ela também for predecessora de outras),
   mas a busca por coincidência NÃO se repete a partir dela.

   Só mexe em datas PLANEJADAS — datas de execução já registradas
   nunca são deslocadas automaticamente, pelo mesmo princípio usado
   na importação.
============================================================ */
function findCascadeCandidates(projectId,taskId,oldEnd,newEnd){
  if(!oldEnd||!newEnd||oldEnd===newEnd) return null;
  const delta=diasEntre(oldEnd,newEnd);
  if(!delta) return null;

  const visitados=new Set([taskId]);
  const formal=[];
  const bfsFormalFrom=(startId)=>{
    let fronteira=[startId];
    while(fronteira.length){
      const proxima=[];
      fronteira.forEach(id=>{
        DATA.tasks.filter(t=>t.projectId===projectId && (t.predecessors||[]).includes(id)).forEach(s=>{
          if(visitados.has(s.id)) return;
          visitados.add(s.id);
          formal.push({task:s, delta});
          proxima.push(s.id);
        });
      });
      fronteira=proxima;
    }
  };
  // Parte 1: cadeia de predecessoras formais a partir da atividade alterada
  bfsFormalFrom(taskId);

  // Parte 2: coincidência de datas, fora do que já apareceu na parte 1
  const coincid=DATA.tasks
    .filter(t=>t.projectId===projectId && t.id!==taskId && !visitados.has(t.id) && t.plannedStart===oldEnd)
    .map(t=>({task:t, delta}));

  // Regra combinada: se uma atividade encontrada por coincidência TAMBÉM for
  // predecessora formal de outras, essas entram na Parte 1 (mesmo
  // princípio da cadeia normal) — mas a busca por COINCIDÊNCIA não se
  // repete a partir dela (só relações formais propagam a partir daqui).
  coincid.forEach(c=>visitados.add(c.task.id));
  coincid.forEach(c=>bfsFormalFrom(c.task.id));

  if(!formal.length && !coincid.length) return null;
  return {delta, formal, coincid};
}

function applyCascadeShift(task,deltaDias){
  const soma=(iso)=>{ if(!iso) return iso; const d=parseD(iso); d.setDate(d.getDate()+deltaDias); return d.toISOString().slice(0,10); };
  task.plannedStart=soma(task.plannedStart);
  task.plannedEnd=soma(task.plannedEnd);
  normalizeMilestone(task);
}

/* Chamada depois de qualquer salvamento que possa ter mudado o Fim
   Planejado de uma atividade (modal completo ou edição por duplo clique).
   Se houver candidatos, pergunta; senão, não interrompe o fluxo. */
async function offerCascadeIfNeeded(projectId,taskId,taskName,oldEnd,newEnd){
  const cand=findCascadeCandidates(projectId,taskId,oldEnd,newEnd);
  if(!cand) return;
  // a janela da cascata também edita o projeto: pega a trava (solta ao fechar)
  if(MODE==="servidor" && !(await pegarTravaParaJanela(tk(projectId,"cronograma")))) return;
  openCascadeModal(taskName,cand);
}

function openCascadeModal(taskName,cand){
  const secao=(chave,titulo,ajuda,lista,marcadoPadrao)=>{
    if(!lista.length) return "";
    return `<div class="field">
      <label>${titulo}</label>
      <p class="hint" style="margin-top:-2px">${ajuda}</p>
      <div class="casc-list">
        ${lista.map((c,i)=>`<label class="casc-row">
          <input type="checkbox" class="casc-chk" data-grupo="${chave}" data-idx="${i}" ${marcadoPadrao?"checked":""}>
          <span class="casc-name">${esc(c.task.name)}</span>
          <span class="mono casc-delta">${c.delta>0?"+":""}${c.delta}d</span>
        </label>`).join("")}
      </div>
    </div>`;
  };
  const body=`
    <p class="hint" style="margin-top:-4px">A data de fim de "<strong>${esc(taskName)}</strong>" mudou (${cand.delta>0?"+":""}${cand.delta} dia${Math.abs(cand.delta)===1?"":"s"}). Quer atualizar junto as atividades relacionadas? Só as datas <strong>planejadas</strong> são deslocadas — datas de execução já registradas não são tocadas.</p>
    ${secao("formal","Atividades vinculadas por predecessora","Têm vínculo formal com esta atividade — atualizar é o esperado.",cand.formal,true)}
    ${secao("coincid","Atividades com data de início coincidente","Só coincidem por data, sem vínculo cadastrado — confira antes de marcar.",cand.coincid,false)}
  `;
  showModal("Atualizar atividades relacionadas?",body,
    `<button class="btn" id="casc_skip">Não atualizar</button><button class="btn primary" id="casc_go">Atualizar selecionadas</button>`,false);
  $("#casc_skip").onclick=closeModal;
  $("#casc_go").onclick=async()=>{
    const marcados=$$(".casc-chk:checked");
    const alvos=marcados.map(chk=>{
      const grupo=chk.dataset.grupo, idx=+chk.dataset.idx;
      return (grupo==="formal"?cand.formal:cand.coincid)[idx];
    });
    alvos.forEach(a=>applyCascadeShift(a.task,a.delta));
    closeModal();
    if(alvos.length){ await persist(); render(); toast(`${alvos.length} atividade(s) atualizada(s) em cadeia`); }
  };
}
/* ============================================================
   EDIÇÃO POR DUPLO CLIQUE (B5)

   Duplo clique numa célula de Responsável, Status ou qualquer uma das
   4 datas troca a célula por um campo editável ali mesmo, sem abrir o
   formulário completo. Enter ou clicar fora salva; Esc cancela.

   O formulário completo (ícone de editar) continua existindo para
   quando for mexer em vários campos de uma vez.

   Sempre que o Fim Planejado muda por aqui, a cascata de predecessoras
   (B6) é oferecida, igual ao que acontece salvando pelo formulário.
============================================================ */
function startInlineEdit(td,taskId){
  if(isReadOnly()) return;
  const t=taskOf(taskId); if(!t) return;
  if(isLockedByOther(tk(t.projectId,"cronograma"))){ toast("Projeto em edição por "+lockHolderName(tk(t.projectId,"cronograma")),true); return; }
  if(td.querySelector("input,select")) return; // já em edição
  const campo=td.dataset.dblfield;
  if(!campo) return;
  if(["plannedStart","plannedEnd","actualStart","actualEnd"].includes(campo) && hasChildren(t)) return; // rollup, não editável

  const original=td.innerHTML;
  let input;

  if(campo==="assignee"){
    input=document.createElement("input");
    input.value=t.assignee||"";
    input.setAttribute("list","dbl_people");
    let dl=document.getElementById("dbl_people");
    if(!dl){ dl=document.createElement("datalist"); dl.id="dbl_people"; document.body.appendChild(dl); }
    dl.innerHTML=nomesSugeridos().map(p=>`<option value="${esc(p)}">`).join("");
  }else if(campo==="status"){
    input=document.createElement("select");
    const auto=`<option value="__auto__" ${!t.statusManual?"selected":""}>Automático (${statusObj(deriveStatusFromDates(t)).label})</option>`;
    const opts=STATUS.map(s=>`<option value="${s.id}" ${t.statusManual&&t.status===s.id?"selected":""}>${s.label}</option>`).join("");
    input.innerHTML=auto+opts;
  }else{
    input=document.createElement("input");
    input.type="date";
    input.value=t[campo]||"";
    if(t.isMilestone && (campo==="plannedStart"||campo==="actualStart")) input.disabled=true; // marco: só o fim é editável
  }
  input.className="dbl-input";
  td.innerHTML=""; td.appendChild(input); input.focus();
  if(input.select) input.select();

  let salvo=false;
  const commit=async()=>{
    if(salvo) return; salvo=true;
    const lockRes=await acquireLock(tk(t.projectId,"cronograma"));
    if(!lockRes.ok){ toast(msgTrava(lockRes),true); td.innerHTML=original; return; }
    // a atualização automática pode ter trocado os dados enquanto a pessoa digitava:
    // aplica a mudança na versão ATUAL da atividade (senão ela se perderia)
    const tx=taskOf(taskId);
    if(!tx){ toast("Esta atividade foi excluída por outra pessoa",true); await releaseLock(tk(t.projectId,"cronograma")); render(); return; }

    let cascataDelta=null;
    if(campo==="assignee"){
      tx.assignee=input.value.trim();
    }else if(campo==="status"){
      const v=input.value;
      if(v==="__auto__"){ tx.statusManual=false; tx.status=deriveStatusFromDates(tx); }
      else{ tx.statusManual=true; tx.status=v; if(v==="concluida"&&!tx.actualEnd) tx.actualEnd=todayISO(); }
    }else{
      const antes=tx[campo];
      let novo=input.value;
      tx[campo]=novo;
      // marco: o início acompanha o fim (inclusive quando o fim é apagado)
      if(tx.isMilestone && /End$/.test(campo)) tx[campo.replace("End","Start")]=novo;
      normalizeMilestone(tx);
      if(campo==="plannedEnd" && antes && tx.plannedEnd && antes!==tx.plannedEnd){
        cascataDelta={oldEnd:antes,newEnd:tx.plannedEnd};
      }
    }
    await persist();
    // solta a trava (antes ela ficava presa até expirar, bloqueando o projeto por até 90 s)
    const emUso = activeLockProjectId===tk(tx.projectId,"cronograma");
    if(!emUso) await releaseLock(tk(tx.projectId,"cronograma"));
    render();
    if(cascataDelta) offerCascadeIfNeeded(tx.projectId,tx.id,tx.name,cascataDelta.oldEnd,cascataDelta.newEnd);
  };
  const cancel=()=>{ if(salvo) return; salvo=true; td.innerHTML=original; };

  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault(); commit(); }
    else if(e.key==="Escape"){ e.preventDefault(); cancel(); }
  });
  input.addEventListener("blur",()=>setTimeout(commit,120));
  if(input.tagName==="SELECT") input.addEventListener("change",commit);
}
/* ============================================================
   MATRIZ DE STAKEHOLDERS (Poder × Interesse)

   Lógica dos quadrantes (fixa, não editável por configuração):

   - GERENCIAR COM ATENÇÃO — poder 3-4 e interesse 3-4
   - MANTER SATISFEITO      — poder 3-4 e interesse 1-2
   - MANTER INFORMADO       — poder 1-2 e interesse 3-4
   - MONITORAR              — poder 1-2 e interesse 1-2

   Por projeto (mesmo padrão de Riscos/Custos). Visualização em grade de
   4 quadrantes + gráfico de dispersão (cada stakeholder é um ponto nas
   coordenadas exatas de poder/interesse). Pode duplicar a matriz inteira
   de um projeto para outro.
============================================================ */
const QUADRANT_META={
  gerenciar:  {label:"Gerenciar com Atenção", cls:"st-can"},
  satisfeito: {label:"Manter Satisfeito",      cls:"st-and"},
  informado:  {label:"Manter Informado",       cls:"st-con"},
  monitorar:  {label:"Monitorar",              cls:"st-nao"},
};
const QUADRANT_STRATEGY={
  gerenciar:  "Envolver de perto, manter reuniões frequentes, alinhar expectativas, antecipar riscos e tratar decisões críticas com prioridade.",
  satisfeito: "Comunicar pontos executivos, evitar excesso de detalhes, manter expectativas sob controle e prevenir resistência.",
  informado:  "Manter comunicação recorrente, oferecer transparência, abrir canais de dúvida e informar mudanças relevantes.",
  monitorar:  "Acompanhar periodicamente, atualizar apenas quando necessário e observar sinais de mudança de interesse ou influência.",
};
function stakeholderQuadrant(power,interest){
  const altoPoder=power>=3, altoInteresse=interest>=3;
  if(altoPoder&&altoInteresse) return "gerenciar";
  if(altoPoder&&!altoInteresse) return "satisfeito";
  if(!altoPoder&&altoInteresse) return "informado";
  return "monitorar";
}

function renderStakeholders(projectId){
  const p=projOf(projectId); if(!p) return emptyState("Projeto não encontrado","");
  const lista=DATA.stakeholders.filter(s=>s.projectId===projectId);

  // pontos do grafico de dispersao: posicionados por interesse (x) e poder (y, invertido pois y cresce pra baixo na tela)
  const pct=v=>((v-0.5)/4)*100;
  const LBL_H=17; // altura aproximada do rotulo, em px
  const PLOT_PX=480; // tamanho renderizado estimado do grafico (quadrado) -- só para decidir colisões, não precisa ser exato
  // perto da borda direita, o rotulo viraria pra fora do grafico e cortaria
  // (o quadro tem overflow:hidden pra manter os cantos arredondados) --
  // entao perto da direita o texto vai pra esquerda do ponto, e vice-versa.
  const posicoes=lista.map(s=>{
    const ladoEsquerda=s.interest>=3;
    const largura=s.name.length*5.8+16; // estimativa de largura do rotulo, em px (sem teto -- o nome tem que caber inteiro)
    return { s, xPx:(pct(s.interest)/100)*PLOT_PX, yPx:(pct(s.power)/100)*PLOT_PX, ladoEsquerda, largura, offsetV:0 };
  });
  // caixa aproximada do rotulo (em px), dado um deslocamento vertical
  const caixaDe=(p,offsetV)=>{
    const esquerda = p.ladoEsquerda ? p.xPx-16-p.largura : p.xPx+16;
    return { l:esquerda, r:esquerda+p.largura, t:p.yPx-LBL_H/2+offsetV, b:p.yPx+LBL_H/2+offsetV };
  };
  const colidem=(a,b)=> !(a.r<b.l || b.r<a.l || a.b<b.t || b.b<a.t);
  // resolve colisoes: empurra o rotulo pra baixo/cima em passos até não
  // sobrepor mais nenhum rotulo já posicionado antes dele
  posicoes.forEach((a,i)=>{
    const passo=LBL_H+3;
    const candidatos=[0,passo,-passo,2*passo,-2*passo,3*passo,-3*passo,4*passo,-4*passo,5*passo,-5*passo];
    for(const cand of candidatos){
      a.offsetV=cand;
      const caixaA=caixaDe(a,a.offsetV);
      const bateu=posicoes.slice(0,i).some(b=>colidem(caixaA,caixaDe(b,b.offsetV)));
      if(!bateu) break;
    }
  });
  const pontos=posicoes.map(({s,ladoEsquerda,offsetV})=>{
    const q=stakeholderQuadrant(s.power,s.interest);
    const classes=ladoEsquerda?"lbl-left":"lbl-right";
    return `<div class="stq-dot ${QUADRANT_META[q].cls}" data-editstake="${s.id}"
      style="left:${pct(s.interest)}%;bottom:${pct(s.power)}%"
      title="${esc(s.name)} — poder ${s.power}, interesse ${s.interest}">
      <span class="stq-dot-label ${classes}" style="margin-top:${offsetV}px">${esc(s.name)}</span>
    </div>`;
  }).join("");

  const grade=`<div class="stq-wrap">
    <div class="stq-axis-y">Poder / Influência</div>
    <div class="stq-plot-col">
      <div class="stq-plot" id="stqPlot">
        <div class="stq-quad-bg">
          <div class="stq-quad stq-q-tl"><span>Manter Satisfeito</span></div>
          <div class="stq-quad stq-q-tr"><span>Gerenciar com Atenção</span></div>
          <div class="stq-quad stq-q-bl"><span>Monitorar</span></div>
          <div class="stq-quad stq-q-br"><span>Manter Informado</span></div>
        </div>
        ${pontos}
      </div>
      <div class="stq-axis-x">Interesse</div>
    </div>
  </div>`;

  const linhas=lista.map(s=>{
    const q=stakeholderQuadrant(s.power,s.interest), meta=QUADRANT_META[q];
    const task=s.taskId?taskOf(s.taskId):null;
    const contatos=[
      s.email?`<span class="sig note" title="${esc(s.email)}"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg></span>`:"",
      s.phone?`<span class="sig note" title="${esc(s.phone)}"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>`:"",
    ].filter(Boolean).join("");
    return `<tr>
      <td data-editstake="${s.id}" style="cursor:pointer">${esc(s.name)}</td>
      <td>${esc(s.organization||"—")}</td>
      <td>${contatos||`<span style="color:var(--muted)">—</span>`}</td>
      <td>${task?`<span class="link-tag" title="Vinculado a: ${esc(task.name)}">🔗 ${esc(task.name)}</span>`:"—"}</td>
      <td class="mono">${s.power}</td>
      <td class="mono">${s.interest}</td>
      <td><span class="pill ${meta.cls}">${meta.label}</span></td>
      <td class="no-print"><button class="iconbtn" data-delstake="${s.id}" title="Excluir"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></td>
    </tr>`;
  }).join("") || `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:22px">Nenhum stakeholder cadastrado.</td></tr>`;

  return `
  <div class="panel">
    <h2>Matriz de stakeholders <span class="badge">${lista.length}</span>
      <button class="btn" id="stkDuplicate" style="margin-left:auto">Duplicar para outro projeto</button>
      <button class="btn primary" id="stkGerenciarEnvios">Gerenciador de envios</button>
    </h2>
    ${lista.length?grade:emptyState("Nenhum stakeholder ainda","Cadastre abaixo para ver a matriz.")}
    <div class="legend" style="margin-top:14px">
      <span><i style="background:var(--danger)"></i> Gerenciar com atenção</span>
      <span><i style="background:var(--warn)"></i> Manter satisfeito</span>
      <span><i style="background:#1098AD"></i> Manter informado</span>
      <span><i style="background:var(--muted)"></i> Monitorar</span>
    </div>
  </div>
  <div class="panel">
    <h2>Stakeholders cadastrados <span class="badge">${lista.length}</span>
      <button class="btn primary" id="newStakeBtn" style="margin-left:auto">+ Novo stakeholder</button>
    </h2>
    <div class="tbl-wrap"><table class="crono">
      <thead><tr><th>Nome</th><th>Organização/cargo</th><th>Contato</th><th>Atividade vinculada</th><th>Poder</th><th>Interesse</th><th>Quadrante</th><th class="no-print"></th></tr></thead>
      <tbody>${linhas}</tbody>
    </table></div>
  </div>`;
}

============================================================ */
async function openStakeholderModal(id,presetProjectId){
  if(blockIfReadOnly()) return;
  const editing=!!id;
  const s = editing ? {...DATA.stakeholders.find(x=>x.id===id)} : {
    id:uid(), projectId:presetProjectId, taskId:null, name:"", organization:"",
    email:"", phone:"", power:2, interest:2, strategy:"", notes:""
  };
  const lockRes=await acquireLock(tk(s.projectId,"stakeholders"));
  if(!lockRes.ok){ toast(msgTrava(lockRes),true); render(); return; }
  activeLockProjectId=tk(s.projectId,"stakeholders"); startHeartbeat(tk(s.projectId,"stakeholders")); render();

  const taskOpts=taskTreeOptions(s.projectId,s.taskId);
  const opts4=(sel)=>[1,2,3,4].map(n=>`<option value="${n}" ${sel===n?"selected":""}>${n}</option>`).join("");
  const body=`
    <div class="field"><label>Nome</label><input id="sk_name" value="${esc(s.name)}" placeholder="Ex.: Secretário de Administração"></div>
    <div class="f2">
      <div class="field"><label>Organização/cargo</label><input id="sk_org" value="${esc(s.organization)}" placeholder="Ex.: Secretaria de Administração"></div>
      <div class="field"><label>Vincular a uma atividade/subatividade <span style="font-weight:400;color:var(--muted)">(opcional)</span></label><select id="sk_task">${taskOpts}</select></div>
    </div>
    <div class="f2">
      <div class="field"><label>E-mail <span style="font-weight:400;color:var(--muted)">(opcional)</span></label><input id="sk_email" type="email" value="${esc(s.email||"")}" placeholder="nome@exemplo.gov.br"></div>
      <div class="field"><label>Telefone <span style="font-weight:400;color:var(--muted)">(opcional)</span></label><input id="sk_phone" type="tel" value="${esc(s.phone||"")}" placeholder="(31) 90000-0000"></div>
    </div>
    <div class="f2">
      <div class="field"><label>Poder/influência (1-4)</label><select id="sk_power">${opts4(s.power)}</select></div>
      <div class="field"><label>Interesse (1-4)</label><select id="sk_interest">${opts4(s.interest)}</select></div>
    </div>
    <div class="field"><label>Quadrante</label><div class="mono" id="sk_quad_preview" style="padding:9px 0"></div></div>
    <div class="field"><label>Estratégia sugerida <span style="font-weight:400;color:var(--muted)">(editável)</span></label><textarea id="sk_strategy" rows="3">${esc(s.strategy||QUADRANT_STRATEGY[stakeholderQuadrant(s.power,s.interest)])}</textarea></div>
    <div class="field"><label>Observações</label><textarea id="sk_notes">${esc(s.notes)}</textarea></div>
  `;
  const foot=`${editing?`<button class="del-link" id="sk_del"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>Excluir</button>`:""}
    <button class="btn" id="sk_cancel">Cancelar</button>
    <button class="btn primary" id="sk_save">${editing?"Salvar alterações":"Adicionar stakeholder"}</button>`;
  showModal(editing?"Editar stakeholder":"Novo stakeholder",body,foot,false);

  let strategyEditadaAMao=!!s.strategy;
  const atualizarPreview=()=>{
    const q=stakeholderQuadrant(+$("#sk_power").value,+$("#sk_interest").value);
    $("#sk_quad_preview").innerHTML=`<span class="pill ${QUADRANT_META[q].cls}">${QUADRANT_META[q].label}</span>`;
    if(!strategyEditadaAMao) $("#sk_strategy").value=QUADRANT_STRATEGY[q];
  };
  atualizarPreview();
  $("#sk_power").onchange=atualizarPreview;
  $("#sk_interest").onchange=atualizarPreview;
  $("#sk_strategy").oninput=()=>{ strategyEditadaAMao=true; };

  $("#sk_cancel").onclick=closeModal;

async function deleteStakeholder(id){
  if(blockIfReadOnly()) return;
  const s=DATA.stakeholders.find(x=>x.id===id); if(!s) return;
  if(isLockedByOther(tk(s.projectId,"stakeholders"))){ toast("Projeto em edição por "+lockHolderName(tk(s.projectId,"stakeholders")),true); return; }
  if(!confirm("Excluir este stakeholder?")) return;
  const lockRes=await acquireLock(tk(s.projectId,"stakeholders"));
  if(!lockRes.ok){ toast(msgTrava(lockRes),true); return; }

}

  if(!lista.length){ toast("Este projeto ainda não tem stakeholders para duplicar",true); return; }

  const body=`

    const lockRes=await acquireLock(tk(destino,"stakeholders"));
    if(!lockRes.ok){ toast("Projeto de destino em edição por "+(lockRes.holderName||lockRes.holder),true); return; }
    const copiados=lista.map(s=>({

/* ============================================================
   RESTAURAÇÃO SELETIVA (a partir de um arquivo .json)

   Compara o conteúdo de um arquivo exportado (base inteira ou um projeto)
   com o estado atual, registro a registro, e deixa escolher exatamente o
   que trazer de volta -- o resto fica como está.

   Granularidade: por REGISTRO INTEIRO (não por campo). Linha de base e
   TAP entram junto com o projeto ("dados do projeto").

   Quem pode aplicar: em cada projeto, quem pode importar nele (Escritório
   de Projetos ou acima); projetos que não existem mais, só quem pode criar
   projetos. O que a pessoa não pode aplicar aparece, mas desabilitado.
============================================================ */
const CATEGORIAS_DIFF=[
  {chave:"tasks",        nome:"Atividade",   campoNome:"name"},
  {chave:"eapNodes",     nome:"EAP",         campoNome:"name"},
  {chave:"risks",        nome:"Risco",       campoNome:"name"},
  {chave:"costs",        nome:"Custo",       campoNome:"description"},
  {chave:"stakeholders", nome:"Stakeholder", campoNome:"name"},
  {chave:"responsibleContacts", nome:"Responsável (contato)", campoNome:"name"},
  {chave:"reportSchedules", nome:"Envio programado", campoNome:"reportType"}
];
const CAMPO_LABEL_DIFF={
  name:"Nome", assignee:"Responsável", status:"Status", priority:"Prioridade", progress:"Progresso (%)",
  plannedStart:"Início planejado", plannedEnd:"Fim planejado", actualStart:"Início executado", actualEnd:"Fim executado",
  isMilestone:"Marco", notes:"Observações", parentId:"Atividade-mãe", predecessors:"Predecessoras", coResponsaveis:"Responsáveis adicionais",
  category:"Categoria", probability:"Probabilidade", impact:"Impacto", owner:"Responsável", riskType:"Tipo de risco", mitigation:"Ação a ser realizada",
  description:"Descrição", plannedValue:"Valor orçado", actualValue:"Valor realizado", acquisitionMethod:"Método de aquisição",
  resourceSource:"Fonte de recurso", costType:"Tipo", date:"Data", requestDate:"Data da requisição",
  organization:"Organização/cargo", email:"E-mail", phone:"Telefone", power:"Poder", interest:"Interesse",
  strategicPerspective:"Perspectiva", portfolioIds:"Portfólios", link:"Link", taskId:"Atividade vinculada"
};
const TIPO_BADGE_DIFF={
  alterado:`<span class="pill st-and">Alterado</span>`,
  so_arquivo:`<span class="pill st-con">Só no arquivo</span>`,
  so_atual:`<span class="pill st-can">Só no atual</span>`
};
let diffSelecao={}; // "categoria:id" -> true/false, reiniciado a cada abertura

// texto canônico (chaves em ordem em TODOS os níveis): só diferença de verdade conta
function _canonico(v){
  if(Array.isArray(v)) return "["+v.map(_canonico).join(",")+"]";
  if(v && typeof v==="object") return "{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+_canonico(v[k])).join(",")+"}";
  return JSON.stringify(v===undefined?null:v);
}
const _semInternos=o=>{ const c=Object.assign({},o||{}); delete c.projectId; return _canonico(c); };

/* compara dois conjuntos de dados do app (arquivo × atual), projeto por projeto */
function compararDados(arq,atual,pids){
  const projetos=[];
  const todosPids=pids || Array.from(new Set([...(arq.projects||[]).map(p=>p.id), ...(atual.projects||[]).map(p=>p.id)]));
  todosPids.forEach(pid=>{
    const pa=(arq.projects||[]).find(p=>p.id===pid), pc=(atual.projects||[]).find(p=>p.id===pid);
    const b={projectId:pid, nome:(pa||pc||{}).name||"(sem nome)", projeto:null, existeAtual:!!pc, existeArquivo:!!pa};
    // "dados do projeto": cabeçalho + TAP + linha de base atual
    const pacote=(d,p)=>p?JSON.stringify([_semInternos(Object.assign({},p,{grupoId:undefined})), _semInternos((d.tapData||[]).find(t=>t.projectId===pid)), _semInternos((d.baselines||[]).find(x=>x.projectId===pid))]):null;
    const ja=pacote(arq,pa), jc=pacote(atual,pc);
    if(ja!==jc) b.projeto={id:pid, tipo:!pc?"so_arquivo":!pa?"so_atual":"alterado", arquivo:pa||null, atual:pc||null};
    CATEGORIAS_DIFF.forEach(cat=>{
      const la=(arq[cat.chave]||[]).filter(x=>x.projectId===pid), lc=(atual[cat.chave]||[]).filter(x=>x.projectId===pid);
      const ma=new Map(la.map(x=>[String(x.id),x])), mc=new Map(lc.map(x=>[String(x.id),x]));
      const itens=[];
      ma.forEach((x,id)=>{ const y=mc.get(id); if(!y) itens.push({id,tipo:"so_arquivo",arquivo:x,atual:null}); else if(_semInternos(x)!==_semInternos(y)) itens.push({id,tipo:"alterado",arquivo:x,atual:y}); });
      mc.forEach((y,id)=>{ if(!ma.has(id)) itens.push({id,tipo:"so_atual",arquivo:null,atual:y}); });
      b[cat.chave]=itens;
    });
    const total=(b.projeto?1:0)+CATEGORIAS_DIFF.reduce((s,c)=>s+b[c.chave].length,0);
    if(total) projetos.push(Object.assign(b,{total}));
  });
  // portfólios
  const pa=new Map((arq.portfolios||[]).map(x=>[String(x.id),x])), pc=new Map((atual.portfolios||[]).map(x=>[String(x.id),x]));
  const portfolios=[];
  pa.forEach((x,id)=>{ const y=pc.get(id); if(!y) portfolios.push({id,tipo:"so_arquivo",arquivo:x,atual:null}); else if(_semInternos(Object.assign({},x,{grupoId:undefined}))!==_semInternos(Object.assign({},y,{grupoId:undefined}))) portfolios.push({id,tipo:"alterado",arquivo:x,atual:y}); });
  if(!pids) pc.forEach((y,id)=>{ if(!pa.has(id)) portfolios.push({id,tipo:"so_atual",arquivo:null,atual:y}); });
  return {projetos, portfolios};
}

function podeAplicarNoProjeto(b){
  if(!comPermissoes()) return true;
  if(b.existeAtual) return pode("importar",b.projectId);
  return podeCriarProjeto();
}
function renderDiffItem(categoria,campoNome,d,habilitado){
  const chave=categoria+":"+d.id;
  const ref=d.arquivo||d.atual||{};
  let detalhe="";
  if(d.tipo==="alterado"){
    const chaves=Array.from(new Set([...Object.keys(d.arquivo||{}),...Object.keys(d.atual||{})])).filter(k=>!["id","projectId","order","grupoId"].includes(k));
    const fmt=v=>v==null||v===""?"—":Array.isArray(v)?(v.length?v.join(", "):"—"):typeof v==="object"?"(…)":String(v);
    const linhas=chaves.filter(k=>JSON.stringify((d.arquivo||{})[k])!==JSON.stringify((d.atual||{})[k])).slice(0,8)
      .map(k=>`<div class="diff-field"><span class="diff-field-label">${esc(Object.prototype.hasOwnProperty.call(CAMPO_LABEL_DIFF,k)?CAMPO_LABEL_DIFF[k]:k)}</span>
        <span class="diff-field-old" title="Estado atual">${esc(fmt((d.atual||{})[k]))}</span><span class="diff-field-arrow">→</span>
        <span class="diff-field-new" title="No arquivo">${esc(fmt((d.arquivo||{})[k]))}</span></div>`).join("");
    detalhe=`<div class="diff-fields">${linhas||'<span class="hint" style="display:inline">Diferença em dados internos (TAP, linha de base ou ordem).</span>'}</div>`;
  }
  return `<label class="diff-item${habilitado?"":" diff-item-off"}">
    <input type="checkbox" data-diffchk="${esc(chave)}" ${habilitado?"":"disabled"}>
    <div class="diff-item-body">
      <div class="diff-item-head">${esc(String(ref[campoNome]||"(sem nome)"))} ${TIPO_BADGE_DIFF[d.tipo]}</div>
      ${detalhe}
    </div>
  </label>`;
}
function renderProjectDiffBucket(b){
  const hab=podeAplicarNoProjeto(b);
  const itens=[];
  if(b.projeto) itens.push(renderDiffItem("projeto","name",b.projeto,hab));
  CATEGORIAS_DIFF.forEach(c=>b[c.chave].forEach(d=>itens.push(renderDiffItem(c.chave,c.campoNome,d,hab))));
  const chaveId="p_"+b.projectId;
  return `<div class="diff-proj">
    <button class="diff-proj-head" data-toggleproj="${esc(chaveId)}" type="button">
      <svg class="diff-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      <span>${esc(b.nome)}${!b.existeAtual?' <span class="pill st-con">projeto excluído</span>':""}</span>
      <span class="badge">${b.total} diferença${b.total===1?"":"s"}</span>
      ${hab?"":`<span class="hint" style="display:inline;margin-left:6px">sem permissão para aplicar</span>`}
    </button>
    <div class="diff-proj-body" id="diffbody_${esc(chaveId)}" style="display:none">${itens.join("")}</div>
  </div>`;
}

/* abre a comparação; "voltar" é chamado ao cancelar */
let _comparacaoAtual=0; // "Voltar" no meio da comparação não pode ser atropelado pela tela que abriria depois
async function openSelecaoDoArquivo(arquivo,voltar){
  const minha=++_comparacaoAtual;
  const voltarDeVerdade=voltar; voltar=()=>{ _comparacaoAtual++; voltarDeVerdade(); };
  const arq=arquivo.dados;
  const pids = arquivo.tipo===TIPO_PROJETO ? (arq.projects||[]).map(p=>p.id) : null;
  showModal("Comparar com o arquivo",`<div style="min-height:140px;display:flex;align-items:center;justify-content:center;color:var(--muted)">Comparando…</div>`,`<button class="btn" id="dif_back">Voltar</button>`,true);
  $("#dif_back").onclick=voltar;
  // seções que ainda não vieram do servidor entram antes da comparação
  const alvos=pids ? pids.filter(pid=>projOf(pid)) : DATA.projects.map(p=>p.id);
  try{ await garantirCompleto(alvos); }
  catch(e){ if(minha!==_comparacaoAtual) return; showModal("Comparar com o arquivo",`<div class="imp-box err">Não consegui comparar: ${esc((e&&e.message)||e)}</div>`,`<button class="btn" id="dif_back3">Voltar</button>`,true); $("#dif_back3").onclick=voltar; return; }
  if(minha!==_comparacaoAtual) return;
  const comp=compararDados(arq,DATA,pids);
  diffSelecao={};
  if(!comp.projetos.length && !comp.portfolios.length){
    showModal("Comparar com o arquivo",`<div class="imp-box ok">Nenhuma diferença — o arquivo e o estado atual são iguais.</div>`,`<button class="btn" id="dif_back2">Voltar</button>`,true);
    $("#dif_back2").onclick=voltar; return;
  }
  const podePort=!comPermissoes()||souAdminMaster;
  const blocoPortfolios = comp.portfolios.length ? `<div class="diff-proj">
      <button class="diff-proj-head" data-toggleproj="portfolios" type="button">
        <svg class="diff-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        <span>Portfólios</span><span class="badge">${comp.portfolios.length} diferença${comp.portfolios.length===1?"":"s"}</span>
        ${podePort?"":`<span class="hint" style="display:inline;margin-left:6px">só a Administração aplica</span>`}
      </button>
      <div class="diff-proj-body" id="diffbody_portfolios" style="display:none">${comp.portfolios.map(d=>renderDiffItem("portfolios","name",d,podePort)).join("")}</div>
    </div>` : "";
  showModal("Comparar com o arquivo",`
    <p class="hint" style="margin-top:-4px">Arquivo de ${esc(fmtBRfullDT(arquivo.exportadoEm))}${arquivo.exportadoPor?` por ${esc(arquivo.exportadoPor)}`:""}. Marque só o que deve voltar a ser como no arquivo. O que não for marcado fica exatamente como está.</p>
    <div class="diff-toolbar no-print">
      <button class="btn sm" id="dif_marcar_tudo" type="button">Marcar tudo</button>
      <button class="btn sm" id="dif_desmarcar_tudo" type="button">Desmarcar tudo</button>
      <span class="hint" id="dif_contagem" style="display:inline;margin-left:auto">0 selecionado(s)</span>
    </div>
    <div class="diff-list">${comp.projetos.map(renderProjectDiffBucket).join("")}${blocoPortfolios}</div>`,
    `<button class="btn" id="dif_cancel">Cancelar</button><button class="btn primary" id="dif_aplicar" disabled>Aplicar seleção</button>`,true);
  $("#dif_cancel").onclick=voltar;
  const atualizar=()=>{ const n=Object.values(diffSelecao).filter(Boolean).length; $("#dif_contagem").textContent=n+" selecionado(s)"; $("#dif_aplicar").disabled=!n; };
  $$("[data-diffchk]").forEach(chk=>chk.onchange=()=>{ diffSelecao[chk.dataset.diffchk]=chk.checked; atualizar(); });
  $("#dif_marcar_tudo").onclick=()=>{ $$("[data-diffchk]:not(:disabled)").forEach(c=>{ c.checked=true; diffSelecao[c.dataset.diffchk]=true; }); atualizar(); };
  $("#dif_desmarcar_tudo").onclick=()=>{ $$("[data-diffchk]").forEach(c=>{ c.checked=false; diffSelecao[c.dataset.diffchk]=false; }); atualizar(); };
  $$("[data-toggleproj]").forEach(btn=>btn.onclick=()=>{
    const body=$("#diffbody_"+cssEsc(btn.dataset.toggleproj)), ch=btn.querySelector(".diff-chevron"), aberto=body.style.display!=="none";
    body.style.display=aberto?"none":"block"; if(ch) ch.style.transform=aberto?"":"rotate(90deg)";
  });
  $("#dif_aplicar").onclick=async()=>{
    const n=Object.values(diffSelecao).filter(Boolean).length;
    if(!confirm(`Aplicar ${n} diferença(s)?\n\nAntes, uma cópia do estado atual será baixada para o seu computador — dá para desfazer importando essa cópia.`)) return;
    const btn=$("#dif_aplicar"); btn.disabled=true; btn.textContent="Aplicando…";
    // os projetos que vão mudar ficam travados (ninguém editando) enquanto isso
    const afetados=comp.projetos.filter(b=>b.existeAtual && Object.keys(diffSelecao).some(k=>diffSelecao[k] && (k==="projeto:"+b.projectId || CATEGORIAS_DIFF.some(c=>b[c.chave].some(x=>k===c.chave+":"+x.id))))).map(b=>b.projectId);
    let travas=[], aplicou=false;
    try{
      travas=await travarProjetos(afetados);
      await baixarCopiaDeSeguranca(pids);
      const r=aplicarSelecaoDoArquivo(arq,comp,diffSelecao); aplicou=true;
      const ok=await persist();
      if(!ok){ await loadData(false); render(); throw new Error("a gravação não terminou — os dados foram recarregados do servidor; confira antes de tentar de novo"); }
      closeModal(); render();
      if(!falhasDoUltimoSalvamento.length){ toast(`${r.aplicados} diferença(s) aplicada(s)`+(r.ignorados?` · ${r.ignorados} ignorada(s) (ver aviso)`:"")); if(r.ignorados) toast(r.aviso,true,true); }
    }catch(e){
      toast("Não foi possível aplicar: "+((e&&e.message)||e),true,true);
      const b2=$("#dif_aplicar"); if(b2){ b2.disabled=false; b2.textContent="Aplicar seleção"; }
    }finally{ soltarTravas(travas); }
  };
}

/* aplica no DATA (o salvamento vem depois, pelo persist) */
function aplicarSelecaoDoArquivo(arq,comp,sel){
  let aplicados=0, ignorados=0; const avisos=[];
  const marcado=(cat,id)=>!!sel[cat+":"+id];
  const substituirNoArray=(lista,item)=>{ const i=lista.findIndex(x=>String(x.id)===String(item.id)); if(i>=0) lista[i]=JSON.parse(JSON.stringify(item)); else lista.push(JSON.parse(JSON.stringify(item))); };
  const tirar=(chave,id)=>{ DATA[chave]=(DATA[chave]||[]).filter(x=>String(x.id)!==String(id)); };
  comp.projetos.forEach(b=>{
    const pid=b.projectId;
    if(b.projeto && marcado("projeto",pid)){
      const d=b.projeto;
      if(d.tipo==="so_atual"){ // o projeto não existe no arquivo: excluir
        DATA.projects=DATA.projects.filter(p=>p.id!==pid);
        ENTITY_KEYS.concat(["baselines"]).forEach(k=>{ if(k!=="projects"&&k!=="portfolios") DATA[k]=(DATA[k]||[]).filter(x=>x.projectId!==pid); });
      }else{
        const p=JSON.parse(JSON.stringify(d.arquivo));
        const atual=projOf(pid);
        // projeto que volta: no grupo do arquivo se a pessoa pode criar lá; senão, no primeiro em que pode
        p.grupoId = atual ? atual.grupoId : (!comPermissoes() ? (p.grupoId||"") : (gruposOndePossoCriar().some(g=>g.id===p.grupoId) ? p.grupoId : grupoPadraoParaNovoProjeto()||""));
        p.portfolioIds=(p.portfolioIds||[]).filter(id=>DATA.portfolios.some(x=>x.id===id)||(arq.portfolios||[]).some(x=>x.id===id&&marcado("portfolios",id)));
        substituirNoArray(DATA.projects,p);
        const tapArq=(arq.tapData||[]).find(t=>t.projectId===pid);
        DATA.tapData=DATA.tapData.filter(t=>t.projectId!==pid); if(tapArq) DATA.tapData.push(normalizarTAP(JSON.parse(JSON.stringify(tapArq))));
        const lbArq=(arq.baselines||[]).find(x=>x.projectId===pid);
        DATA.baselines=(DATA.baselines||[]).filter(x=>x.projectId!==pid); if(lbArq) DATA.baselines.push(JSON.parse(JSON.stringify(lbArq)));
      }
      aplicados++;
    }
    const projetoExiste=!!projOf(pid);
    CATEGORIAS_DIFF.forEach(c=>b[c.chave].forEach(d=>{
      if(!marcado(c.chave,d.id)) return;
      if(d.tipo==="so_atual"){ tirar(c.chave,d.id); aplicados++; return; }
      if(!projetoExiste){ ignorados++; avisos.push(b.nome); return; } // registro de projeto que não existe (e não foi restaurado)
      substituirNoArray(DATA[c.chave],d.arquivo); aplicados++;
    }));
  });
  (comp.portfolios||[]).forEach(d=>{
    if(!marcado("portfolios",d.id)) return;
    if(d.tipo==="so_atual") DATA.portfolios=DATA.portfolios.filter(x=>x.id!==d.id);
    else { const pf=JSON.parse(JSON.stringify(d.arquivo)); const at=DATA.portfolios.find(x=>x.id===pf.id); pf.grupoId=at?at.grupoId:(!comPermissoes()?(pf.grupoId||""):(gruposOndePossoCriar().some(g=>g.id===pf.grupoId)?pf.grupoId:grupoPadraoParaNovoProjeto()||"")); substituirNoArray(DATA.portfolios,pf); }
    aplicados++;
  });
  return {aplicados, ignorados, aviso: ignorados ? `Itens de projetos excluídos só voltam junto com o próprio projeto (marque "dados do projeto"): ${Array.from(new Set(avisos)).join(", ")}` : ""};
}

function reportEsc(v){ return esc(String(v==null?"":v)); }
function reportPct(v){ return `${Math.max(0,Math.min(100,Math.round(Number(v)||0)))}%`; }
function reportTruncate(v,max){ const s=String(v==null?"":v); return s.length>max?s.slice(0,Math.max(1,max-1))+"…":s; }
function reportFileBaseName(v,maxLen){
  const max=Math.max(24,Number(maxLen)||58);
  const clean=String(v==null?"Relatório":v)
    .replace(/[<>:"/\\|?*\u0000-\u001F]/g," ")
    .replace(/\s+/g," ")
    .trim()
    .replace(/[. ]+$/,"");
  if(!clean) return "Relatório";
  if(clean.length<=max) return clean;
  const limit=max-3, words=clean.split(" ");
  let short="";
  for(const word of words){
    const candidate=short?`${short} ${word}`:word;
    if(candidate.length>limit) break;
    short=candidate;
  }
  if(short.length<Math.min(18,limit)) short=clean.slice(0,limit).trim();
  return `${short.replace(/[. ]+$/,"")}...`;
}
function reportScopeName(type,id){

function reportKpi(label,value,note,cls){ return `<div class="report-kpi"><div class="rk-label">${reportEsc(label)}</div><div class="rk-value ${cls||""}">${value}</div>${note?`<div class="rk-note">${reportEsc(note)}</div>`:""}</div>`; }

function reportTaskDepth(t){
  let depth=0, cur=t, guard=new Set();
  while(cur&&cur.parentId&&!guard.has(cur.parentId)){ guard.add(cur.parentId); cur=taskOf(cur.parentId); if(cur) depth++; }
  return depth;
}
function reportTaskPath(t){
  const names=[]; let cur=t, guard=new Set();
  while(cur&&!guard.has(cur.id)){ guard.add(cur.id); names.unshift(cur.name||""); cur=cur.parentId?taskOf(cur.parentId):null; }
  return names.filter(Boolean).join(" › ");
}
function reportTaskType(t){ const d=reportTaskDepth(t); return d?`Subatividade N${d}`:"Atividade"; }
function reportTaskSequence(projectId){
  const out=[]; let seq=0;
  const walk=(t,depth)=>{ out.push({task:t,depth,index:seq++}); childrenOf(projectId,t.id).forEach(k=>walk(k,depth+1)); };
  childrenOf(projectId,null).forEach(t=>walk(t,0));
  return out;
}
function reportIsCurrentLate(t){
  const st=effStatus(t), pe=effPlannedEnd(t);
  return !["concluida","cancelada"].includes(st) && !!pe && pe<todayISO();
}
function reportDaysLate(t){ const pe=effPlannedEnd(t); return pe?Math.max(0,dayDiff(pe,todayISO())):0; }
function reportActionableTasks(projectId){ return reportTaskSequence(projectId).map(x=>x.task).filter(t=>!t.isMilestone&&!hasChildren(t)); }
function reportRecentCompleted(tasks,limit){
  return tasks.filter(t=>effStatus(t)==="concluida"&&effActualEnd(t)).sort((a,b)=>{
    const d=(effActualEnd(b)||"").localeCompare(effActualEnd(a)||"");
    return d||((effPlannedEnd(b)||"").localeCompare(effPlannedEnd(a)||""));
  }).slice(0,limit||3);
}
function reportUpcomingTasks(tasks,limit){
  const today=todayISO();
  const open=tasks.filter(t=>{
    const end=effPlannedEnd(t);
    return !["concluida","cancelada"].includes(effStatus(t)) && !!end && end>=today;
  });
  return open.sort((a,b)=>{
    const endOrder=(effPlannedEnd(a)||"9999-12-31").localeCompare(effPlannedEnd(b)||"9999-12-31");
    return endOrder||(effPlannedStart(a)||"9999-12-31").localeCompare(effPlannedStart(b)||"9999-12-31");
  }).slice(0,limit||3);
}
function reportTaskVariance(t){
  const pe=effPlannedEnd(t), ae=effActualEnd(t);
  if(!pe||!ae) return "—";
  const d=dayDiff(pe,ae);
  if(d===0) return "No prazo";
  return d>0?`${d} dia(s) após`:`${Math.abs(d)} dia(s) antes`;
}
function reportTaskCell(t,showPath){

function reportSequenceCard(title,items,mode,includeProject){

  return `<div class="report-seq-card"><h3>${reportEsc(title)}</h3>${items.length?items.map((t,i)=>{

    return `<div class="report-seq-item"><span class="report-seq-num">${i+1}</span><div><div class="report-seq-main">${reportEsc(t.name)}</div><div class="report-seq-meta">${reportEsc(meta)}</div></div><div class="report-seq-date">${fmtBRfull(date)||"—"}</div></div>`;
  }).join(""):`<div class="report-note">${reportEsc(empty)}</div>`}</div>`;
}
function reportProjectMetrics(projectId){
  const p=projOf(projectId); if(!p) return null;
  const tasks=DATA.tasks.filter(t=>t.projectId===projectId);
  const work=tasks.filter(t=>!t.isMilestone);
  const roots=childrenOf(projectId,null);
  const progress=roots.length?Math.round(roots.reduce((a,t)=>a+progressOf(t),0)/roots.length):0;
  const done=tasks.filter(t=>effStatus(t)==="concluida").length;
  const late=tasks.filter(isLate);
  const lateActive=tasks.filter(reportIsCurrentLate);
  const open=tasks.filter(t=>!["concluida","cancelada"].includes(effStatus(t)));
  const milestones=tasks.filter(t=>t.isMilestone);
  const msDone=milestones.filter(t=>effStatus(t)==="concluida").length;
  const risks=(DATA.risks||[]).filter(r=>r.projectId===projectId);
  const activeRisks=risks.filter(r=>r.status!=="mitigado"); // aberto, mitigando e materializado contam como ativos
  const criticalRisks=activeRisks.filter(r=>(Number(r.probability)||0)*(Number(r.impact)||0)>=15);
  const costs=(DATA.costs||[]).filter(c=>c.projectId===projectId);
  const budget=costs.reduce((a,c)=>a+(Number(c.plannedValue)||0),0);
  const actual=costs.reduce((a,c)=>a+(Number(c.actualValue)||0),0);
  const variance=budget-actual;
  const stakeholders=(DATA.stakeholders||[]).filter(x=>x.projectId===projectId);
  const keyStakeholders=stakeholders.filter(x=>(Number(x.power)||0)>=4 || (Number(x.interest)||0)>=4);
  const baseline=baselineOf(projectId);
  let baselineLate=0, comparable=0, baselineLateExec=0, comparableExec=0;
  if(baseline){
    tasks.forEach(t=>{
      const bt=baselineTaskOf(baseline,t.id);
      const end=effPlannedEnd(t);
      if(bt&&bt.plannedEnd&&end){ comparable++; if(diasEntre(bt.plannedEnd,end)>0) baselineLate++; }
      // comparacao com o EXECUTADO: so entra quem ja tem data de fim real registrada
      const exec=effActualEnd(t);
      if(bt&&bt.plannedEnd&&exec){ comparableExec++; if(diasEntre(bt.plannedEnd,exec)>0) baselineLateExec++; }
    });
  }
  const plannedEnd=projPlannedEnd(projectId), actualEnd=projActualEnd(projectId);
  const actionable=reportActionableTasks(projectId);
  const recentCompleted=reportRecentCompleted(actionable,3);
  const nextTasks=reportUpcomingTasks(actionable,3);
  let health="good", healthLabel="Saudável";
  if(criticalRisks.length || lateActive.length>=Math.max(2,Math.ceil(tasks.length*.2)) || (budget>0&&actual>budget*1.1)){health="crit";healthLabel="Crítico";}
  else if(lateActive.length || activeRisks.length || (budget>0&&actual>budget)){health="attn";healthLabel="Atenção";}
  return {p,tasks,work,roots,progress,done,late,lateActive,open,milestones,msDone,risks,activeRisks,criticalRisks,costs,budget,actual,variance,stakeholders,keyStakeholders,baseline,baselineLate,comparable,baselineLateExec,comparableExec,plannedEnd,actualEnd,actionable,recentCompleted,nextTasks,health,healthLabel};
}
function projectExecutiveNarrative(m){
  const pressure=[];
  if(m.lateActive.length) pressure.push(`${m.lateActive.length} atividade(s) atualmente atrasada(s)`);
  if(m.criticalRisks.length) pressure.push(`${m.criticalRisks.length} risco(s) crítico(s)`);
  if(m.budget>0&&m.actual>m.budget) pressure.push(`estouro de ${fmtBRL(m.actual-m.budget)}`);
  if(!pressure.length) return `O projeto apresenta execução controlada, com ${m.progress}% de avanço e sem exceções críticas registradas no momento.`;
  return `O projeto está em condição de ${m.healthLabel.toLowerCase()}. Os principais vetores de pressão são ${pressure.join(", ")}. A prioridade gerencial deve ser remover bloqueios das entregas críticas e proteger os próximos marcos.`;
}
function reportDatePos(date,minMs,totalMs,chartX,chartW){ return chartX+Math.max(0,Math.min(1,(parseD(date).getTime()-minMs)/totalMs))*chartW; }
function renderReportGantt(rows,emptyMessage){
  const dated=rows.filter(r=>r.start&&r.end);
  if(!dated.length) return `<div class="report-callout warn">${reportEsc(emptyMessage||"Não há datas planejadas suficientes para gerar o Gantt.")}</div>`;
  let minMs=Math.min(...dated.map(r=>parseD(r.start).getTime())), maxMs=Math.max(...dated.map(r=>parseD(r.end).getTime()));
  if(maxMs<=minMs) maxMs=minMs+86400000;
  const pad=Math.max(86400000,Math.round((maxMs-minMs)*.03)); minMs-=pad; maxMs+=pad;
  const totalMs=maxMs-minMs, viewW=1200, labelW=345, chartX=365, chartW=805;
  const rowH=Math.max(20,Math.min(29,Math.floor(560/Math.max(rows.length,1))));
  const top=65, height=top+rows.length*rowH+26;
  const ticks=6; let grid="";
  for(let i=0;i<ticks;i++){
    const ratio=i/(ticks-1), x=chartX+ratio*chartW, d=new Date(minMs+ratio*totalMs), iso=isoOf(d);
    grid+=`<line x1="${x}" y1="38" x2="${x}" y2="${height-18}" stroke="#E3DEEA" stroke-width="1"/><text x="${x}" y="29" text-anchor="middle" font-size="10" fill="#615873">${reportEsc(fmtBRfull(iso))}</text>`;
  }
  const body=rows.map((r,i)=>{
    const y=top+i*rowH, label=reportTruncate(r.label,52), meta=reportTruncate(r.meta||"",34);
    let bar=`<text x="12" y="${y+5}" font-size="10.5" font-weight="600" fill="#2A1840">${reportEsc(label)}</text>${meta?`<text x="12" y="${y+16}" font-size="8.5" fill="#6E6680">${reportEsc(meta)}</text>`:""}`;
    if(r.start&&r.end){
      const x1=reportDatePos(r.start,minMs,totalMs,chartX,chartW), x2=reportDatePos(r.end,minMs,totalMs,chartX,chartW);
      const width=Math.max(4,x2-x1), fill=r.late?"#E8590C":"#0CA678", progress=Math.max(0,Math.min(100,Number(r.progress)||0));
      bar+=`<rect x="${x1}" y="${y-4}" width="${width}" height="11" rx="3" fill="#D9C7EE"/><rect x="${x1}" y="${y-4}" width="${Math.max(0,width*progress/100)}" height="11" rx="3" fill="${fill}"/><text x="${Math.min(chartX+chartW-4,x2+6)}" y="${y+5}" font-size="8.5" fill="#334155">${progress}%</text>`;
    }else{
      bar+=`<text x="${chartX+8}" y="${y+5}" font-size="9" fill="#6E6680">Sem datas planejadas</text>`;
    }
    return `<line x1="0" y1="${y+rowH-9}" x2="${viewW}" y2="${y+rowH-9}" stroke="#F0EDF4"/>${bar}`;
  }).join("");
  return `<div class="report-gantt-legend"><span><i class="plan"></i>Período planejado</span><span><i class="done"></i>Execução</span><span><i class="late"></i>Execução com atraso</span></div><div class="report-gantt-wrap"><svg class="report-gantt-svg" viewBox="0 0 ${viewW} ${height}" role="img" aria-label="Gráfico de Gantt"><rect width="${viewW}" height="${height}" fill="#fff"/><rect x="${chartX}" y="38" width="${chartW}" height="${height-56}" fill="#FAFBFD"/>${grid}<line x1="${labelW}" y1="38" x2="${labelW}" y2="${height-18}" stroke="#C2CAD8" stroke-width="1.5"/>${body}</svg></div>`;
}

function executiveLateTable(tasks,includeProject){
  const sorted=tasks.slice().sort((a,b)=>reportDaysLate(b)-reportDaysLate(a)||(effPlannedEnd(a)||"9999").localeCompare(effPlannedEnd(b)||"9999"));
  const cols=includeProject?[15,29,11,14,10,9,12]:[34,12,16,11,10,8,9];
  const heads=includeProject?"<th>Projeto</th><th>Atividade/subatividade</th><th>Nível</th><th>Responsável</th><th>Fim planejado</th><th>Dias</th><th>Progresso</th>":"<th>Atividade/subatividade</th><th>Nível</th><th>Responsável</th><th>Fim planejado</th><th>Dias</th><th>Status</th><th>Progresso</th>";
  const rows=sorted.map(t=>{
    const p=projOf(t.projectId);
    if(includeProject) return `<tr><td>${reportEsc(p?p.name:"—")}</td><td>${reportTaskCell(t,true)}</td><td><span class="report-level">${reportEsc(reportTaskType(t))}</span></td><td>${reportEsc(t.assignee||"—")}</td><td class="date">${fmtBRfull(effPlannedEnd(t))||"—"}</td><td class="late-cell num">${reportDaysLate(t)}</td><td class="num">${reportPct(progressOf(t))}</td></tr>`;
    return `<tr><td>${reportTaskCell(t,true)}</td><td><span class="report-level">${reportEsc(reportTaskType(t))}</span></td><td>${reportEsc(t.assignee||"—")}</td><td class="date">${fmtBRfull(effPlannedEnd(t))||"—"}</td><td class="late-cell num">${reportDaysLate(t)}</td><td>${reportEsc(statusObj(effStatus(t)).label)}</td><td class="num">${reportPct(progressOf(t))}</td></tr>`;
  }).join("");
  return `<div class="report-table-wrap"><table class="report-table">${reportCols(cols)}<thead><tr>${heads}</tr></thead><tbody>${rows||reportEmptyRow(cols.length,"Nenhuma atividade ou subatividade atualmente atrasada")}</tbody></table></div>`;
}

function reportPortfolioMetrics(portfolioId){
  const pf=DATA.portfolios.find(x=>x.id===portfolioId); if(!pf) return null;
  const projects=DATA.projects.filter(p=>(p.portfolioIds||[]).includes(portfolioId));
  const ms=projects.map(p=>reportProjectMetrics(p.id)).filter(Boolean);
  const tasks=ms.flatMap(x=>x.tasks), risks=ms.flatMap(x=>x.risks), costs=ms.flatMap(x=>x.costs);
  const actionable=ms.flatMap(x=>x.actionable);
  const progress=ms.length?Math.round(ms.reduce((a,x)=>a+x.progress,0)/ms.length):0;
  const late=tasks.filter(isLate), lateActive=tasks.filter(reportIsCurrentLate);
  const criticalRisks=risks.filter(r=>r.status!=="mitigado"&&(Number(r.probability)||0)*(Number(r.impact)||0)>=15);
  const budget=costs.reduce((a,c)=>a+(Number(c.plannedValue)||0),0), actual=costs.reduce((a,c)=>a+(Number(c.actualValue)||0),0);
  return {pf,projects,ms,tasks,risks,costs,actionable,progress,late,lateActive,criticalRisks,budget,actual,variance:budget-actual,recentCompleted:reportRecentCompleted(actionable,3),nextTasks:reportUpcomingTasks(actionable,3)};
}

    `<button class="btn" id="rep_back">Voltar</button><button class="btn primary" id="rep_generate">${isCustom?'Continuar':'Visualizar relatório'}</button>`,
    false);

function printGeneratedReport(type,id,htmlPronto){
  const renderers={"project-exec":renderProjectExecutiveReport,"project-full":renderProjectCompleteReport,"portfolio-exec":renderPortfolioExecutiveReport,"portfolio-full":renderPortfolioCompleteReport};
  const html=htmlPronto!=null ? htmlPronto : (renderers[type]||(()=>""))(id);
  if(!html){toast("Não foi possível gerar o relatório",true);return;}
  const originalTitle=document.title;
  document.title=reportPdfFileName(type,id);
  let c=document.querySelector(".print-all-container"); if(!c){c=document.createElement("div");c.className="print-all-container";document.body.appendChild(c);}
  c.innerHTML=html;
  document.body.classList.add("printing-all","printing-report");
  // window.print() NÃO é garantidamente síncrono em todo navegador/contexto --
  // resetar o título logo depois da chamada (num try/finally) arriscava
  // devolver o nome original ANTES da pessoa ver a caixa de salvar, fazendo
  // o PDF sair sempre com o nome antigo da página. "afterprint" é o jeito
  // correto e documentado de saber quando a impressão realmente terminou.
  let limpo=false;
  const limpar=()=>{
    if(limpo) return; limpo=true;
    document.title=originalTitle;
    document.body.classList.remove("printing-all","printing-report");
    c.innerHTML="";
    window.removeEventListener("afterprint",limpar);
  };
  window.addEventListener("afterprint",limpar);
  window.print();
  setTimeout(limpar,15000); // rede de segurança, caso o navegador não dispare afterprint
}

/**
 * Gera o PDF de verdade no navegador e baixa com o nome certo, sem passar
 * pelo diálogo de impressão do sistema. Existe porque, no Apps Script, o
 * conteúdo do app roda dentro de um iframe -- e o navegador usa o título
 * da página de FORA desse iframe para sugerir o nome do arquivo ao
 * "Salvar como PDF", não o document.title que o JavaScript daqui consegue
 * mudar (é por isso que existe uma API separada, HtmlOutput.setTitle(),
 * chamada uma vez só no servidor). Baixar o arquivo diretamente (em vez
 * de imprimir) usa outro mecanismo do navegador, que respeita o nome
 * que a gente escolhe de verdade.
 */
async function downloadReportPdf(type,id,htmlPronto){
  await garantirLibs("html2pdf");
  const renderers={"project-exec":renderProjectExecutiveReport,"project-full":renderProjectCompleteReport,"portfolio-exec":renderPortfolioExecutiveReport,"portfolio-full":renderPortfolioCompleteReport};
  const html=htmlPronto!=null ? htmlPronto : (renderers[type]||(()=>""))(id);
  if(!html){toast("Não foi possível gerar o relatório",true);return;}
  if(typeof html2pdf==="undefined"){
    toast("Não consegui carregar o gerador de PDF — abrindo a impressão do navegador",true);
    printGeneratedReport(type,id,htmlPronto);
    return;
  }
  const nomeArquivo=reportPdfFileName(type,id)+".pdf";
  let c=document.querySelector(".print-all-container"); if(!c){c=document.createElement("div");c.className="print-all-container";document.body.appendChild(c);}
  c.innerHTML=html;
  document.body.classList.add("printing-all","printing-report");
  toast("Gerando PDF…");
  const limpar=()=>{ document.body.classList.remove("printing-all","printing-report"); c.innerHTML=""; };
  html2pdf().from(c.querySelector(".report-document")||c).set({
    margin:[8,8,8,8],
    filename:nomeArquivo,
    image:{type:"jpeg",quality:0.95},
    html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},
    jsPDF:{unit:"mm",format:"a4",orientation:"landscape"},
    pagebreak:{mode:["css","legacy"]}
  }).save().then(limpar).catch(()=>{
    limpar();
    toast("Não consegui gerar o PDF — tente 'Abrir para impressão'",true);
  });
}

/**
 * Prévia do relatório antes de baixar -- mostra o documento formatado
 * (as mesmas classes .report-* do PDF final) numa janela grande e
 * rolável, para conferir o conteúdo antes de gerar o arquivo. Baixar e
 * imprimir continuam disponíveis a partir daqui, sem precisar voltar.
 */
function openReportPreview(type,id,htmlPronto){
  const renderers={"project-exec":renderProjectExecutiveReport,"project-full":renderProjectCompleteReport,"portfolio-exec":renderPortfolioExecutiveReport,"portfolio-full":renderPortfolioCompleteReport};
  const html=htmlPronto!=null ? htmlPronto : (renderers[type]||(()=>""))(id);
  if(!html){toast("Não foi possível gerar o relatório",true);return;}
  const ov=$("#overlay");
  ov.innerHTML=`<div class="report-preview-modal">
    <div class="modal-h"><h3>Prévia do relatório</h3><button class="iconbtn" id="revw_x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="report-preview-body"><div class="report-preview-paper">${html}</div></div>
    <div class="modal-f"><button class="btn" id="revw_back">Voltar</button><button class="btn" id="revw_print">Abrir para impressão</button><button class="btn primary" id="revw_download">Baixar PDF</button></div>
  </div>`;
  ov.classList.add("show");

  $("#revw_print").onclick=()=>{ closeModal(); printGeneratedReport(type,id,html); };
  $("#revw_download").onclick=()=>{ closeModal(); downloadReportPdf(type,id,html); };
}

/* ============================================================
   GERENCIADOR DE ENVIOS A STAKEHOLDERS

   Vive dentro da aba Stakeholders de cada projeto. Duas frentes:

   1. AGENDAMENTOS — programar envios periódicos (semanal/quinzenal/
      mensal) de um resumo do projeto para stakeholders escolhidos.
      Roda no servidor (tarefa agendada), por isso usa um
      resumo DELIBERADAMENTE simples em vez do relatório
      completo -- sem navegador aberto no momento do envio, não dá para
      reaproveitar a lógica rica do front-end.

   2. ENVIAR AGORA — dispara na hora, com o navegador aberto. Aqui sim
      reaproveita as métricas de verdade dos relatórios
      (reportProjectMetrics), só que formatadas como um resumo simples
      de e-mail (tabela com estilo em linha, sem grade CSS nem SVG --
      e-mail não renderiza isso de forma confiável).

   Contato: se o stakeholder já tem e-mail cadastrado, usa direto. Se
   não, mostra um campo para completar ali mesmo, com a opção de salvar
   no cadastro dele para não precisar digitar de novo da próxima vez.
============================================================ */

  $("#ges_extra_add").onclick=()=>{
    const nome=$("#ges_extra_name").value.trim(), email=$("#ges_extra_email").value.trim();
    if(!nome||!email){ toast("Preencha nome e e-mail do contato avulso",true); return; }
    extras.push({name:nome,email}); $("#ges_extra_name").value=""; $("#ges_extra_email").value=""; redesenharExtras();
  };

  const atualizarDiaWrap=()=>{
    const freq=$("#ges_freq").value;
    if(freq==="mensal") $("#ges_dia_wrap").innerHTML=`<label>Dia do mês</label><input type="number" id="ges_daymonth" min="1" max="28" value="1">`;
    else $("#ges_dia_wrap").innerHTML=`<label>Dia da semana</label><select id="ges_weekday">${WEEKDAY_LABEL.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select>`;
  };
  $("#ges_freq").onchange=atualizarDiaWrap;

  $("#ges_cancel").onclick=closeModal;
  $("#ges_save").onclick=async()=>{
    const name=$("#ges_name").value.trim();
    if(!name){ toast("Dê um nome para o agendamento",true); return; }
    const stakeholderIds=[];
    let faltaEmail=false;
    $$("[data-gepick]:checked").forEach(chk=>{
      const sid=chk.dataset.gepick;
      const sk=DATA.stakeholders.find(x=>x.id===sid);
      const emailInput=$(`[data-geemail="${sid}"]`);
      if(sk&&!sk.email&&emailInput){
        const val=emailInput.value.trim();
        if(!val){ faltaEmail=true; return; }
        sk.email=val; // salva no cadastro, para nao pedir de novo da proxima vez
      }
      stakeholderIds.push(sid);
    });
    if(faltaEmail){ toast("Preencha o e-mail dos stakeholders marcados sem contato",true); return; }
    if(!stakeholderIds.length && !extras.length){ toast("Escolha pelo menos um destinatário",true); return; }

    const freq=$("#ges_freq").value;
    const weekdayEl=$("#ges_weekday"), daymonthEl=$("#ges_daymonth");
    const novo={
      id:uid(), projectId, name, reportType:$("#ges_type").value,
      stakeholderIds, extraContacts:extras.slice(),
      frequency:freq,
      weekday: weekdayEl?+weekdayEl.value:null,
      dayOfMonth: daymonthEl?+daymonthEl.value:null,
      active:true, lastSentAt:0, createdBy:me||"Anônimo"
    };
    DATA.reportSchedules.push(novo);
    closeModal(); await persist();
    toast("Agendamento criado"); openGerenciadorEnvios(projectId);
  };
}

async function toggleGeSchedule(id,projectId){
  if(blockIfReadOnly()) return;
  const s=DATA.reportSchedules.find(x=>x.id===id); if(!s) return;
  s.active=!s.active;
  await persist(); toast(s.active?"Agendamento reativado":"Agendamento pausado");
  openGerenciadorEnvios(projectId);
}
async function deleteGeSchedule(id,projectId){
  if(blockIfReadOnly()) return;
  if(!confirm("Excluir este agendamento?")) return;
  DATA.reportSchedules=DATA.reportSchedules.filter(x=>x.id!==id);
  await persist(); toast("Agendamento excluído");
  openGerenciadorEnvios(projectId);
}

    $$("[data-rmextra2]").forEach(el=>el.onclick=()=>{ extras.splice(+el.dataset.rmextra2,1); redesenharExtras(); });
  };
  $("#gea_extra_add").onclick=()=>{

    extras.push({name:nome,email}); $("#gea_extra_name").value=""; $("#gea_extra_email").value=""; redesenharExtras();
  };

  $("#gea_send").onclick=async()=>{
    const destinatarios=[];

    $$("[data-gepick]:checked").forEach(chk=>{
      const sid=chk.dataset.gepick;
      const sk=DATA.stakeholders.find(x=>x.id===sid);
      const emailInput=$(`[data-geemail="${sid}"]`);
      if(sk&&!sk.email&&emailInput){
        const val=emailInput.value.trim();
        if(!val){ faltaEmail=true; return; }
        sk.email=val;
      }
      if(sk) destinatarios.push({name:sk.name,email:sk.email});
    });
    if(faltaEmail){ toast("Preencha o e-mail dos stakeholders marcados sem contato",true); return; }
    extras.forEach(c=>destinatarios.push(c));
    if(!destinatarios.length){ toast("Escolha pelo menos um destinatário",true); return; }

    const btn=$("#gea_send"); btn.disabled=true; btn.textContent="Enviando…";
    try{

      const r=await servidorCall("enviarRelatorioPorEmail", JSON.stringify(destinatarios), assunto, corpo, anexoHtml, nomeAnexo);

        : `Enviado para ${destinatarios.length} destinatário(s)`);
      closeModal();
    }catch(e){
      toast("Não foi possível enviar agora",true);
      btn.disabled=false; btn.textContent="Enviar agora";
    }

/* Monta um HTML autocontido (com o CSS do app embutido) para o servidor
   converter em PDF -- a conversão roda isolada, sem acesso à folha de
   estilos já carregada na página, então precisa vir junto. */
function standaloneReportHtml(type,projectId){
  const renderers={"project-exec":renderProjectExecutiveReport,"project-full":renderProjectCompleteReport};
  const html=(renderers[type]||(()=>""))(projectId);
  if(!html) return "";
  const estilos=[...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${estilos}
    body{margin:0}
    .report-page{break-after:page}
  </style></head><body class="printing-report">${html}</body></html>`;
}

/* ============================================================
   RELATÓRIO PERSONALIZADO

   Um 5º tipo de relatório: a pessoa escolhe quais das 7 seções do
   projeto entram (EAP, Cronograma, Gantt, Riscos, Custos, Stakeholders,
   Linha de base) e, para cada uma, se quer a versão completa ou um
   resumo. O Cronograma tem uma escolha própria em vez de completa/resumo:
   usar os filtros que estão ativos na tela de Cronograma agora, ou a
   sequência de 3 últimas conclusões + 3 próximas.

   Reaproveita as mesmas funções de métricas e desenho dos outros 4
   relatórios (reportProjectMetrics, reportSequenceCard, projectGanttRows
   etc.) -- as seções aqui são só outra forma de montar o mesmo material.
============================================================ */
const CUSTOM_SECOES=[
  {id:"eap",label:"EAP"},
  {id:"cronograma",label:"Cronograma"},
  {id:"gantt",label:"Gantt"},
  {id:"riscos",label:"Riscos"},
  {id:"custos",label:"Custos"},
  {id:"stakeholders",label:"Stakeholders"},
  {id:"baseline",label:"Linha de base"},
];

function openCustomReportConfigModal(projectId){
  const p=projOf(projectId); if(!p) return;
  const linhas=CUSTOM_SECOES.filter(s=>s.id!=="custos"||pode("verCustos",projectId)).map(s=>{
    const ehCrono=s.id==="cronograma";
    return `<div class="custrep-row">
      <label class="custrep-check">
        <input type="checkbox" data-custsec="${s.id}" checked>
        <strong>${esc(s.label)}</strong>
      </label>
      <div class="custrep-mode" data-custmode-wrap="${s.id}">
        ${ehCrono ? `
          <label><input type="radio" name="mode_${s.id}" value="filtros" checked> Filtros atuais da tela</label>
          <label><input type="radio" name="mode_${s.id}" value="sequencia"> 3 últimas + 3 próximas</label>
        ` : `
          <label><input type="radio" name="mode_${s.id}" value="completa" checked> Completa</label>
          <label><input type="radio" name="mode_${s.id}" value="resumo"> Resumo</label>
        `}
      </div>
    </div>`;
  }).join("");

  const body=`
    <p class="hint" style="margin-top:-4px;margin-bottom:12px">Marque as seções que você quer no relatório de <strong>${esc(p.name)}</strong> e escolha o nível de detalhe de cada uma.</p>
    <div class="custrep-list">${linhas}</div>
  `;
  showModal("Relatório personalizado",body,
    `<button class="btn" id="custrep_back">Voltar</button><button class="btn primary" id="custrep_generate">Visualizar relatório</button>`,false);

  $("#custrep_back").onclick=()=>openReportScopeModal("project-custom");
  $$("[data-custsec]").forEach(chk=>chk.onchange=()=>{
    const wrap=$(`[data-custmode-wrap="${chk.dataset.custsec}"]`);
    if(wrap) wrap.style.opacity=chk.checked?"1":".4";
    $$(`[data-custmode-wrap="${chk.dataset.custsec}"] input`).forEach(r=>r.disabled=!chk.checked);
  });

  const coletarEscolhas=()=>CUSTOM_SECOES
    .filter(s=>$(`[data-custsec="${s.id}"]`).checked)
    .map(s=>({id:s.id,label:s.label,modo:($$(`input[name="mode_${s.id}"]`).find(r=>r.checked)||{}).value}));

  $("#custrep_generate").onclick=()=>{
    const escolhas=coletarEscolhas();
    if(!escolhas.length){ toast("Escolha pelo menos uma seção",true); return; }
    closeModal();
    const html=buildCustomReportHtml(projectId,escolhas);
    openReportPreview("project-custom",projectId,html);
  };
}

function buildCustomReportHtml(projectId,escolhas){
  const m=reportProjectMetrics(projectId); if(!m) return "";
  const pages=[reportPage("Relatório personalizado",m.p.name,
    reportCover("Relatório Personalizado",m.p.name,`Responsável: ${m.p.owner||"não informado"} · Seções incluídas: ${escolhas.map(e=>e.label).join(", ")}`)+
    `<div class="report-grid">
      ${reportKpi("Progresso",reportPct(m.progress),`${m.done}/${m.tasks.length} itens concluídos`)}
      ${reportKpi("Atrasos ativos",m.lateActive.length,m.lateActive.length?"Requer recuperação":"Sem atrasos ativos",m.lateActive.length?"warn":"exec")}
      ${reportKpi("Riscos ativos",m.activeRisks.length,`${m.criticalRisks.length} críticos`)}
      ${reportKpi("Variação de custo",m.budget?fmtBRL(m.variance):"—",m.budget?`${fmtBRL(m.actual)} realizado de ${fmtBRL(m.budget)}`:"Sem base de custos",m.variance<0?"warn":"")}
    </div>`
  )];

  const builders={
    eap: (modo)=>modo==="resumo"?customSectionEAPResumo(m):customSectionEAP(m),
    cronograma: (modo)=>customSectionCronograma(m,modo),
    gantt: (modo)=>customSectionGantt(m,modo),
    riscos: (modo)=>customSectionRiscos(m,modo),
    custos: (modo)=>customSectionCustos(m,modo),
    stakeholders: (modo)=>customSectionStakeholders(m,modo),
    baseline: (modo)=>customSectionBaseline(m,modo),
  };
  let n=2;
  escolhas.forEach(e=>{
    const corpo=(builders[e.id]||(()=>""))(e.modo);
    const extraClass=e.id==="gantt"?"report-gantt-page":"";
    pages.push(reportPage(`${n}. ${e.label}`,m.p.name,`<section class="report-section">${corpo}</section>`,extraClass));
    n++;
  });
  return reportDocument(pages);
}

/* ---------- seções, cada uma em modo completa/resumo ---------- */
function customSectionEAP(m){
  const nos=[];
  const walk=(parentId,depth)=>{
    eapOrdenar(eapChildrenOf(m.p.id,parentId)).forEach(e=>{
      nos.push({e,depth});
      walk(e.id,depth+1);
    });
  };
  walk(null,0);
  if(!nos.length) return `<div class="report-callout warn">Este projeto ainda não tem uma EAP definida.</div>`;
  const linhas=nos.map(({e,depth})=>`<tr><td style="padding-left:${depth*14}px">${reportEsc(e.name)}${e.isMilestone?" ◆":""}</td><td>${e.notes?reportEsc(e.notes):"—"}</td></tr>`).join("");
  return `<table class="report-table">${reportCols([70,30])}<thead><tr><th>Item</th><th>Observações</th></tr></thead><tbody>${linhas}</tbody></table>`;
}
function customSectionEAPResumo(m){
  const roots=eapOrdenar(eapChildrenOf(m.p.id,null));
  if(!roots.length) return `<div class="report-callout warn">Este projeto ainda não tem uma EAP definida.</div>`;
  const linhas=roots.map(e=>{
    const filhos=eapChildrenOf(m.p.id,e.id).length;
    return `<tr><td>${reportEsc(e.name)}${e.isMilestone?" ◆":""}</td><td class="num">${filhos}</td></tr>`;
  }).join("");
  return `<table class="report-table">${reportCols([70,30])}<thead><tr><th>Fase/entrega principal</th><th>Subitens</th></tr></thead><tbody>${linhas}</tbody></table>`;
}
function passCronogramaFiltersExceptProject(t){
  if(filters.assignee && t.assignee!==filters.assignee) return false;
  if(filters.status && effStatus(t)!==filters.status) return false;
  if(filters.late && !isLate(t)) return false;
  if(filters.milestone && !t.isMilestone) return false;
  if(filters.search){
    const q=filters.search.toLowerCase();
    if(!t.name.toLowerCase().includes(q)) return false;
  }
  return true;
}
